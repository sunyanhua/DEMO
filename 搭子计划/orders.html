<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>我的订单 - 搭子计划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 pb-20">
    <div id="app"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script>
        function render() {
            const orders = window.GlobalData.orders || [];
            const activities = window.GlobalData.activities || [];

            // 按时间倒序排序
            const sortedOrders = [...orders].sort((a, b) => new Date(b.time) - new Date(a.time));

            document.getElementById('app').innerHTML = `
                <!-- 顶部导航 -->
                <div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm flex items-center justify-between">
                    <button onclick="window.history.back()" class="p-1.5 rounded-full hover:bg-gray-100 transition">
                        <i data-lucide="chevron-left" class="w-6 h-6 text-gray-800"></i>
                    </button>
                    <h1 class="text-lg font-bold text-gray-900">我的订单</h1>
                    <div class="w-10"></div> <!-- 占位保持对称 -->
                </div>

                <div class="px-4 pt-4">
                    <!-- 订单统计 -->
                    <div class="bg-white rounded-2xl p-4 shadow-sm mb-6">
                        <div class="flex justify-around">
                            <div class="flex flex-col items-center">
                                <span class="font-black text-lg text-gray-900">${orders.filter(o => o.status === 'paid').length}</span>
                                <span class="text-xs text-gray-400">已支付</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-black text-lg text-gray-900">${orders.filter(o => o.status === 'cancelled').length}</span>
                                <span class="text-xs text-gray-400">已取消</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="font-black text-lg text-gray-900">${orders.filter(o => o.status === 'refunded').length}</span>
                                <span class="text-xs text-gray-400">已退款</span>
                            </div>
                        </div>
                    </div>

                    <!-- 订单列表 -->
                    <div class="space-y-3">
                        ${sortedOrders.length > 0 ? sortedOrders.map(order => {
                            // 获取活动信息
                            const activity = activities.find(a => a.id === order.activityId) || {};

                            // 状态显示
                            let statusText = '';
                            let statusColor = '';
                            let statusIcon = '';

                            switch(order.status) {
                                case 'paid':
                                    statusText = '已支付';
                                    statusColor = 'text-green-500 bg-green-50';
                                    statusIcon = 'check-circle';
                                    break;
                                case 'cancelled':
                                    statusText = '已取消';
                                    statusColor = 'text-gray-500 bg-gray-50';
                                    statusIcon = 'x-circle';
                                    break;
                                case 'refunded':
                                    statusText = '已退款';
                                    statusColor = 'text-orange-500 bg-orange-50';
                                    statusIcon = 'refresh-cw';
                                    break;
                                default:
                                    statusText = '待支付';
                                    statusColor = 'text-yellow-500 bg-yellow-50';
                                    statusIcon = 'clock';
                            }

                            return `
                                <div onclick="window.location.href='detail.html?id=${order.activityId}'" class="bg-white rounded-2xl p-4 shadow-sm active:bg-gray-50 cursor-pointer">
                                    <div class="flex justify-between items-start mb-3">
                                        <div>
                                            <h3 class="font-bold text-gray-900 text-sm">${order.activityTitle}</h3>
                                            <div class="text-xs text-gray-400 mt-1">${order.time}</div>
                                        </div>
                                        <div class="px-2 py-1 ${statusColor} text-xs font-medium rounded-full flex items-center gap-1">
                                            <i data-lucide="${statusIcon}" class="w-3 h-3"></i>
                                            ${statusText}
                                        </div>
                                    </div>

                                    <div class="flex justify-between items-center pt-3 border-t border-gray-50">
                                        <div class="text-sm text-gray-600">
                                            <span class="font-medium">${order.participants}人</span>
                                            <span class="text-gray-400 mx-2">·</span>
                                            <span>订单号：${order.id}</span>
                                        </div>
                                        <div class="font-bold text-gray-900">
                                            ${order.amount === 0 ? '免费' : `¥${order.amount.toFixed(2)}`}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('') : `
                            <div class="bg-white rounded-2xl p-8 text-center shadow-sm">
                                <i data-lucide="shopping-bag" class="w-16 h-16 mx-auto mb-4 text-gray-300"></i>
                                <h3 class="font-bold text-gray-900 mb-2">暂无订单</h3>
                                <p class="text-sm text-gray-500 mb-6">您还没有报名过任何活动</p>
                                <button onclick="window.location.href='index.html'" class="px-6 py-2.5 bg-gradient-to-r from-brand-orange to-brand-yellow text-white font-bold rounded-xl">
                                    去发现活动
                                </button>
                            </div>
                        `}
                    </div>
                </div>

                ${window.Common.renderBottomNav('me')}
            `;
            window.Common.initIcons();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
