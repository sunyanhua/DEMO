<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>聊天</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col h-full"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script>
        function render() {
            const urlParams = new URLSearchParams(window.location.search);
            const userName = urlParams.get('name') || '用户';
            const userId = urlParams.get('uid');

            // 获取对方用户信息
            const otherUser = window.GlobalData.partners.find(p => p.id === userId) ||
                            { name: userName, avatarUrl: 'https://picsum.photos/50/50?random=0' };
            // 添加在线状态（随机生成）
            otherUser.isOnline = Math.random() > 0.5;

            // 模拟关注关系数据
            // 假设当前用户ID为'u1'（从GlobalData.user.id获取）
            const currentUserId = window.GlobalData.user.id;

            // 模拟关注关系：假设有以下关注状态
            // 1. 对方关注了当前用户
            // 2. 当前用户关注了对方
            // 为了演示不同状态，我们根据userId来决定关注状态
            let otherFollowsMe = false;
            let iFollowOther = false;

            // 根据userId模拟不同的关注状态
            if (userId === 'p1' || userId === 'p2') {
                // p1, p2：互相关注状态（畅聊）
                otherFollowsMe = true;
                iFollowOther = true;
            } else if (userId === 'u2' || userId === 'p3') {
                // u2, p3：对方关注我，但我没关注对方
                otherFollowsMe = true;
                iFollowOther = false;
            } else if (userId === 'u3' || userId === 'p4') {
                // u3, p4：我关注对方，但对方没关注我
                otherFollowsMe = false;
                iFollowOther = true;
            } else {
                // 其他：没有互相关注
                otherFollowsMe = false;
                iFollowOther = false;
            }

            // 判断私信状态
            let chatStatus = '';
            let statusColor = 'blue';
            if (!otherFollowsMe && !iFollowOther) {
                chatStatus = '你和TA没有互相关注，只能互相留言一次';
                statusColor = 'yellow';
            } else if (!otherFollowsMe && iFollowOther) {
                chatStatus = 'TA还没有关注你，你只能给TA留言一次';
                statusColor = 'orange';
            } else if (otherFollowsMe && !iFollowOther) {
                chatStatus = '你还没有关注TA，TA只能给你留言一次';
                statusColor = 'orange';
            } else {
                chatStatus = '你们已经互相关注，可以进行畅聊了~';
                statusColor = 'green';
            }

            // 根据关注状态模拟不同的聊天记录
            let chats = [];

            if (!otherFollowsMe && !iFollowOther) {
                // 没有互相关注：只能互相留言一次
                chats = [
                    { isMe: false, text: '你好！看到你也对飞盘感兴趣？', time: '10:00' },
                    { isMe: true, text: '是的，第一次尝试，请多指教！', time: '10:05' },
                    { isMe: false, text: '系统提示：你们尚未互相关注，这是最后一次留言机会', time: '10:06', isSystem: true }
                ];
            } else if (!otherFollowsMe && iFollowOther) {
                // TA还没有关注你，你只能给TA留言一次
                chats = [
                    { isMe: true, text: '你好！看到你发的滑雪动态，我也想去崇礼', time: '09:30' },
                    { isMe: false, text: '欢迎啊！这周末天气不错', time: '09:35' },
                    { isMe: true, text: '系统提示：对方尚未关注你，这是你最后一次留言机会', time: '09:36', isSystem: true }
                ];
            } else if (otherFollowsMe && !iFollowOther) {
                // 你还没有关注TA，TA只能给你留言一次
                chats = [
                    { isMe: false, text: '你好！我是夜跑达人，看到你也经常跑步', time: '08:15' },
                    { isMe: true, text: '是的，最近在锻炼身体', time: '08:20' },
                    { isMe: false, text: '系统提示：你尚未关注对方，这是对方最后一次留言机会', time: '08:21', isSystem: true }
                ];
            } else {
                // 互相关注：可以畅聊
                chats = [
                    { isMe: false, text: '你好呀！看到你也报名了那个活动？', time: '10:00' },
                    { isMe: true, text: '是啊，第一次参加这种活动，有点紧张哈哈', time: '10:05' },
                    { isMe: false, text: '没事，我也是新手，到时候一起！', time: '10:06' },
                    { isMe: false, text: '这周六记得穿运动鞋哦！', time: '10:30' },
                    { isMe: true, text: '好的！我已经准备好了', time: '10:35' },
                    { isMe: false, text: '那我们周六见！期待一起玩~', time: '10:40' }
                ];
            }

            const chatHtml = chats.map(chat => {
                if (chat.isSystem) {
                    return `
                        <div class="flex flex-col mb-4 items-center">
                            <div class="text-[10px] text-gray-400 mb-1">${chat.time}</div>
                            <div class="px-3 py-1.5 rounded-full max-w-[90%] text-xs bg-gray-100 text-gray-500 border border-gray-200">
                                <i data-lucide="info" class="w-3 h-3 inline-block mr-1"></i> ${chat.text}
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="flex flex-col mb-4 ${chat.isMe ? 'items-end' : 'items-start'}">
                            <div class="text-[10px] text-gray-400 mb-1 px-1">${chat.time}</div>
                            <div class="px-4 py-2.5 rounded-2xl max-w-[80%] text-sm ${chat.isMe ? 'bg-brand-orange text-white rounded-tr-sm' : 'bg-white text-gray-800 rounded-tl-sm shadow-sm border border-gray-100'}">
                                ${chat.text}
                            </div>
                        </div>
                    `;
                }
            }).join('');

            document.getElementById('app').innerHTML = `
                <!-- Header -->
                <div class="bg-white px-4 py-3 flex items-center justify-between border-b border-gray-100 shadow-sm sticky top-0 z-10">
                    <button onclick="window.history.back()" class="p-1 -ml-2"><i data-lucide="chevron-left" class="w-6 h-6 text-gray-700"></i></button>
                    <div class="flex items-center gap-2" onclick="window.location.href='profile.html?id=${userId}'">
                        <img src="${otherUser.avatarUrl}" class="w-8 h-8 rounded-full border border-gray-100 object-cover" />
                        <span class="font-bold text-gray-900 text-base">${userName}</span>
                        <i data-lucide="home" class="w-4 h-4 text-gray-400"></i>
                    </div>
                    <span class="flex items-center gap-1 ${otherUser.isOnline ? 'text-green-500' : 'text-gray-400'}">
                        <i data-lucide="circle" class="w-2.5 h-2.5 ${otherUser.isOnline ? 'fill-green-500' : 'fill-gray-400'}"></i>
                        <span class="text-xs">${otherUser.isOnline ? '在线' : '离线'}</span>
                    </span>
                </div>

                <!-- 私信状态提示和安全提示 -->
                <div class="bg-white border-b border-gray-100 py-2 px-4">
                    <div class="flex items-center justify-between mb-1">
                        <div class="flex items-center gap-2">
                            ${statusColor === 'green' ?
                                '<i data-lucide="users" class="w-4 h-4 text-green-500"></i>' :
                                statusColor === 'orange' ?
                                '<i data-lucide="user" class="w-4 h-4 text-orange-500"></i>' :
                                '<i data-lucide="alert-circle" class="w-4 h-4 text-yellow-500"></i>'
                            }
                            <span class="text-xs font-medium text-gray-700">${chatStatus}</span>
                        </div>
                        <i data-lucide="info" class="w-4 h-4 text-gray-400"></i>
                    </div>
                    <div class="text-[10px] text-gray-400 mt-1 flex items-center gap-1">
                        <i data-lucide="shield" class="w-3 h-3"></i>
                        沟通及交往过程中请注意保护您的人身财产安全
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="flex-1 overflow-y-auto p-4 bg-gray-50 no-scrollbar" id="chat-container">
                    ${chatHtml}
                </div>

                <!-- Input Area -->
                <div class="bg-white border-t border-gray-100 p-3 pb-safe flex items-center gap-2">
                    <button class="text-gray-400 p-1"><i data-lucide="mic" class="w-6 h-6"></i></button>
                    <input type="text" id="message-input" class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-brand-orange/50 transition-all" placeholder="发消息..." />
                    <button class="text-gray-400 p-1"><i data-lucide="smile" class="w-6 h-6"></i></button>
                    <button onclick="sendMessage()" class="bg-brand-orange text-white rounded-full p-2 w-8 h-8 flex items-center justify-center"><i data-lucide="arrow-up" class="w-5 h-5"></i></button>
                </div>
            `;
            window.Common.initIcons();
            
            // 滚动到底部
            const container = document.getElementById('chat-container');
            if(container) container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();

            if (!message) return;

            const chatContainer = document.getElementById('chat-container');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            // 创建新的消息元素
            const messageElement = document.createElement('div');
            messageElement.className = 'flex flex-col mb-4 items-end';
            messageElement.innerHTML = `
                <div class="text-[10px] text-gray-400 mb-1 px-1">${timeStr}</div>
                <div class="px-4 py-2.5 rounded-2xl max-w-[80%] text-sm bg-brand-orange text-white rounded-tr-sm">
                    ${message}
                </div>
            `;

            // 添加到聊天容器
            chatContainer.appendChild(messageElement);

            // 清空输入框
            input.value = '';

            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 模拟对方回复（仅用于演示）
            setTimeout(() => {
                const replyElement = document.createElement('div');
                replyElement.className = 'flex flex-col mb-4 items-start';
                replyElement.innerHTML = `
                    <div class="text-[10px] text-gray-400 mb-1 px-1">${(now.getHours()).toString().padStart(2, '0')}:${(now.getMinutes() + 1).toString().padStart(2, '0')}</div>
                    <div class="px-4 py-2.5 rounded-2xl max-w-[80%] text-sm bg-white text-gray-800 rounded-tl-sm shadow-sm border border-gray-100">
                        收到你的消息了！👍
                    </div>
                `;
                chatContainer.appendChild(replyElement);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }

        // 添加输入框回车发送功能
        document.addEventListener('DOMContentLoaded', () => {
            render();

            const messageInput = document.getElementById('message-input');
            if (messageInput) {
                messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        sendMessage();
                    }
                });
            }
        });
    </script>
</body>
</html>
