<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>大运河音乐节 - 搭子计划</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 覆盖 style.css 中 main 的白色背景/圆角（专题页 main 需透明融入渐变背景） */
        main {
            margin-top: 0 !important;
            background-color: transparent !important;
            backdrop-filter: none !important;
            border-radius: 0 !important;
            min-height: auto !important;
        }

        /* 音乐节主题动画 */
        @keyframes music-float {
            0%, 100% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }
        .music-float { animation: music-float 3.2s ease-in-out infinite; }

        @keyframes note-rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-70px) scale(1.4); opacity: 0; }
        }
        .note-decor {
            position: absolute;
            pointer-events: none;
            animation: note-rise 4.5s ease-in infinite;
        }
        .note-decor:nth-child(1) { left: 6%;  top: 55%; animation-delay: 0s; }
        .note-decor:nth-child(2) { left: 22%; top: 70%; animation-delay: 1.4s; font-size: 14px; }
        .note-decor:nth-child(3) { left: 60%; top: 60%; animation-delay: 2.1s; }
        .note-decor:nth-child(4) { left: 82%; top: 68%; animation-delay: 0.7s; font-size: 14px; }
        .note-decor:nth-child(5) { left: 90%; top: 40%; animation-delay: 2.8s; font-size: 12px; }

        @keyframes shimmer-festival {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .shimmer-festival {
            background: linear-gradient(90deg, #f3c146, #fff3c9, #5ac1fb, #dff1ff, #f3c146);
            background-size: 200% 100%;
            animation: shimmer-festival 4s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes pulse-festival {
            0%, 100% { box-shadow: 0 0 0 0 rgba(243, 193, 70, 0.45); }
            50% { box-shadow: 0 0 0 14px rgba(243, 193, 70, 0); }
        }
        .btn-pulse-festival { animation: pulse-festival 2s infinite; }

        /* 标签 */
        .tag-festival {
            background: linear-gradient(135deg, #fff6d8, #fdeec2);
            color: #a97b0a;
            border: 1px solid rgba(243, 193, 70, 0.5);
        }
        .tag-festival-sky {
            background: linear-gradient(135deg, #e3f4ff, #d0ecff);
            color: #0b7fc4;
            border: 1px solid rgba(90, 193, 251, 0.5);
        }

        /* 母版 coverflow 3D */
        .carousel-stage { perspective: 1100px; }
        .carousel-item {
            position: absolute;
            left: 50%;
            top: 0;
            margin-left: -144px; /* w-72 / 2 */
            width: 288px;
            height: 162px;
            transition: transform 0.45s cubic-bezier(0.22, 0.9, 0.35, 1), opacity 0.45s ease;
            cursor: pointer;
        }
        .carousel-item img { pointer-events: none; user-select: none; -webkit-user-drag: none; }

        /* AI 合成进度 */
        @keyframes ai-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .ai-ring {
            border: 4px solid rgba(243, 193, 70, 0.2);
            border-top-color: #f3c146;
            border-right-color: #5ac1fb;
            animation: ai-ring 1.1s linear infinite;
        }
        @keyframes ai-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .ai-bounce { animation: ai-bounce 1.6s ease-in-out infinite; }

        /* 聊天 */
        .chat-bubble-me {
            background: linear-gradient(135deg, #f3c146, #f7d269);
            color: #4a3504;
            border-radius: 16px 16px 4px 16px;
        }
        .chat-bubble-other {
            background: #ffffff;
            border-radius: 16px 16px 16px 4px;
        }

        .poster-frame {
            background: linear-gradient(160deg, #0f1424 0%, #1b2440 100%);
            padding: 10px;
            border-radius: 20px;
        }

        /* 底部弹窗滑入 */
        @keyframes slideUpFestival {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUpFestival 0.35s cubic-bezier(0.22, 0.9, 0.35, 1); }

        /* TAB 栏吸顶状态（到达顶部后悬浮并加背景） */
        .tab-stuck {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        /* TAB 金色滑块（仅背景滑动：白底垫最底层 → 金滑块中间层 → 文字最上层） */
        .tab-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #f3c146, #f7b733);
            box-shadow: 0 2px 10px rgba(243, 193, 70, 0.4);
            z-index: 10;
            pointer-events: none;
            transition: left 0.35s cubic-bezier(0.22, 0.9, 0.35, 1), width 0.35s cubic-bezier(0.22, 0.9, 0.35, 1);
            will-change: left, width;
        }

        /* 欢迎区丝滑收起（grid 行高过渡 + 淡出） */
        .welcome-collapsible {
            display: grid;
            grid-template-rows: 1fr;
            opacity: 1;
            transition: grid-template-rows 0.45s cubic-bezier(0.22, 0.9, 0.35, 1), opacity 0.4s ease;
        }
        .welcome-collapsible-inner { overflow: hidden; min-height: 0; }
        .welcome-collapsed .welcome-collapsible { grid-template-rows: 0fr; opacity: 0; }

        /* 护照弹窗弹出 */
        @keyframes passport-pop {
            0% { transform: scale(0.88) translateY(18px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-passport-pop { animation: passport-pop 0.38s cubic-bezier(0.22, 0.9, 0.35, 1); }

        /* 护照样式卡片（暖金奶油底，呼应页面金色主调的欢乐氛围） */
        .passport-book {
            width: 150px;
            height: 190px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #fffdf4 0%, #fdf2cf 100%);
            border: 2px solid rgba(243, 193, 70, 0.9);
            border-radius: 14px;
            box-shadow: 0 10px 24px rgba(212, 160, 23, 0.3);
            position: relative;
        }
        .passport-book::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 8%;
            bottom: 8%;
            width: 1px;
            background: rgba(243, 193, 70, 0.55);
        }
        .passport-stamp {
            position: absolute;
            right: -22px;
            bottom: -12px;
            width: 96px;
            height: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 116, 110, 0.9);
            color: rgba(255, 116, 110, 0.95);
            border-radius: 50%;
            transform: rotate(-16deg);
            background: rgba(255, 116, 110, 0.08);
            text-align: center;
            line-height: 1.15;
            font-weight: 900;
            box-shadow: 0 4px 14px rgba(255, 116, 110, 0.25);
        }
        .passport-stamp::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1.5px dashed rgba(255, 116, 110, 0.45);
            border-radius: 50%;
        }
    </style>
</head>

                var result = Object.assign({}, defaults, saved || {});
                // 旧版本状态迁移（buddy/partner/chat → posts/chats）
                if (saved && saved.buddy && !saved.posts) {
                    var oldPartner = result.partner || null;
                    result.posts = [{
                        id: 'p-legacy',
                        category: LEGACY_CATEGORY_MAP[result.buddy.category] || result.buddy.category,
                        message: result.buddy.message,
                        time: '',
                        matches: oldPartner ? [cleanMatch(oldPartner)] : []
                    }];
                    result.chats = oldPartner ? { [oldPartner.id]: result.chat || [] } : {};
                    delete result.buddy;
                    delete result.partner;
                    delete result.chat;
                }
                // 匹配搭子资料实时从搭子池刷新头像（旧版本状态里可能没有头像字段）
                if (Array.isArray(result.posts)) {
                    result.posts = result.posts.map(function (p) {
                        if (!p || !Array.isArray(p.matches)) return p;
                        return Object.assign({}, p, {
                            matches: p.matches.map(function (m) {
                                if (!m || !m.id) return m;
                                var fresh = BUDDY_POOL.find(function (b) { return b.id === m.id; });
                                return fresh ? Object.assign({}, m, { avatarUrl: fresh.avatarUrl }) : m;
                            })
                        });
                    });
                }
                // 旧版海报分享 → 动态列表
                if (!Array.isArray(result.feedPosts)) result.feedPosts = [];
                if (!result.feedPosts.length && result.poster && result.poster.shared) {
                    result.feedPosts = [{
                        id: 'feed-legacy',
                        image: 'music_new.png',
                        text: result.poster.sharedText || '',
                        onScreen: true,
                        time: '刚刚',
                        likes: 66,
                        comments: 12
                    }];
                }
                // 旧版聊天 key（仅搭子 id）→ 新版（需求id:搭子id）
                if (result.chats && !Array.isArray(result.chats)) {
                    var remapped = {};
                    Object.keys(result.chats).forEach(function (key) {
                        if (key.indexOf(':') > -1) { remapped[key] = result.chats[key]; return; }
                        result.posts.forEach(function (p) {
                            if ((p.matches || []).some(function (m) { return m.id === key; })) {
                                remapped[p.id + ':' + key] = result.chats[key];
                            }
                        });
                    });
                    result.chats = remapped;
                }
                return result;
            } catch (e) {
                return defaults;
            }
        }

        // 清理旧版搭子字段（同担/在场时间/座位/匹配度已下线）
        function cleanMatch(m) {
            return {
                id: m.id, name: m.name, gender: m.gender, age: m.age,
                category: LEGACY_CATEGORY_MAP[m.category] || m.category,
                tags: m.tags || [], intro: m.intro, avatarUrl: m.avatarUrl

                slider.style.width = fromBtn.offsetWidth + 'px';
                slider.offsetWidth; // 强制回流，让起始位置先生效

                if (this.fabClampBound) return;

                                <i data-lucide="plus" class="w-3.5 h-3.5"></i>

                        ${switcherHtml}

                        <div class="space-y-2 text-sm">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-white px-2 py-0.5 rounded-md whitespace-nowrap shrink-0" style="background:#d4a017;">需求类别</span>
                                <span class="text-gray-700">${categoryLabel(post.category)}</span>
                                ${post.time ? '<span class="ml-auto text-[10px] text-gray-300 whitespace-nowrap">' + escapeHtml(post.time) + ' 发布</span>' : ''}
                            </div>
                            <div class="flex items-start gap-2">
                                <span class="text-[10px] font-bold text-white px-2 py-0.5 rounded-md mt-0.5 whitespace-nowrap shrink-0" style="background:#7B1FA2;">留&#12288;&#12288;言</span>
                                <span class="text-gray-600 leading-relaxed">${escapeHtml(post.message)}</span>
                            </div>
                        </div>
                    </div>

                    <!-- 匹配结果列表 -->
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(90,193,251,0.18);">
                                <i data-lucide="users" class="w-4 h-4" style="color:#0b7fc4;"></i>
                            </div>
                            <h3 class="font-black text-gray-900 text-sm">为你找到 ${matches.length} 位搭子</h3>
                            <span class="text-[10px] text-gray-400">选一位开聊吧</span>
                        </div>
                        ${matchCards || `
                        <div class="text-center text-gray-400 text-xs py-6">
                            <div class="mb-2">暂时没有匹配结果</div>
                            <button onclick="MusicFestivalView.rematchPost()"
                                    class="text-xs font-bold px-4 py-2 rounded-full border border-festival-gold active:scale-95 transition-transform"
                                    style="color:#a97b0a; background: rgba(243,193,70,0.08);">
                                重新匹配
                            </button>
                        </div>`}
                    </div>
                </div>
                `;
            },

            // 单个搭子匹配结果卡片（标注搭子自身的需求类别）
            renderMatchCard(m) {
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3">
                    <div class="flex items-center gap-3">
                        <img src="${escapeHtml(m.avatarUrl)}" class="w-14 h-14 flex-shrink-0 rounded-full border-2 border-white shadow-md object-cover"/>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-black text-gray-900 whitespace-nowrap">${escapeHtml(m.name)}</span>
                                <i data-lucide="badge-check" class="w-3.5 h-3.5 text-festival-sky"></i>
                                <span class="text-[10px] text-gray-500 whitespace-nowrap">${escapeHtml(m.gender)} · ${escapeHtml(m.age)}岁</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 mt-1.5">
                                <span class="tag-festival-sky text-[10px] px-2 py-0.5 rounded-full font-medium">${categoryLabel(m.category)}</span>
                                ${(m.tags || []).map((t) => '<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">' + escapeHtml(t) + '</span>').join('')}
                            </div>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 leading-relaxed mt-3 bg-gray-50 rounded-xl p-3">"${escapeHtml(m.intro)}"</p>
                    <button data-id="${escapeHtml(m.id)}" onclick="MusicFestivalView.openChat(this.dataset.id)"
                            class="w-full mt-3 py-2.5 rounded-xl text-white font-black text-sm active:scale-95 transition-transform flex items-center justify-center gap-2"
                            style="background: linear-gradient(135deg, #5ac1fb, #f3c146); box-shadow: 0 4px 15px rgba(243,193,70,0.4);">
                        <i data-lucide="message-circle" class="w-4 h-4"></i>
                        和 TA 聊天
                    </button>
                </div>
                `;
            },

            // 再发一条：进入填写表单（保留已有需求与草稿内容）
            postAnother() {
                this.isDraftingPost = true;
                this.render();
            },

            // 表单返回：回到已发布需求视图
            backToPosts() {
                this.isDraftingPost = false;
                this.render();
            },

            // 切换查看某条需求及其匹配结果（仅会话内记录，不写入存储）
            switchPost(id) {
                this.activePostId = id;
                this.render();
            },

            // 当前查看的需求（兜底取第一条）
            activePost() {
                return state.posts.find((p) => p.id === this.activePostId) || state.posts[0];
            },

            // 重新匹配当前需求（无匹配结果时兜底）
            rematchPost() {
                var post = this.activePost();
                var matches = this.matchPartners();
                var posts = state.posts.map(function (p) {
                    return p.id === post.id ? Object.assign({}, p, { matches: matches }) : p;
                });
                saveState({ posts: posts });
                this.render();
                window.Common.showToast('已为你找到 ' + matches.length + ' 位搭子');
            },

            // 表单草稿（预置演示内容）
            initBuddyDraft() {
                this.buddyDraft = {
                    category: 'support',
                    message: '第一次来大运河音乐节，想找个搭子一起吃吃喝喝、拍照蹦迪！'
                };
            },

            pickCategory(id) {
                this.buddyDraft.category = id;
                this.render();
            },

            submitBuddyForm() {
                if (this.matchingInProgress) return;

                var message = document.getElementById('buddyMessage').value.trim();

                if (!this.buddyDraft.category) { window.Common.showToast('请选择需求类别'); return; }
                if (!message) { window.Common.showToast('写句留言介绍一下自己吧'); return; }

                // 匹配中动画
                this.matchingInProgress = true;
                this.showMatchingOverlay();

                var view = this;
                setTimeout(function () {
                    var matches = view.matchPartners();
                    view.hideMatchingOverlay();
                    view.matchingInProgress = false;

                    var post = {
                        id: 'p' + Date.now(),
                        category: view.buddyDraft.category,
                        message: message,
                        time: view.nowTime(),
                        matches: matches
                    };
                    saveState({ posts: state.posts.concat([post]) });
                    view.activePostId = post.id;
                    view.isDraftingPost = false;
                    view.initBuddyDraft();
                    view.render();
                    window.Common.showToast('已为你找到 ' + matches.length + ' 位搭子，选一位开聊吧');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 1600);
            },

            // 匹配逻辑：优先同需求类别，不足时从其余搭子补齐
            matchPartners() {
                var cat = this.buddyDraft.category;
                var sameCat = shuffle(BUDDY_POOL.filter((b) => b.category === cat));
                var others = shuffle(BUDDY_POOL.filter((b) => b.category !== cat));
                return sameCat.concat(others).slice(0, MATCH_COUNT).map((b) => Object.assign({}, b));
            },

            showMatchingOverlay() {
                var overlay = document.createElement('div');
                overlay.id = 'matchingOverlay';
                overlay.className = 'fixed inset-0 z-[300] flex flex-col items-center justify-center fade-in';
                overlay.style.background = 'rgba(15, 20, 36, 0.85)';
                overlay.innerHTML = `
                    <div class="ai-ring w-14 h-14 rounded-full mb-5"></div>
                    <div class="text-white font-bold text-lg ai-bounce">正在为你匹配搭子…</div>
                    <div class="text-white/50 text-xs mt-2">根据需求类别智能匹配 · 稍后揭晓多位搭子</div>
                `;
                document.body.appendChild(overlay);
                window.Common.initIcons();
            },

            hideMatchingOverlay() {
                var overlay = document.getElementById('matchingOverlay');
                if (overlay) overlay.remove();
            },

            // ---------- 私聊 ----------
            // 聊天页头部（标注搭子自身的需求类别）
            chatHeaderHtml(p) {
                return `
                    <div class="flex items-center gap-2 px-3 py-3 bg-white/85 backdrop-blur-md border-b border-gray-100">
                        <button onclick="MusicFestivalView.closeChat()" class="p-1.5 -ml-1 rounded-full active:bg-gray-100">
                            <i data-lucide="chevron-left" class="w-6 h-6 text-gray-600"></i>
                        </button>
                        <img src="${escapeHtml(p.avatarUrl)}" class="w-9 h-9 rounded-full object-cover border border-gray-200"/>
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-sm text-gray-900 flex items-center gap-1 whitespace-nowrap">
                                ${escapeHtml(p.name)}
                                <i data-lucide="badge-check" class="w-3.5 h-3.5 text-festival-sky flex-shrink-0"></i>
                            </div>
                            <div class="text-[10px] text-gray-400 truncate">${categoryLabel(p.category)}搭子 · ${escapeHtml(p.gender)} · ${escapeHtml(p.age)}岁</div>
                        </div>
                    </div>`;
            },

            // 向指定聊天线程追加一条消息（key = 需求id:搭子id）
            appendChat(chatKey, msg) {
                var list = (state.chats[chatKey] || []).concat([msg]);
                saveState({ chats: Object.assign({}, state.chats, { [chatKey]: list }) });
            },

            openChat(partnerId) {
                if (document.getElementById('festivalChat')) return;

                var post = this.activePost();
                var p = (post.matches || []).find((m) => m.id === partnerId);
                if (!p) return;
                this.chatPartnerKey = post.id + ':' + p.id;

                // 首次打开时，对方先来一句打招呼
                if (!state.chats[this.chatPartnerKey] || !state.chats[this.chatPartnerKey].length) {
                    this.appendChat(this.chatPartnerKey, { isMe: false, text: '哈喽！我是你的搭子「' + p.name + '」，音乐节现场见！', time: this.nowTime() });
                }

                var chat = document.createElement('div');
                chat.id = 'festivalChat';
                chat.className = 'fixed inset-0 z-[400] flex flex-col fade-in';
                chat.style.background = 'linear-gradient(180deg, #dfefff 0%, #ecf7ff 40%, #fef8e8 100%)';

                chat.innerHTML = this.chatHeaderHtml(p) + `
                    <div id="chatMessages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>
                    <div class="px-3 pb-3 pt-2 bg-white/85 backdrop-blur-md border-t border-gray-100">
                        <div class="flex items-center gap-2">
                            <input id="chatInput" type="text" maxlength="100" placeholder="和 TA 聊聊音乐节…"
                                   class="flex-1 border border-gray-200 rounded-full px-4 py-2.5 text-sm bg-white outline-none focus:border-festival-sky"/>
                            <button onclick="MusicFestivalView.sendMessage()"
                                    class="w-10 h-10 rounded-full text-white flex items-center justify-center active:scale-90 transition-transform"
                                    style="background: linear-gradient(135deg, #5ac1fb, #2b8fd6);">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
                document.body.appendChild(chat);
                window.Common.initIcons();

                this.renderChatMessages();

                var input = document.getElementById('chatInput');
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.sendMessage();
                });
                setTimeout(() => input.focus(), 200);
            },

            closeChat() {
                // 聊天层挂在 body 上，关闭时主界面无需重建
                var chat = document.getElementById('festivalChat');
                if (chat) chat.remove();
            },

            renderChatMessages() {
                var box = document.getElementById('chatMessages');
                if (!box) return;

                var list = state.chats[this.chatPartnerKey] || [];
                var html = list.map((m) => {
                    return m.isMe
                        ? '<div class="flex justify-end"><div class="chat-bubble-me max-w-[75%] px-3.5 py-2.5 text-sm leading-relaxed shadow-sm">' + escapeHtml(m.text) + '</div></div>'
                        : '<div class="flex justify-start"><div class="chat-bubble-other max-w-[75%] px-3.5 py-2.5 text-sm leading-relaxed text-gray-700 shadow-sm border border-gray-100">' + escapeHtml(m.text) + '</div></div>';
                }).join('');
                box.innerHTML = html || '<div class="text-center text-gray-300 text-xs mt-10">和你的搭子打个招呼吧~</div>';
                box.scrollTop = box.scrollHeight;
            },

            sendMessage() {
                var input = document.getElementById('chatInput');
                var text = (input.value || '').trim();
                if (!text) return;

                var chatKey = this.chatPartnerKey;
                this.appendChat(chatKey, { isMe: true, text: text, time: this.nowTime() });
                input.value = '';
                this.renderChatMessages();

                // 对方自动回复
                var view = this;
                setTimeout(function () {
                    var replies = [
                        '哈哈哈收到！',
                        '那必须的！',
                        '我也这么想，现场见！',
                        '好呀，到时候一起冲前排！',
                        '我带了应援棒，分你一根！',
                        '没问题，运河边集合！',
                        '我提前到，到时候喊你~',
                        '这就安排上！'
                    ];
                    var reply = replies[Math.floor(Math.random() * replies.length)];
                    view.appendChat(chatKey, { isMe: false, text: reply, time: view.nowTime() });
                    view.renderChatMessages();
                }, 900);
            },

            nowTime() {
                var d = new Date();
                var h = d.getHours();
                var m = d.getMinutes();
                return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
            },

            // ---------- 功能二：海报工坊 ----------
            renderPosterTab() {
                if (state.poster.status === 'done') {
                    return this.renderPosterResult();
                }
                return this.renderPosterMaker();
            },

            renderPosterMaker() {
                var templatesHtml = TEMPLATES.map((t, i) => {
                    var offset = i - this.centerIndex;
                    var abs = Math.abs(offset);
                    var zIndex = 10 - abs;
                    var opacity = abs >= 3 ? 0 : (abs === 2 ? 0.45 : 1);
                    var transform = 'translateX(' + (offset * 96) + 'px) translateZ(' + (-abs * 90) + 'px) rotateY(' + (offset * -30) + 'deg)';
                    return `
                    <div class="carousel-item" data-idx="${i}"
                         style="z-index:${zIndex}; opacity:${opacity}; transform:${transform};"
                         onclick="MusicFestivalView.pickTemplate(${i})">
                        <img src="${t.file}" class="w-full h-full object-cover rounded-xl shadow-lg border ${abs === 0 ? 'border-festival-gold border-2' : 'border-white/60'}"
                             onerror="this.style.background='linear-gradient(135deg,#f3c146,#5ac1fb)';"/>
                        ${abs === 0 ? '<div class="absolute bottom-2 left-2 right-2 text-center text-[10px] font-bold text-white bg-black/45 backdrop-blur-sm rounded-full py-1">当前母版</div>' : ''}

                var selected = TEMPLATES[this.selectedTemplateId];

                return `
                <div class="px-4 pt-1.5 pb-4">
                    <!-- 海报工坊工作区卡片（参考搭个伴表单卡片样式） -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <!-- 头部排版与音浪广场一致：图标 + 上下排列的标题与介绍 -->
                        <div class="flex items-center gap-2 mb-3">
                            <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(90,193,251,0.18);">
                                <i data-lucide="wand-sparkles" class="w-4 h-4" style="color:#0b7fc4;"></i>
                            </div>
                            <div class="min-w-0">
                                <h3 class="font-black text-gray-900 whitespace-nowrap">海报工坊</h3>
                                <p class="text-[11px] text-gray-400">合成你的大运河音乐节海报，有机会登上现场大屏</p>
                            </div>
                        </div>

                        <!-- 母版选择 -->
                        <div class="mb-4">
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-bold text-gray-500">选择海报母版</label>
                                <span class="text-[10px] text-gray-400">左右滑动立体切换</span>
                            </div>
                            <div id="carouselStage" class="carousel-stage relative h-[170px] overflow-visible select-none" style="touch-action: pan-y;">
                                ${templatesHtml}
                            </div>
                            <div class="flex items-center justify-center gap-3 mt-4">
                                <button onclick="MusicFestivalView.moveCarousel(-1)" class="p-1.5 rounded-full bg-gray-100 active:scale-90 transition-transform">
                                    <i data-lucide="chevron-left" class="w-4 h-4 text-gray-500"></i>
                                </button>
                                <div class="text-center">
                                    <div class="text-sm font-bold text-gray-800">${selected.name}</div>
                                    <div class="text-[10px] text-gray-400">${selected.style}</div>
                                </div>
                                <button onclick="MusicFestivalView.moveCarousel(1)" class="p-1.5 rounded-full bg-gray-100 active:scale-90 transition-transform">
                                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-500"></i>
                                </button>
                            </div>
                            <div class="flex justify-center gap-1.5 mt-2">
                                ${TEMPLATES.map((t, i) => '<span class="w-1.5 h-1.5 rounded-full ' + (i === this.selectedTemplateId ? 'bg-festival-gold w-4' : 'bg-gray-200') + '" style="transition:all .3s;"></span>').join('')}
                            </div>
                        </div>

                        <!-- 上传图片 -->
                        <div class="mb-4">
                            <label class="text-xs font-bold text-gray-500 mb-2 block">上传你的图片</label>
                            <div class="flex items-center gap-4">
                                <div class="w-24 h-24 rounded-xl overflow-hidden border-2 border-dashed border-gray-200 flex-shrink-0 bg-gray-50">
                                    <img id="uploadPreview" src="music_userphoto.jpg" class="w-full h-full object-cover"/>
                                </div>
                                <div class="flex-1">
                                    <button onclick="document.getElementById('posterFileInput').click()"
                                            class="w-full py-2.5 rounded-xl text-white font-bold text-sm active:scale-95 transition-transform flex items-center justify-center gap-2"
                                            style="background: linear-gradient(135deg, #5ac1fb, #2b8fd6); box-shadow: 0 3px 12px rgba(90,193,251,0.35);">
                                        <i data-lucide="image-plus" class="w-4 h-4"></i>
                                        上图
                                    </button>
                                    <p class="text-[10px] text-gray-400 mt-2 leading-relaxed">默认使用你的现场照（演示图），点击上图可更换</p>
                                </div>
                                <input type="file" id="posterFileInput" accept="image/*" class="hidden" onchange="MusicFestivalView.onPickImage(this)"/>
                            </div>
                        </div>

                        <button onclick="MusicFestivalView.submitPoster()"
                                class="btn-pulse-festival w-full py-3.5 rounded-xl text-white font-black text-base active:scale-95 transition-transform"
                                style="background: linear-gradient(135deg, #f3c146, #f7b733); box-shadow: 0 4px 15px rgba(243,193,70,0.45);">
                            <span class="flex items-center justify-center gap-2">
                                <i data-lucide="sparkles" class="w-4 h-4"></i>
                                生成我的海报
                            </span>
                        </button>
                        <p class="text-center text-[10px] text-gray-400 mt-2">每人仅有一次合成机会，生成后海报将保留在你的页面</p>
                    </div>
                </div>
                `;
            },

            pickTemplate(i) {
                if (this.recentDrag) return;
                this.selectedTemplateId = i;
                this.centerIndex = i;
                this.render();
            },

            moveCarousel(dir) {
                var next = (this.centerIndex + dir + TEMPLATES.length) % TEMPLATES.length;
                this.centerIndex = next;
                this.selectedTemplateId = next;
                this.render();
            },

            onPickImage(input) {
                var file = input.files && input.files[0];
                if (!file) return;
                if (file.size > 8 * 1024 * 1024) { window.Common.showToast('图片太大啦，请选择 8MB 以内的图片'); return; }

                var reader = new FileReader();
                var view = this;
                reader.onload = function (e) {
                    view.pickedImage = e.target.result;
                    var preview = document.getElementById('uploadPreview');
                    if (preview) preview.src = view.pickedImage;
                    window.Common.showToast('图片已选择');
                };
                reader.readAsDataURL(file);
            },

            submitPoster() {
                if (state.poster.status === 'done') {
                    window.Common.showToast('每人仅有一次合成机会，你的海报已生成');
                    return;
                }
                this.showAiOverlay();
            },

            // AI 合成动画（约 3.5 秒）
            showAiOverlay() {
                var steps = [
                    { icon: 'scan-face', text: '正在识别你的照片…' },
                    { icon: 'layout-template', text: '匹配母版风格…' },
                    { icon: 'sparkles', text: 'AI 融合渲染中…' },
                    { icon: 'image', text: '生成专属海报…' }
                ];

                var overlay = document.createElement('div');
                overlay.id = 'aiOverlay';
                overlay.className = 'fixed inset-0 z-[300] flex flex-col items-center justify-center fade-in';
                overlay.style.background = 'rgba(15, 20, 36, 0.9)';
                overlay.innerHTML = `
                    <div class="relative mb-8">
                        <div class="ai-ring w-20 h-20 rounded-full"></div>
                        <div class="absolute inset-0 flex items-center justify-center text-2xl ai-bounce">🎵</div>
                    </div>
                    <div id="aiStepText" class="text-white font-bold text-base ai-bounce">正在识别你的照片…</div>
                    <div class="w-56 h-1.5 bg-white/15 rounded-full mt-6 overflow-hidden">
                        <div id="aiProgressBar" class="h-full rounded-full" style="width:0%; background: linear-gradient(90deg, #f3c146, #5ac1fb); transition: width .2s ease;"></div>
                    </div>
                    <div id="aiProgressText" class="text-white/50 text-xs mt-2">0%</div>
                `;
                document.body.appendChild(overlay);
                window.Common.initIcons();

                var progress = 0;
                var stepIdx = 0;
                var view = this;

                var timer = setInterval(function () {
                    progress += 2 + Math.random() * 5;
                    if (progress >= 100) progress = 100;

                    var bar = document.getElementById('aiProgressBar');
                    var pctText = document.getElementById('aiProgressText');
                    if (bar) bar.style.width = progress + '%';
                    if (pctText) pctText.textContent = Math.floor(progress) + '%';

                    var newStep = Math.min(steps.length - 1, Math.floor(progress / (100 / steps.length)));
                    if (newStep !== stepIdx) {
                        stepIdx = newStep;
                        var stepText = document.getElementById('aiStepText');
                        if (stepText) stepText.textContent = steps[stepIdx].text;
                    }

                    if (progress >= 100) {
                        clearInterval(timer);
                        setTimeout(function () {
                            view.finishPoster();
                        }, 500);
                    }
                }, 120);
            },

            finishPoster() {
                var overlay = document.getElementById('aiOverlay');
                if (overlay) overlay.remove();

                saveState({
                    poster: Object.assign({}, state.poster, { status: 'done' })
                });
                this.render();
                window.Common.showToast('🎉 海报合成成功！');
            },

            renderPosterResult() {
                var shared = state.poster.shared;
                return `
                <div class="px-4 pt-1.5 pb-4">
                    <!-- 海报工坊结果卡片（与生成态同款白色卡片） -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <!-- 头部排版与音浪广场一致：图标 + 上下排列的标题与介绍 -->
                        <div class="flex items-center gap-2 mb-3">
                            <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(90,193,251,0.18);">
                                <i data-lucide="wand-sparkles" class="w-4 h-4" style="color:#0b7fc4;"></i>
                            </div>
                            <div class="min-w-0">
                                <h3 class="font-black text-gray-900 whitespace-nowrap">海报工坊</h3>
                                <p class="text-[11px] text-gray-400">合成你的大运河音乐节海报，有机会登上现场大屏</p>
                            </div>
                        </div>

                        <!-- 成品海报 -->
                        <div class="poster-frame shadow-xl">
                            <img src="music_new.png" class="w-full rounded-xl" style="aspect-ratio: 1000/561; object-fit: cover;"
                                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
                            <div class="hidden flex-col items-center justify-center rounded-xl" style="aspect-ratio: 1000/561; background: linear-gradient(135deg, #f3c146, #5ac1fb);">
                                <span class="text-3xl mb-1">🎵</span>
                                <span class="text-white text-sm font-bold">大运河音乐节 · 专属海报</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-center gap-2 text-xs text-gray-500 mt-3">
                            <i data-lucide="monitor-up" class="w-3.5 h-3.5 text-festival-sky"></i>
                            你的海报已生成，分享后有机会登上大屏
                        </div>

                        <div class="flex gap-3 mt-4">
                            <button onclick="MusicFestivalView.goShare()"
                                    class="flex-1 py-3.5 rounded-xl font-black text-sm active:scale-95 transition-transform flex items-center justify-center gap-2 ${shared ? 'bg-gray-100 text-gray-400 cursor-default' : 'text-white'}"
                                    style="${shared ? '' : 'background: linear-gradient(135deg, #f3c146, #f7b733); box-shadow: 0 4px 15px rgba(243,193,70,0.4);'}">
                                <i data-lucide="${shared ? 'check' : 'share-2'}" class="w-4 h-4"></i>
                                ${shared ? '已分享' : '去分享'}
                            </button>
                            <button onclick="MusicFestivalView.savePoster()"
                                    class="flex-1 py-3.5 rounded-xl text-white font-black text-sm active:scale-95 transition-transform flex items-center justify-center gap-2"
                                    style="background: linear-gradient(135deg, #5ac1fb, #2b8fd6); box-shadow: 0 4px 15px rgba(90,193,251,0.4);">
                                <i data-lucide="download" class="w-4 h-4"></i>
                                保存
                            </button>
                        </div>
                        <p class="text-center text-[10px] text-gray-400 mt-2">海报合成后永久保留在界面，随时可以保存</p>

                        <!-- 重新合成入口（卡片最下方） -->
                        <button onclick="MusicFestivalView.resetPoster()"
                                class="w-full mt-3 py-2.5 rounded-xl border border-festival-gold text-sm font-bold active:scale-95 transition-transform flex items-center justify-center gap-1.5"
                                style="color: #a97b0a; background: rgba(243,193,70,0.08);">
                            <i data-lucide="refresh-ccw" class="w-3.5 h-3.5"></i>
                            重新合成
                        </button>
                    </div>
                </div>
                `;
            },

            // 重新合成：回到海报生成界面
            resetPoster() {
                saveState({
                    poster: Object.assign({}, state.poster, { status: 'none', shared: false, sharedText: '' })
                });
                this.render();
                window.Common.showToast('已进入海报合成界面');
            },

            savePoster() {
                var a = document.createElement('a');
                a.href = 'music_new.png';
                a.download = '大运河音乐节-我的海报.png';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.Common.showToast('海报已保存到本地');
            },

            // 去分享：跳到音浪广场并直接调起发布窗口（默认用我的海报）
            goShare() {
                if (state.poster.status !== 'done') return;
                if (state.poster.shared) return; // 已分享过，不再重复拉起
                this.switchTab('feed');
                this.initPublishDraft({ image: 'music_new.png', imageType: 'poster' });
                this.openPublishModal();
            },

            // ---------- 发动态 ----------
            initPublishDraft(preset) {
                this.publishDraft = Object.assign({ image: null, imageType: null, text: '', onScreen: true, idCard: null }, preset || {});
            },

            openPublishModal() {
                if (document.getElementById('publishModal')) return;
                if (!this.publishDraft) this.initPublishDraft();

                var overlay = document.createElement('div');
                overlay.id = 'publishModal';
                // z-[90]：高于页面内容（z-40），低于 Toast（z-[100]），保证校验提示可见
                overlay.className = 'fixed inset-0 z-[90] flex items-end justify-center fade-in';
                overlay.style.background = 'rgba(0,0,0,0.45)';
                overlay.innerHTML = '<div id="publishSheet" class="bg-white w-full max-w-md rounded-t-3xl p-5 pb-8 animate-slide-up max-h-[90vh] overflow-y-auto"></div>';
                document.body.appendChild(overlay);

                this.renderPublishModalContent();

                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) this.closePublishModal();
                });
            },

            closePublishModal() {
                var modal = document.getElementById('publishModal');
                if (modal) modal.remove();
            },

            renderPublishModalContent() {
                var sheet = document.getElementById('publishSheet');
                if (!sheet) return;

                var d = this.publishDraft;
                var posterDone = state.poster.status === 'done';
                var idCardUploaded = !!state.idCardUploaded;

                var preview = d.image
                    ? '<img src="' + escapeHtml(d.image) + '" class="w-full h-28 object-cover rounded-xl border border-gray-100"/>'
                    : '<div class="w-full h-28 rounded-xl border-2 border-dashed border-gray-200 bg-gray-50 flex flex-col items-center justify-center text-gray-300"><i data-lucide="image" class="w-6 h-6 mb-1"></i><span class="text-[10px]">选择一张图片</span></div>';

                var idCardSection = '';
                if (d.onScreen) {
                    if (idCardUploaded) {
                        idCardSection = `
                        <div class="flex items-center gap-2 bg-green-50 rounded-xl px-3 py-2.5 border border-green-100 mb-4">
                            <i data-lucide="badge-check" class="w-4 h-4 text-green-500 shrink-0"></i>
                            <span class="text-xs text-green-700 font-medium">已完成实名登记，无需重复上传</span>
                        </div>`;
                    } else {
                        idCardSection = `
                        <div class="mb-4">
                            <label class="text-xs font-bold text-gray-500 mb-2 block">身份证照片</label>
                            <div class="flex items-center gap-3">
                                ${d.idCard ? '<img src="' + escapeHtml(d.idCard) + '" class="w-14 h-10 rounded-lg object-cover border border-gray-200 flex-shrink-0"/>' : '<div class="w-14 h-10 rounded-lg border-2 border-dashed border-gray-200 bg-gray-50 flex-shrink-0"></div>'}
                                <button onclick="document.getElementById('idCardInput').click()"
                                        class="flex-1 py-2.5 rounded-xl border border-festival-gold text-sm font-bold active:scale-95 transition-transform"
                                        style="color:#a97b0a; background: rgba(243,193,70,0.08);">
                                    ${d.idCard ? '重新上传' : '上传身份证照片'}
                                </button>
                            </div>
                            <p class="text-[10px] text-gray-400 mt-2">根据安保要求，上大屏需进行实名登记</p>
                            <input type="file" id="idCardInput" accept="image/*" class="hidden" onchange="MusicFestivalView.pickIdCardImage(this)"/>
                        </div>`;
                    }
                }

                sheet.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-lg font-black text-gray-900 whitespace-nowrap">发动态</h3>
                        <button onclick="MusicFestivalView.closePublishModal()" class="p-1 rounded-full active:bg-gray-100 shrink-0">
                            <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
                        </button>
                    </div>

                    <!-- 图片 -->
                    <div class="mb-4">
                        <label class="text-xs font-bold text-gray-500 mb-2 block">图片</label>
                        ${preview}
                        <div class="flex gap-2 mt-2">
                            <button onclick="MusicFestivalView.pickPosterImage()"
                                    class="flex-1 py-2.5 rounded-xl text-sm font-bold border transition-all duration-150 active:scale-95 ${d.imageType === 'poster' ? 'border-festival-gold text-amber-700' : 'border-gray-200 text-gray-600 bg-white'} ${posterDone ? '' : 'opacity-40'}">
                                🖼 用我的海报
                            </button>
                            <button onclick="document.getElementById('publishFileInput').click()"
                                    class="flex-1 py-2.5 rounded-xl text-sm font-bold border transition-all duration-150 active:scale-95 ${d.imageType === 'upload' ? 'border-festival-gold text-amber-700' : 'border-gray-200 text-gray-600 bg-white'}">
                                📷 上传照片
                            </button>
                        </div>
                        <input type="file" id="publishFileInput" accept="image/*" class="hidden" onchange="MusicFestivalView.pickFeedImage(this)"/>
                    </div>

                    <!-- 内容 -->
                    <div class="mb-4">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs font-bold text-gray-500">内容</label>
                            <button onclick="MusicFestivalView.autoGenerateText()"
                                    class="text-[11px] font-bold px-2.5 py-1 rounded-full flex items-center gap-1 active:scale-95 transition-transform"
                                    style="background: rgba(243,193,70,0.18); color:#a97b0a;">
                                <i data-lucide="wand-sparkles" class="w-3 h-3"></i>
                                自动生成
                            </button>
                        </div>
                        <textarea id="publishText" maxlength="100" rows="3"
                                  class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-festival-gold resize-none"
                                  placeholder="分享你在音乐节的现场瞬间…">${escapeHtml(d.text || '')}</textarea>
                        <div class="text-right text-[10px] text-gray-400 mt-1"><span id="publishTextCount">0</span>/100</div>
                    </div>

                    <!-- 上大屏 -->
                    <div class="flex items-center justify-between bg-gradient-to-r from-amber-50 to-sky-50 rounded-xl px-3 py-2.5 border border-amber-100/60 mb-4">
                        <div>
                            <div class="text-sm font-bold text-gray-800">上大屏</div>
                            <div class="text-[10px] text-gray-400">发布后进入现场大屏候选池</div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer shrink-0">
                            <input type="checkbox" class="sr-only" ${d.onScreen ? 'checked' : ''} onchange="MusicFestivalView.toggleOnScreen(this.checked)"/>
                            <div class="w-10 h-6 rounded-full transition-colors duration-200 ${d.onScreen ? 'bg-festival-gold' : 'bg-gray-200'}"></div>
                            <div class="absolute w-5 h-5 rounded-full bg-white shadow transition-transform duration-200 ${d.onScreen ? 'translate-x-4' : ''}"></div>
                        </label>
                    </div>

                    ${idCardSection}

                    <button onclick="MusicFestivalView.publishFeedPost()"
                            class="w-full py-3.5 rounded-xl text-white font-black text-sm active:scale-95 transition-transform"
                            style="background: linear-gradient(135deg, #f3c146, #f7b733); box-shadow: 0 4px 15px rgba(243,193,70,0.4);">
                        发布
                    </button>
                `;
                window.Common.initIcons();

                // 内容输入同步到草稿 + 字数统计（重渲染后恢复焦点与光标，避免打断输入）
                var prevTextarea = document.getElementById('publishText');
                var restoreFocus = prevTextarea && document.activeElement === prevTextarea;
                var caret = restoreFocus ? prevTextarea.selectionStart : null;

                var textarea = document.getElementById('publishText');
                var counter = document.getElementById('publishTextCount');
                var view = this;
                var updateCount = function () {
                    counter.textContent = textarea.value.length;
                    view.publishDraft.text = textarea.value;
                };
                updateCount();
                textarea.addEventListener('input', updateCount);

                if (restoreFocus) {
                    textarea.focus();
                    if (caret !== null) textarea.setSelectionRange(caret, caret);
                }
            },

            pickPosterImage() {
                if (state.poster.status !== 'done') {
                    window.Common.showToast('先去海报工坊生成你的专属海报吧');
                    return;
                }
                this.publishDraft.image = 'music_new.png';
                this.publishDraft.imageType = 'poster';
                this.renderPublishModalContent();
            },

            // 图片压缩：等比缩放并转 JPEG，控制本地存储体积
            compressImage(file, maxWidth, callback) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    var img = new Image();
                    img.onload = function () {
                        var scale = Math.min(1, maxWidth / img.width);
                        var canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        callback(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.onerror = function () { window.Common.showToast('图片读取失败，请换一张试试'); };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

            pickFeedImage(input) {
                var file = input.files && input.files[0];
                input.value = ''; // 先清空，拒绝后再次选择同一文件也能触发 change
                if (!file) return;
                if (file.size > 8 * 1024 * 1024) { window.Common.showToast('图片太大啦，请选择 8MB 以内的图片'); return; }

                var view = this;
                this.compressImage(file, 1080, function (dataUrl) {
                    view.publishDraft.image = dataUrl;
                    view.publishDraft.imageType = 'upload';
                    view.renderPublishModalContent();
                    window.Common.showToast('图片已选择');
                });
            },

            pickIdCardImage(input) {
                var file = input.files && input.files[0];
                input.value = '';
                if (!file) return;
                if (file.size > 8 * 1024 * 1024) { window.Common.showToast('图片太大啦，请选择 8MB 以内的图片'); return; }

                var view = this;
                this.compressImage(file, 800, function (dataUrl) {
                    view.publishDraft.idCard = dataUrl;
                    view.renderPublishModalContent();
                });
            },

            autoGenerateText() {
                var sentence = AUTO_TEXTS[Math.floor(Math.random() * AUTO_TEXTS.length)];
                this.publishDraft.text = sentence;
                var textarea = document.getElementById('publishText');
                var counter = document.getElementById('publishTextCount');
                if (textarea) {
                    textarea.value = sentence;
                    if (counter) counter.textContent = sentence.length;
                }
                window.Common.showToast('✨ 文案已生成');
            },

            toggleOnScreen(checked) {
                this.publishDraft.onScreen = checked;
                this.renderPublishModalContent();
            },

            publishFeedPost() {
                var text = (document.getElementById('publishText').value || '').trim();
                var d = this.publishDraft;

                if (!d.image) { window.Common.showToast('请选择一张图片'); return; }
                if (!text) { window.Common.showToast('写点内容再发布吧'); return; }
                if (d.onScreen && !state.idCardUploaded && !d.idCard) {
                    window.Common.showToast('上大屏需先上传身份证照片完成实名登记');
                    return;
                }

                var post = { id: 'feed' + Date.now(), image: d.image, text: text, onScreen: d.onScreen, time: '刚刚', likes: 0, comments: 0 };
                var patch = { feedPosts: [post].concat(state.feedPosts) };
                if (d.idCard) patch.idCardUploaded = true;
                if (d.imageType === 'poster') {
                    patch.poster = Object.assign({}, state.poster, { shared: true, sharedText: text });
                }
                saveState(patch);

                this.publishDraft = null; // 清空草稿，避免下次打开残留内容误发重复动态
                this.closePublishModal();
                window.Common.showToast('发布成功！已同步到音浪广场');
                this.render();
            },

            // ---------- 功能三：音浪广场 ----------
            renderFeedTab() {
                // 动态瀑布流（我的动态在前，与项目动态页同款双列瀑布流）
                var me = window.GlobalData && window.GlobalData.user ? window.GlobalData.user : { name: '我' };
                var posts = [];

                state.feedPosts.forEach(function (p) {
                    posts.push(this.renderFeedCard(Object.assign({}, p, {
                        name: me.name,
                        avatar: 'music_userphoto.jpg', // 使用本地用户照片
                        isMine: true
                    })));
                }, this);

                FEED_POSTS.forEach(function (p) {
                    posts.push(this.renderFeedCard(Object.assign({}, p, { isMine: false })));
                }, this);

                // 左右交替分列，让同类图片（如四张海报）错落排布在两侧
                var leftColumn = [];
                var rightColumn = [];
                posts.forEach(function (html, i) {
                    (i % 2 === 0 ? leftColumn : rightColumn).push(html);
                });

                return `
                <div class="px-4 pt-1.5 pb-28">
                    <!-- 音浪广场白色卡片区 -->
                    <div id="feedCardZone" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <!-- 卡片头部（与搭个伴/海报工坊一致）+ 右上角发动态入口 -->
                        <div class="p-4 pb-2">
                            <div class="flex items-center gap-2">
                                <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(243,193,70,0.18);">
                                    <i data-lucide="radio" class="w-4 h-4" style="color:#d4a017;"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <h3 class="font-black text-gray-900 whitespace-nowrap">音浪广场</h3>
                                    <p class="text-[11px] text-gray-400 truncate">大屏直击 · 大家分享的音乐节现场动态</p>
                                </div>
                                <button id="publishAnchor" onclick="MusicFestivalView.openPublishModal()"
                                        class="flex-shrink-0 flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border border-white active:scale-95 transition-transform"
                                        style="background: linear-gradient(135deg, #f3c146, #f7b733); color:#4a3504; box-shadow: 0 2px 8px rgba(243,193,70,0.4);">
                                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                    发动态
                                </button>
                            </div>
                        </div>

                        <!-- 话题横幅 -->
                        <div class="px-3 pb-3">
                            <div class="rounded-xl overflow-hidden relative" style="background: linear-gradient(135deg, #5ac1fb, #2b8fd6);">
                                <div class="absolute -right-4 -top-6 text-6xl opacity-20">🎸</div>
                                <div class="p-4 relative">
                                    <div class="text-white font-black text-base">${FESTIVAL_TOPIC}</div>
                                    <div class="text-white/80 text-xs mt-1">${this.feedTopicCount()} 人正在参与 · 已有 ${this.screenCount()} 条内容登上大屏</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 动态瀑布流（双列左右交替错落，图片原比例） -->
                    <div class="flex gap-3 mt-3 items-start">
                        <div class="flex-1 min-w-0">${leftColumn.join('')}</div>
                        <div class="flex-1 min-w-0">${rightColumn.join('')}</div>
                    </div>

                    <div class="text-center text-gray-400 text-xs pt-2">—— 音浪不停，现场见 🎶 ——</div>
                </div>

                <!-- 底部悬浮发动态按钮：仅当卡片右上角入口滚出视口后才出现 -->
                <button id="publishFab" onclick="MusicFestivalView.openPublishModal()"
                        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 px-6 py-3 rounded-full text-white font-black text-sm flex items-center gap-1.5 active:scale-95 transition-transform whitespace-nowrap border-2 border-white"
                        style="display:none; background: linear-gradient(135deg, #f3c146, #f7b733); box-shadow: 0 6px 20px rgba(243,193,70,0.5);">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    发动态
                </button>
                `;
            },

            feedTopicCount() {
                var base = 1286;
                return (base + state.feedPosts.length).toLocaleString();
            },

            screenCount() {
                var presets = FEED_POSTS.filter((p) => p.onScreen).length;
                var mine = state.feedPosts.filter((p) => p.onScreen).length;
                return presets + mine;
            },

            // 单条动态瀑布流卡片（同项目动态页样式）
            renderFeedCard(post) {
                var liked = !!this.feedLiked[post.id];
                var likeCount = post.likes + (liked ? 1 : 0);

                return `
                <div class="mb-3 bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="relative">
                        <img src="${escapeHtml(post.image)}" class="w-full h-auto object-cover"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
                        <!-- 图片加载失败时的占位 -->
                        <div class="hidden flex-col items-center justify-center w-full" style="aspect-ratio: 4/3; background: linear-gradient(135deg, #f3c146, #5ac1fb);">
                            <span class="text-2xl mb-1">🎵</span>
                            <span class="text-white text-xs font-bold">大运河音乐节</span>
                        </div>
                        ${post.onScreen ? '<span class="absolute top-2 right-2 text-[9px] font-bold px-1.5 py-0.5 rounded-full" style="background: rgba(243,193,70,0.92); color:#4a3504;">大屏候选 ⭐</span>' : ''}
                        ${post.isMine ? '<span class="absolute top-2 left-2 text-[9px] font-bold px-1.5 py-0.5 rounded-full text-white bg-black/40">我的动态</span>' : ''}
                    </div>
                    <div class="p-2.5">
                        <p class="text-[13px] text-gray-800 leading-snug mb-2">${escapeHtml(post.text)} <span class="text-festival-sky font-medium">${FESTIVAL_TOPIC}</span></p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5 overflow-hidden">
                                <img src="${escapeHtml(post.avatar)}" class="w-5 h-5 rounded-full border border-gray-100 flex-shrink-0 object-cover"/>
                                <span class="text-[10px] text-gray-500 truncate">${escapeHtml(post.name)}</span>
                            </div>
                            <div class="flex items-center gap-2.5 text-gray-400 shrink-0">
                                <button data-id="${escapeHtml(post.id)}" onclick="MusicFestivalView.toggleLike(this.dataset.id)" class="flex items-center gap-0.5 active:scale-90 transition-transform ${liked ? 'text-red-500' : ''}">
                                    <i data-lucide="heart" class="w-3 h-3 ${liked ? 'fill-red-500' : ''}"></i>
                                    <span class="text-[10px]">${likeCount}</span>
                                </button>
                                <span class="flex items-center gap-0.5">
                                    <i data-lucide="message-circle" class="w-3 h-3"></i>
                                    <span class="text-[10px]">${post.comments}</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            },

            toggleLike(id) {
                this.feedLiked = Object.assign({}, this.feedLiked, { [id]: !this.feedLiked[id] });
                this.render();
            },

            // ---------- Coverflow 拖拽 ----------
            bindCarouselDrag() {
                var stage = document.getElementById('carouselStage');
                if (!stage) return;

                var startX = null;
                var moved = false;
                var view = this;

                stage.addEventListener('pointerdown', (e) => {
                    startX = e.clientX;
                    moved = false;
                    stage.setPointerCapture(e.pointerId);
                });

                stage.addEventListener('pointermove', (e) => {
                    if (startX === null) return;
                    var dx = e.clientX - startX;
                    if (Math.abs(dx) > 12) moved = true;
                });

                stage.addEventListener('pointerup', (e) => {
                    if (startX === null) return;
                    var dx = e.clientX - startX;
                    startX = null;
                    if (!moved || Math.abs(dx) < 40) return;

                    // 拖拽后短暂屏蔽点击事件，避免同时触发两次切换
                    view.recentDrag = true;
                    setTimeout(function () { view.recentDrag = false; }, 300);
                    view.moveCarousel(dx < 0 ? 1 : -1);
                });
            },

            // ---------- 主渲染 ----------
            render() {
                var app = document.getElementById('app');
                var tabContent = this.activeTab === 'buddy'
                    ? this.renderBuddyTab()
                    : (this.activeTab === 'poster' ? this.renderPosterTab() : this.renderFeedTab());

                // 欢迎区收起后，仅保留护照按钮行（仍位于波浪上方、TAB 栏之上）
                var welcomeHtml = this.welcomeCollapsed ? this.renderPassportRow() : this.renderWelcome();

                app.innerHTML =
                    this.renderBanner(welcomeHtml) +
                    '<main>' + this.renderTabs() + tabContent + '</main>' +
                    '<footer class="text-center text-[10px] text-gray-400 pb-8 pt-2">大运河音乐节 · 搭子计划专题页（DEMO 演示，数据保存在本地浏览器）</footer>';

                if (window.Common) window.Common.initIcons();

                // 发动态悬浮按钮显隐校正（feed 页渲染后立即执行）
                if (this.activeTab === 'feed') this.updateFabPosition();

                // 表单预置内容（输入实时同步到草稿，切换分类重渲染时不丢失）
                if (this.activeTab === 'buddy' && (this.isDraftingPost || state.posts.length === 0)) {
                    var msg = document.getElementById('buddyMessage');
                    var view = this;

                    if (msg) {
                        msg.value = this.buddyDraft.message;
                        msg.addEventListener('input', function () { view.buddyDraft.message = msg.value; });
                        var cnt = document.getElementById('buddyMessageCount');
                        if (cnt) cnt.textContent = msg.value.length;
                    }
                }

                if (this.activeTab === 'poster' && state.poster.status !== 'done') {
                    this.bindCarouselDrag();
                }
            }
        };

        window.MusicFestivalView = MusicFestivalView;

        document.addEventListener('DOMContentLoaded', function () {
            MusicFestivalView.initBuddyDraft();
            MusicFestivalView.render();
            MusicFestivalView.bindTabSticky();
            MusicFestivalView.bindFabClamp();
        });
    </script>
</body>
</html>
