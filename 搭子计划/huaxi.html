<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>搭子就位·奇遇华熙 - 搭子计划</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 覆盖 style.css 中 main 的白色背景/圆角（专题页 main 需透明融入渐变背景） */
        main {
            margin-top: 0 !important;
            background-color: transparent !important;
            backdrop-filter: none !important;
            border-radius: 0 !important;
            min-height: auto !important;
        }

        /* 华熙专题主题动画 */
        @keyframes huaxi-float {
            0%, 100% { transform: translateY(0) rotate(-8deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }
        .huaxi-float { animation: huaxi-float 3.2s ease-in-out infinite; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.25; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .star-decor {
            position: absolute;
            pointer-events: none;
            color: #fff;
            animation: twinkle 2.6s ease-in-out infinite;
        }
        .star-decor:nth-child(1) { left: 8%;  top: 18%; }
        .star-decor:nth-child(2) { left: 20%; top: 34%; animation-delay: 0.8s; font-size: 10px; }
        .star-decor:nth-child(3) { left: 38%; top: 12%; animation-delay: 1.5s; font-size: 12px; }
        .star-decor:nth-child(4) { left: 55%; top: 30%; animation-delay: 2.2s; font-size: 10px; }
        .star-decor:nth-child(5) { left: 70%; top: 16%; animation-delay: 0.4s; }
        .star-decor:nth-child(6) { left: 86%; top: 36%; animation-delay: 1.1s; font-size: 12px; }

        @keyframes shimmer-huaxi {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .shimmer-huaxi {
            background: linear-gradient(90deg, #ffd166, #fff3d6, #ff8fd8, #ffe1f5, #ffd166);
            background-size: 200% 100%;
            animation: shimmer-huaxi 4s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes pulse-huaxi {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 90, 95, 0.5); }
            50% { box-shadow: 0 0 0 14px rgba(255, 90, 95, 0); }
        }
        .btn-pulse-huaxi { animation: pulse-huaxi 2s infinite; }

        /* 标签 */
        .tag-huaxi {
            background: linear-gradient(135deg, #fff0f6, #ffdbe8);
            color: #c2255c;
            border: 1px solid rgba(255, 77, 136, 0.5);
        }
        .tag-huaxi-night {
            background: linear-gradient(135deg, #efeaff, #e0d4ff);
            color: #5f3dc4;
            border: 1px solid rgba(124, 77, 255, 0.5);
        }


        /* AI 合成进度 */
        @keyframes ai-ring {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .ai-ring {
            border: 4px solid rgba(124, 77, 255, 0.2);
            border-top-color: #7c4dff;
            border-right-color: #ff4d88;
            animation: ai-ring 1.1s linear infinite;
        }
        @keyframes ai-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .ai-bounce { animation: ai-bounce 1.6s ease-in-out infinite; }

        /* 聊天 */
        .chat-bubble-me {
            background: linear-gradient(135deg, #ff4d88, #ff7d9e);
            color: #fff;
            border-radius: 16px 16px 4px 16px;
        }
        .chat-bubble-other {
            background: #ffffff;
            border-radius: 16px 16px 16px 4px;
        }

        /* 底部弹窗滑入 */
        @keyframes slideUpHuaxi {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUpHuaxi 0.35s cubic-bezier(0.22, 0.9, 0.35, 1); }

        /* TAB 内容切换淡入上移（与滑块滑动同步，切换更丝滑） */
        @keyframes tabFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-content-enter { animation: tabFadeIn 0.35s cubic-bezier(0.22, 0.9, 0.35, 1); }

        /* TAB 栏吸顶状态（到达顶部后悬浮并加背景） */
        .tab-stuck {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        /* TAB 紫色滑块（仅背景滑动：白底垫最底层 → 紫滑块中间层 → 文字最上层） */
        .tab-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #7c4dff, #ff4d88);
            box-shadow: 0 2px 10px rgba(124, 77, 255, 0.4);
            z-index: 10;
            pointer-events: none;
            transition: left 0.35s cubic-bezier(0.22, 0.9, 0.35, 1), width 0.35s cubic-bezier(0.22, 0.9, 0.35, 1);
            will-change: left, width;
        }

        /* 欢迎区丝滑收起（grid 行高过渡 + 淡出） */
        .welcome-collapsible {
            display: grid;
            grid-template-rows: 1fr;
            opacity: 1;
            transition: grid-template-rows 0.45s cubic-bezier(0.22, 0.9, 0.35, 1), opacity 0.4s ease;
        }
        .welcome-collapsible-inner { overflow: hidden; min-height: 0; }
        .welcome-collapsed .welcome-collapsible { grid-template-rows: 0fr; opacity: 0; }

        /* 弹窗弹出 */
        @keyframes huaxi-pop {
            0% { transform: scale(0.88) translateY(18px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-huaxi-pop { animation: huaxi-pop 0.38s cubic-bezier(0.22, 0.9, 0.35, 1); }

        /* 大转盘旋转（快起步、缓收尾） */
        .wheel-spinning {
            transition: transform 4.2s cubic-bezier(0.12, 0.8, 0.16, 1);
            will-change: transform;
        }

        /* 中奖彩带 */
        @keyframes confetti-fall {
            0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(320px) rotate(540deg); opacity: 0; }
        }
        .confetti {
            position: absolute;
            top: 0;
            font-size: 18px;
            animation: confetti-fall 1.9s ease-in forwards;
            pointer-events: none;
        }

        /* 已核销印章 */
        .redeem-stamp {
            position: absolute;
            right: -14px;
            bottom: -10px;
            width: 78px;
            height: 78px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(0, 169, 157, 0.85);
            color: rgba(0, 169, 157, 0.9);
            border-radius: 50%;
            transform: rotate(-14deg);
            background: rgba(0, 169, 157, 0.08);
            text-align: center;
            line-height: 1.2;
            font-weight: 900;
            box-shadow: 0 4px 14px rgba(0, 169, 157, 0.25);
        }
        .redeem-stamp::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1.5px dashed rgba(0, 169, 157, 0.45);
            border-radius: 50%;
        }
    </style>
</head>

                result.prize = Object.assign({}, defaults.prize, (saved && saved.prize) || {});
                if (!Array.isArray(result.posts)) result.posts = [];
                if (!Array.isArray(result.checkins)) result.checkins = [];
                if (!result.chats || Array.isArray(result.chats)) result.chats = {};
                // 匹配搭子资料实时从搭子池刷新头像
                result.posts = result.posts.map(function (p) {
                    if (!p || !Array.isArray(p.matches)) return p;
                    return Object.assign({}, p, {
                        matches: p.matches.map(function (m) {
                            if (!m || !m.id) return m;
                            var fresh = BUDDY_POOL.find(function (b) { return b.id === m.id; });
                            return fresh ? Object.assign({}, m, { avatarUrl: fresh.avatarUrl }) : m;
                        })
                    });
                });
                return result;
            } catch (e) {
                return defaults;

        // 用户输入内容 HTML 转义，防止注入
        function escapeHtml(s) {

                .replace(/&/g, '&amp;')

            // ---------- TAB 切换 ----------
            renderTabs() {

                // 紫色滑块初始位置与激活 TAB 对齐（容器 p-1 + 1 个 gap-1 共 12px 偏移）
                var sliderStyle = 'left: calc(4px + ' + activeIdx + ' * ((100% - 12px) / 2 + 4px)); width: calc((100% - 12px) / 2);';

                return `
                <div id="huaxiTabBar" class="sticky top-0 z-40 transition-all duration-200">
                    <div class="px-3 pt-1 pb-1">
                        <div class="max-w-md mx-auto rounded-full p-1 flex gap-1 relative">

                </div>

            },

            // 紫色滑块从上一个 TAB 横向滑动到当前 TAB
            animateTabSlider(prevId) {
                var slider = document.getElementById('tabSlider');
                var bar = document.getElementById('huaxiTabBar');
                if (!slider || !bar) return;

                var buttons = bar.querySelectorAll('button');
                var tabIds = ['checkin', 'buddy'];
                var fromIdx = tabIds.indexOf(prevId);
                var toIdx = tabIds.indexOf(this.activeTab);
                if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) return;

                var fromBtn = buttons[fromIdx];
                var toBtn = buttons[toIdx];
                if (!fromBtn || !toBtn) return;

                // 先瞬移到旧位置，再平滑滑到新位置（同一任务内执行，避免闪烁）
                slider.style.transition = 'none';
                slider.style.left = fromBtn.offsetLeft + 'px';
                slider.style.width = fromBtn.offsetWidth + 'px';
                slider.offsetWidth; // 强制回流，让起始位置先生效
                slider.style.transition = '';
                slider.style.left = toBtn.offsetLeft + 'px';
                slider.style.width = toBtn.offsetWidth + 'px';
            },

            switchTab(id) {
                // 取消动画期间挂起的切换，避免旧定时器覆盖本次选择
                if (this.pendingEnterTimer) {
                    clearTimeout(this.pendingEnterTimer);
                    this.pendingEnterTimer = null;
                }
                var prevId = this.activeTab;
                this.activeTab = id;
                this.tabAnimating = prevId !== id; // 仅真正切换 TAB 时播放内容淡入动画
                // 离开找搭子时退出草稿态，回来时展示已发布需求列表
                if (id !== 'buddy') this.isDraftingPost = false;
                this.render();
                if (prevId !== id) this.animateTabSlider(prevId);
            },

            // TAB 栏滚动吸顶（到达页面顶部后悬浮并加背景）
            bindTabSticky() {
                if (this.tabStickyBound) return;
                this.tabStickyBound = true;
                window.addEventListener('scroll', function () {
                    var bar = document.getElementById('huaxiTabBar');
                    if (!bar) return;

            tasksDone() {

                var buddyDone = state.posts.length > 0 ? 1 : 0;
                return checkinDone + buddyDone;

            // 剩余抽奖次数（每人仅有一次抽奖机会，完成任一任务即解锁）
            chancesLeft() {
                if (state.prize.won || state.spinsUsed >= 1) return 0;
                return this.tasksDone() > 0 ? 1 : 0;
            },

            // 玩法卡片 → 丝滑收起欢迎区，再切换到对应 TAB
            enterPlay(id) {
                if (this.welcomeCollapsed) { this.switchTab(id); return; }
                var el = document.getElementById('welcomeSection');
                if (!el) { this.switchTab(id); return; }

                this.welcomeCollapsed = true;
                el.classList.add('welcome-collapsed');

                // 等收起动画结束再重建页面（按钮行随之上移，保留在 TAB 栏上方）
                var view = this;
                this.pendingEnterTimer = setTimeout(function () {
                    view.pendingEnterTimer = null;
                    view.switchTab(id);
                }, 460);
            },

            renderWelcome() {

            renderActionRow() {

            renderWheelSvg() {
                var segs = FORTUNES.map(function (f, i) {
                    var a1 = (i * 60 - 90) * Math.PI / 180;
                    var a2 = ((i + 1) * 60 - 90) * Math.PI / 180;
                    var x1 = 150 + 150 * Math.cos(a1), y1 = 150 + 150 * Math.sin(a1);
                    var x2 = 150 + 150 * Math.cos(a2), y2 = 150 + 150 * Math.sin(a2);
                    // 文字初始位于顶部（-90°），顺时针旋转 mid 后落在该段中心（i*60-60°）：mid = i*60+30
                    var mid = i * 60 + 30;
                    return `
                    <path d="M150 150 L${x1.toFixed(2)} ${y1.toFixed(2)} A150 150 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z"

                return `

            // 开始旋转：先定奖品（加权随机），转盘停到对应好运
            startSpin() {
                if (this.spinning) return;

                }

                // 加权随机选中一种好运
                var r = Math.random();
                var acc = 0;
                var picked = FORTUNES[0];
                for (var i = 0; i < FORTUNES.length; i++) {
                    acc += FORTUNES[i].weight;
                    if (r <= acc) { picked = FORTUNES[i]; break; }
                }

                var el = document.getElementById('wheelSpin');
                if (!el) return;

                // 立即保存结果（弹窗中途关闭也能保证状态一致）
                saveState({
                    spinsUsed: state.spinsUsed + 1,
                    prize: { won: true, prizeId: picked.id, wonAt: this.nowTime(), redeemed: false }
                });

                this.spinning = true;

                // 目标：让 picked 段的中心（i*60-60）转到顶部指针（-90°）
                var idx = FORTUNES.indexOf(picked);
                var targetAngle = (-30 - idx * 60) % 360;
                if (targetAngle < 0) targetAngle += 360;
                var from = this.wheelRotation % 360;
                if (from < 0) from += 360;
                var delta = (targetAngle - from + 360) % 360;
                if (delta === 0) delta = 360;
                var target = this.wheelRotation + 5 * 360 + delta;

                el.style.transition = 'none';
                el.style.transform = 'rotate(' + this.wheelRotation + 'deg)';
                el.offsetWidth; // 强制回流，让起始位置先生效
                // 内联 transition 会覆盖 class 声明，直接写内联过渡
                el.style.transition = 'transform 4.2s cubic-bezier(0.12, 0.8, 0.16, 1)';
                el.style.transform = 'rotate(' + target + 'deg)';

                var view = this;
                var finalize = function () {
                    if (!view.spinning) return;
                    view.spinning = false;
                    clearTimeout(view.spinSafetyTimer);
                    view.wheelRotation = target;
                    view.lotteryStep = 'result';
                    view.renderLotteryModalContent();
                    view.render(); // 同步更新顶部抽奖按钮为中奖态
                    view.spawnConfetti();
                };
                el.addEventListener('transitionend', finalize, { once: true });
                // 兜底：transitionend 丢失时也保证揭晓
                this.spinSafetyTimer = setTimeout(finalize, 4600);
            },

            // 伪二维码（演示用）：三个定位角 + 固定种子点阵
            renderQrCodeSvg() {
                var size = 21;
                var seed = 20261010;
                function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

                var rects = '';
                for (var r = 0; r < size; r++) {
                    for (var c = 0; c < size; c++) {
                        var inFinder = (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
                        if (inFinder) continue;
                        if (rnd() > 0.55) rects += '<rect x="' + c + '" y="' + r + '" width="1" height="1" fill="#241a5c"/>';
                    }
                }
                var finder = function (x, y) {
                    return '<rect x="' + x + '" y="' + y + '" width="7" height="7" fill="#241a5c"/>'
                        + '<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" fill="#ffffff"/>'
                        + '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" fill="#241a5c"/>';
                };
                return '<svg viewBox="0 0 21 21" class="w-full h-full">'
                    + finder(0, 0) + finder(14, 0) + finder(0, 14) + rects + '</svg>';
            },

            // 图片压缩：等比缩放并转 JPEG，控制本地存储体积
            compressImage(file, maxWidth, callback) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    var img = new Image();
                    img.onload = function () {
                        var scale = Math.min(1, maxWidth / img.width);
                        var canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        callback(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.onerror = function () { window.Common.showToast('图片读取失败，请换一张试试'); };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            },

                input.value = ''; // 先清空，拒绝后再次选择同一文件也能触发 change

                this.compressImage(file, 1080, function (dataUrl) {

            // ---------- 功能二：发布找搭子信息 ----------
            renderBuddyTab() {

            // 未发布需求时的探索视图：随机展示 4 位不同需求的华熙搭子
            renderBuddyExplore() {
                var catIds = shuffle(NEED_CATEGORIES.map(function (c) { return c.id; }));
                var picks = [];
                for (var i = 0; i < catIds.length && picks.length < 4; i++) {
                    var pool = shuffle(BUDDY_POOL.filter(function (b) { return b.category === catIds[i]; }));

                return `
                <div class="px-4 pt-1.5 pb-4">

                        <div class="flex items-center gap-2">
                            <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(255,77,136,0.14);">
                                <i data-lucide="heart-handshake" class="w-4 h-4" style="color:#ff4d88;"></i>
                            </div>
                            <div class="min-w-0 flex-1">

                                <p class="text-[11px] text-gray-400 truncate">以下为部分找搭子信息，发布你的需求匹配更多</p>
                            </div>
                            <button onclick="HuaxiView.openBuddyForm()"
                                    class="flex-shrink-0 flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border border-white active:scale-95 transition-transform"
                                    style="background: linear-gradient(135deg, #ff4d88, #ff8a3d); color:#fff; box-shadow: 0 2px 8px rgba(255,77,136,0.4);">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                发需求
                            </button>
                        </div>
                    </div>

                    <div class="mt-3 space-y-3">
                        ${picks.map((b) => this.renderBuddyExploreCard(b)).join('')}
                    </div>

                    <button onclick="HuaxiView.goPublishRequest()"
                            class="w-full mt-3 py-3 rounded-xl text-sm font-bold border border-huaxi-pink active:scale-95 transition-transform"
                            style="color:#c2255c; background: rgba(255,77,136,0.08);">
                        更多
                    </button>
                </div>
                `;
            },

            renderBuddyExploreCard(b) {
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                    <div class="flex items-center gap-3">
                        <img src="${escapeHtml(b.avatarUrl)}" class="w-14 h-14 flex-shrink-0 rounded-full border-2 border-white shadow-md object-cover"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
                        <div class="w-14 h-14 flex-shrink-0 rounded-full border-2 border-white shadow-md hidden items-center justify-center text-lg font-black text-white"
                             style="background: linear-gradient(135deg, #ff4d88, #7c4dff);">${escapeHtml(b.name.charAt(0))}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-black text-gray-900 whitespace-nowrap">${escapeHtml(b.name)}</span>
                                <i data-lucide="badge-check" class="w-3.5 h-3.5 text-huaxi-purple"></i>

                            </div>
                            <div class="flex flex-wrap gap-1.5 mt-1.5">

                    <button onclick="HuaxiView.contactFromExplore()"

            // 抢先看联系TA：需先发布需求

                            class="flex flex-col items-center gap-1 p-2.5 rounded-xl border transition-all duration-150 ${active ? 'border-huaxi-pink bg-pink-50 shadow-sm' : 'border-gray-200 bg-white'}">
                        <i data-lucide="${cat.icon}" class="w-5 h-5 ${active ? 'text-huaxi-pink' : 'text-gray-400'}"></i>

                }).join('');

                return `
                <div class="px-4 pt-1.5 pb-4">

                    <button onclick="HuaxiView.backToPosts()" class="flex items-center gap-1 text-xs text-gray-500 mb-2 active:opacity-70">

                                      placeholder="${escapeHtml(this.buddyMessagePlaceholder())}"></textarea>
                            <div class="text-right text-[10px] text-gray-400 mt-1"><span id="buddyMessageCount">0</span>/100</div>
                        </div>

                        <button onclick="HuaxiView.submitBuddyForm()"
                                class="btn-pulse-huaxi w-full py-3.5 rounded-xl text-white font-black text-base active:scale-95 transition-transform"
                                style="background: linear-gradient(135deg, #ff5a5f, #ff4d88); box-shadow: 0 4px 15px rgba(255,90,95,0.45);">
                            <span class="flex items-center justify-center gap-2">
                                <i data-lucide="sparkles" class="w-4 h-4"></i>
                                立即发布 · 匹配搭子
                            </span>

                        <p class="text-center text-[10px] text-gray-400 mt-2">发布后即可完成抽奖任务，系统将为你匹配多位同场搭子</p>
                    </div>
                </div>
                `;
            },

            // 已发布需求视图（我的需求 + 需求切换 + 匹配结果列表）
            renderPostsView() {
                var post = this.activePost();
                var matches = post.matches || [];

                var switcherHtml = state.posts.length > 1 ? `
                    <div class="flex gap-2 overflow-x-auto no-scrollbar mb-3">
                        ${state.posts.map((p, i) => {
                            var active = p.id === post.id;
                            return `
                            <button data-id="${escapeHtml(p.id)}" onclick="HuaxiView.switchPost(this.dataset.id)"
                                    class="flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border transition-all duration-150 whitespace-nowrap ${active ? 'border-huaxi-pink bg-pink-50 text-pink-700' : 'border-gray-200 bg-white text-gray-500'}">
                                需求${i + 1} · ${categoryLabel(p.category)}
                            </button>`;
                        }).join('')}
                    </div>` : '';

                var matchCards = matches.map((m) => this.renderMatchCard(m)).join('');

                return `
                <div class="px-4 pt-1.5 pb-4 space-y-4">
                    <!-- 我的需求卡 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-black text-gray-900 text-sm whitespace-nowrap shrink-0">我的需求</h3>
                            <button onclick="HuaxiView.postAnother()"
                                    class="text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1 active:scale-95 transition-transform shrink-0"
                                    style="background: linear-gradient(135deg, #ff4d88, #ff8a3d); color:#fff; box-shadow: 0 2px 8px rgba(255,77,136,0.35);">
                                <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                再发一条
                            </button>
                        </div>

                        ${switcherHtml}

                        ${this.editingPostId === post.id ? `
                        <!-- 编辑态：留言可修改 -->
                        <div>
                            <label class="text-xs font-bold text-gray-500 mb-2 block">留言 <span class="text-gray-400 font-normal">（100 字以内）</span></label>
                            <textarea id="editMessage" maxlength="100" rows="3"
                                      class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white outline-none focus:border-huaxi-pink resize-none">${escapeHtml(post.message)}</textarea>
                            <div class="flex items-center justify-between mt-1.5">
                                <span class="text-[10px] text-gray-400"><span id="editMessageCount">0</span>/100</span>
                                <div class="flex gap-2">
                                    <button onclick="HuaxiView.cancelEditPost()"
                                            class="text-xs font-bold px-3 py-1.5 rounded-full border border-gray-200 text-gray-500 active:scale-95 transition-transform">
                                        取消
                                    </button>
                                    <button onclick="HuaxiView.saveEditPost()"
                                            class="text-xs font-bold px-3 py-1.5 rounded-full active:scale-95 transition-transform"
                                            style="background: linear-gradient(135deg, #ff4d88, #ff8a3d); color:#fff;">
                                        保存
                                    </button>
                                </div>
                            </div>
                        </div>` : `
                        <!-- 静态预览：需求类别 / 留言 -->
                        <div class="space-y-2 text-sm">
                            <div class="flex items-center gap-2">
                                <span class="text-[10px] font-bold text-white px-2 py-0.5 rounded-md whitespace-nowrap shrink-0" style="background:#ff4d88;">需求类别</span>
                                <span class="text-gray-700">${categoryLabel(post.category)}</span>
                                ${post.time ? '<span class="ml-auto text-[10px] text-gray-300 whitespace-nowrap">' + escapeHtml(post.time) + ' 发布</span>' : ''}
                            </div>
                            <div class="flex items-start gap-2">
                                <span class="text-[10px] font-bold text-white px-2 py-0.5 rounded-md mt-0.5 whitespace-nowrap shrink-0" style="background:#7c4dff;">留&#12288;&#12288;言</span>
                                <div class="flex-1 min-w-0">
                                    <span class="text-gray-600 leading-relaxed">${escapeHtml(post.message)}</span>
                                    <button onclick="HuaxiView.editPost('${post.id}')"
                                            class="mt-1 flex items-center gap-1 text-[10px] font-medium active:opacity-70"
                                            style="color:#7c4dff;">
                                        <i data-lucide="pencil" class="w-3 h-3"></i>
                                        编辑留言
                                    </button>
                                </div>
                            </div>
                        </div>`}
                    </div>

                    <!-- 匹配结果列表 -->
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(124,77,255,0.14);">
                                <i data-lucide="users" class="w-4 h-4" style="color:#7c4dff;"></i>
                            </div>
                            <h3 class="font-black text-gray-900 text-sm">为你找到 ${matches.length} 位搭子</h3>
                            <span class="text-[10px] text-gray-400">选一位开聊吧</span>
                        </div>
                        ${matchCards || `
                        <div class="text-center text-gray-400 text-xs py-6">
                            <div class="mb-2">暂时没有匹配结果</div>
                            <button onclick="HuaxiView.rematchPost()"
                                    class="text-xs font-bold px-4 py-2 rounded-full border border-huaxi-pink active:scale-95 transition-transform"
                                    style="color:#c2255c; background: rgba(255,77,136,0.08);">
                                重新匹配
                            </button>
                        </div>`}
                    </div>
                </div>
                `;
            },

            // 单个搭子匹配结果卡片（标注搭子自身的需求类别）
            renderMatchCard(m) {
                return `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3">
                    <div class="flex items-center gap-3">
                        <img src="${escapeHtml(m.avatarUrl)}" class="w-14 h-14 flex-shrink-0 rounded-full border-2 border-white shadow-md object-cover"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
                        <div class="w-14 h-14 flex-shrink-0 rounded-full border-2 border-white shadow-md hidden items-center justify-center text-lg font-black text-white"
                             style="background: linear-gradient(135deg, #ff4d88, #7c4dff);">${escapeHtml(m.name.charAt(0))}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="font-black text-gray-900 whitespace-nowrap">${escapeHtml(m.name)}</span>
                                <i data-lucide="badge-check" class="w-3.5 h-3.5 text-huaxi-purple"></i>
                                <span class="text-[10px] text-gray-500 whitespace-nowrap">${escapeHtml(m.gender)} · ${escapeHtml(m.age)}岁</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 mt-1.5">
                                <span class="tag-huaxi-night text-[10px] px-2 py-0.5 rounded-full font-medium">${categoryLabel(m.category)}</span>
                                ${(m.tags || []).map((t) => '<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-100 text-gray-500">' + escapeHtml(t) + '</span>').join('')}
                            </div>
                        </div>
                    </div>
                    <p class="text-sm text-gray-500 leading-relaxed mt-3 bg-gray-50 rounded-xl p-3">"${escapeHtml(m.intro)}"</p>
                    <button data-id="${escapeHtml(m.id)}" onclick="HuaxiView.openChat(this.dataset.id)"
                            class="w-full mt-3 py-2.5 rounded-xl text-white font-black text-sm active:scale-95 transition-transform flex items-center justify-center gap-2"
                            style="background: linear-gradient(135deg, #7c4dff, #ff4d88); box-shadow: 0 4px 15px rgba(124,77,255,0.4);">
                        <i data-lucide="message-circle" class="w-4 h-4"></i>
                        和 TA 聊天
                    </button>
                </div>
                `;
            },

            // 再发一条：进入填写表单（保留已有需求与草稿内容）
            postAnother() {
                this.isDraftingPost = true;
                this.render();
            },

            // 表单返回：回到已发布需求视图
            backToPosts() {
                this.isDraftingPost = false;
                this.render();
            },

            // 切换查看某条需求及其匹配结果（仅会话内记录，不写入存储）
            switchPost(id) {
                this.activePostId = id;
                this.render();
            },

            // 编辑已发布需求留言（会话内状态，保存后写入存储）
            editPost(id) {
                this.editingPostId = id;
                this.render();
            },

            cancelEditPost() {
                this.editingPostId = null;
                this.render();
            },

            saveEditPost() {
                var el = document.getElementById('editMessage');
                if (!el) return;
                var msg = el.value.trim();
                if (!msg) { window.Common.showToast('留言不能为空'); return; }

                var editingId = this.editingPostId;
                var posts = state.posts.map(function (p) {
                    return p.id === editingId ? Object.assign({}, p, { message: msg }) : p;
                });
                saveState({ posts: posts });
                this.editingPostId = null;
                this.render();
                window.Common.showToast('已保存');
            },

            // 当前查看的需求（兜底取第一条）
            activePost() {
                return state.posts.find((p) => p.id === this.activePostId) || state.posts[0];
            },

            // 重新匹配当前需求（无匹配结果时兜底）
            rematchPost() {
                var post = this.activePost();
                var matches = this.matchPartners();
                var posts = state.posts.map(function (p) {
                    return p.id === post.id ? Object.assign({}, p, { matches: matches }) : p;
                });
                saveState({ posts: posts });
                this.render();
                window.Common.showToast('已为你找到 ' + matches.length + ' 位搭子');
            },

            // 表单草稿（默认留言为空，placeholder 按需求类别切换提示）
            initBuddyDraft() {
                this.buddyDraft = { category: 'shopping', message: '' };
            },

            pickCategory(id) {
                this.buddyDraft.category = id;
                this.render();
            },

            // 当前需求类别对应的留言示例提示
            buddyMessagePlaceholder() {
                var cat = NEED_CATEGORIES.find(function (c) { return c.id === this.buddyDraft.category; }, this);
                return cat && cat.placeholder ? cat.placeholder : '说说你想找什么样的搭子~';
            },

            submitBuddyForm() {
                if (this.matchingInProgress) return;

                var message = document.getElementById('buddyMessage').value.trim();

                if (!this.buddyDraft.category) { window.Common.showToast('请选择需求类别'); return; }
                if (!message) { window.Common.showToast('写句留言介绍一下自己吧'); return; }

                // 匹配中动画
                this.matchingInProgress = true;
                this.showMatchingOverlay();

                var view = this;
                setTimeout(function () {
                    var matches = view.matchPartners();
                    view.hideMatchingOverlay();
                    view.matchingInProgress = false;

                    var post = {
                        id: 'p' + Date.now(),
                        category: view.buddyDraft.category,
                        message: message,
                        time: view.nowTime(),
                        matches: matches
                    };
                    saveState({ posts: state.posts.concat([post]) });
                    view.activePostId = post.id;
                    view.isDraftingPost = false;
                    view.initBuddyDraft();
                    view.render();
                    window.Common.showToast('已为你找到 ' + matches.length + ' 位搭子，获得抽奖机会！');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }, 1600);
            },

            // 匹配逻辑：优先同需求类别，不足时从其余搭子补齐
            matchPartners() {
                var cat = this.buddyDraft.category;
                var sameCat = shuffle(BUDDY_POOL.filter((b) => b.category === cat));
                var others = shuffle(BUDDY_POOL.filter((b) => b.category !== cat));
                return sameCat.concat(others).slice(0, MATCH_COUNT).map((b) => Object.assign({}, b, {
                    tags: shuffle(b.tags).slice(0, 2)
                }));
            },

            showMatchingOverlay() {
                var overlay = document.createElement('div');
                overlay.id = 'matchingOverlay';
                overlay.className = 'fixed inset-0 z-[300] flex flex-col items-center justify-center fade-in';
                overlay.style.background = 'rgba(20, 14, 46, 0.85)';
                overlay.innerHTML = `
                    <div class="ai-ring w-14 h-14 rounded-full mb-5"></div>
                    <div class="text-white font-bold text-lg ai-bounce">正在为你匹配搭子…</div>
                    <div class="text-white/50 text-xs mt-2">根据需求类别智能匹配 · 稍后揭晓多位搭子</div>
                `;
                document.body.appendChild(overlay);
                window.Common.initIcons();
            },

            hideMatchingOverlay() {
                var overlay = document.getElementById('matchingOverlay');
                if (overlay) overlay.remove();
            },

            // ---------- 私聊 ----------
            // 聊天页头部（标注搭子自身的需求类别）
            chatHeaderHtml(p) {
                return `
                    <div class="flex items-center gap-2 px-3 py-3 bg-white/85 backdrop-blur-md border-b border-gray-100">
                        <button onclick="HuaxiView.closeChat()" class="p-1.5 -ml-1 rounded-full active:bg-gray-100">
                            <i data-lucide="chevron-left" class="w-6 h-6 text-gray-600"></i>
                        </button>
                        <img src="${escapeHtml(p.avatarUrl)}" class="w-9 h-9 rounded-full object-cover border border-gray-200"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
                        <div class="w-9 h-9 rounded-full border border-gray-200 hidden items-center justify-center text-sm font-black text-white flex-shrink-0"
                             style="background: linear-gradient(135deg, #ff4d88, #7c4dff);">${escapeHtml(p.name.charAt(0))}</div>
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-sm text-gray-900 flex items-center gap-1 whitespace-nowrap">
                                ${escapeHtml(p.name)}
                                <i data-lucide="badge-check" class="w-3.5 h-3.5 text-huaxi-purple flex-shrink-0"></i>
                            </div>
                            <div class="text-[10px] text-gray-400 truncate">${categoryLabel(p.category)}搭子 · ${escapeHtml(p.gender)} · ${escapeHtml(p.age)}岁</div>
                        </div>
                    </div>`;
            },

            // 向指定聊天线程追加一条消息（key = 需求id:搭子id）
            appendChat(chatKey, msg) {
                var list = (state.chats[chatKey] || []).concat([msg]);
                saveState({ chats: Object.assign({}, state.chats, { [chatKey]: list }) });
            },

            openChat(partnerId) {
                if (document.getElementById('huaxiChat')) return;

                var post = this.activePost();
                var p = (post.matches || []).find((m) => m.id === partnerId);
                if (!p) return;
                this.chatPartnerKey = post.id + ':' + p.id;

                // 首次打开时，对方先来一句打招呼
                if (!state.chats[this.chatPartnerKey] || !state.chats[this.chatPartnerKey].length) {
                    this.appendChat(this.chatPartnerKey, { isMe: false, text: '哈喽！我是你的搭子「' + p.name + '」，华熙LIVE见！', time: this.nowTime() });
                }

                var chat = document.createElement('div');
                chat.id = 'huaxiChat';
                chat.className = 'fixed inset-0 z-[400] flex flex-col fade-in';
                chat.style.background = 'linear-gradient(180deg, #efe9ff 0%, #f7f1ff 40%, #fff3e8 100%)';

                chat.innerHTML = this.chatHeaderHtml(p) + `
                    <div id="chatMessages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>
                    <div class="px-3 pb-3 pt-2 bg-white/85 backdrop-blur-md border-t border-gray-100">
                        <div class="flex items-center gap-2">
                            <input id="chatInput" type="text" maxlength="100" placeholder="和 TA 聊聊华熙…"
                                   class="flex-1 border border-gray-200 rounded-full px-4 py-2.5 text-sm bg-white outline-none focus:border-huaxi-purple"/>
                            <button onclick="HuaxiView.sendMessage()"
                                    class="w-10 h-10 rounded-full text-white flex items-center justify-center active:scale-90 transition-transform"
                                    style="background: linear-gradient(135deg, #7c4dff, #5a32c9);">
                                <i data-lucide="send" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                `;
                document.body.appendChild(chat);
                window.Common.initIcons();

                this.renderChatMessages();

                var input = document.getElementById('chatInput');
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.sendMessage();
                });
                setTimeout(() => input.focus(), 200);
            },

            closeChat() {
                // 聊天层挂在 body 上，关闭时主界面无需重建
                var chat = document.getElementById('huaxiChat');
                if (chat) chat.remove();
            },

            renderChatMessages() {
                var box = document.getElementById('chatMessages');
                if (!box) return;

                var list = state.chats[this.chatPartnerKey] || [];
                var html = list.map((m) => {
                    return m.isMe
                        ? '<div class="flex justify-end"><div class="chat-bubble-me max-w-[75%] px-3.5 py-2.5 text-sm leading-relaxed shadow-sm">' + escapeHtml(m.text) + '</div></div>'
                        : '<div class="flex justify-start"><div class="chat-bubble-other max-w-[75%] px-3.5 py-2.5 text-sm leading-relaxed text-gray-700 shadow-sm border border-gray-100">' + escapeHtml(m.text) + '</div></div>';
                }).join('');
                box.innerHTML = html || '<div class="text-center text-gray-300 text-xs mt-10">和你的搭子打个招呼吧~</div>';
                box.scrollTop = box.scrollHeight;
            },

            sendMessage() {
                var input = document.getElementById('chatInput');
                var text = (input.value || '').trim();
                if (!text) return;

                var chatKey = this.chatPartnerKey;
                this.appendChat(chatKey, { isMe: true, text: text, time: this.nowTime() });
                input.value = '';
                this.renderChatMessages();

                // 对方自动回复
                var view = this;
                setTimeout(function () {
                    var replies = [
                        '哈哈哈好呀！',
                        '那必须的，华熙见！',
                        '我也这么想！',
                        '走起，就今晚？',
                        '我在华熙附近，随时约！',
                        '没问题，到时候喊你~',
                        '这就安排上！',
                        '一起冲！'
                    ];
                    var reply = replies[Math.floor(Math.random() * replies.length)];
                    view.appendChat(chatKey, { isMe: false, text: reply, time: view.nowTime() });
                    view.renderChatMessages();
                }, 900);
            },

            nowTime() {
                var d = new Date();
                var h = d.getHours();
                var m = d.getMinutes();
                return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
            },

            // ---------- 功能三：打卡墙 ----------
            renderCheckinTab() {
                var me = window.GlobalData && window.GlobalData.user ? window.GlobalData.user : { name: '我' };
                var posts = [];

                var collectMine = function () {
                    state.checkins.forEach(function (p) {
                        posts.push(this.renderCheckinCard(Object.assign({}, p, {
                            name: me.name,
                            avatar: me.avatarUrl,
                            isMine: true
                        })));
                    }, this);
                };

                // 最新 = 我的在前 + 预置打卡；我的 = 仅自己发布
                collectMine.call(this);
                if (this.feedFilter !== 'mine') {
                    CHECKIN_POSTS.forEach(function (p) {
                        posts.push(this.renderCheckinCard(Object.assign({}, p, { isMine: false })));
                    }, this);
                }

                // 左右交替分列，让图片错落排布在两侧
                var leftColumn = [];
                var rightColumn = [];
                posts.forEach(function (html, i) {
                    (i % 2 === 0 ? leftColumn : rightColumn).push(html);
                });

                // 最新 / 我的 筛选
                var filterChips = ['latest', 'mine'].map(function (id) {
                    var active = this.feedFilter === id;
                    var label = id === 'latest' ? '最新' : '我的';
                    return `
                    <button onclick="HuaxiView.setFeedFilter('${id}')"
                            class="px-5 py-1.5 rounded-full text-xs font-bold transition-all duration-150 active:scale-95 ${active ? '' : 'bg-white border border-gray-200 text-gray-500'}"
                            style="${active ? 'background: linear-gradient(135deg, #7c4dff, #ff4d88); color:#fff; box-shadow: 0 2px 8px rgba(124,77,255,0.35);' : ''}">
                        ${label}
                    </button>`;
                }, this).join('');

                var waterfallHtml = posts.length === 0
                    ? '<div class="mt-6 text-center text-gray-400 text-xs py-8">还没有发布过打卡，点悬浮按钮发一条吧</div>'
                    : `
                    <div class="flex gap-3 mt-3 items-start">
                        <div class="flex-1 min-w-0">${leftColumn.join('')}</div>
                        <div class="flex-1 min-w-0">${rightColumn.join('')}</div>
                    </div>`;

                return `
                <div class="px-4 pt-1.5 pb-28">
                    <!-- 最新 / 我的 筛选 -->
                    <div class="flex gap-2">${filterChips}</div>

                    <!-- 打卡瀑布流（双列左右交替错落，图片原比例） -->
                    ${waterfallHtml}

                    <div class="text-center text-gray-400 text-xs pt-2">—— 奇遇华熙见 🎡 ——</div>
                </div>
                `;
            },

            // 单条打卡瀑布流卡片（同项目动态页样式）
            renderCheckinCard(post) {
                var liked = !!this.feedLiked[post.id];
                var likeCount = post.likes + (liked ? 1 : 0);

                return `
                <div class="mb-3 bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="relative cursor-pointer active:opacity-80" onclick="HuaxiView.goMomentDetail()">
                        <img src="${escapeHtml(post.image)}" class="w-full h-auto object-cover"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
                        <!-- 图片加载失败时的占位 -->
                        <div class="hidden flex-col items-center justify-center w-full" style="aspect-ratio: 4/3; background: linear-gradient(135deg, #7c4dff, #ff4d88);">
                            <span class="text-2xl mb-1">🎡</span>
                            <span class="text-white text-xs font-bold">奇遇华熙</span>
                        </div>
                        ${post.isMine ? '<span class="absolute top-2 left-2 text-[9px] font-bold px-1.5 py-0.5 rounded-full text-white bg-black/40">我的打卡</span>' : ''}
                    </div>
                    <div class="p-2.5">
                        <p class="text-[13px] text-gray-800 leading-snug mb-2 cursor-pointer active:opacity-80" onclick="HuaxiView.goMomentDetail()">${escapeHtml(post.text)} <span class="text-huaxi-purple font-medium">${HUAXI_TOPIC}</span></p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5 overflow-hidden">
                                <img src="${escapeHtml(post.avatar)}" class="w-5 h-5 rounded-full border border-gray-100 flex-shrink-0 object-cover"
                                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"/>
                                <div class="w-5 h-5 rounded-full border border-gray-100 flex-shrink-0 hidden items-center justify-center text-[10px] font-black text-white"
                                     style="background: linear-gradient(135deg, #ff4d88, #7c4dff);">${escapeHtml(post.name.charAt(0))}</div>
                                <span class="text-[10px] text-gray-500 truncate">${escapeHtml(post.name)}</span>
                            </div>
                            <div class="flex items-center gap-2.5 text-gray-400 shrink-0">
                                <button data-id="${escapeHtml(post.id)}" onclick="HuaxiView.toggleLike(this.dataset.id)" class="flex items-center gap-0.5 active:scale-90 transition-transform ${liked ? 'text-red-500' : ''}">
                                    <i data-lucide="heart" class="w-3 h-3 ${liked ? 'fill-red-500' : ''}"></i>
                                    <span class="text-[10px]">${likeCount}</span>
                                </button>
                                <span class="flex items-center gap-0.5">
                                    <i data-lucide="message-circle" class="w-3 h-3"></i>
                                    <span class="text-[10px]">${post.comments}</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            },

            toggleLike(id) {
                this.feedLiked = Object.assign({}, this.feedLiked, { [id]: !this.feedLiked[id] });
                this.render();
            },

            setFeedFilter(id) {
                this.feedFilter = id;
                this.render();
            },

            // 跳转到主站动态详情页（演示统一跳 mo1）
            goMomentDetail() {
                window.location.href = 'moment.html?id=mo1';
            },

            // ---------- 主渲染 ----------
            render() {
                var app = document.getElementById('app');
                var tabContent = this.activeTab === 'buddy' ? this.renderBuddyTab() : this.renderCheckinTab();

                // 欢迎区收起后，仅保留抽奖按钮行（仍位于剪影上方、TAB 栏之上）
                var welcomeHtml = this.welcomeCollapsed ? this.renderActionRow() : this.renderWelcome();

                // TAB 切换时内容带淡入动画，普通重渲染不触发
                var tabAnimClass = this.tabAnimating ? 'tab-content-enter' : '';
                this.tabAnimating = false;

                app.innerHTML =
                    this.renderBanner(welcomeHtml) +
                    '<main>' + this.renderTabs() + '<div class="' + tabAnimClass + '">' + tabContent + '</div></main>' +
                    '<footer class="text-center text-[10px] text-gray-400 pb-8 pt-2">华熙LIVE · 搭子计划专题页（DEMO 演示，数据保存在本地浏览器）</footer>' +
                    this.renderFabs();

                if (window.Common) window.Common.initIcons();

                // 表单预置内容（输入实时同步到草稿，切换分类重渲染时不丢失）
                if (this.activeTab === 'buddy' && (this.isDraftingPost || state.posts.length === 0)) {
                    var msg = document.getElementById('buddyMessage');
                    var view = this;

                    if (msg) {
                        msg.value = this.buddyDraft.message;
                        msg.addEventListener('input', function () { view.buddyDraft.message = msg.value; });
                        var cnt = document.getElementById('buddyMessageCount');
                        if (cnt) cnt.textContent = msg.value.length;
                    }
                }

                // 留言编辑态：字数统计 + 输入同步
                if (this.activeTab === 'buddy' && this.editingPostId) {
                    var editMsg = document.getElementById('editMessage');
                    if (editMsg) {
                        var editCnt = document.getElementById('editMessageCount');
                        if (editCnt) editCnt.textContent = editMsg.value.length;
                        editMsg.addEventListener('input', function () {
                            var cntEl = document.getElementById('editMessageCount');
                            if (cntEl) cntEl.textContent = editMsg.value.length;
                        });
                    }
                }
            }
        };

        window.HuaxiView = HuaxiView;

        document.addEventListener('DOMContentLoaded', function () {
            HuaxiView.initBuddyDraft();
            HuaxiView.render();
            HuaxiView.bindTabSticky();
        });
    </script>
</body>
</html>
