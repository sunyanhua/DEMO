<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>报名搭子列表 - 搭子计划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-white text-gray-900 pb-24">
    <div id="app"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script>
        function render() {
            // 获取 URL 参数
            const urlParams = new URLSearchParams(window.location.search);
            const activityId = urlParams.get('id') || 'a1';
            const activity = window.GlobalData.activities.find(a => a.id === activityId) || window.GlobalData.activities[0];

            // 获取报名该活动的订单（状态为paid）
            const activityOrders = window.GlobalData.orders.filter(order =>
                order.activityId === activityId && order.status === 'paid'
            );

            // 获取对应的用户信息
            let participants = activityOrders.map(order => {
                const user = window.GlobalData.users.find(u => u.id === order.userId);
                return {
                    ...user,
                    orderTime: order.time,
                    participants: order.participants || 1
                };
            }).filter(p => p.id); // 确保用户存在

            // 如果参与者数量少于活动当前报名人数，补充模拟用户
            if (participants.length < activity.currentParticipants) {
                const needed = activity.currentParticipants - participants.length;
                const allUsers = [...window.GlobalData.users, ...window.GlobalData.partners];
                // 去重，避免重复添加已存在的用户
                const existingIds = participants.map(p => p.id);
                const availableUsers = allUsers.filter(user =>
                    user && user.id && !existingIds.includes(user.id)
                );

                // 从可用用户中取需要的数量，如果不够则使用模拟用户
                const extraUsers = [];
                for (let i = 0; i < needed; i++) {
                    let user;
                    if (availableUsers.length > 0) {
                        user = availableUsers[i % availableUsers.length];
                    } else {
                        user = {
                            id: 'temp_' + i,
                            name: '热心搭子',
                            avatarUrl: 'https://picsum.photos/100/100?random=' + (100 + i),
                            intro: '期待参加活动！'
                        };
                    }
                    extraUsers.push({
                        ...user,
                        orderTime: '刚刚',
                        participants: 1
                    });
                }

                participants = [...participants, ...extraUsers];
            }

            document.getElementById('app').innerHTML = `
                <!-- 顶部导航 -->
                <div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm flex items-center justify-between border-b border-gray-100">
                    <button onclick="window.history.back()" class="p-1.5 rounded-full hover:bg-gray-100 transition">
                        <i data-lucide="chevron-left" class="w-6 h-6 text-gray-800"></i>
                    </button>
                    <h1 class="text-lg font-bold text-gray-900">报名搭子列表</h1>
                    <div class="w-10"></div> <!-- 占位保持对称 -->
                </div>

                <!-- 活动信息卡片 -->
                <div class="px-4 pt-4">
                    <div class="bg-gray-50 rounded-xl p-4 mb-4">
                        <div class="flex items-center gap-3 mb-3">
                            <img src="${activity.imageUrl}" class="w-16 h-16 object-cover rounded-lg bg-gray-100" />
                            <div class="flex-1">
                                <h2 class="font-bold text-gray-900 text-sm line-clamp-2">${activity.title}</h2>
                                <div class="flex items-center gap-2 mt-1">
                                    <i data-lucide="users" class="w-4 h-4 text-gray-400"></i>
                                    <span class="text-xs text-gray-500">已报 ${activity.currentParticipants} 人 / 限 ${activity.maxParticipants} 人</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-center text-sm text-gray-600">
                            <span class="font-bold text-brand-orange">${participants.length}</span> 位搭子已报名
                        </div>
                    </div>

                    <!-- 报名搭子列表 -->
                    <div class="space-y-3">
                        <h3 class="font-bold text-gray-900 text-base">报名搭子 (${participants.length})</h3>

                        ${participants.length > 0 ? participants.map(user => `
                            <div onclick="window.location.href='profile.html?id=${user.id}'" class="flex items-center gap-3 bg-white rounded-xl shadow-sm border border-gray-100 p-3 cursor-pointer hover:bg-gray-50 transition-colors">
                                <img src="${user.avatarUrl}" class="w-12 h-12 rounded-full border border-gray-100 object-cover" />
                                <div class="flex-1">
                                    <div class="flex items-center justify-between">
                                        <div>
                                            <h4 class="font-bold text-gray-900 text-sm">${user.name}</h4>
                                            <p class="text-xs text-gray-500 line-clamp-1">${user.intro || '这个搭子很神秘~'}</p>
                                        </div>
                                        <span class="text-xs text-gray-400">${user.orderTime}</span>
                                    </div>
                                    <div class="flex items-center gap-2 mt-2">
                                        <span class="px-2 py-0.5 bg-gray-100 text-gray-600 text-xs rounded-md flex items-center gap-0.5">
                                            <i data-lucide="user" class="w-3 h-3"></i>
                                            报名 ${user.participants} 人
                                        </span>
                                    </div>
                                </div>
                                <i data-lucide="chevron-right" class="w-5 h-5 text-gray-300"></i>
                            </div>
                        `).join('') : `
                            <div class="text-center py-10 bg-gray-50 rounded-xl">
                                <i data-lucide="users" class="w-12 h-12 text-gray-300 mx-auto mb-3"></i>
                                <p class="text-gray-400 text-sm">还没有搭子报名此活动</p>
                                <p class="text-gray-400 text-xs mt-1">快来分享活动邀请更多搭子吧！</p>
                            </div>
                        `}
                    </div>
                </div>
            `;
            window.Common.initIcons();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
