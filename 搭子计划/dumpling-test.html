<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>饺子人格测试 - 搭子计划</title>
    <link rel="stylesheet" href="tailwind.css">
    <script src="vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900">

    <div id="app"></div>

    <script src="data.js?v=2"></script>
    <script src="dumpling-data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script src="dumpling-test.js?v=2"></script>
    <script>
        const OPTION_KEYS = ['A', 'B', 'C', 'D'];
        const ANSWER_DELAY_MS = 250;

        const Test = {
            answers: [],
            currentIndex: 0,
            locked: false,
            started: false,
            resultPersonality: null,
            showPoster: false,

            get questions() {
                const d = (window.GlobalData && window.GlobalData.dumpling) || {};
                return d.questions || [];
            },
            get personalities() {
                const d = (window.GlobalData && window.GlobalData.dumpling) || {};
                return d.personalities || [];
            },

            header() {
                return `
                <div class="fixed top-0 left-0 right-0 h-[50px] bg-white z-50 flex items-center px-4 shadow-sm border-b border-gray-100">
                    <button onclick="window.location.href='dumpling.html'" class="p-1.5 rounded-full hover:bg-gray-100 transition">
                        <i data-lucide="chevron-left" class="w-6 h-6 text-gray-800"></i>
                    </button>
                    <div class="flex-1 text-center font-bold text-gray-900">饺子人格测试</div>
                    <div class="w-6"></div>
                </div>
                `;
            },

            // 从专题页"查看详情"进入：恢复已保存的答案直接展示结果
            restoreFromStorage() {
                if (this.answers.length > 0) return;
                try {
                    const raw = sessionStorage.getItem('dumpling_test_answers');
                    if (raw) {
                        const arr = JSON.parse(raw);
                        if (Array.isArray(arr) && arr.length === this.questions.length) {
                            this.answers = arr;
                        }
                    }
                } catch (e) { /* 忽略损坏的缓存 */ }
            },

            introView() {
                const teaser = this.personalities.map(p => `
                    <div class="flex flex-col items-center gap-1.5">
                        <div class="w-12 h-12 bg-white rounded-2xl shadow-sm border border-gray-100 flex items-center justify-center text-xl">${p.emoji}</div>
                        <span class="text-[10px] text-gray-500 text-center leading-tight">${p.title}</span>
                    </div>
                `).join('');
                return `
                <div class="pt-[50px] min-h-screen flex flex-col justify-center px-6 fade-in">
                    <div class="w-full max-w-sm mx-auto -mt-6">
                        <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-brand-orange to-brand-yellow flex items-center justify-center shadow-lg shadow-brand-orange/30 rotate-3">
                            <span class="text-4xl">🥟</span>
                        </div>
                        <h2 class="mt-6 text-center text-xl font-black text-gray-900">测测你是哪种饺子人格？</h2>
                        <p class="mt-2 text-center text-sm text-gray-500">8道题，看看你偷吃饺子时是什么馅。</p>
                        <div class="mt-5 bg-white rounded-xl border border-gray-100 p-4 space-y-2">
                            <p class="text-xs text-gray-600 leading-relaxed">立冬饺子局，偷吃是一门手艺。</p>
                            <p class="text-xs text-gray-600 leading-relaxed">选你真实会选的，我们给你一条立冬该去的饺子路线。</p>
                            <p class="text-xs text-gray-600 leading-relaxed">测完还能领立冬限定优惠券，偷吃也要讲究性价比。</p>
                        </div>
                        <div class="mt-6 grid grid-cols-4 gap-x-3 gap-y-5">${teaser}</div>
                        <button onclick="Test.start()" class="mt-8 w-full py-3.5 bg-brand-orange text-white rounded-xl font-bold text-base shadow-lg shadow-brand-orange/30 active:scale-95 transition-transform">
                            开始测试 →
                        </button>
                    </div>
                </div>
                `;
            },

            quizView() {
                const total = this.questions.length;
                const q = this.questions[this.currentIndex];
                const progress = Math.round((this.currentIndex / total) * 100);
                const optionsHtml = q.options.map((opt, i) => `
                    <button onclick="Test.answer(${i})" class="w-full flex items-center gap-3 bg-white rounded-xl p-4 shadow-sm border border-gray-100 text-left active:scale-[0.98] transition-transform hover:border-brand-orange/40">
                        <span class="w-8 h-8 flex-shrink-0 rounded-full bg-brand-orange/10 text-brand-orange font-bold text-sm flex items-center justify-center">${OPTION_KEYS[i]}</span>
                        <span class="text-sm text-gray-800 leading-snug">${opt.text}</span>
                    </button>
                `).join('');
                return `
                <div class="pt-[50px] min-h-screen fade-in">
                    <div class="px-4 pt-5">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs text-gray-400 font-medium">第 ${this.currentIndex + 1}/${total} 题</span>
                            <span class="text-xs text-gray-400">${progress}%</span>
                        </div>
                        <div class="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-brand-orange to-brand-yellow rounded-full transition-all duration-500" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    <div class="px-4 mt-7">
                        <h2 class="text-xl font-black text-gray-900 leading-snug">${q.text}</h2>
                        <div class="mt-6 space-y-3">${optionsHtml}</div>
                    </div>
                </div>
                `;
            },

            // ============ 结果页：人格卡 + 详细路线 + 分享 ============
            resultView() {
                const { id } = window.DumplingTest.calculate(this.answers);
                const p = this.personalities.find(item => item.id === id);
                this.resultPersonality = p;
                const tagsHtml = p.tags.map(tag => `
                    <span class="px-3 py-1 bg-white/20 text-white text-xs font-medium rounded-full border border-white/40">${tag}</span>
                `).join('');
                const route = window.DumplingTest.routeForPersonality(p.id);
                return `
                <div class="pt-[50px] pb-10 fade-in">
                    <div class="px-4 pt-4">
                        <!-- 人格结果卡 -->
                        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100">
                            <div class="bg-gradient-to-br ${p.color} px-5 pt-8 pb-7 text-center relative overflow-hidden">
                                <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/15 rounded-full blur-2xl"></div>
                                <div class="absolute -left-6 -bottom-10 w-28 h-28 bg-black/10 rounded-full blur-2xl"></div>
                                <div class="relative">
                                    <p class="text-white/75 text-[11px] font-semibold tracking-widest">你的饺子人格</p>
                                    <div class="text-5xl mt-2">${p.emoji}</div>
                                    <h2 class="mt-2 text-3xl font-black text-white">${p.title}</h2>
                                    <div class="mt-3 flex flex-wrap justify-center gap-2">${tagsHtml}</div>
                                </div>
                            </div>
                            <div class="p-5">
                                <blockquote class="relative pl-4 border-l-4 border-brand-orange">
                                    <p class="text-base font-bold text-gray-900 leading-relaxed">"${p.quote}"</p>
                                </blockquote>
                                <p class="mt-4 text-sm text-gray-500 leading-relaxed">${p.description}</p>
                                <div class="mt-4 inline-flex items-center gap-1.5 px-3 py-1.5 bg-brand-yellow/15 text-brand-orange rounded-full text-xs font-bold border border-brand-yellow/40">
                                    <i data-lucide="utensils" class="w-3.5 h-3.5"></i><span>偷吃作案方式：${p.method}</span>
                                </div>
                                <div class="mt-6 flex gap-2.5">
                                    <button onclick="Test.openPoster()" class="flex-1 py-3 bg-brand-orange/10 text-brand-orange rounded-xl font-bold text-sm active:scale-95 transition-transform flex items-center justify-center gap-1.5">
                                        <i data-lucide="share-2" class="w-4 h-4"></i><span>分享我的饺子人格</span>
                                    </button>
                                    <button onclick="Test.restart()" class="flex-1 py-3 bg-white border border-brand-orange text-brand-orange rounded-xl font-bold text-sm active:scale-95 transition-transform">
                                        重新测试
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${this.routeDetailSection(route)}
                    <div class="px-4">
                        <button onclick="window.location.href='dumpling.html'" class="mt-5 w-full py-3 bg-white border border-brand-orange text-brand-orange rounded-xl font-bold active:scale-95 transition-transform">
                            回活动页领优惠券
                        </button>
                    </div>
                </div>
                `;
            },

            sectionTitle(text) {
                return `
                <div class="flex items-center gap-1.5 mb-2.5">
                    <div class="w-1 h-4 rounded-full bg-brand-orange"></div>
                    <h2 class="text-base font-black text-gray-900">${text}</h2>
                </div>
                `;
            },

            // 详细路线（参考 V2 路线详情：类型/行程/沿途/准备/预算/理由/攻略，纯展示无内链）
            routeDetailSection(route) {
                if (!route) return '';

                // 行程时间轴
                const scheduleRows = route.schedule.map((s, i) => `
                    <div class="flex gap-3">
                        <div class="flex flex-col items-center">
                            <div class="w-2.5 h-2.5 rounded-full mt-1.5 ${i === 0 ? 'bg-brand-orange ring-4 ring-brand-orange/15' : 'bg-gray-300'}"></div>
                            ${i < route.schedule.length - 1 ? '<div class="w-0.5 flex-1 bg-gray-200 my-0.5"></div>' : ''}
                        </div>
                        <div class="pb-4 ${i === route.schedule.length - 1 ? 'pb-0' : ''}">
                            <span class="text-sm font-bold text-brand-orange">${s.time}</span>
                            <span class="text-sm text-gray-800 ml-2">${s.item}</span>
                        </div>
                    </div>
                `).join('');

                // 沿途推荐（纯展示，无点击跳转）
                const highlightCards = route.highlights.map((h, i) => `
                    <div class="bg-white rounded-xl border border-gray-100 overflow-hidden ${i === 0 ? 'ring-1 ring-brand-orange/30' : ''}">
                        <div class="p-4">
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="text-sm font-bold text-gray-900">${h.name}</h3>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${h.primary ? 'bg-brand-orange/10 text-brand-orange' : 'bg-gray-100 text-gray-500'}">${h.primary ? '主推荐' : '顺路推荐'}</span>
                            </div>
                            <div class="flex items-center gap-2 text-[11px] text-gray-500 mb-2">
                                <span class="px-2 py-0.5 bg-gray-50 rounded-md">${h.budget}</span>
                                <span class="px-2 py-0.5 bg-gray-50 rounded-md">${h.district}</span>
                            </div>
                            <p class="text-xs text-gray-600 leading-relaxed">${h.blurb}</p>
                            <p class="mt-2 text-[11px] text-amber-600 bg-amber-50 rounded-lg px-2.5 py-1.5 flex items-start gap-1">
                                <i data-lucide="lightbulb" class="w-3.5 h-3.5 flex-shrink-0 mt-0.5"></i><span>${h.tip}</span>
                            </p>
                        </div>
                    </div>
                `).join('');

                // 路线准备
                const prepRows = route.preparation.map(item => `
                    <div class="flex items-start gap-2.5 py-2 ${item !== route.preparation[0] ? 'border-t border-gray-100' : ''}">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-brand-green flex-shrink-0 mt-0.5"></i>
                        <span class="text-sm text-gray-700 leading-relaxed">${item}</span>
                    </div>
                `).join('');

                // 预算明细
                const budgetRows = route.budgetDetail.map(b => `
                    <div class="flex items-center justify-between py-2 ${b.item.includes('合计') ? 'border-t border-dashed border-gray-200 font-black text-gray-900' : ''}">
                        <span class="text-sm ${b.item.includes('合计') ? 'font-black' : 'text-gray-600'}">${b.item}</span>
                        <span class="text-sm ${b.item.includes('合计') ? 'font-black text-brand-orange' : 'text-gray-800 font-bold'}">${b.amount}</span>
                    </div>
                `).join('');

                // 攻略
                const tipsHtml = route.tips.map(t => `
                    <div class="flex items-start gap-2.5">
                        <span class="px-2 py-0.5 bg-brand-orange/10 text-brand-orange text-[10px] font-bold rounded-md flex-shrink-0">${t.title}</span>
                        <span class="text-xs text-gray-600 leading-relaxed">${t.content}</span>
                    </div>
                `).join('');

                return `
                <div class="px-4 pt-5">
                    ${this.sectionTitle('为你推荐的一条饺子路线')}
                    <!-- 头部卡 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 bg-gradient-to-r from-brand-orange to-brand-yellow text-white text-[10px] font-black rounded-full">${route.typeLabel}</span>
                            <span class="text-sm font-black text-brand-orange">${route.budget}</span>
                        </div>
                        <h3 class="mt-2 text-base font-black text-gray-900">${route.shop}</h3>
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            ${route.tags.map(tag => `<span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-[10px] rounded-md border border-gray-100">${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>

                <div class="px-4 pt-5">
                    ${this.sectionTitle('行程时间轴')}
                    <div class="bg-white rounded-xl border border-gray-100 p-4">${scheduleRows}</div>
                </div>

                <div class="px-4 pt-5">
                    ${this.sectionTitle('沿途推荐')}
                    <div class="space-y-2.5">${highlightCards}</div>
                </div>

                <div class="px-4 pt-5">
                    ${this.sectionTitle('路线准备（出发前核验）')}
                    <div class="bg-white rounded-xl border border-gray-100 px-4">${prepRows}</div>
                </div>

                <div class="px-4 pt-5">
                    ${this.sectionTitle('预算明细')}
                    <div class="bg-white rounded-xl border border-gray-100 px-4">${budgetRows}</div>
                </div>

                <div class="px-4 pt-5">
                    ${this.sectionTitle('推荐理由')}
                    <div class="bg-white rounded-xl border border-gray-100 p-4 flex items-start gap-2">
                        <i data-lucide="sparkles" class="w-4 h-4 text-brand-orange flex-shrink-0 mt-0.5"></i>
                        <p class="text-sm text-gray-700 leading-relaxed">${route.reason}</p>
                    </div>
                </div>

                <div class="px-4 pt-5">
                    ${this.sectionTitle('路线攻略')}
                    <div class="bg-white rounded-xl border border-gray-100 p-4 space-y-3">${tipsHtml}</div>
                </div>
                `;
            },

            // 分享我的饺子人格海报
            openPoster() {
                this.showPoster = true;
                this.render();
            },

            closePoster() {
                this.showPoster = false;
                this.render();
            },

            posterModal() {
                if (!this.showPoster || !this.resultPersonality) return '';
                const p = this.resultPersonality;
                const user = (window.GlobalData && window.GlobalData.user) || { name: '我', avatarUrl: 'images/avatar-1.png' };
                return `
                <div class="fixed inset-0 bg-black/60 z-[200] flex items-center justify-center px-8" onclick="Test.closePoster()">
                    <div class="w-full max-w-xs" onclick="event.stopPropagation()">
                        <div class="rounded-2xl overflow-hidden bg-gradient-to-br ${p.color} p-5 relative">
                            <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/15 rounded-full blur-2xl"></div>
                            <div class="absolute -left-6 -bottom-10 w-28 h-28 bg-black/10 rounded-full blur-2xl"></div>
                            <div class="relative">
                                <div class="flex items-center gap-2">
                                    <img src="${user.avatarUrl}" class="w-10 h-10 rounded-full border-2 border-white/70 object-cover" />
                                    <div>
                                        <p class="text-white text-sm font-bold">${user.name}</p>
                                        <p class="text-white/70 text-[10px]">在搭子计划完成了饺子人格测试</p>
                                    </div>
                                </div>
                                <div class="text-center mt-4">
                                    <div class="text-5xl">${p.emoji}</div>
                                    <h3 class="text-white text-2xl font-black mt-2">${p.title}</h3>
                                    <p class="text-white/90 text-sm italic mt-2">"${p.quote}"</p>
                                    <p class="text-white/85 text-[11px] mt-2 leading-relaxed">${p.method}</p>
                                </div>
                                <div class="mt-4 bg-white rounded-xl p-3.5 flex items-center gap-3">
                                    <canvas id="qr-canvas" class="flex-shrink-0" width="72" height="72" style="width:72px;height:72px"></canvas>
                                    <p class="text-[10px] text-gray-500 leading-relaxed">来测测你和我<br/>是不是同一种<br/>饺子人格</p>
                                </div>
                            </div>
                        </div>
                        <button onclick="Test.closePoster()" class="mt-3 w-full py-2.5 bg-white/90 rounded-xl font-bold text-sm text-gray-700">关闭</button>
                    </div>
                </div>
                `;
            },

            errorView() {
                return `
                <div class="pt-[50px] min-h-screen flex flex-col items-center justify-center px-6 fade-in">
                    <div class="text-center -mt-10">
                        <div class="text-5xl">🥟</div>
                        <h2 class="mt-4 text-xl font-black text-gray-900">测试题目加载失败</h2>
                        <p class="mt-2 text-sm text-gray-500">请检查数据文件后重试</p>
                        <button onclick="window.location.reload()" class="mt-6 px-8 py-2.5 bg-brand-orange text-white rounded-xl font-bold">重新加载</button>
                    </div>
                </div>
                `;
            },

            start() {
                this.started = true;
                this.answers = [];
                this.currentIndex = 0;
                this.locked = false;
                this.render();
            },

            restart() {
                // 重新测试：清掉保存的答案，回到介绍页
                sessionStorage.removeItem('dumpling_test_answers');
                this.started = false;
                this.answers = [];
                this.currentIndex = 0;
                this.locked = false;
                this.render();
            },

            answer(optionIndex) {
                if (this.locked) return;
                this.locked = true;
                this.answers.push(optionIndex);

                const buttons = document.querySelectorAll('#app button[onclick^="Test.answer"]');
                buttons.forEach((btn, i) => {
                    if (i === optionIndex) {
                        btn.className = btn.className.replace('border-gray-100', 'border-brand-orange bg-brand-orange/5 ring-1 ring-brand-orange');
                    } else {
                        btn.className += ' opacity-40';
                    }
                });

                setTimeout(() => {
                    this.currentIndex++;
                    this.locked = false;
                    this.render();
                }, ANSWER_DELAY_MS);
            },

            render() {
                this.restoreFromStorage();
                let view;
                if (!window.DumplingTest || this.questions.length === 0) {
                    view = this.errorView();
                } else if (this.answers.length === this.questions.length) {
                    view = this.resultView();
                } else if (this.started || this.answers.length > 0) {
                    view = this.quizView();
                } else {
                    view = this.introView();
                }
                document.getElementById('app').innerHTML = `
                    ${this.header()}
                    ${view}
                    ${this.posterModal()}
                `;
                if (window.Common) window.Common.initIcons();
                // 海报二维码绘制
                if (this.showPoster && this.resultPersonality) {
                    const canvas = document.getElementById('qr-canvas');
                    if (canvas && typeof canvas.getContext === 'function' && window.Common && window.Common.drawQr) {
                        const userName = (window.GlobalData && window.GlobalData.user && window.GlobalData.user.name) || 'me';
                        window.Common.drawQr(canvas, 'dumpling-test:' + this.resultPersonality.id + ':' + userName);
                    }
                }
            }
        };

        window.Test = Test;
        document.addEventListener('DOMContentLoaded', () => Test.render());
    </script>
</body>
</html>
