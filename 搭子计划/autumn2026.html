    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 秋季主题动画 */
        @keyframes autumn-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(3deg); }
            75% { transform: translateY(-4px) rotate(-3deg); }
        }

        @keyframes leaf-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(60px) rotate(45deg); opacity: 0; }
        }

        @keyframes shimmer-gold {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .autumn-float {
            animation: autumn-float 3s ease-in-out infinite;
        }

        .shimmer-gold {
            background: linear-gradient(90deg, #fffcdd, #fccf2c, #ee4d16, #fccf2c, #fffcdd);
            background-size: 200% 100%;
            animation: shimmer-gold 3s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* 秋季卡片光晕 */
        .autumn-glow {
            box-shadow: 0 4px 20px rgba(238, 77, 22, 0.15), 0 1px 3px rgba(252, 207, 44, 0.2);
        }

        .autumn-card {
            background: linear-gradient(135deg, rgba(255,252,221,0.6) 0%, rgba(252,207,44,0.15) 100%);
            border: 1px solid rgba(252, 207, 44, 0.3);
        }

        /* 优惠券撕边效果 */
        .coupon-card {
            position: relative;
            background: linear-gradient(135deg, #fffdf5 0%, #fff9e6 100%);
        }
        .coupon-card::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f8f9fa;
            z-index: 2;
        }
        .coupon-card::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f8f9fa;
            z-index: 2;
        }

        /* Banner 渐变叠加 */
        .banner-overlay {
            background: linear-gradient(
                to bottom,
                rgba(255,252,221,0.3) 0%,
                rgba(252,207,44,0.25) 40%,
                rgba(238,77,22,0.5) 100%
            );
        }

        /* 秋季标签 */
        .tag-autumn {
            background: linear-gradient(135deg, #fffcdd, #fef3c7);
            color: #ee4d16;
            border: 1px solid rgba(252,207,44,0.4);
        }

        /* 脉冲按钮 */
        @keyframes pulse-autumn {
            0%, 100% { box-shadow: 0 0 0 0 rgba(238, 77, 22, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(238, 77, 22, 0); }
        }
        .btn-pulse-autumn {
            animation: pulse-autumn 2s infinite;
        }

        /* 落叶装饰 */
        .leaf-decor {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            animation: leaf-fall 4s ease-in infinite;
        }
        .leaf-decor:nth-child(1) { left: 5%; animation-delay: 0s; }
        .leaf-decor:nth-child(2) { left: 25%; animation-delay: 1.5s; font-size: 18px; }
        .leaf-decor:nth-child(3) { left: 55%; animation-delay: 0.8s; font-size: 20px; }
        .leaf-decor:nth-child(4) { left: 75%; animation-delay: 2.2s; }
        .leaf-decor:nth-child(5) { left: 90%; animation-delay: 3s; font-size: 16px; }

        /* 活动卡片微调 */
        .activity-card-autumn {
            transition: all 0.3s ease;
        }
        .activity-card-autumn:active {
            transform: scale(0.98);
        }

        main {
            margin-top: 0 !important;
        }
    </style>
</head>

                // 按 ID 降序（模拟最新优先）
                allActivities.sort(function(a, b) {
                    var aNum = parseInt(String(a.id).replace(/[^0-9]/g, '')) || 0;
                    var bNum = parseInt(String(b.id).replace(/[^0-9]/g, '')) || 0;
                    return bNum - aNum;
                });

                var listHtml = allActivities.map(function(activity) {
                    var isFull = activity.status === 'FULL';
                    var statusBadge = activity.status === 'RECRUITING'
                        ? '<span class="text-white px-2 py-1 text-xs font-bold rounded-full backdrop-blur-md" style="background: #ee4d16;">招募中</span>'
                        : '<span class="bg-gray-500 text-white px-2 py-1 text-xs font-bold rounded-full backdrop-blur-md">已满员</span>';
                    var btnClass = isFull
                        ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                        : 'text-white font-bold';
                    var btnStyle = isFull
                        ? ''
                        : 'background: linear-gradient(135deg, #fccf2c, #ee4d16); box-shadow: 0 2px 10px rgba(238,77,22,0.3);';

                    // 判断是否是秋季活动
                    var isAutumn = String(activity.id).indexOf('autumn') === 0;
                    var autumnBadge = isAutumn
                        ? '<span class="absolute top-3 left-3 text-white text-[10px] px-2 py-0.5 rounded-full font-medium backdrop-blur-md z-10" style="background: rgba(238,77,22,0.85);">🍂 秋季限定</span>'
                        : '';

                    return `
                    <div onclick="window.location.href='detail.html?id=${activity.id}'"
                         class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-300 mb-4 group cursor-pointer relative activity-card-autumn">
                        <div class="relative h-48 w-full overflow-hidden">
                            <img src="${activity.imageUrl}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                 onerror="this.src='https://images.unsplash.com/photo-1506812574050-5e1f5b5f5e5f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80';" />
                            ${autumnBadge}
                            <div class="absolute top-3 right-3">${statusBadge}</div>
                            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3 pt-10">
                                <div class="flex gap-2">
                                    ${(activity.tags || []).map(function(tag) {
                                        return '<span class="text-[10px] bg-white/20 backdrop-blur-sm text-white px-2 py-0.5 rounded-md border border-white/30">#' + tag + '</span>';
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="p-4">
                            <h3 class="text-lg font-bold text-gray-800 mb-2 line-clamp-1">${activity.title}</h3>
                            <div class="space-y-2 text-sm text-gray-500">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5" style="color: #ee4d16;"></i>
                                    <span>${activity.date}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5" style="color: #fccf2c;"></i>
                                    <span class="line-clamp-1">${activity.district} · ${activity.location}</span>
                                </div>
                            </div>
                            <div class="mt-4 flex items-center justify-between">
                                <div class="flex items-center gap-2 z-10"
                                     onclick="event.stopPropagation(); window.location.href='profile.html?id=${activity.organizer.id}'">
                                    <img src="${activity.organizer.avatarUrl}" class="w-6 h-6 rounded-full border border-gray-200" />
                                    <span class="text-xs text-gray-500 truncate max-w-[80px]">${activity.organizer.name}</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <div class="flex items-center text-xs text-gray-400">
                                        <i data-lucide="users" class="w-3.5 h-3.5 mr-1"></i>
                                        <span>${activity.currentParticipants}/${activity.maxParticipants}</span>
                                    </div>
                                    <button class="flex items-center gap-1 px-4 py-1.5 rounded-full text-sm transition-colors ${btnClass}"
                                            style="${btnStyle}">
                                        ${isFull ? '已满' : '去报名'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');

                return `
                <div class="px-4 pb-2">
                    <div class="flex items-center justify-between mb-2 pt-1">
                        <div class="flex items-center gap-1.5">
                            <div class="p-1 rounded-md" style="background: rgba(238,77,22,0.15);">
                                <i data-lucide="flame" class="w-4 h-4" style="color: #ee4d16; fill: #ee4d16;"></i>
                            </div>
                            <h2 class="text-lg font-black text-gray-900">热门活动</h2>
                            <span class="tag-autumn text-[10px] px-2 py-0.5 rounded-full font-medium">秋季精选</span>
                        </div>
                    </div>
                    <div class="space-y-4">${listHtml}</div>
                    <div class="mt-4 text-center text-gray-400 text-xs pb-4">—— 已经到底啦 🍁 ——</div>
                </div>
                `;
            },

            // 刷新搭子模式（用户可手动切换）
            togglePartnerMode() {
                this.partnerMode = this.partnerMode === 'list' ? 'prompt' : 'list';
                this.render();
            },

            // 主渲染
            render() {
                var app = document.getElementById('app');
                app.innerHTML =
                    this.renderBanner() +
                    '<main>' +
                        this.renderPartnerSection() +
                        this.renderCouponSection() +
                        this.renderActivitySection() +
                    '</main>';

                if (window.Common) window.Common.initIcons();
            }
        };

        window.AutumnView = AutumnView;

        document.addEventListener('DOMContentLoaded', function() {
            AutumnView.render();
        });
    </script>
</body>
</html>
