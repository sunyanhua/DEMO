<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>浏览历史 - 搭子计划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <div id="app"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script>
        function render() {
            const urlParams = new URLSearchParams(window.location.search);
            const activeTab = urlParams.get('tab') || 'moments'; // 'moments' | 'activities'

            // 模拟浏览历史的动态数据
            const historyMoments = [
                {
                    id: 'mo1',
                    userId: 'u1',
                    content: '今天天气真好，在亮马河边发呆，有没有一起喝咖啡的？☕️ #亮马河 #咖啡',
                    images: ['https://images.unsplash.com/photo-1497935586351-b67a49e012bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'],
                    likes: 45,
                    comments: 12,
                    time: '2小时前',
                    location: '亮马河国际风情水岸',
                    viewedAt: '今天 10:30'
                },
                {
                    id: 'mo2',
                    userId: 'p1',
                    content: '崇礼万龙开板啦！雪质无敌！这个周末还要来冲！🎿',
                    images: [
                        'https://images.unsplash.com/photo-1551698618-1dfe5d97d256?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                        'https://images.unsplash.com/photo-1565992441121-4367c2967103?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'
                    ],
                    likes: 128,
                    comments: 34,
                    time: '3小时前',
                    location: '万龙滑雪场',
                    viewedAt: '今天 09:15'
                },
                {
                    id: 'mo3',
                    userId: 'u4',
                    content: '晨跑5公里完成，神清气爽！🏃‍♂️',
                    images: ['https://images.unsplash.com/photo-1571008887538-b36bb32f4571?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'],
                    likes: 89,
                    comments: 8,
                    time: '昨天',
                    location: '奥林匹克公园',
                    viewedAt: '昨天 18:20'
                }
            ];

            // 模拟浏览历史的活动数据
            const historyActivities = [
                {
                    id: 'a1',
                    title: '朝阳公园飞盘新手局',
                    imageUrl: 'https://images.unsplash.com/photo-1546519638-68e109498ffc?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                    date: '本周六 14:00-16:00',
                    location: '朝阳公园 草坪区',
                    status: 'RECRUITING',
                    price: 0,
                    organizer: { id: 'u2', name: '飞盘小队长', avatarUrl: 'https://picsum.photos/50/50?random=2' },
                    viewedAt: '今天 11:45'
                },
                {
                    id: 'a2',
                    title: '胡同美食探索团',
                    imageUrl: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                    date: '本周日 18:00-20:00',
                    location: '雍和宫附近',
                    status: 'RECRUITING',
                    price: 50,
                    organizer: { id: 'u3', name: 'FoodieJane', avatarUrl: 'https://picsum.photos/50/50?random=4' },
                    viewedAt: '今天 10:10'
                },
                {
                    id: 'a3',
                    title: '零基础油画体验课',
                    imageUrl: 'https://images.unsplash.com/photo-1541961017774-22349e4a1262?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                    date: '下周六 15:00-17:30',
                    location: '798艺术区',
                    status: 'RECRUITING',
                    price: 120,
                    organizer: { id: 'p2', name: 'CoffeeJane', avatarUrl: 'https://picsum.photos/100/100?random=21' },
                    viewedAt: '昨天 16:30'
                }
            ];

            // Tab 切换逻辑
            const getTabClass = (name) => activeTab === name ? 'font-bold text-gray-900 border-b-2 border-brand-orange' : 'text-gray-400';

            // 动态卡片生成函数
            const getMomentCard = (m) => {
                const user = window.GlobalData.user.id === m.userId ? window.GlobalData.user :
                             (window.GlobalData.partners.find(p=>p.id===m.userId) ||
                             { name:'未知用户', avatarUrl:'https://picsum.photos/50/50?random=0' });

                return `
                <div onclick="window.location.href='moment.html?id=${m.id}'" class="break-inside-avoid mb-3 bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 cursor-pointer group">
                    <img src="${m.images[0]}" class="w-full h-auto object-cover" />
                    <div class="p-2.5">
                        <p class="text-sm text-gray-800 line-clamp-2 mb-2 leading-snug">${m.content}</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1.5 overflow-hidden" onclick="event.stopPropagation(); window.location.href='profile.html?id=${m.userId}'">
                                <img src="${user.avatarUrl}" class="w-5 h-5 rounded-full border border-gray-100 flex-shrink-0" />
                                <span class="text-[10px] text-gray-500 truncate">${user.name}</span>
                            </div>
                            <div class="flex items-center gap-2 text-gray-400">
                                <span class="text-[10px] text-gray-400">${m.viewedAt}</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            };

            // 活动卡片生成函数
            const getActivityCard = (activity) => {
                const isFull = activity.status === 'FULL';
                return `
                <div onclick="window.location.href='detail.html?id=${activity.id}'" class="bg-white rounded-xl p-3 shadow-sm flex gap-3 mb-3 cursor-pointer">
                    <div class="relative w-24 h-24 flex-shrink-0">
                        <img src="${activity.imageUrl}" class="w-full h-full object-cover rounded-lg" />
                        ${activity.status === 'RECRUITING' ? '<div class="absolute top-0 left-0 bg-brand-orange text-white text-[10px] px-1.5 py-0.5 rounded-br-lg rounded-tl-lg">招募</div>' : '<div class="absolute top-0 left-0 bg-gray-400 text-white text-[10px] px-1.5 py-0.5 rounded-br-lg rounded-tl-lg">满员</div>'}
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-0.5">
                        <div class="flex justify-between items-start">
                            <h3 class="text-sm font-bold text-gray-900 line-clamp-2 leading-tight">${activity.title}</h3>
                            <span class="text-[10px] text-gray-400">${activity.viewedAt}</span>
                        </div>
                        <div class="text-xs text-gray-400 mt-1 flex items-center gap-1">
                            <i data-lucide="calendar" class="w-3 h-3"></i> ${activity.date}
                        </div>
                        <div class="text-xs text-gray-400 mt-0.5 flex items-center gap-1">
                            <i data-lucide="map-pin" class="w-3 h-3"></i> ${activity.location.split(' ')[0]}
                        </div>
                        <div class="flex items-center justify-between mt-2">
                            <div class="flex items-center gap-1" onclick="event.stopPropagation(); window.location.href='profile.html?id=${activity.organizer.id}'">
                                <img src="${activity.organizer.avatarUrl}" class="w-4 h-4 rounded-full" />
                                <span class="text-xs text-gray-500 scale-90 origin-left">${activity.organizer.name}</span>
                            </div>
                            <span class="text-brand-orange font-bold text-sm">${activity.price === 0 ? '免费' : '¥'+activity.price}</span>
                        </div>
                    </div>
                </div>
                `;
            };

            document.getElementById('app').innerHTML = `
                <!-- 头部 -->
                <div class="fixed top-0 left-0 right-0 h-[50px] bg-white z-50 flex items-center px-4 shadow-sm border-b border-gray-100">
                    <button onclick="window.history.back()" class="p-1.5 rounded-full hover:bg-gray-100 transition">
                        <i data-lucide="chevron-left" class="w-6 h-6 text-gray-800"></i>
                    </button>
                    <div class="flex-1 text-center font-bold text-gray-900">浏览历史</div>
                    <div class="w-6"></div> <!-- 占位保持对称 -->
                </div>

                <!-- Tab 切换 -->
                <div class="pt-[50px] bg-white">
                    <div class="flex px-4 border-b border-gray-100">
                        <button onclick="window.location.href='history.html?tab=moments'" class="flex-1 py-3 text-center ${getTabClass('moments')}">
                            动态 (${historyMoments.length})
                        </button>
                        <button onclick="window.location.href='history.html?tab=activities'" class="flex-1 py-3 text-center ${getTabClass('activities')}">
                            活动 (${historyActivities.length})
                        </button>
                    </div>
                </div>

                <!-- 内容区域 -->
                <div class="p-4 pb-20 min-h-screen bg-gray-50">
                    ${activeTab === 'moments' ? `
                        <div class="columns-2 gap-3 space-y-3">
                            ${historyMoments.length > 0 ? historyMoments.map(m => getMomentCard(m)).join('') : `
                                <div class="text-center py-10 text-gray-400 col-span-2">
                                    <i data-lucide="eye" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
                                    <p class="text-sm">暂无浏览历史</p>
                                </div>
                            `}
                        </div>
                    ` : `
                        <div class="space-y-3">
                            ${historyActivities.length > 0 ? historyActivities.map(activity => getActivityCard(activity)).join('') : `
                                <div class="text-center py-10 text-gray-400 bg-white rounded-xl">
                                    <i data-lucide="calendar" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
                                    <p class="text-sm">暂无浏览历史</p>
                                </div>
                            `}
                        </div>
                    `}
                </div>
            `;

            window.Common.initIcons();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
