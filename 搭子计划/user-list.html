<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>用户列表 - 搭子计划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <div id="app"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script>
        function render() {
            const urlParams = new URLSearchParams(window.location.search);
            const activeTab = urlParams.get('tab') || 'following'; // 'following' | 'followers'

            // 模拟关注/粉丝数据（添加认证状态）
            const mockFollowing = [
                { id: 'p1', name: '滑雪大冒险', avatarUrl: 'https://picsum.photos/100/100?random=20', tags: ['单板', '自驾', '摄影'], intro: '崇礼周末往返，缺人拼车！', distance: '1.2km', realNameVerified: true, cooperationVerified: true, role: 'merchant' },
                { id: 'p2', name: 'CoffeeJane', avatarUrl: 'https://picsum.photos/100/100?random=21', tags: ['探店', '手冲', '阅读'], intro: '寻找三里屯附近的咖啡搭子。', distance: '0.5km', realNameVerified: true, cooperationVerified: false, role: 'user' },
                { id: 'u2', name: '飞盘小队长', avatarUrl: 'https://picsum.photos/50/50?random=2', tags: ['飞盘', '运动'], intro: '拥有3年飞盘经验的快乐修狗', realNameVerified: true, cooperationVerified: true, role: 'host' },
                { id: 'u3', name: 'FoodieJane', avatarUrl: 'https://picsum.photos/50/50?random=4', tags: ['美食', '探店'], intro: '专注于寻找北京好吃的', realNameVerified: false, cooperationVerified: false, role: 'user' }
            ];

            const mockFollowers = [
                { id: 'p3', name: '健身狂魔', avatarUrl: 'https://picsum.photos/100/100?random=22', tags: ['举铁', '增肌', '早起'], intro: '每天早上6点健身房见。', distance: '3.0km', realNameVerified: true, cooperationVerified: false, role: 'user' },
                { id: 'p4', name: '剧本杀DM', avatarUrl: 'https://picsum.photos/100/100?random=23', tags: ['推理', '演绎'], intro: '缺1人，硬核本，速来！', distance: '5.2km', realNameVerified: true, cooperationVerified: true, role: 'host' },
                { id: 'u4', name: '夜跑达人', avatarUrl: 'https://picsum.photos/50/50?random=6', tags: ['跑步', '健康'], intro: '自律即自由', realNameVerified: true, cooperationVerified: false, role: 'user' },
                { id: 'u5', name: '魔法师', avatarUrl: 'https://picsum.photos/50/50?random=8', tags: ['哈利波特', '游乐园'], intro: '霍格沃茨在读研究生', realNameVerified: false, cooperationVerified: false, role: 'user' }
            ];

            const currentUser = window.GlobalData.user;
            const displayUsers = activeTab === 'following' ? mockFollowing : mockFollowers;

            // Tab 切换逻辑
            const getTabClass = (name) => activeTab === name ? 'font-bold text-gray-900 border-b-2 border-brand-orange' : 'text-gray-400';

            // 用户卡片生成函数
            const getUserCard = (user) => {
                const isOnline = Math.random() > 0.5;
                return `
                <div onclick="window.location.href='profile.html?id=${user.id}'" class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 active:bg-gray-50 cursor-pointer group">
                    <div class="flex gap-3">
                        <!-- 头像 -->
                        <div class="relative flex-shrink-0">
                            <img src="${user.avatarUrl}" class="w-14 h-14 rounded-full border-2 border-white shadow-md object-cover bg-gray-100">
                            ${user.distance ? `<div class="absolute -bottom-1 -right-1 bg-brand-blue text-[8px] text-white px-1.5 py-0.5 rounded-full border border-white">${user.distance}</div>` : ''}
                        </div>

                        <!-- 用户信息 -->
                        <div class="flex-1 min-w-0">
                            <div class="flex justify-between items-start mb-1">
                                <div>
                                    <h3 class="font-bold text-gray-900 text-sm truncate flex items-center gap-1">
                                        ${user.name}
                                        ${user.realNameVerified ? '<i data-lucide="shield-check" class="w-3 h-3 text-orange-500 flex-shrink-0" title="实名认证"></i>' : ''}
                                        ${user.cooperationVerified ? '<i data-lucide="badge-check" class="w-3 h-3 text-blue-500 flex-shrink-0" title="合作认证"></i>' : ''}
                                    </h3>
                                    <div class="flex gap-1 mt-1 flex-wrap">
                                        ${user.tags ? user.tags.map(tag => `<span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-xs rounded-md border border-gray-100">${tag}</span>`).join('') : ''}
                                    </div>
                                </div>
                                <button onclick="event.stopPropagation(); window.location.href='chat.html?uid=${user.id}&name=${encodeURIComponent(user.name)}'" class="px-3 py-1 bg-gradient-to-r from-gray-900 to-gray-700 text-white text-[10px] font-bold rounded-full shadow-gray-200 shadow-sm active:scale-95 transition-transform flex items-center gap-1">
                                    <i data-lucide="message-circle" class="w-2.5 h-2.5"></i>私信
                                </button>
                            </div>

                            <!-- 简介 -->
                            <p class="text-xs text-gray-500 mt-2 line-clamp-2">${user.intro || '这个用户很神秘'}</p>
                            <!-- 在线状态 -->
                            <div class="flex items-center justify-between mt-2 text-xs text-gray-400">
                                <span class="flex items-center gap-1">
                                    <i data-lucide="calendar" class="w-3 h-3"></i>
                                    <span>最近活跃: 今天</span>
                                </span>
                                <span class="flex items-center gap-1 ${isOnline ? 'text-green-500' : 'text-gray-400'}">
                                    <i data-lucide="circle" class="w-2.5 h-2.5 ${isOnline ? 'fill-green-500' : 'fill-gray-400'}"></i>
                                    <span>${isOnline ? '在线' : '离线'}</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            };

            document.getElementById('app').innerHTML = `
                <!-- 头部 -->
                <div class="fixed top-0 left-0 right-0 h-[50px] bg-white z-50 flex items-center px-4 shadow-sm border-b border-gray-100">
                    <button onclick="window.history.back()" class="p-1.5 rounded-full hover:bg-gray-100 transition">
                        <i data-lucide="chevron-left" class="w-6 h-6 text-gray-800"></i>
                    </button>
                    <div class="flex-1 text-center font-bold text-gray-900">用户列表</div>
                    <div class="w-6"></div> <!-- 占位保持对称 -->
                </div>

                <!-- Tab 切换 -->
                <div class="pt-[50px] bg-white">
                    <div class="flex px-4 border-b border-gray-100">
                        <button onclick="window.location.href='user-list.html?tab=following'" class="flex-1 py-3 text-center ${getTabClass('following')}">
                            我关注的 (${mockFollowing.length})
                        </button>
                        <button onclick="window.location.href='user-list.html?tab=followers'" class="flex-1 py-3 text-center ${getTabClass('followers')}">
                            关注我的 (${mockFollowers.length})
                        </button>
                    </div>
                </div>

                <!-- 用户列表 -->
                <div class="p-4 pb-20 min-h-screen bg-gray-50">
                    <div class="space-y-3">
                        ${displayUsers.length > 0 ? displayUsers.map(user => getUserCard(user)).join('') : `
                            <div class="text-center py-10 text-gray-400 bg-white rounded-xl">
                                <i data-lucide="users" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
                                <p class="text-sm">暂无${activeTab === 'following' ? '关注的' : '粉丝'}用户</p>
                            </div>
                        `}
                    </div>
                </div>
            `;

            window.Common.initIcons();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
