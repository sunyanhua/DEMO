<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>地推活动 - 搭子计划</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 覆盖 style.css 中 main 的白色背景/圆角（专题页 main 需透明融入渐变背景） */
        main {
            margin-top: 0 !important;
            background-color: transparent !important;
            backdrop-filter: none !important;
            border-radius: 0 !important;
            min-height: auto !important;
        }

        /* 彩带庆祝动画 */
        .confetti-piece {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 14px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 300;
            animation: confetti-fall 2.8s ease-in forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.5; }
        }

        /* 横幅小元素浮动 */
        @keyframes promo-float {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-10px) rotate(6deg); }
        }
        .promo-float { animation: promo-float 3s ease-in-out infinite; }

        /* 弹窗滑入 / 弹出 */
        @keyframes slideUpPromo {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up-promo { animation: slideUpPromo 0.35s cubic-bezier(0.22, 0.9, 0.35, 1); }
        @keyframes promo-pop {
            0% { transform: scale(0.88) translateY(18px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-promo-pop { animation: promo-pop 0.38s cubic-bezier(0.22, 0.9, 0.35, 1); }

        /* 任务标签 */
        .tag-promo {
            background: linear-gradient(135deg, #fff4e0, #fdeec4);
            color: #c26200;
            border: 1px solid rgba(255, 107, 0, 0.3);
        }

        /* 领奖印章 */
        .promo-stamp {
            position: absolute;
            right: -20px;
            bottom: -10px;
            width: 88px;
            height: 88px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 107, 0, 0.85);
            color: rgba(255, 107, 0, 0.9);
            border-radius: 50%;
            transform: rotate(-14deg);
            background: rgba(255, 107, 0, 0.06);
            text-align: center;
            line-height: 1.15;
            font-weight: 900;
            box-shadow: 0 4px 14px rgba(255, 107, 0, 0.25);
        }
        .promo-stamp::after {
            content: '';
            position: absolute;
            inset: 5px;
            border: 1.5px dashed rgba(255, 107, 0, 0.45);
            border-radius: 50%;
        }
    </style>
</head>
<body class="text-gray-900 antialiased selection:bg-brand-orange selection:text-white"
      style="background: linear-gradient(180deg, #fff4e0 0%, #fff4e0 500px, #fff9ec 1100px, #fff3d6 75%, #fdeec4 100%);">

    <!-- 浮动装饰元素 -->
    <div class="floating-shapes">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <!-- 应用挂载点 -->
    <div id="app" class="min-h-screen"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>

    <script>
        // ===== 地推活动页状态（localStorage 持久化）=====
        var STORAGE_KEY = 'groundPromoState.v1';

        var state = loadState();

        function loadState() {
            var defaults = { phoneAuthorized: false, subscribed: false, rewarded: false };
            try {
                var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return Object.assign({}, defaults, saved || {});
            } catch (e) {
                return defaults;
            }
        }

        function saveState(patch) {
            state = Object.assign({}, state, patch);
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                if (window.Common) window.Common.showToast('本地存储已满，状态可能无法保存');
            }
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 奖品清单
        var PRIZES = [
            { id: 'p1', icon: '🎁', name: '新人见面礼包', desc: '帆布袋 + 贴纸 + 好运签，见者有份' },
            { id: 'p2', icon: '☕', name: '咖啡双人券', desc: '现场咖啡车任选两杯，和搭子碰个杯' },
            { id: 'p3', icon: '🎫', name: '音乐节门票抽奖券', desc: '抽取大运河音乐节门票，下一站现场见' },
            { id: 'p4', icon: '🧸', name: '搭子周边公仔', desc: '限量搭子 IP 公仔，软fufu抱回家' }
        ];

        // 彩带颜色池
        var CONFETTI_COLORS = ['#FF6B00', '#FFD000', '#42A5F5', '#00C853', '#FF4081', '#00A99D', '#7B1FA2', '#f3c146'];

        // 伪二维码（演示用）
        function renderQrCodeSvg() {
            var size = 21;
            var seed = 20260918;
            function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }

            var rects = '';
            for (var r = 0; r < size; r++) {
                for (var c = 0; c < size; c++) {
                    var inFinder = (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
                    if (inFinder) continue;
                    if (rnd() > 0.55) rects += '<rect x="' + c + '" y="' + r + '" width="1" height="1" fill="#1f2937"/>';
                }
            }
            var finder = function (x, y) {
                return '<rect x="' + x + '" y="' + y + '" width="7" height="7" fill="#1f2937"/>'
                    + '<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="5" height="5" fill="#ffffff"/>'
                    + '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" fill="#1f2937"/>';
            };
            return '<svg viewBox="0 0 21 21" class="w-full h-full">'
                + finder(0, 0) + finder(14, 0) + finder(0, 14) + rects + '</svg>';
        }

        // ===== 页面视图 =====
        var GroundPromoView = {
            // 会话内状态
            authModalOpen: false,     // 手机号授权弹窗
            authPhone: '',            // 授权弹窗内的手机号输入
            subscribeOpen: false,     // 关注订阅二维码弹窗
            redeemOpen: false,        // 核销领奖弹窗
            redeemDoneView: false,    // 领奖弹窗内的已领奖态
            prizeModalId: null,       // 查看的奖品弹窗 id
            redeemClickCount: 0,
            redeemLastClickTime: 0,

            taskDone() {
                return state.phoneAuthorized && state.subscribed;
            },

            // ---------- 主渲染 ----------
            render() {
                var app = document.getElementById('app');

                // 任务卡
                var taskCard = `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(255,107,0,0.12);">
                            <i data-lucide="sparkles" class="w-4 h-4" style="color:#FF6B00;"></i>
                        </div>
                        <h3 class="font-black text-gray-900 whitespace-nowrap">好运双响炮</h3>
                        <span class="tag-promo text-[10px] px-2 py-0.5 rounded-full font-medium ml-auto">必做任务</span>
                    </div>
                    <p class="text-xs text-gray-500 leading-relaxed">两步把好运拉满：手机号注册 + 关注公众号订阅，完成后解锁见面礼！</p>

                    <!-- 任务步骤 -->
                    <div class="flex flex-wrap gap-1.5 mt-3">
                        <span class="text-[10px] px-2 py-0.5 rounded-full ${state.phoneAuthorized ? 'bg-green-50 text-green-600' : 'bg-gray-100 text-gray-500'}">① 手机号注册 ${state.phoneAuthorized ? '✓' : '○'}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full ${state.subscribed ? 'bg-green-50 text-green-600' : 'bg-gray-100 text-gray-500'}">② 关注订阅 ${state.subscribed ? '✓' : '○'}</span>
                    </div>

                    ${this.taskDone() ? `
                    <div class="mt-3 flex items-center gap-2 bg-green-50 rounded-xl px-3 py-2.5 border border-green-100">
                        <i data-lucide="badge-check" class="w-4 h-4 text-green-500 shrink-0"></i>
                        <span class="text-xs text-green-700 font-bold">任务已完成，见面礼解锁！</span>
                    </div>` : `
                    <button onclick="GroundPromoView.openAuthModal()"
                            class="w-full mt-3 py-3.5 rounded-xl text-white font-black text-base active:scale-95 transition-transform"
                            style="background: linear-gradient(135deg, #FF6B00, #FFB300); box-shadow: 0 4px 15px rgba(255,107,0,0.4);">
                        立即参与
                    </button>`}
                </div>
                `;

                // 核销领奖卡
                var rewarded = state.rewarded;
                var redeemCard = `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(255,208,0,0.15);">
                            <i data-lucide="gift" class="w-4 h-4" style="color:#d4a017;"></i>
                        </div>
                        <h3 class="font-black text-gray-900 whitespace-nowrap">核销领奖</h3>
                    </div>
                    <p class="text-xs text-gray-500 leading-relaxed">${rewarded ? '奖品已到手，好运已开箱！' : '完成任务后，凭核销码到工作人员处领奖'}</p>
                    ${rewarded ? `
                    <div class="mt-3 flex items-center gap-2 bg-gray-50 rounded-xl px-3 py-2.5">
                        <i data-lucide="stamp" class="w-4 h-4 text-gray-400 shrink-0"></i>
                        <span class="text-xs text-gray-500 font-bold">已领奖</span>
                    </div>` : `
                    <button onclick="GroundPromoView.openRedeemModal()"
                            class="w-full mt-3 py-3.5 rounded-xl font-black text-base active:scale-95 transition-transform ${this.taskDone() ? 'text-white' : 'bg-gray-100 text-gray-400'}"
                            style="${this.taskDone() ? 'background: linear-gradient(135deg, #FFD000, #FFB300); color:#5c4300; box-shadow: 0 4px 15px rgba(255,208,0,0.4);' : ''}">
                        出示核销码领奖
                    </button>`}
                </div>
                `;

                // 奖品卡
                var prizeCards = PRIZES.map((p) => `
                <button onclick="GroundPromoView.openPrizeModal('${p.id}')"
                        class="flex items-center gap-3 bg-white rounded-2xl border border-gray-100 shadow-sm p-3.5 text-left active:scale-[0.98] transition-transform">
                    <span class="text-3xl">${p.icon}</span>
                    <div class="flex-1 min-w-0">
                        <div class="font-black text-sm text-gray-900">${p.name}</div>
                        <div class="text-[11px] text-gray-500 mt-0.5">${p.desc}</div>
                    </div>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 flex-shrink-0"></i>
                </button>
                `).join('');

                // 活动规则
                var rules = [
                    '现场扫码进入本页，完成「好运双响炮」任务（手机号注册 + 关注公众号订阅）',
                    '任务完成后，凭核销码到工作人员处核销领奖，每人限领一次',
                    '奖品数量有限，先到先得，领完即止',
                    '本活动解释权归搭子计划所有'
                ];
                var rulesHtml = rules.map((r, i) => `
                <div class="flex items-start gap-2">
                    <span class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black text-white flex-shrink-0 mt-0.5" style="background:#FF6B00;">${i + 1}</span>
                    <span class="text-xs text-gray-600 leading-relaxed">${r}</span>
                </div>
                `).join('');

                app.innerHTML = `
                <main>
                    <!-- 活动 Banner -->
                    <div class="relative w-full overflow-hidden" style="background: linear-gradient(160deg, #FF8A00 0%, #FFB300 55%, #FFD54F 100%);">
                        <div class="absolute -left-6 top-8 text-6xl opacity-25 promo-float">🎁</div>
                        <div class="absolute -right-4 top-20 text-5xl opacity-25 promo-float" style="animation-delay: 1.2s;">🎉</div>
                        <div class="px-6 py-10 text-center relative">
                            <div class="text-[11px] tracking-[0.3em] text-white/85 font-bold mb-2">搭子计划 · 地推专场</div>
                            <h1 class="text-3xl font-black text-white drop-shadow-lg">见面有礼，好运双响</h1>
                            <p class="text-white/85 text-xs mt-2">注册 + 订阅，见面礼拿到手软！</p>
                        </div>

                        <!-- 底部波浪过渡 -->
                        <div class="relative h-8 -mb-px">
                            <svg viewBox="0 0 1440 60" class="absolute bottom-0 w-full h-full" preserveAspectRatio="none">
                                <path d="M0,28 C240,8 480,48 720,32 C960,16 1200,6 1440,26 L1440,60 L0,60 Z" fill="#fff4e0"/>
                            </svg>
                        </div>
                    </div>

                    <!-- 活动信息卡 -->
                    <div class="px-4 pt-1.5">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                            <h2 class="font-black text-lg text-gray-900">搭子计划 · 见面有礼</h2>
                            <p class="text-xs text-gray-500 mt-1 leading-relaxed">来现场玩「好运双响炮」，注册订阅两步走，见面礼人人有份，还有机会抽音乐节门票！</p>
                            <div class="flex flex-wrap gap-1.5 mt-3">
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-orange-50 text-orange-600">📍 运河广场 · 东区入口</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-amber-50 text-amber-600">🕐 9.18 - 9.20 全天</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-sky-50 text-sky-600">👥 现场参与</span>
                            </div>
                        </div>
                    </div>

                    <!-- 必做任务 -->
                    <div class="px-4 pt-3 space-y-3">
                        ${taskCard}
                        ${redeemCard}
                    </div>

                    <!-- 奖品查看 -->
                    <div class="px-4 pt-3">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                            <div class="flex items-center gap-2 mb-3">
                                <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(255,64,129,0.12);">
                                    <i data-lucide="trophy" class="w-4 h-4" style="color:#FF4081;"></i>
                                </div>
                                <h3 class="font-black text-gray-900 whitespace-nowrap">奖品查看</h3>
                                <span class="text-[10px] text-gray-400 ml-auto">点击查看详情</span>
                            </div>
                            <div class="grid grid-cols-1 gap-2.5">
                                ${prizeCards}
                            </div>
                        </div>
                    </div>

                    <!-- 活动规则 -->
                    <div class="px-4 pt-3 pb-24">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                            <div class="flex items-center gap-2 mb-3">
                                <div class="p-1.5 rounded-lg flex-shrink-0" style="background: rgba(66,165,245,0.12);">
                                    <i data-lucide="scroll-text" class="w-4 h-4" style="color:#42A5F5;"></i>
                                </div>
                                <h3 class="font-black text-gray-900 whitespace-nowrap">活动规则</h3>
                            </div>
                            <div class="space-y-2.5">
                                ${rulesHtml}
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="text-center text-[10px] text-gray-400 pb-8 pt-2">搭子计划 · 地推活动页（DEMO 演示，数据保存在本地浏览器）</footer>
                `;

                if (window.Common) window.Common.initIcons();
            },

            // ---------- 手机号授权 ----------
            openAuthModal() {
                if (this.authModalOpen || document.getElementById('promoAuthModal')) return;
                this.authModalOpen = true;
                var user = window.GlobalData && window.GlobalData.user ? window.GlobalData.user : {};
                this.authPhone = user.phone || '';

                var overlay = document.createElement('div');
                overlay.id = 'promoAuthModal';
                overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center p-6 fade-in';
                overlay.style.background = 'rgba(0,0,0,0.5)';
                overlay.innerHTML = `
                <div class="w-full max-w-sm bg-white rounded-3xl p-5 animate-promo-pop">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-lg font-black text-gray-900">手机号授权</h3>
                        <button onclick="GroundPromoView.closeAuthModal()" class="p-1 rounded-full active:bg-gray-100">
                            <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
                        </button>
                    </div>
                    <p class="text-xs text-gray-500 leading-relaxed mb-4">用于注册搭子计划并参与「好运双响炮」任务，我们不会向第三方泄露你的信息</p>

                    <label class="text-xs font-bold text-gray-500 mb-2 block">手机号</label>
                    <input id="promoAuthPhone" type="tel" maxlength="11" value="${escapeHtml(this.authPhone)}"
                           class="w-full border border-gray-200 rounded-xl px-4 py-3 text-base bg-gray-50 outline-none focus:border-brand-orange"
                           placeholder="请输入手机号"/>

                    <div class="flex gap-3 mt-5">
                        <button onclick="GroundPromoView.closeAuthModal()"
                                class="flex-1 py-3 rounded-xl text-sm font-bold border border-gray-200 text-gray-500 active:scale-95 transition-transform">
                            拒绝
                        </button>
                        <button onclick="GroundPromoView.confirmAuth()"
                                class="flex-1 py-3 rounded-xl text-white text-sm font-black active:scale-95 transition-transform"
                                style="background: linear-gradient(135deg, #FF6B00, #FFB300); box-shadow: 0 4px 15px rgba(255,107,0,0.4);">
                            允许授权
                        </button>
                    </div>
                </div>
                `;
                document.body.appendChild(overlay);
                window.Common.initIcons();

                var input = document.getElementById('promoAuthPhone');
                input.addEventListener('input', function () { GroundPromoView.authPhone = input.value; });
            },

            closeAuthModal() {
                this.authModalOpen = false;
                var modal = document.getElementById('promoAuthModal');
                if (modal) modal.remove();
            },

            confirmAuth() {
                var phone = (this.authPhone || '').trim();
                if (!/^1\d{10}$/.test(phone)) {
                    window.Common.showToast('请输入正确的手机号');
                    return;
                }
                // 注册完成，接着进入关注订阅
                saveState({ phoneAuthorized: true });
                this.closeAuthModal();
                this.render();
                this.openSubscribeSheet();
            },

            // ---------- 关注订阅（底部二维码，双击完成） ----------
            openSubscribeSheet() {
                if (document.getElementById('promoSubscribeSheet')) return;
                var overlay = document.createElement('div');
                overlay.id = 'promoSubscribeSheet';
                overlay.className = 'fixed inset-0 z-[200] flex items-end justify-center fade-in';
                overlay.style.background = 'rgba(0,0,0,0.5)';
                overlay.innerHTML = `
                <div class="bg-white w-full max-w-md rounded-t-3xl p-5 pb-8 animate-slide-up-promo">
                    <div class="flex items-center justify-between mb-1">
                        <h3 class="text-lg font-black text-gray-900">关注公众号</h3>
                        <button onclick="GroundPromoView.closeSubscribeSheet()" class="p-1 rounded-full active:bg-gray-100">
                            <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
                        </button>
                    </div>
                    <p class="text-xs text-gray-400 mb-4">第二步：关注公众号完成订阅</p>

                    <div class="flex flex-col items-center">
                        <div id="promoSubscribeQr" class="bg-white rounded-2xl p-3 border-2 border-gray-100 w-48 h-48 cursor-pointer select-none">
                            ${renderQrCodeSvg()}
                        </div>
                        <p class="text-sm font-bold text-gray-800 mt-3">长按识别关注公众号以完成订阅</p>
                        <p class="text-[10px] text-gray-400 mt-1">（演示模式：双击二维码模拟完成关注）</p>
                    </div>
                </div>
                `;
                document.body.appendChild(overlay);
                window.Common.initIcons();

                var qr = document.getElementById('promoSubscribeQr');
                qr.addEventListener('dblclick', function () {
                    GroundPromoView.completeSubscribe();
                });
            },

            closeSubscribeSheet() {
                var sheet = document.getElementById('promoSubscribeSheet');
                if (sheet) sheet.remove();
            },

            completeSubscribe() {
                saveState({ subscribed: true });
                this.closeSubscribeSheet();
                this.render();
                this.celebrate();
                window.Common.showToast('🎉 订阅成功，任务完成！');
            },

            // 庆祝动画（彩带雨）
            celebrate() {
                for (var i = 0; i < 60; i++) {
                    var p = document.createElement('div');
                    p.className = 'confetti-piece';
                    p.style.left = Math.random() * 100 + 'vw';
                    p.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
                    p.style.animationDelay = Math.random() * 0.8 + 's';
                    p.style.animationDuration = 2 + Math.random() * 1.5 + 's';
                    document.body.appendChild(p);
                    (function (el) { setTimeout(function () { el.remove(); }, 4500); })(p);
                }
            },

            // ---------- 核销领奖 ----------
            openRedeemModal() {
                if (!this.taskDone()) {
                    window.Common.showToast('先完成「好运双响炮」任务才能领奖哦');
                    return;
                }
                if (document.getElementById('promoRedeemModal')) return;

                this.redeemDoneView = false;
                this.redeemClickCount = 0;

                var overlay = document.createElement('div');
                overlay.id = 'promoRedeemModal';
                overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center p-6 fade-in';
                overlay.style.background = 'rgba(0,0,0,0.5)';
                overlay.innerHTML = '<div id="promoRedeemCard" class="w-full max-w-sm"></div>';
                document.body.appendChild(overlay);
                this.renderRedeemContent();

                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) GroundPromoView.closeRedeemModal();
                });
            },

            closeRedeemModal() {
                var modal = document.getElementById('promoRedeemModal');
                if (modal) modal.remove();
            },

            renderRedeemContent() {
                var card = document.getElementById('promoRedeemCard');
                if (!card) return;

                var body = '';
                if (this.redeemDoneView) {
                    body = `
                    <div class="flex flex-col items-center text-center py-2">
                        <div class="relative mb-5 mt-1">
                            <div class="w-40 h-48 rounded-2xl flex flex-col items-center justify-center"
                                 style="background: linear-gradient(160deg, #fffdf4, #fdf2cf); border: 2px solid rgba(255,208,0,0.8);">
                                <span class="text-4xl">🎁</span>
                                <span class="font-black text-base mt-2" style="color:#8a6a1a;">见面礼</span>
                                <span class="text-[9px] tracking-widest mt-1" style="color: rgba(169,123,10,0.55);">MEET GIFT 2026</span>
                            </div>
                            <div class="promo-stamp">
                                <span class="text-[10px]">已验证</span>
                                <span class="text-base">已领奖</span>
                            </div>
                        </div>
                        <div class="font-black text-base text-gray-900">🎉 领奖成功，好运开箱！</div>
                        <p class="text-xs text-gray-500 mt-2 leading-relaxed">见面礼已到手，和搭子们分享这份好运吧</p>
                        <button onclick="GroundPromoView.closeRedeemModal()"
                                class="mt-5 w-full py-3 rounded-xl font-black text-sm active:scale-95 transition-transform text-white"
                                style="background: linear-gradient(135deg, #FF6B00, #FFB300); box-shadow: 0 4px 15px rgba(255,107,0,0.4);">
                            好的，收下好运！
                        </button>
                    </div>
                    `;
                } else {
                    body = `
                    <div class="flex flex-col items-center text-center py-1">
                        <div class="font-black text-base text-gray-900">出示核销码领奖</div>
                        <p class="text-xs text-gray-500 mt-1.5 leading-relaxed">凭此二维码到工作人员处核销领奖</p>
                        <div class="mt-4 bg-white rounded-2xl p-3 border-2 border-gray-100">
                            <div class="w-44 h-44">${renderQrCodeSvg()}</div>
                        </div>
                        <div id="promoRedeemHint" onclick="GroundPromoView.countRedeemClick()"
                             class="mt-3 text-xs font-bold underline underline-offset-2 cursor-pointer select-none text-brand-orange">
                            请出示给工作人员进行领奖
                        </div>
                        <button onclick="GroundPromoView.closeRedeemModal()"
                                class="w-full mt-3 py-3 rounded-xl text-sm font-black active:scale-95 transition-transform flex items-center justify-center gap-1.5"
                                style="background: rgba(255,107,0,0.1); color:#FF6B00;">
                            <i data-lucide="chevron-left" class="w-4 h-4"></i>
                            返回
                        </button>
                    </div>
                    `;
                }

                card.innerHTML = `
                <div class="bg-white rounded-3xl p-5 animate-promo-pop">${body}</div>
                `;
                window.Common.initIcons();
            },

            // 领奖提示三连击 → 完成领奖
            countRedeemClick() {
                var now = Date.now();
                if (now - this.redeemLastClickTime > 1000) this.redeemClickCount = 0;
                this.redeemLastClickTime = now;
                this.redeemClickCount += 1;
                if (this.redeemClickCount >= 3) {
                    this.redeemClickCount = 0;
                    this.completeRedeem();
                }
            },

            completeRedeem() {
                saveState({ rewarded: true });
                this.redeemDoneView = true;
                this.renderRedeemContent();
                this.render(); // 页面领奖状态同步
                this.celebrate();
            },

            // ---------- 奖品详情 ----------
            openPrizeModal(id) {
                var prize = PRIZES.find(function (p) { return p.id === id; });
                if (!prize || document.getElementById('promoPrizeModal')) return;
                this.prizeModalId = id;

                var overlay = document.createElement('div');
                overlay.id = 'promoPrizeModal';
                overlay.className = 'fixed inset-0 z-[200] flex items-center justify-center p-6 fade-in';
                overlay.style.background = 'rgba(0,0,0,0.5)';
                overlay.innerHTML = `
                <div class="w-full max-w-sm bg-white rounded-3xl p-5 animate-promo-pop">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-lg font-black text-gray-900">奖品详情</h3>
                        <button onclick="GroundPromoView.closePrizeModal()" class="p-1 rounded-full active:bg-gray-100">
                            <i data-lucide="x" class="w-5 h-5 text-gray-400"></i>
                        </button>
                    </div>
                    <div class="flex flex-col items-center text-center py-2">
                        <div class="w-24 h-24 rounded-2xl flex items-center justify-center text-5xl"
                             style="background: linear-gradient(160deg, #fff4e0, #fdeec4);">
                            ${prize.icon}
                        </div>
                        <div class="font-black text-base text-gray-900 mt-3">${prize.name}</div>
                        <p class="text-xs text-gray-500 mt-2 leading-relaxed">${prize.desc}</p>
                        <p class="text-[10px] text-gray-400 mt-3">完成任务并现场核销后即可领取</p>
                        <button onclick="GroundPromoView.closePrizeModal()"
                                class="mt-5 w-full py-3 rounded-xl font-black text-sm active:scale-95 transition-transform text-white"
                                style="background: linear-gradient(135deg, #FF6B00, #FFB300); box-shadow: 0 4px 15px rgba(255,107,0,0.4);">
                            知道了
                        </button>
                    </div>
                </div>
                `;
                document.body.appendChild(overlay);
                window.Common.initIcons();

                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) GroundPromoView.closePrizeModal();
                });
            },

            closePrizeModal() {
                var modal = document.getElementById('promoPrizeModal');
                if (modal) modal.remove();
            }
        };

        window.GroundPromoView = GroundPromoView;

        document.addEventListener('DOMContentLoaded', function () {
            GroundPromoView.render();
        });
    </script>
</body>
</html>
