<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>搭子计划 - 首页</title>
    
    <!-- 引入资源 -->
    <link rel="stylesheet" href="tailwind.css">
    <!-- 核心修复：使用 jsdelivr 引用 UMD 版本 -->
    <script src="vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <!-- 强制隐藏滚动条样式 -->
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-brand-orange selection:text-white pb-20">

    <!-- 浮动装饰元素 -->
    <div class="floating-shapes">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <!-- 应用挂载点 -->
    <div id="app" class="min-h-screen"></div>

    <!-- 引入逻辑 -->
    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>

    <script>
        // Data Fallback: Ensure GlobalData exists even if data.js fails to load
        if (!window.GlobalData) {
            console.warn('data.js failed to load, using inline fallback data.');
            window.GlobalData = {
                user: {
                    id: 'u1',
                    name: 'ActiveExplorer',
                    avatarUrl: 'images/avatar-10.png',
                    following: 42,
                    followers: 108,
                    activities: 5
                },
                weekendCard: {
                    title: '这个周末，北京怎么过？',
                    subtitle: '测测你的周末人格，定制专属周末路线',
                    buttons: [
                        { id: 'b1', label: '开始周末人格测试', icon: 'sparkles', link: 'weekend-test.html', style: 'primary' },
                        { id: 'b2', label: '定制周末路线', icon: 'map', link: 'weekend-route.html', style: 'outline' }
                    ]
                },
                categories: [
                    { id: 'c1', label: '运动', icon: 'dumbbell', color: 'bg-orange-100 text-orange-600' },
                    { id: 'c2', label: '户外', icon: 'tent', color: 'bg-green-100 text-green-600' },
                    { id: 'c3', label: '饭搭子', icon: 'utensils', color: 'bg-yellow-100 text-yellow-600' },
                    { id: 'c7', label: '游戏', icon: 'gamepad-2', color: 'bg-indigo-100 text-indigo-600' },
                    { id: 'c4', label: '看展', icon: 'palette', color: 'bg-purple-100 text-purple-600' },
                    { id: 'c8', label: '旅行', icon: 'tv', color: 'bg-cyan-100 text-cyan-600' },
                    { id: 'c5', label: '娱乐', icon: 'mic', color: 'bg-pink-100 text-pink-600' },
                    { id: 'c9', label: '读书', icon: 'book-open', color: 'bg-emerald-100 text-emerald-600' },
                    { id: 'c10', label: '音乐', icon: 'music', color: 'bg-rose-100 text-rose-600' }
                ],
                partners: [
                    {
                        id: 'p1',
                        name: '滑雪大冒险',
                        avatarUrl: 'images/avatar-10.png',
                        tags: ['单板', '自驾', '摄影'],
                        intro: '崇礼周末往返，缺人拼车！',
                        distance: '1.2km'
                    },
                    {
                        id: 'p2',
                        name: 'CoffeeJane',
                        avatarUrl: 'images/avatar-8.png',
                        tags: ['探店', '手冲', '阅读'],
                        intro: '寻找三里屯附近的咖啡搭子。',
                        distance: '0.5km'
                    },
                    {
                        id: 'p3',
                        name: '健身狂魔',
                        avatarUrl: 'images/avatar-8.png',
                        tags: ['举铁', '增肌', '早起'],
                        intro: '每天早上6点健身房见。',
                        distance: '3.0km'
                    },
                    {
                        id: 'p4',
                        name: '剧本杀DM',
                        avatarUrl: 'images/avatar-2.png',
                        tags: ['推理', '演绎'],
                        intro: '缺1人，硬核本，速来！',
                        distance: '5.2km'
                    }
                ],
                activities: [
                    {
                        id: 'a1',
                        title: '朝阳公园飞盘新手局',
                        description: '欢迎萌新！有专业教练指导，并在活动后一起聚餐。不用担心接不到盘，主要是为了快乐流汗！',
                        category: 'SPORTS',
                        imageUrl: 'images/cover-20.png',
                        location: '朝阳公园南门草坪',
                        district: '朝阳区',
                        date: '本周六 14:00',
                        price: 39,
                        organizer: { id: 'u2', name: '飞盘小队长', avatarUrl: 'images/avatar-8.png', intro: '拥有3年飞盘经验的快乐修狗' },
                        status: 'RECRUITING',
                        currentParticipants: 12,
                        maxParticipants: 20,
                        tags: ['萌新友好', '含饮料', '社交']
                    },
                    {
                        id: 'a2',
                        title: '三里屯Bistro早午餐',
                        description: '打卡网红Bistro，聊聊最近的工作和生活，寻找志同道合的朋友。餐厅环境很好，适合拍照。',
                        category: 'DINING',
                        imageUrl: 'images/cover-6.png',
                        location: '三里屯太古里北区',
                        district: '朝阳区',
                        date: '本周日 11:00',
                        price: 0,
                        organizer: { id: 'u3', name: 'FoodieJane', avatarUrl: 'images/avatar-7.png', intro: '专注于寻找北京好吃的' },
                        status: 'RECRUITING',
                        currentParticipants: 3,
                        maxParticipants: 6,
                        tags: ['AA制', '拍照', '美食']
                    },
                    {
                        id: 'a3',
                        title: '奥森公园5km慢跑+拉伸',
                        description: '不仅是跑步，更是为了呼吸新鲜空气。配速600，不卷。跑完会在草地上带大家做15分钟拉伸。',
                        category: 'SPORTS',
                        imageUrl: 'images/cover-6.png',
                        location: '奥林匹克森林公园南门',
                        district: '朝阳区',
                        date: '今晚 19:30',
                        price: 0,
                        organizer: { id: 'u4', name: '夜跑达人', avatarUrl: 'images/avatar-8.png', intro: '自律即自由' },
                        status: 'FULL',
                        currentParticipants: 10,
                        maxParticipants: 10,
                        tags: ['免费', '健康', '夜跑']
                    },
                    {
                        id: 'a4',
                        title: '环球影城一日游搭子',
                        description: '主要想刷霸天虎过山车，有没有一起的？最好有优速通。我性格随和，会拍照。',
                        category: 'ENTERTAINMENT',
                        imageUrl: 'images/cover-11.png',
                        location: '北京环球度假区',
                        district: '通州区',
                        date: '下周五 全天',
                        price: 0,
                        organizer: { id: 'u5', name: '魔法师', avatarUrl: 'images/avatar-10.png', intro: '霍格沃茨在读研究生' },
                        status: 'RECRUITING',
                        currentParticipants: 1,
                        maxParticipants: 3,
                        tags: ['哈利波特', '过山车']
                    }
                ],
                moments: [
                    {
                        id: 'mo1',
                        userId: 'u1',
                        content: '今天天气真好，在亮马河边发呆，有没有一起喝咖啡的？☕️ #亮马河 #咖啡',
                        images: ['images/cover-8.png'],
                        likes: 45,
                        comments: 12,
                        time: '10分钟前',
                        location: '亮马河国际风情水岸'
                    },
                    {
                        id: 'mo2',
                        userId: 'p1',
                        content: '崇礼万龙开板啦！雪质无敌！这个周末还要来冲！🎿',
                        images: [
                            'images/cover-2.png',
                            'images/cover-4.png'
                        ],
                        likes: 128,
                        comments: 34,
                        time: '1小时前',
                        location: '万龙滑雪场'
                    }
                ]
            };
        }

        const View = {
            filterType: 'latest', // 'latest' or 'nearest'

            header() {
                return `
                <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm">
                  <div class="flex items-center gap-3">
                    <div class="flex items-center gap-0.5 cursor-pointer min-w-fit">
                      <span class="text-gray-900 font-bold text-base">北京</span>
                      <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-600"></i>
                    </div>
                    <div class="flex-1 relative">
                      <div class="flex items-center bg-gray-100 rounded-full px-3 py-2 cursor-pointer" onclick="handleSearch()">
                        <i data-lucide="search" class="w-4 h-4 text-gray-400 mr-2"></i>
                        <input id="search-input" type="text" placeholder="找搭子、找活动..." class="bg-transparent border-none outline-none text-sm w-full placeholder-gray-400 text-gray-800" onkeypress="if(event.key === 'Enter') handleSearch()"/>
                      </div>
                    </div>
                    <button class="relative p-1.5 rounded-full hover:bg-gray-100 transition-colors" onclick="window.location.href='message.html?tab=notification'">
                      <i data-lucide="bell" class="w-5 h-5 text-gray-800"></i>
                      <span class="absolute top-1 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                    </button>
                  </div>
                </header>
                `;
            },

            weekendCard() {
                const card = window.GlobalData?.weekendCard;
                if (!card) return '';

                // 按钮样式：primary 白底橙字主按钮，其余为半透明白描边按钮
                const buttonsHtml = (card.buttons || []).map(btn => {
                    const isPrimary = btn.style === 'primary';
                    const btnCls = isPrimary
                        ? 'bg-white text-brand-orange shadow-lg'
                        : 'bg-white/15 border border-white/60 text-white backdrop-blur-sm';
                    return `
                    <button onclick="window.location.href='${btn.link || '#'}'" class="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-xl font-bold text-sm active:scale-95 transition-transform ${btnCls}">
                      <i data-lucide="${btn.icon || 'sparkles'}" class="w-4 h-4"></i><span>${btn.label}</span>
                    </button>
                    `;
                }).join('');

                return `
                <div class="px-4 py-3">
                  <div class="relative rounded-2xl overflow-hidden bg-gradient-to-br from-brand-orange via-[#FF8A3D] to-brand-yellow p-5 shadow-lg shadow-brand-orange/20">
                    <div class="absolute -right-8 -top-8 w-32 h-32 bg-white/20 rounded-full blur-2xl"></div>
                    <div class="absolute -left-6 -bottom-10 w-28 h-28 bg-brand-yellow/40 rounded-full blur-2xl"></div>
                    <div class="relative z-10">
                      <p class="text-white/75 text-[11px] font-semibold tracking-wide mb-1.5">THIS WEEKEND · 周末企划</p>
                      <h2 class="text-white text-2xl font-black leading-snug">${card.title}</h2>
                      <p class="text-white/85 text-sm mt-1.5">${card.subtitle}</p>
                      <div class="flex gap-3 mt-4">${buttonsHtml}</div>
                    </div>
                  </div>
                </div>
                `;
            },

            categoryGrid() {
                const categories = window.GlobalData?.categories || [];
                if (categories.length === 0) return '';
                
                // 链接到 category.html；仅保留前 4 个分类，末位为"更多"（跳发现活动标签页）
                const displayCats = categories.slice(0, 4);
                const catsHtml = displayCats.map(cat => `
                    <div class="flex-shrink-0 flex flex-col items-center gap-1.5 cursor-pointer group" onclick="window.location.href='category.html?view=activity&cat=${cat.id}'">
                        <div class="w-11 h-11 ${cat.color} rounded-xl flex items-center justify-center shadow-sm group-active:scale-95 transition-transform">
                          <i data-lucide="${cat.icon}" class="w-5 h-5"></i>
                        </div>
                        <span class="text-[11px] text-gray-600 font-medium tracking-tight">${cat.label}</span>
                    </div>
                `).join('');

                const moreBtnHtml = `
                    <div class="flex-shrink-0 flex flex-col items-center gap-1.5 cursor-pointer group" onclick="window.location.href='category.html?view=activity'">
                        <div class="w-11 h-11 bg-gray-100 text-gray-500 rounded-xl flex items-center justify-center shadow-sm group-active:scale-95 transition-transform">
                          <i data-lucide="layout-grid" class="w-5 h-5"></i>
                        </div>
                        <span class="text-[11px] text-gray-600 font-medium tracking-tight">更多</span>
                    </div>
                `;
                return `<div class="px-4 py-2"><div class="grid grid-cols-5 justify-items-center items-start">${catsHtml}${moreBtnHtml}</div></div>`;
            },

            // 搭子需求卡片：完成定制周末路线操作的用户（头像/昵称/需求胶囊/认识TA/定制同款路线）
            demandRail() {
                const users = window.GlobalData?.demandUsers || [];
                const form = window.GlobalData?.weekendRouteForm;
                if (users.length === 0 || !form) return '';

                const usersHtml = users.map(u => {
                    const s = u.selections;
                    // 需求胶囊：情况/片区/时间/人数/预算（预算带"人均预算"标签与"元"单位）；
                    // "是否找搭子""是否接受陌生人组局"两个选项不显示
                    const filterCaps = form.filters.map(f => {
                        if (f.id === 'partner' || f.id === 'stranger') return null;
                        return f.id === 'budget' ? `人均预算 ${f.options[s[f.id]]}元` : f.options[s[f.id]];
                    }).filter(Boolean);
                    const caps = [
                        form.situations[s.situation].title,
                        form.areas[s.area].label.split(' / ')[0],
                        ...filterCaps
                    ].map(text => `<span class="px-2 py-0.5 bg-gray-50 text-gray-600 text-[9px] rounded-md border border-gray-100">${text}</span>`).join('');
                    const params = `s=${s.situation}&a=${s.area}&t=${s.time}&p=${s.people}&b=${s.budget}&pa=${s.partner}&st=${s.stranger}`;
                    return `
                    <div class="flex-shrink-0 w-52 bg-white rounded-xl p-3 shadow-sm border border-gray-100">
                        <div class="flex items-center gap-2 mb-2">
                            <img src="${u.avatarUrl}" class="w-10 h-10 rounded-full border border-gray-100 object-cover" />
                            <h3 class="font-bold text-gray-900 text-sm truncate">${u.name}</h3>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-3">${caps}</div>
                        <div class="flex gap-2">
                            <button onclick="window.location.href='profile.html?id=${u.id}'" class="flex-1 py-1.5 bg-white border border-brand-orange text-brand-orange text-[11px] font-bold rounded-full active:scale-95 transition-transform">认识TA</button>
                            <button onclick="window.location.href='weekend-route.html?${params}'" class="flex-1 py-1.5 bg-brand-orange text-white text-[11px] font-bold rounded-full active:scale-95 transition-transform">定制同款路线</button>
                        </div>
                    </div>
                    `;
                }).join('');
                return `
                <div class="pt-4 pb-2">
                  <div class="px-4 flex items-center justify-between mb-3">
                    <div class="flex items-center gap-1.5"><div class="p-1 bg-brand-yellow/20 rounded-md"><i data-lucide="users" class="w-4 h-4 text-brand-orange"></i></div><h2 class="text-lg font-black text-gray-900">搭子需求</h2></div>
                    <button onclick="window.location.href='category.html?view=partner'" class="text-xs text-gray-400 flex items-center">更多 <span class="ml-1">&gt;</span></button>
                  </div>
                  <div class="flex overflow-x-auto px-4 gap-3 no-scrollbar pb-2" style="scrollbar-width: none; -ms-overflow-style: none;">${usersHtml}</div>
                </div>
                `;
            },

            activityFeed() {
                let activities = window.GlobalData?.activities || [];
                if (activities.length === 0) return '<div class="p-4 text-center text-gray-400">暂无活动</div>';

                // 根据当前筛选类型排序
                if (this.filterType === 'latest') {
                    // 按ID降序排序，假设ID越大越新
                    activities = [...activities].sort((a, b) => {
                        const aNum = parseInt(a.id.replace('a', '')) || 0;
                        const bNum = parseInt(b.id.replace('a', '')) || 0;
                        return bNum - aNum;
                    });
                } else if (this.filterType === 'nearest') {
                    // 模拟按距离排序：为每个区域分配一个距离值
                    const districtDistance = {
                        '朝阳区': 1,
                        '通州区': 5,
                        '海淀区': 3,
                        '东城区': 2,
                        '西城区': 2,
                        '丰台区': 4
                    };
                    activities = [...activities].sort((a, b) => {
                        const aDist = districtDistance[a.district] || 10;
                        const bDist = districtDistance[b.district] || 10;
                        return aDist - bDist;
                    });
                }
                
                // 链接到 detail.html
                const listHtml = activities.map(activity => {
                    const isFull = activity.status === 'FULL';
                    const statusBadge = activity.status === 'RECRUITING' 
                        ? '<span class="bg-brand-orange text-white px-2 py-1 text-xs font-bold rounded-full backdrop-blur-md">招募中</span>' 
                        : '<span class="bg-gray-500 text-white px-2 py-1 text-xs font-bold rounded-full backdrop-blur-md">已满员</span>';
                    const btnClass = isFull 
                        ? 'bg-gray-100 text-gray-400 cursor-not-allowed'
                        : 'bg-gradient-to-r from-brand-orange to-brand-yellow text-white shadow-brand-orange/30 shadow-lg';
                    
                    return `
                    <div onclick="window.location.href='detail.html?id=${activity.id}'" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-shadow duration-300 mb-4 group cursor-pointer relative fade-in">
                      <div class="relative h-48 w-full overflow-hidden">
                        <img src="${activity.imageUrl}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
                        <div class="absolute top-3 right-3">${statusBadge}</div>
                        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-3 pt-10">
                           <div class="flex gap-2">${activity.tags.map(tag => `<span class="text-[10px] bg-white/20 backdrop-blur-sm text-white px-2 py-0.5 rounded-md border border-white/30">#${tag}</span>`).join('')}</div>
                        </div>
                      </div>
                      <div class="p-4">
                        <h3 class="text-lg font-bold text-gray-800 mb-2 line-clamp-1">${activity.title}</h3>
                        <div class="space-y-2 text-sm text-gray-500">
                          <div class="flex items-center gap-2"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-blue"></i><span>${activity.date}</span></div>
                          <div class="flex items-center gap-2"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-blue"></i><span class="line-clamp-1">${activity.district} · ${activity.location}</span></div>
                        </div>
                        <div class="mt-4 flex items-center justify-between">
                          <div class="flex items-center gap-2 z-10" onclick="event.stopPropagation(); window.location.href='profile.html?id=${activity.organizer.id}'">
                            <img src="${activity.organizer.avatarUrl}" class="w-6 h-6 rounded-full border border-gray-200" />
                            <span class="text-xs text-gray-500 truncate max-w-[80px]">${activity.organizer.name}</span>
                          </div>
                          <div class="flex items-center gap-3">
                             <div class="flex items-center text-xs text-gray-400"><i data-lucide="users" class="w-3.5 h-3.5 mr-1"></i><span>${activity.currentParticipants}/${activity.maxParticipants}</span></div>
                             <button class="flex items-center gap-1 px-4 py-1.5 rounded-full text-sm font-bold transition-colors ${btnClass}">${isFull ? '已满' : '去报名'}</button>
                          </div>
                        </div>
                      </div>
                    </div>
                    `;
                }).join('');

                return `
                <div class="px-4 pb-2 pt-4">
                  <div class="flex items-center justify-between mb-4 sticky top-[60px] z-30 bg-gray-50/95 backdrop-blur py-2">
                    <div class="flex items-center gap-1"><i data-lucide="sparkles" class="w-5 h-5 text-brand-orange fill-brand-orange"></i><h2 class="text-xl font-black text-gray-800 italic">热门活动</h2></div>
                    <div class="flex bg-white rounded-full p-1 shadow-sm border border-gray-100">
                       <button onclick="View.setFilterType('latest')" class="px-3 py-1 text-xs rounded-full font-medium transition-all ${this.filterType === 'latest' ? 'bg-gray-900 text-white' : 'text-gray-500 hover:bg-gray-100'}">最新</button>
                       <button onclick="View.setFilterType('nearest')" class="px-3 py-1 text-xs rounded-full font-medium transition-all ${this.filterType === 'nearest' ? 'bg-gray-900 text-white' : 'text-gray-500 hover:bg-gray-100'}">离我最近</button>
                    </div>
                  </div>
                  <div class="space-y-4">${listHtml}</div>
                  <div class="mt-6 text-center text-gray-400 text-xs pb-4">已经到底啦 ~</div>
                </div>
                `;
            },

            setFilterType(type) {
                this.filterType = type;
                this.render();
            },

            render() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    ${this.header()}
                    <main>
                        ${this.weekendCard()}
                        ${this.categoryGrid()}
                        ${this.demandRail()}
                        ${this.activityFeed()}
                    </main>
                    ${window.Common ? window.Common.renderBottomNav('home') : ''}
                `;
                if (window.Common) window.Common.initIcons();
            }
        };

        window.View = View;

        // 搜索处理函数
        function handleSearch() {
            const searchInput = document.getElementById('search-input');
            const query = searchInput?.value?.trim();
            if (query) {
                // 跳转到搜索页面，传递搜索关键词
                window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            } else {
                // 如果没有输入关键词，跳转到搜索页面但不带关键词
                window.location.href = 'search.html';
            }
        }

        document.addEventListener('DOMContentLoaded', () => View.render());
    </script>
</body>
</html>
