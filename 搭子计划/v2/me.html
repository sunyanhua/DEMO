<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>我的 - 搭子计划</title>
    <link rel="stylesheet" href="tailwind.css">
    <script src="vendor/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

    <div id="app"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script>
        const MePage = {
            activeTab: 'activities', // 'activities' 活动 | 'favorites' 收藏 | 'stroll' 溜搭
            showMore: false, // 更多下拉是否展开
            favoriteSub: 'moments', // 收藏二级 TAB：'moments' 动态 | 'routes' 路线
            strollSub: 'pending', // 溜搭二级 TAB：'pending' 未出行 | 'done' 已出行

            activityById(id) {
                return (window.GlobalData.activities || []).find(a => a.id === id) || null;
            },
            momentById(id) {
                return (window.GlobalData.moments || []).find(m => m.id === id) || null;
            },
            routeById(id) {
                return (window.GlobalData.weekendRoutes || []).find(r => r.id === id) || null;
            },
            // 溜搭计划状态：sessionStorage 优先，其次数据默认
            planStatus(routeId) {
                const saved = sessionStorage.getItem('me_plan_' + routeId);
                if (saved === 'done' || saved === 'pending') return saved;
                const item = (window.GlobalData.myPlanRoutes || []).find(p => p.routeId === routeId);
                return item ? item.status : 'none';
            },

            // 溜搭计划条目：静态数据 + 动态加入（sessionStorage 有记录但不在静态列表）
            planEntries() {
                const entries = (window.GlobalData.myPlanRoutes || [])
                    .map(p => ({ routeId: p.routeId, status: this.planStatus(p.routeId) }));
                for (let i = 0; i < sessionStorage.length; i++) {
                    const key = sessionStorage.key(i);
                    if (key && key.startsWith('me_plan_')) {
                        const routeId = key.slice('me_plan_'.length);
                        if (!entries.some(e => e.routeId === routeId)) {
                            entries.push({ routeId, status: this.planStatus(routeId) });
                        }
                    }
                }
                return entries;
            },

            headerBg() {
                return `
                <div class="relative h-44 overflow-hidden" style="background-image: linear-gradient(135deg, #FF6B00 0%, #FFD000 60%, #FF6B00 100%)">
                </div>
                `;
            },

            profileCard() {
                const user = window.GlobalData.user;
                return `
                <div class="px-4 -mt-16 relative z-10">
                    <div class="bg-white rounded-2xl p-4 shadow-sm">
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-3">
                                <img src="${user.avatarUrl}" class="w-16 h-16 rounded-full border-4 border-white shadow-md -mt-10" />
                                <div class="pt-1">
                                    <h1 class="text-xl font-black text-gray-900 flex items-center gap-1">${user.name} <i data-lucide="edit-3" class="w-3.5 h-3.5 text-gray-400 cursor-pointer" onclick="window.location.href='edit-profile.html'"></i></h1>
                                    <p class="text-xs text-gray-400 mt-0.5 flex items-center gap-1">ID: ${user.id} <i data-lucide="home" class="w-3 h-3 ml-1 cursor-pointer" onclick="window.location.href='profile.html?id=${user.id}'" title="我的主页"></i></p>
                                </div>
                            </div>
                            <div class="px-3 py-1 bg-gray-100 rounded-full text-xs font-bold text-gray-600 flex items-center gap-1">
                                <i data-lucide="medal" class="w-3 h-3 text-brand-orange"></i> LV.3
                            </div>
                        </div>

                        <!-- 简介 -->
                        <p class="text-sm text-gray-600 mb-4 px-1">${user.intro || '这个人很懒，什么都没写'}</p>

                        <!-- 数据统计 -->
                        <div class="flex justify-around py-2 border-t border-gray-50">
                            <div class="flex flex-col items-center cursor-pointer" onclick="window.location.href='profile.html?id=${user.id}&tab=activities'">
                                <span class="font-black text-lg text-gray-900">${user.activities}</span>
                                <span class="text-xs text-gray-400">活动</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer" onclick="window.location.href='user-list.html?tab=following'">
                                <span class="font-black text-lg text-gray-900">${user.following}</span>
                                <span class="text-xs text-gray-400">关注</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer" onclick="window.location.href='user-list.html?tab=followers'">
                                <span class="font-black text-lg text-gray-900">${user.followers}</span>
                                <span class="text-xs text-gray-400">粉丝</span>
                            </div>
                            <div class="flex flex-col items-center cursor-pointer" onclick="window.location.href='message.html?tab=notification'">
                                <span class="font-black text-lg text-gray-900">${user.likes}</span>
                                <span class="text-xs text-gray-400">获赞</span>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            },

            // 周末人格 + 钱包余额卡（原积分区改为周末人格展示）
            personalityWalletCard() {
                const user = window.GlobalData.user;
                const p = (window.GlobalData.weekendPersonalities || []).find(x => x.id === user.weekendPersonality)
                    || (window.GlobalData.weekendPersonalities || [])[0]
                    || { emoji: '🧩', title: '未测试', id: '' };
                return `
                <div class="px-4 mt-4">
                    <div class="bg-gradient-to-r from-brand-orange to-brand-yellow rounded-2xl p-4 shadow-lg">
                        <div class="flex items-center">
                            <!-- 周末人格 -->
                            <div class="flex-1 text-center cursor-pointer" onclick="window.location.href='weekend-test.html?view=result'">
                                <div class="flex flex-col items-center">
                                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center mb-2 text-xl">${p.emoji}</div>
                                    <div class="text-base font-black text-white">${p.title}</div>
                                    <div class="text-xs text-white/80">我的周末人格</div>
                                    <div class="text-[10px] text-white/60 mt-1">查看我的测试结果</div>
                                </div>
                            </div>

                            <!-- 分隔线 -->
                            <div class="w-px h-16 bg-white/30"></div>

                            <!-- 钱包 -->
                            <div class="flex-1 text-center cursor-pointer" onclick="window.location.href='wallet.html'">
                                <div class="flex flex-col items-center">
                                    <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center mb-2">
                                        <i data-lucide="wallet" class="w-6 h-6 text-white"></i>
                                    </div>
                                    <div class="text-2xl font-black text-white">¥${user.wallet.toFixed(2)}</div>
                                    <div class="text-sm text-white/90">钱包余额</div>
                                    <div class="text-xs text-white/70 mt-1">可提现</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            },

            // TAB 栏：活动 / 收藏 / 溜搭 / 更多（下拉）
            tabBar() {
                const tabs = [
                    { id: 'activities', label: '活动' },
                    { id: 'favorites', label: '收藏' },
                    { id: 'stroll', label: '溜搭' }
                ];
                const tabsHtml = tabs.map(t => `
                    <button onclick="MePage.setTab('${t.id}')" class="flex-1 py-3 text-sm font-bold transition-colors ${this.activeTab === t.id ? 'text-brand-orange border-b-2 border-brand-orange' : 'text-gray-400 border-b-2 border-transparent'}">${t.label}</button>
                `).join('');
                return `
                <div class="px-4 mt-4">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 relative">
                        <div class="flex items-center px-2">
                            ${tabsHtml}
                            <button onclick="MePage.toggleMore()" class="flex-1 py-3 text-sm font-bold transition-colors flex items-center justify-center gap-1 ${this.showMore ? 'text-brand-orange' : 'text-gray-400'}">
                                <span>更多</span>
                                <i data-lucide="chevron-down" class="w-3.5 h-3.5 ${this.showMore ? 'rotate-180' : ''} transition-transform"></i>
                            </button>
                        </div>
                        ${this.showMore ? this.moreDropdown() : ''}
                    </div>
                </div>
                `;
            },

            moreDropdown() {
                const items = [
                    { icon: 'user', label: '我的资料', href: 'edit-profile.html' },
                    { icon: 'shield', label: '我的认证', href: 'verification.html' },
                    { icon: 'users', label: '我的搭子', href: 'user-list.html' },
                    { icon: 'history', label: '浏览历史', href: 'history.html' },
                    { icon: 'shopping-bag', label: '我的订单', href: 'orders.html' },
                    { icon: 'help-circle', label: '帮助与反馈', toast: '帮助与反馈功能开发中' }
                ];
                const itemsHtml = items.map(item => `
                    <div class="flex items-center justify-between p-3.5 border-b border-gray-50 cursor-pointer active:bg-gray-50" onclick="${item.href ? `window.location.href='${item.href}'` : `window.Common.showToast('${item.toast}')`}">
                        <div class="flex items-center gap-3">
                            <i data-lucide="${item.icon}" class="w-5 h-5 text-gray-600"></i>
                            <span class="text-sm text-gray-800 font-medium">${item.label}</span>
                        </div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>
                    </div>
                `).join('');
                return `
                <div class="absolute top-full left-0 right-0 mt-2 bg-white rounded-xl shadow-lg border border-gray-100 z-20 overflow-hidden">
                    ${itemsHtml}
                    <div class="p-3.5 text-center text-sm text-red-500 font-bold cursor-pointer active:bg-gray-50" onclick="window.Common.showToast('已退出登录（演示）')">退出登录</div>
                </div>
                `;
            },

            // ---------- TAB 内容 ----------

            activitiesTab() {
                const items = (window.GlobalData.myActivities || [])
                    .map(id => this.activityById(id))
                    .filter(Boolean);
                const cardsHtml = items.map(a => `
                    <div onclick="window.location.href='detail.html?id=${a.id}'" class="flex gap-3 bg-white rounded-xl border border-gray-100 p-3 cursor-pointer active:scale-[0.99] transition-transform">
                        <img src="${a.imageUrl}" class="w-20 h-20 rounded-lg object-cover flex-shrink-0" />
                        <div class="flex-1 flex flex-col justify-between py-0.5 min-w-0">
                            <div class="flex items-start justify-between gap-2">
                                <h3 class="text-sm font-bold text-gray-900 line-clamp-1">${a.title}</h3>
                                <span class="px-2 py-0.5 bg-brand-orange/10 text-brand-orange text-[10px] font-bold rounded-full flex-shrink-0">已报名</span>
                            </div>
                            <div class="text-[11px] text-gray-400 mt-1 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i>${a.date}</div>
                            <div class="text-[11px] text-gray-400 mt-0.5 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i>${a.district} · ${a.location}</div>
                            <div class="flex items-center justify-between mt-1">
                                <span class="text-[10px] text-gray-400">${a.currentParticipants}/${a.maxParticipants}人</span>
                                <span class="text-brand-orange font-bold text-sm">${a.price === 0 ? '免费' : '¥' + a.price}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
                return `
                <div class="px-4 mt-3 pb-8">
                    <p class="text-sm font-black text-gray-900 mb-2.5">我报名的活动</p>
                    ${items.length > 0 ? `<div class="space-y-2.5">${cardsHtml}</div>` : '<div class="bg-white rounded-xl border border-gray-100 p-6 text-center text-xs text-gray-400">还没有报名的活动</div>'}
                </div>
                `;
            },

            subTabBar(items) {
                const buttonsHtml = items.map(item => `
                    <button onclick="MePage.${item.action}" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-colors ${item.active ? 'bg-brand-orange text-white' : 'text-gray-400'}">${item.label}</button>
                `).join('');
                return `
                <div class="flex bg-white rounded-xl border border-gray-100 p-1 mb-3">${buttonsHtml}</div>
                `;
            },

            favoritesTab() {
                const subBar = this.subTabBar([
                    { label: '动态', action: "setFavoriteSub('moments')", active: this.favoriteSub === 'moments' },
                    { label: '路线', action: "setFavoriteSub('routes')", active: this.favoriteSub === 'routes' }
                ]);
                let content = '';
                if (this.favoriteSub === 'routes') {
                    const routes = (window.GlobalData.myFavoriteRoutes || [])
                        .map(id => this.routeById(id))
                        .filter(Boolean);
                    const routeCards = routes.map(r => `
                        <div onclick="window.location.href='weekend-route.html?view=detail&route=${r.id}'" class="bg-white rounded-xl border border-gray-100 p-3.5 cursor-pointer">
                            <div class="flex items-center justify-between gap-2">
                                <h3 class="text-sm font-bold text-gray-900 line-clamp-1">${r.name}</h3>
                                <span class="text-xs font-black text-brand-orange flex-shrink-0">${r.budgetTotal}</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5 mt-2">
                                ${r.tags.map(tag => `<span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-[10px] rounded-md border border-gray-100">${tag}</span>`).join('')}
                            </div>
                            <p class="mt-1.5 text-[11px] text-gray-400">${r.schedule.length} 站行程 · ${r.schedule[0].time} ${r.schedule[0].item} 起</p>
                        </div>
                    `).join('');
                    content = routeCards.length > 0 ? `<div class="space-y-2.5">${routeCards}</div>` : '<div class="bg-white rounded-xl border border-gray-100 p-6 text-center text-xs text-gray-400">还没有收藏路线</div>';
                } else {
                    const moments = (window.GlobalData.myFavoriteMoments || [])
                        .map(id => this.momentById(id))
                        .filter(Boolean);
                    const momentCards = moments.map(m => `
                        <div onclick="window.location.href='moment.html?id=${m.id}'" class="bg-white rounded-xl border border-gray-100 p-3 cursor-pointer">
                            <p class="text-xs text-gray-700 line-clamp-2 leading-relaxed">${m.content}</p>
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-[10px] text-gray-400">${m.time} · ${m.location}</span>
                                <span class="text-[10px] text-gray-400"><i data-lucide="heart" class="w-3 h-3 inline-block mr-0.5 text-brand-pink"></i>${m.likes} · <i data-lucide="message-circle" class="w-3 h-3 inline-block mr-0.5"></i>${m.comments}</span>
                            </div>
                        </div>
                    `).join('');
                    content = momentCards.length > 0 ? `<div class="space-y-2.5">${momentCards}</div>` : '<div class="bg-white rounded-xl border border-gray-100 p-6 text-center text-xs text-gray-400">还没有收藏动态</div>';
                }
                return `
                <div class="px-4 mt-3 pb-8">
                    ${subBar}
                    ${content}
                </div>
                `;
            },

            strollTab() {
                const routeCard = (r, status) => `
                    <div onclick="window.location.href='weekend-route.html?view=detail&route=${r.id}'" class="bg-white rounded-xl border border-gray-100 p-3.5 cursor-pointer active:scale-[0.99] transition-transform">
                        <div class="flex items-center justify-between gap-2">
                            <h3 class="text-sm font-bold text-gray-900 line-clamp-1">${r.name}</h3>
                            ${status === 'done'
                                ? '<span class="px-2 py-0.5 bg-gray-100 text-gray-400 text-[10px] font-bold rounded-full flex-shrink-0">已出行</span>'
                                : '<button onclick="event.stopPropagation(); MePage.markPlanDone(\'' + r.id + '\')" class="px-3 py-1.5 bg-brand-orange text-white text-[11px] font-bold rounded-full flex-shrink-0 active:scale-95 transition-transform">标记已出行</button>'}
                        </div>
                        <p class="mt-1.5 text-[11px] text-gray-400">${r.schedule.length} 站行程 · ${r.schedule[0].time} ${r.schedule[0].item} 起 · ${r.budgetTotal}</p>
                    </div>
                `;
                const subBar = this.subTabBar([
                    { label: '未出行', action: "setStrollSub('pending')", active: this.strollSub === 'pending' },
                    { label: '已出行', action: "setStrollSub('done')", active: this.strollSub === 'done' }
                ]);
                const status = this.strollSub === 'done' ? 'done' : 'pending';
                const cardsHtml = this.planEntries().filter(p => p.status === status)
                    .map(p => this.routeById(p.routeId)).filter(Boolean)
                    .map(r => routeCard(r, status)).join('');
                const emptyText = status === 'done' ? '还没有已出行的路线' : '没有待出行的路线';
                return `
                <div class="px-4 mt-3 pb-8">
                    ${subBar}
                    ${cardsHtml ? `<div class="space-y-2.5">${cardsHtml}</div>` : `<div class="bg-white rounded-xl border border-gray-100 p-6 text-center text-xs text-gray-400">${emptyText}</div>`}
                </div>
                `;
            },

            tabContent() {
                if (this.activeTab === 'favorites') return this.favoritesTab();
                if (this.activeTab === 'stroll') return this.strollTab();
                return this.activitiesTab();
            },

            setTab(tabId) {
                this.activeTab = tabId;
                this.showMore = false;
                this.render();
            },

            setFavoriteSub(sub) {
                this.favoriteSub = sub;
                this.render();
            },

            setStrollSub(sub) {
                this.strollSub = sub;
                this.render();
            },

            toggleMore() {
                this.showMore = !this.showMore;
                this.render();
            },

            markPlanDone(routeId) {
                sessionStorage.setItem('me_plan_' + routeId, 'done');
                if (window.Common) window.Common.showToast('已标记为已出行');
                this.render();
            },

            render() {
                document.getElementById('app').innerHTML = `
                    ${this.headerBg()}
                    ${this.profileCard()}
                    ${this.personalityWalletCard()}
                    ${this.tabBar()}
                    ${this.tabContent()}
                    ${window.Common ? window.Common.renderBottomNav('me') : ''}
                `;
                if (window.Common) window.Common.initIcons();
            }
        };

        window.MePage = MePage;
        document.addEventListener('DOMContentLoaded', () => MePage.render());
    </script>
</body>
</html>
