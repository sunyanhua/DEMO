<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>推荐搭子 - 搭子计划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">
    <div id="app"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script>
        function render() {
            // 获取推荐用户数据
            const partners = window.GlobalData?.partners || [];

            // 为了页面更丰富，可以添加更多模拟用户
            const allRecommendedUsers = [
                ...partners,
                // 添加更多模拟用户
                {
                    id: 'p5',
                    name: '摄影爱好者',
                    avatarUrl: 'https://picsum.photos/100/100?random=30',
                    tags: ['街拍', '人像', '夜景'],
                    intro: '周末一起扫街拍照，交流摄影技巧。',
                    distance: '0.8km',
                    realNameVerified: true,
                    cooperationVerified: false,
                    role: 'user',
                    verified: false
                },
                {
                    id: 'p6',
                    name: '桌游达人',
                    avatarUrl: 'https://picsum.photos/100/100?random=31',
                    tags: ['狼人杀', '剧本杀', '德式'],
                    intro: '每周组织桌游局，新手友好！',
                    distance: '2.3km',
                    realNameVerified: true,
                    cooperationVerified: true,
                    role: 'host',
                    verified: true
                },
                {
                    id: 'p7',
                    name: '瑜伽修行者',
                    avatarUrl: 'https://picsum.photos/100/100?random=32',
                    tags: ['瑜伽', '冥想', '正念'],
                    intro: '清晨瑜伽练习，寻找同频伙伴。',
                    distance: '1.5km',
                    realNameVerified: false,
                    cooperationVerified: false,
                    role: 'user',
                    verified: false
                },
                {
                    id: 'p8',
                    name: '美食地图',
                    avatarUrl: 'https://picsum.photos/100/100?random=33',
                    tags: ['探店', '火锅', '甜品'],
                    intro: '吃遍北京所有网红店，一起打卡！',
                    distance: '3.2km',
                    realNameVerified: true,
                    cooperationVerified: true,
                    role: 'merchant',
                    verified: true
                }
            ];

            document.getElementById('app').innerHTML = `
                <!-- 顶部导航 -->
                <div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm flex items-center justify-between">
                    <button onclick="window.history.back()" class="p-1.5 rounded-full hover:bg-gray-100 transition">
                        <i data-lucide="chevron-left" class="w-6 h-6 text-gray-800"></i>
                    </button>
                    <h1 class="text-lg font-bold text-gray-900">推荐搭子</h1>
                    <button class="p-1.5 rounded-full hover:bg-gray-100 transition" onclick="window.Common.showToast('筛选功能开发中')">
                        <i data-lucide="filter" class="w-5 h-5 text-gray-800"></i>
                    </button>
                </div>

                <!-- 筛选标签 -->
                <div class="px-4 pt-4">
                    <div class="flex overflow-x-auto gap-2 pb-3 no-scrollbar">
                        <button class="px-3 py-1.5 bg-brand-orange text-white text-xs font-medium rounded-full whitespace-nowrap flex-shrink-0">全部</button>
                        <button class="px-3 py-1.5 bg-gray-100 text-gray-600 text-xs font-medium rounded-full whitespace-nowrap flex-shrink-0">附近</button>
                        <button class="px-3 py-1.5 bg-gray-100 text-gray-600 text-xs font-medium rounded-full whitespace-nowrap flex-shrink-0">同兴趣</button>
                        <button class="px-3 py-1.5 bg-gray-100 text-gray-600 text-xs font-medium rounded-full whitespace-nowrap flex-shrink-0">活跃用户</button>
                        <button class="px-3 py-1.5 bg-gray-100 text-gray-600 text-xs font-medium rounded-full whitespace-nowrap flex-shrink-0">新人</button>
                        <button class="px-3 py-1.5 bg-gray-100 text-gray-600 text-xs font-medium rounded-full whitespace-nowrap flex-shrink-0">运动</button>
                        <button class="px-3 py-1.5 bg-gray-100 text-gray-600 text-xs font-medium rounded-full whitespace-nowrap flex-shrink-0">美食</button>
                    </div>
                </div>

                <!-- 用户列表 -->
                <div class="px-4 pb-6">
                    <div class="space-y-3">
                        ${allRecommendedUsers.map(user => {
                            const isOnline = Math.random() > 0.5;
                            return `
                            <div onclick="window.location.href='profile.html?id=${user.id}'" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 active:bg-gray-50 cursor-pointer group">
                                <div class="flex gap-3">
                                    <!-- 头像 -->
                                    <div class="relative flex-shrink-0">
                                        <img src="${user.avatarUrl}" class="w-14 h-14 rounded-full border-2 border-white shadow-md object-cover bg-gray-100">
                                        <div class="absolute -bottom-1 -right-1 bg-brand-blue text-[8px] text-white px-1.5 py-0.5 rounded-full border border-white">${user.distance}</div>
                                    </div>

                                    <!-- 用户信息 -->
                                    <div class="flex-1 min-w-0">
                                        <div class="flex justify-between items-start mb-1">
                                            <div>
                                                <h3 class="font-bold text-gray-900 text-sm truncate flex items-center gap-1">
                                                    ${user.name}
                                                    ${user.realNameVerified ? '<i data-lucide="shield-check" class="w-3 h-3 text-orange-500 flex-shrink-0" title="实名认证"></i>' : ''}
                                                    ${user.cooperationVerified ? '<i data-lucide="badge-check" class="w-3 h-3 text-blue-500 flex-shrink-0" title="合作认证"></i>' : ''}
                                                </h3>
                                                <div class="flex gap-1 mt-1 flex-wrap">
                                                    ${user.tags.map(tag => `<span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-xs rounded-md border border-gray-100">${tag}</span>`).join('')}
                                                </div>
                                            </div>
                                            <button onclick="event.stopPropagation(); window.location.href='chat.html?uid=${user.id}&name=${encodeURIComponent(user.name)}'" class="px-3 py-1 bg-gradient-to-r from-gray-900 to-gray-700 text-white text-[10px] font-bold rounded-full shadow-gray-200 shadow-sm active:scale-95 transition-transform flex items-center gap-1">
                                                <i data-lucide="message-circle" class="w-2.5 h-2.5"></i>搭讪
                                            </button>
                                        </div>

                                        <!-- 简介 -->
                                        <p class="text-xs text-gray-500 mt-2 line-clamp-2 bg-gray-50/50 rounded p-2">"${user.intro}"</p>

                                        <!-- 互动信息 -->
                                        <div class="flex items-center justify-between mt-3 text-xs text-gray-400">
                                            <div class="flex items-center gap-3">
                                                <span class="flex items-center gap-1">
                                                    <i data-lucide="calendar" class="w-3 h-3"></i>
                                                    <span>最近活跃: 今天</span>
                                                </span>
                                                <span class="flex items-center gap-1">
                                                    <i data-lucide="users" class="w-3 h-3"></i>
                                                    <span>共同兴趣: 2个</span>
                                                </span>
                                            </div>
                                            <span class="flex items-center gap-1 ${isOnline ? 'text-green-500' : 'text-gray-400'}">
                                                <i data-lucide="circle" class="w-2.5 h-2.5 ${isOnline ? 'fill-green-500' : 'fill-gray-400'}"></i>
                                                <span>${isOnline ? '在线' : '离线'}</span>
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                        }).join('')}
                    </div>

                    <!-- 加载更多提示 -->
                    <div class="mt-6 text-center">
                        <div class="text-gray-400 text-sm mb-2">已显示全部推荐搭子</div>
                        <button onclick="window.Common.showToast('已加载全部用户')" class="px-4 py-2 bg-gray-100 text-gray-600 text-sm font-medium rounded-full">
                            没有更多了
                        </button>
                    </div>
                </div>
            `;
            window.Common.initIcons();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
