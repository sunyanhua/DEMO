<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>我的钱包 - 搭子计划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 pb-20">
    <div id="app"></div>

    <script src="data.js?v=2"></script>
    <script src="common.js?v=2"></script>
    <script>
        function render() {
            const user = window.GlobalData.user;
            const walletRecords = window.GlobalData.walletRecords || [];

            document.getElementById('app').innerHTML = `
                <!-- 顶部导航 -->
                <div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm flex items-center justify-between">
                    <button onclick="window.history.back()" class="p-1.5 rounded-full hover:bg-gray-100 transition">
                        <i data-lucide="chevron-left" class="w-6 h-6 text-gray-800"></i>
                    </button>
                    <h1 class="text-lg font-bold text-gray-900">我的钱包</h1>
                    <div class="w-10"></div> <!-- 占位保持对称 -->
                </div>

                <div class="px-4 pt-4">
                    <!-- 余额概览 -->
                    <div class="bg-gradient-to-r from-blue-500 to-blue-600 rounded-2xl p-5 text-white mb-6 shadow-lg">
                        <div class="text-center">
                            <div class="text-sm opacity-90">钱包余额</div>
                            <div class="text-4xl font-black mt-2 mb-6">¥${user.wallet.toFixed(2)}</div>
                            <button onclick="withdraw()" class="w-full py-3 bg-white text-blue-600 font-bold rounded-xl shadow-lg active:scale-95 transition-transform">
                                提现
                            </button>
                        </div>
                    </div>

                    <!-- 钱包说明 -->
                    <div class="bg-white rounded-2xl p-4 shadow-sm mb-6">
                        <h3 class="font-bold text-gray-900 mb-3 flex items-center gap-2">
                            <i data-lucide="info" class="w-4 h-4 text-blue-500"></i>
                            钱包说明
                        </h3>
                        <div class="space-y-2 text-sm text-gray-600">
                            <div class="flex items-start gap-2">
                                <i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i>
                                <div>余额来源：您发布的收费活动报名费用</div>
                            </div>
                            <div class="flex items-start gap-2">
                                <i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i>
                                <div>提现时间：申请后1-3个工作日到账</div>
                            </div>
                            <div class="flex items-start gap-2">
                                <i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i>
                                <div>提现限额：单笔最低10元，最高5000元</div>
                            </div>
                        </div>
                    </div>

                    <!-- 交易记录 -->
                    <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-gray-50">
                            <h3 class="font-bold text-gray-900">交易记录</h3>
                        </div>

                        ${walletRecords.length > 0 ? walletRecords.map(record => `
                            <div class="flex items-center justify-between p-4 border-b border-gray-50 last:border-none">
                                <div class="flex-1">
                                    <div class="font-medium text-gray-900">${record.description}</div>
                                    <div class="text-xs text-gray-400 mt-0.5">${record.time}</div>
                                </div>
                                <div class="flex items-center gap-1">
                                    <span class="font-bold ${record.amount > 0 ? 'text-green-500' : 'text-red-500'}">
                                        ${record.amount > 0 ? '+' : ''}¥${Math.abs(record.amount).toFixed(2)}
                                    </span>
                                    <i data-lucide="${record.amount > 0 ? 'arrow-down-circle' : 'arrow-up-circle'}" class="w-4 h-4 ${record.amount > 0 ? 'text-green-500' : 'text-red-500'}"></i>
                                </div>
                            </div>
                        `).join('') : `
                            <div class="p-8 text-center text-gray-400">
                                <i data-lucide="wallet" class="w-12 h-12 mx-auto mb-3 opacity-30"></i>
                                <div class="text-sm">暂无交易记录</div>
                            </div>
                        `}
                    </div>
                </div>

                ${window.Common.renderBottomNav('me')}
            `;
            window.Common.initIcons();
        }

        function withdraw() {
            const user = window.GlobalData.user;
            if (user.wallet < 10) {
                window.Common.showToast('余额不足10元，无法提现');
                return;
            }

            // 模拟提现流程
            const amount = Math.min(user.wallet, 5000);
            window.Common.showToast(`提现申请已提交：¥${amount.toFixed(2)}`);

            // 实际项目中应调用API，这里模拟更新数据
            setTimeout(() => {
                // 添加提现记录
                const newRecord = {
                    id: 'wr' + Date.now(),
                    type: 'withdraw',
                    description: '提现',
                    amount: -amount,
                    time: '刚刚',
                    status: 'processing'
                };
                window.GlobalData.walletRecords.unshift(newRecord);

                // 更新余额
                window.GlobalData.user.wallet -= amount;

                // 重新渲染
                render();
                window.Common.showToast('提现成功！预计1-3个工作日到账');
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
