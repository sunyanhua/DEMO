<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>互动社区 - 拾光聚会</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-brand-orange selection:text-white pb-20">
    <!-- 浮动装饰元素 -->
    <div class="floating-shapes">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <div id="app" class="min-h-screen"></div>

    <script src="data.js?v=4"></script>
    <script src="common.js?v=2"></script>

    <script>
        const CommunityView = {
            header() {
                return `
                <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm border-b border-gray-200 header-glow">
                  <div class="flex items-center gap-3">
                    <button onclick="window.location.href='index.html'" class="p-1.5 rounded-full hover:bg-gray-100 transition-colors">
                      <i data-lucide="arrow-left" class="w-5 h-5 text-color-orange"></i>
                    </button>
                    <div class="flex-1">
                      <h1 class="text-2xl font-bold text-gradient-orange">互动社区</h1>
                    </div>
                    <button class="relative p-1.5 rounded-full hover:bg-gray-100 transition-colors">
                      <i data-lucide="bell" class="w-5 h-5 text-color-orange"></i>
                    </button>
                  </div>
                </header>
                `;
            },

            postForm() {
                return `
                <div class="px-4 py-3">
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                        <div class="flex items-start gap-3 mb-3">
                            <img src="${window.GlobalData.user.avatarUrl}" class="w-10 h-10 rounded-full border border-gray-200" onerror="this.src='https://picsum.photos/100/100'" />
                            <div class="flex-1">
                                <textarea placeholder="分享你的汽车生活、购车经验、交通见闻..." class="w-full border-none outline-none resize-none text-sm text-gray-800 placeholder-gray-400" rows="2"></textarea>
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <button class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                                    <i data-lucide="image" class="w-5 h-5 text-gray-400"></i>
                                </button>
                                <button class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                                    <i data-lucide="tag" class="w-5 h-5 text-gray-400"></i>
                                </button>
                                <button class="p-2 rounded-full hover:bg-gray-100 transition-colors">
                                    <i data-lucide="map-pin" class="w-5 h-5 text-gray-400"></i>
                                </button>
                            </div>
                            <button class="px-4 py-2 bg-gradient-to-r from-brand-orange to-brand-yellow text-white font-bold rounded-full">
                                发布
                            </button>
                        </div>
                    </div>
                </div>
                `;
            },

            momentList() {
                const moments = window.GlobalData?.moments || [];
                if (moments.length === 0) return '<div class="p-4 text-center text-gray-400">暂无动态</div>';

                const listHtml = moments.map(moment => {
                    const user = window.GlobalData.users.find(u => u.id === moment.userId) || { name: '未知用户', avatarUrl: '' };
                    return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">
                        <div class="flex items-start gap-3 mb-3">
                            <img src="${user.avatarUrl}" class="w-10 h-10 rounded-full border border-gray-200" onerror="this.src='https://picsum.photos/100/100'" />
                            <div class="flex-1">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <h4 class="font-bold text-gray-800">${user.name}</h4>
                                        <div class="flex items-center gap-2 text-xs text-gray-400 mt-1">
                                            <span>${moment.time}</span>
                                            <span>·</span>
                                            <span>${moment.location}</span>
                                        </div>
                                    </div>
                                    <button class="p-1 rounded-full hover:bg-gray-100">
                                        <i data-lucide="more-vertical" class="w-4 h-4 text-gray-400"></i>
                                    </button>
                                </div>
                                <p class="text-sm text-gray-800 mt-2">${moment.content}</p>
                                ${moment.images && moment.images.length > 0 ? `
                                <div class="mt-3 grid grid-cols-2 gap-2">
                                    ${moment.images.map(img => `<img src="${img}" class="w-full h-32 object-cover rounded-lg bg-gray-200" onerror="this.src='https://images.unsplash.com/photo-1549399542-7e3f8b79c341?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'" />`).join('')}
                                </div>
                                ` : ''}
                                <div class="mt-4 pt-4 border-t border-gray-100">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center gap-4">
                                            <button class="flex items-center gap-1 text-gray-400 hover:text-brand-orange">
                                                <i data-lucide="heart" class="w-4 h-4"></i>
                                                <span class="text-xs">${moment.likes}</span>
                                            </button>
                                            <button class="flex items-center gap-1 text-gray-400 hover:text-brand-blue">
                                                <i data-lucide="message-circle" class="w-4 h-4"></i>
                                                <span class="text-xs">${moment.comments}</span>
                                            </button>
                                            <button class="flex items-center gap-1 text-gray-400 hover:text-brand-green">
                                                <i data-lucide="share-2" class="w-4 h-4"></i>
                                                <span class="text-xs">分享</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');

                return `<div class="px-4 py-2">${listHtml}</div>`;
            },

            render() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    ${this.header()}
                    <main>
                        ${this.postForm()}
                        <div class="px-4 py-2">
                            <h2 class="text-xl font-black text-gray-800 mb-3">最新动态</h2>
                        </div>
                        ${this.momentList()}
                    </main>
                    ${window.Common ? window.Common.renderBottomNav('community') : ''}
                `;
                if (window.Common) window.Common.initIcons();
            }
        };

        document.addEventListener('DOMContentLoaded', () => CommunityView.render());
    </script>
</body>
</html>
