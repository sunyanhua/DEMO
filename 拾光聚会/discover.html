<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>发现 - 拾光聚会</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active {
            color: #1a1a2e;
            font-weight: bold;
            border-bottom: 2px solid #e8a87c;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased selection:bg-orange-500 selection:text-white pb-20">
    <!-- 浮动装饰元素 -->
    <div class="floating-shapes floating-shapes-poster">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <div id="app" class="min-h-screen"></div>

    <script src="data.js?v=4"></script>
    <script src="common.js?v=2"></script>

    <script>
        const DiscoverView = {
            currentTab: 'activities', // 'activities' or 'merchants'
            selectedCategory: '全部', // '全部' or category label
            selectedMerchantFilter: '全部', // '全部' or tag label

            header() {
                return `
                <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm border-b border-gray-200 header-glow">
                  <div class="flex items-center gap-3">
                    <button onclick="window.location.href='index.html'" class="p-1.5 rounded-full hover:bg-gray-100 transition-colors">
                      <i data-lucide="arrow-left" class="w-5 h-5 text-color-orange"></i>
                    </button>
                    <div class="flex-1">
                      <h1 class="text-2xl font-bold text-gradient-orange">发现</h1>
                    </div>
                    <button class="relative p-1.5 rounded-full hover:bg-gray-100 transition-colors">
                      <i data-lucide="search" class="w-5 h-5 text-color-orange"></i>
                    </button>
                  </div>
                </header>
                `;
            },

            tabBar() {
                return `
                <div class="sticky top-[56px] z-30 bg-white/95 backdrop-blur-md px-4 py-3 border-b border-gray-200">
                  <div class="flex space-x-6">
                    <button onclick="DiscoverView.switchTab('activities')" class="px-1 py-2 text-sm font-medium transition-all ${this.currentTab === 'activities' ? 'tab-active text-color-dark' : 'text-gray-500'}">
                      活动
                    </button>
                    <button onclick="DiscoverView.switchTab('merchants')" class="px-1 py-2 text-sm font-medium transition-all ${this.currentTab === 'merchants' ? 'tab-active text-color-dark' : 'text-gray-500'}">
                      商家
                    </button>
                  </div>
                </div>
                `;
            },

            switchTab(tab) {
                this.currentTab = tab;
                this.render();
            },

            selectCategory(categoryLabel) {
                this.selectedCategory = categoryLabel;
                this.render();
            },

            selectMerchantFilter(filterLabel) {
                this.selectedMerchantFilter = filterLabel;
                this.render();
            },

            activitiesList() {
                let activities = window.GlobalData?.activities || [];
                if (activities.length === 0) return '<div class="p-4 text-center text-color-dark">暂无活动</div>';

                // 根据选中分类筛选活动
                if (this.selectedCategory !== '全部') {
                    activities = activities.filter(activity => activity.category === this.selectedCategory);
                }

                // 如果筛选后没有活动，显示提示
                if (activities.length === 0) {
                    return '<div class="p-4 text-center text-color-dark">该分类下暂无活动</div>';
                }

                // 限制只显示一个“进行中”活动，其余“进行中”活动显示为“已结束”
                let recruitingShown = false;
                const processedActivities = activities.map(activity => {
                    const isRecruiting = activity.status === 'RECRUITING';
                    let displayStatus = activity.status;
                    let displayStatusText = isRecruiting ? '进行中' : '已结束';

                    if (isRecruiting) {
                        if (!recruitingShown) {
                            recruitingShown = true;
                            // 保持为进行中
                        } else {
                            // 超过一个进行中活动，显示为已结束
                            displayStatus = 'FULL';
                            displayStatusText = '已结束';
                        }
                    }

                    return {
                        ...activity,
                        displayStatus,
                        displayStatusText
                    };
                });

                const listHtml = processedActivities.map(activity => `
                    <a href="activity-detail.html?id=${activity.id}" class="block no-underline">
                      <div class="card-poster rounded-2xl p-4 shadow-sm hover-glow-orange card-hover-lift mb-4">
                        <div class="flex gap-4">
                          <div class="relative flex-shrink-0">
                            <img src="${activity.imageUrl}" class="w-24 h-24 rounded-xl object-cover bg-gray-200" onerror="this.src='https://images.unsplash.com/photo-1549399542-7e3f8b79c341?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'" />
                            <div class="absolute top-2 left-2 bg-white/90 backdrop-blur-sm text-xs px-2 py-1 rounded-full font-medium text-color-dark">
                              ${activity.price === 0 ? '免费' : '¥' + activity.price}
                            </div>
                          </div>
                          <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between mb-2">
                              <h3 class="font-bold text-color-dark text-lg line-clamp-2 flex-1 min-w-0 mr-2">${activity.title}</h3>
                              <span class="text-xs px-2 py-1 rounded-full flex-shrink-0 ${activity.displayStatus === 'RECRUITING' ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-600'}">
                                ${activity.displayStatusText}
                              </span>
                            </div>
                            <p class="text-sm text-gray-600 mb-3 line-clamp-2">${activity.description}</p>
                            <div class="flex items-center text-xs text-gray-500 mb-2">
                              <i data-lucide="calendar" class="w-3 h-3 mr-1 text-color-orange"></i>
                              <span>${activity.date}</span>
                              <span class="mx-2">·</span>
                              <i data-lucide="map-pin" class="w-3 h-3 mr-1 text-color-orange"></i>
                              <span>${activity.district}</span>
                            </div>
                            <div class="flex items-center justify-between">
                              <div class="flex items-center text-xs text-gray-500">
                                <i data-lucide="users" class="w-3 h-3 mr-1 text-color-orange"></i>
                                <span>${activity.currentParticipants}人已报名</span>
                              </div>
                              <div class="flex flex-wrap gap-1">
                                ${activity.tags.map(tag => `<span class="text-[10px] px-2 py-0.5 bg-gray-50 text-gray-600 rounded-md">${tag}</span>`).join('')}
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </a>
                `).join('');

                return `<div class="px-4 py-3">${listHtml}</div>`;
            },

            merchantsList() {
                let partners = window.GlobalData?.partners || [];
                if (partners.length === 0) return '<div class="p-4 text-center text-color-dark">暂无商家</div>';

                // 根据选中标签筛选商家
                if (this.selectedMerchantFilter !== '全部') {
                    partners = partners.filter(partner =>
                        partner.tags && partner.tags.includes(this.selectedMerchantFilter)
                    );
                }

                // 如果筛选后没有商家，显示提示
                if (partners.length === 0) {
                    return '<div class="p-4 text-center text-color-dark">该标签下暂无商家</div>';
                }

                const listHtml = partners.map(partner => `
                    <div class="card-poster rounded-2xl p-4 shadow-sm hover-glow-orange card-hover-lift mb-4" onclick="window.location.href='merchant-detail.html?id=${partner.id}'">
                      <div class="flex items-start gap-3">
                        <div class="relative">
                          <img src="${partner.avatarUrl}" class="w-16 h-16 rounded-xl object-cover border border-gray-200" />
                          ${partner.verified ? '<div class="absolute -top-1 -right-1 bg-color-light text-color-dark text-[8px] px-1.5 py-0.5 rounded-full font-bold">认证</div>' : ''}
                        </div>
                        <div class="flex-1">
                          <div class="flex items-center justify-between mb-1">
                            <h3 class="font-bold text-color-dark">${partner.name}</h3>
                            <span class="text-xs text-gray-500">${partner.distance}</span>
                          </div>
                          <div class="flex flex-wrap gap-1 mb-2">
                            ${partner.tags.map(tag => `<span class="text-[10px] px-2 py-0.5 bg-gray-50 text-gray-500 rounded-md border border-gray-100">${tag}</span>`).join('')}
                          </div>
                          <p class="text-sm text-gray-600 mb-3">${partner.intro}</p>
                          <div class="flex items-center justify-between">
                            <div class="flex items-center text-xs text-gray-500">
                              <i data-lucide="star" class="w-3 h-3 mr-1 text-color-orange"></i>
                              <span>4.8</span>
                              <span class="mx-1">·</span>
                              <i data-lucide="users" class="w-3 h-3 mr-1 text-color-orange"></i>
                              <span>500+ 关注</span>
                            </div>
                            <div class="flex items-center gap-2">
                              <button class="px-3 py-1.5 text-xs bg-gray-100 text-gray-700 font-medium rounded-full hover:bg-gray-200" onclick="event.stopPropagation()">
                                关注
                              </button>
                              <button class="px-3 py-1.5 text-xs btn-gradient-primary text-white font-bold rounded-full" onclick="event.stopPropagation()">
                                咨询
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                `).join('');

                return `<div class="px-4 py-3">${listHtml}</div>`;
            },

            merchantFilter() {
                const partners = window.GlobalData?.partners || [];
                // 提取所有商家标签
                const allTags = partners.flatMap(partner => partner.tags || []);
                const uniqueTags = ['全部', ...new Set(allTags)].slice(0, 8); // 限制最多8个标签

                // 图标映射
                const iconMap = {
                    '全部': 'grid',
                    '豪华车': 'car',
                    '购车优惠': 'tag',
                    '试驾': 'steering-wheel',
                    '新能源': 'battery-charging',
                    '电动车': 'car',
                    '充电服务': 'plug',
                    '商务车': 'truck',
                    '金融方案': 'credit-card',
                    '换电服务': 'refresh-ccw',
                    '洗车': 'droplets',
                    '美容': 'sparkles',
                    '保养': 'wrench'
                };

                const filtersHtml = uniqueTags.map(tag => {
                    const icon = iconMap[tag] || 'tag';
                    const isActive = this.selectedMerchantFilter === tag;
                    return `
                    <button onclick="DiscoverView.selectMerchantFilter('${tag}')" class="flex flex-col items-center gap-1.5 px-2 py-1.5 rounded-xl transition-colors ${isActive ? 'bg-color-light border border-color-orange' : 'hover:bg-gray-50'}">
                        <div class="w-10 h-10 ${isActive ? 'bg-color-orange' : 'bg-gray-100'} rounded-xl flex items-center justify-center">
                            <i data-lucide="${icon}" class="w-5 h-5 ${isActive ? 'text-white' : 'text-color-orange'}"></i>
                        </div>
                        <span class="text-[10px] ${isActive ? 'text-color-orange font-bold' : 'text-gray-600'}">${tag}</span>
                    </button>
                    `;
                }).join('');

                return `
                <div class="px-4 py-3">
                    <div class="flex overflow-x-auto gap-3 no-scrollbar pb-2">
                        ${filtersHtml}
                    </div>
                </div>
                `;
            },

            categoryFilter() {
                // 从活动中提取唯一分类
                const activities = window.GlobalData?.activities || [];
                const uniqueCategories = ['全部', ...new Set(activities.map(a => a.category).filter(Boolean))];

                // 图标映射
                const iconMap = {
                    '全部': 'grid',
                    '生活节': 'music',
                    '购车优惠': 'tag',
                    '自驾游': 'map-pin',
                    '二手车': 'repeat',
                    '车主服务': 'wrench',
                    '车展活动': 'car',
                    '广播收听': 'radio',
                    '互动社区': 'message-square',
                    '商家展示': 'store',
                    '交通资讯': 'newspaper',
                    '试驾': 'car',
                    '讲座': 'mic'
                };

                const catsHtml = uniqueCategories.map(catLabel => {
                    const icon = iconMap[catLabel] || 'circle';
                    const isActive = this.selectedCategory === catLabel;
                    return `
                    <button onclick="DiscoverView.selectCategory('${catLabel}')" class="flex flex-col items-center gap-1.5 px-2 py-1.5 rounded-xl transition-colors ${isActive ? 'bg-color-light border border-color-orange' : 'hover:bg-gray-50'}">
                        <div class="w-10 h-10 ${isActive ? 'bg-color-orange' : 'bg-gray-100'} rounded-xl flex items-center justify-center">
                            <i data-lucide="${icon}" class="w-5 h-5 ${isActive ? 'text-white' : 'text-color-orange'}"></i>
                        </div>
                        <span class="text-[10px] ${isActive ? 'text-color-orange font-bold' : 'text-gray-600'}">${catLabel}</span>
                    </button>
                    `;
                }).join('');

                return `
                <div class="px-4 py-3">
                    <div class="flex overflow-x-auto gap-3 no-scrollbar pb-2">
                        ${catsHtml}
                    </div>
                </div>
                `;
            },

            render() {
                const app = document.getElementById('app');
                app.innerHTML = `
                    ${this.header()}
                    <main>
                        ${this.tabBar()}
                        ${this.currentTab === 'activities' ? this.categoryFilter() : this.merchantFilter()}
                        <div class="px-4 py-2">
                            <h2 class="text-xl font-black text-color-dark mb-3">
                                ${this.currentTab === 'activities' ? '推荐活动' : '推荐商家'}
                            </h2>
                        </div>
                        ${this.currentTab === 'activities' ? this.activitiesList() : this.merchantsList()}
                    </main>
                    ${window.Common ? window.Common.renderBottomNav('discover') : ''}
                `;
                if (window.Common) window.Common.initIcons();
            }
        };

        // 从URL参数获取当前标签页
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const tabParam = getUrlParam('tab');
            if (tabParam === 'merchants') {
                DiscoverView.currentTab = 'merchants';
            } else {
                DiscoverView.currentTab = 'activities'; // 默认
            }
            DiscoverView.render();
        });
    </script>
</body>
</html>
