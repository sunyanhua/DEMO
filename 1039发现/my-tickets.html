// Per-card verified state
var verified = {};
var transferred = { 'OD202607180006_1': true };

// Flatten all orders into individual ticket cards
function buildCards() {
    var cards = [];
    ALL_ORDERS.forEach(function(order) {
        for (var g = 1; g <= (order.quantity || 1); g++) {
            cards.push({
                order: order,
                group: g,
                cardId: order.orderNo + '_' + g,
            });
        }
    });
    return cards;
}

// === Calendar helpers for booking ===
var bookingCard = null;
var bookingCalMonth = (new Date()).getMonth();
var bookingCalYear = (new Date()).getFullYear();
var bookingSelectedDateStr = '';
var bookingSelectedSlot = '';
var TIME_SLOTS = ['09:00-10:00','10:00-11:00','11:00-12:00','14:00-15:00','15:00-16:00','16:00-17:00'];
var SLOTS_STATUS = {};

function getCalendarDates(year, month) {
    var dates = [];
    var firstDay = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    for (var i = 0; i < firstDay; i++) dates.push(null);
    var today = new Date();
    for (var d = 1; d <= daysInMonth; d++) {
        var dt = new Date(year, month, d);
        var isPast = dt < new Date(today.getFullYear(), today.getMonth(), today.getDate());
        dates.push({day:d, date:dt, isPast:isPast});
    }
    return dates;
}

    { name:'张小宝', mobile:'', idcard:'110101201803201234' },
];
var regFormCard = null;

    var cardsHtml = cards.map(function(c) {
        var order = c.order, g = c.group;

        var isPost = order.isPostRegister;
        var isReg = !isPost || (order.registered && order.registered[g]);

        // Check booking
        var existBk = (order.bookings || []).filter(function(bk){return bk.group === g;})[0];
        var isBooked = !!existBk;

        var innerHtml = '';

                <span class="inline-block px-5 py-1.5 rounded-full border border-brand-gold text-brand-gold text-xs font-bold cursor-pointer card-hover" style="'+(transferred[c.cardId]?'display:none;':'')+'" onclick="showTicketBooking(\''+c.cardId+'\')">预约</span>\

                <span class="inline-block px-5 py-1.5 rounded-full text-xs font-bold '+(transferred[c.cardId]?'bg-gray-200 text-gray-400 cursor-default':'bg-brand-pink text-white cursor-pointer card-hover')+'" '+(transferred[c.cardId]?'':'onclick="doTransfer(\''+c.cardId+'\')"')+'>'+(transferred[c.cardId]?'已转赠':'转赠')+'</span>\

            <div class="px-3 pb-3 pt-1">\
                <div class="ticket-card">\
                    <div class="ticket-left-bar" style="background:'+leftBarColor+';"><div class="ticket-rotate-text">1039发现</div></div>\
                    <div class="ticket-body">\
                        '+innerHtml+'\n                    </div>\
                </div>\
                <div class="flex justify-end mt-2">\
                    '+footerLink+'\n                </div>\
            </div>\
        </div>';
    }).join('');

    document.getElementById('app').innerHTML = '\
        <div class="top-section"><div class="px-4 pt-3 pb-2"><img src="logo.png" alt="1039发现" style="height:28px;"/></div></div>\
        <div class="content-card">\
            <div class="px-4 py-4 border-b border-gray-100 flex items-center gap-2">\
                <i data-lucide="wallet" class="w-5 h-5 text-brand-gold"></i>\
                <span class="text-base font-black text-gray-800">我的票夹</span></div>\
            <div class="px-4 pt-3 pb-2 flex gap-2 overflow-x-auto no-scrollbar">'+tabHtml+'</div>\
            <div class="px-4 pb-4">'+(cardsHtml||'<p class="text-center text-xs text-gray-400 py-8">暂无票券</p>')+'</div>\
        </div>\
        <div class="pb-6"></div>';
    Common.initIcons();
}

function switchTab(t) { tab = t; render(); }

function goOrder(orderNo) {
    var o = ALL_ORDERS.filter(function(x){return x.orderNo===orderNo;})[0];
    if (o) { localStorage.setItem('lastOrder', JSON.stringify(o)); location.href = 'order-detail.html'; }
}

// === Verify ===
var verifyCardId = '';
function doVerify(cid) { verifyCardId = cid; Common.showPopup('verify-overlay'); setTimeout(function(){Common._icons(document.getElementById('verify-overlay'));},50); }
function hideVerify(e) { Common.closePopup(e, 'verify-overlay'); if (verifyCardId) { verified[verifyCardId] = true; render(); } verifyCardId = ''; }

var transferCardId = '';
function doTransfer(cid) { transferCardId = cid; Common.showPopup('transfer-overlay'); setTimeout(function(){Common._icons(document.getElementById('transfer-overlay'));},50); }
function hideTransfer(e) { Common.closePopup(e, 'transfer-overlay'); if (transferCardId) { transferred[transferCardId] = true; render(); } transferCardId = ''; }

// === Registration ===
function showRegTicketForm(cid) {
    regFormCard = cid;
    var card = buildCards().filter(function(c){return c.cardId===cid;})[0];
    if (!card) return;
    var order = card.order;
    var labels = order.personLabels || [];
    var fieldsHtml = '';
    for (var p = 0; p < labels.length; p++) {
        var pf = PRE_FILL_REG[p] || {name:'',mobile:'',idcard:''};
        fieldsHtml += '\
        <div class="mb-3"><h5 class="text-xs font-bold text-gray-500 mb-2">'+labels[p]+'</h5>\
            <div class="space-y-2">\
                <div class="flex items-center gap-2"><span class="text-xs text-gray-400 w-12">姓名</span><input type="text" id="rname-'+p+'" value="'+pf.name+'" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none"/></div>\
                <div class="flex items-center gap-2"><span class="text-xs text-gray-400 w-12">手机号</span><input type="tel" id="rmobile-'+p+'" value="'+pf.mobile+'" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none"/></div>\
                <div class="flex items-center gap-2"><span class="text-xs text-gray-400 w-12">身份证</span><input type="text" id="ridcard-'+p+'" value="'+pf.idcard+'" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none"/></div>\
            </div>\
        </div>';
    }
    document.getElementById('register-form').innerHTML = '\
        <div class="bg-brand-gold-light rounded-xl p-3 mb-3"><p class="text-sm font-bold text-gray-800">'+order.productName+'</p><p class="text-xs text-gray-500">'+order.specName+'</p></div>\
        '+fieldsHtml+'\n        <span class="block text-center cursor-pointer w-full py-3 rounded-full bg-brand-gold text-white font-bold text-sm card-hover" onclick="confirmRegTicket()">确认登记</span>';
    Common.showPopup('register-overlay');
    Common._icons(document.getElementById('register-overlay'));
}
function hideRegForm(e) { Common.closePopup(e, 'register-overlay'); }
function confirmRegTicket() {
    var card = buildCards().filter(function(c){return c.cardId===regFormCard;})[0];
    if (!card) return;
    var order = card.order, g = card.group;
    var labels = order.personLabels || [];
    for (var p = 0; p < labels.length; p++) {
        var nEl = document.getElementById('rname-'+p);
        if (!nEl || !nEl.value.trim()) { Common.showToast('请填写'+labels[p]+'姓名'); return; }
        var target = null;
        for (var i = 0; i < order.persons.length; i++) {
            if (order.persons[i].group === g && order.persons[i].label === labels[p]) { target = order.persons[i]; break; }
        }
        if (target) {
            target.name = nEl.value;
            target.mobile = document.getElementById('rmobile-'+p).value;
            target.idcard = document.getElementById('ridcard-'+p).value;
        }
    }
    if (!order.registered) order.registered = {};
    order.registered[g] = true;
    Common.hidePopup('register-overlay');
    Common.showToast('登记成功！');
    render();
}

// === Booking ===
function showTicketBooking(cid) {
    bookingCard = cid;
    bookingCalMonth = (new Date()).getMonth();
    bookingCalYear = (new Date()).getFullYear();
    bookingSelectedDateStr = '';
    bookingSelectedSlot = '';
    TIME_SLOTS.forEach(function(s) { SLOTS_STATUS[s] = Math.random() > 0.2; });
    document.getElementById('booking-step-title').textContent = '选择预约时间';
    renderBookingPopup();
    Common.showPopup('booking-overlay');
}
function hideBooking(e) { Common.closePopup(e, 'booking-overlay'); }

function renderBookingPopup() {
    var CALS = getCalendarDates(bookingCalYear, bookingCalMonth);
    var weekNames = ['日','一','二','三','四','五','六'];
    var weekHeader = weekNames.map(function(w){return '<div class="text-center text-[10px] text-gray-400 font-medium py-1">'+w+'</div>';}).join('');
    var calHtml = '';
    for (var i = 0; i < CALS.length; i++) {
        var cell = CALS[i];
        if (cell === null) { calHtml += '<div class="py-2 text-center text-xs text-gray-300"></div>'; }
        else {
            var isPast = cell.isPast;
            var sel = bookingSelectedDateStr === cell.date.toISOString().slice(0,10);
            var cls = sel ? 'bg-brand-gold text-white rounded-full' : (isPast ? 'text-gray-300 cursor-default' : 'text-gray-700 cursor-pointer card-hover');
            calHtml += '<div class="py-2 text-center text-xs font-medium '+cls+'" '+(!isPast?'onclick="selBkDate(\''+cell.date.toISOString().slice(0,10)+'\')"':'')+'>'+cell.day+'</div>';
        }
    }
    var monthLabel = ((bookingCalMonth+1) + '月 ' + bookingCalYear + '年');
    var slotHtml = bookingSelectedDateStr ? TIME_SLOTS.map(function(s) {
        var avail = SLOTS_STATUS[s], sel = bookingSelectedSlot === s;
        return '<div class="py-2.5 rounded-xl text-center text-xs font-medium border-2 transition-all '+(sel?'border-brand-gold bg-brand-gold-light text-brand-gold cursor-pointer':(avail?'border-gray-100 bg-white text-gray-600 cursor-pointer card-hover':'border-gray-100 bg-gray-100 text-gray-300 cursor-default'))+'" '+(avail?'onclick="selBkSlot(\''+s+'\')"':'')+'>'+s+(avail?'':'（不可预约）')+'</div>';
    }).join('') : '<p class="text-xs text-gray-400 text-center py-4">请先选择日期</p>';

    // Post-register: add registration form after slot
    var regFieldsHtml = '';
    var card = buildCards().filter(function(c){return c.cardId===bookingCard;})[0];
    if (card && card.order.isPostRegister && bookingSelectedDateStr && bookingSelectedSlot) {
        var labels = card.order.personLabels || ['购票人'];
        for (var p = 0; p < labels.length; p++) {
            var pf2 = PRE_FILL_REG[p] || {name:'小明',mobile:'13912345678',idcard:''};
            regFieldsHtml += '<div class="mb-3"><h5 class="text-xs font-bold text-gray-500 mb-2">'+labels[p]+'</h5><div class="space-y-2"><div class="flex items-center gap-2"><span class="text-xs text-gray-400 w-12">姓名</span><input type="text" id="bk-name-'+p+'" value="'+pf2.name+'" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none"/></div><div class="flex items-center gap-2"><span class="text-xs text-gray-400 w-12">手机号</span><input type="tel" id="bk-mobile-'+p+'" value="'+pf2.mobile+'" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none"/></div></div></div>';
        }
    }
    var canConfirm = bookingSelectedDateStr && bookingSelectedSlot;

    document.getElementById('booking-form').innerHTML = '\
        <p class="text-xs text-gray-400 bg-amber-50 rounded-lg py-2 px-3 mb-3">⚠ 预约完成后不能修改，且本订单不再退款</p>\
        <div><label class="block text-sm font-bold text-gray-700 mb-2">选择日期</label>\
            <div class="flex items-center justify-between mb-2"><span class="cursor-pointer card-hover px-2 py-1 rounded-lg bg-gray-100 text-sm" onclick="navCal(-1)"><i data-lucide="chevron-left" class="w-4 h-4"></i></span><span class="text-sm font-bold text-gray-800">'+monthLabel+'</span><span class="cursor-pointer card-hover px-2 py-1 rounded-lg bg-gray-100 text-sm" onclick="navCal(1)"><i data-lucide="chevron-right" class="w-4 h-4"></i></span></div>\
            <div class="grid grid-cols-7 gap-1">'+weekHeader+calHtml+'</div></div>\
        <div><label class="block text-sm font-bold text-gray-700 mb-2">选择时段</label><div class="grid grid-cols-3 gap-2">'+slotHtml+'</div></div>\
        '+(regFieldsHtml?'<div><label class="block text-sm font-bold text-gray-700 mb-2">购票信息</label>'+regFieldsHtml+'</div>':'')+'\n        '+(bookingSelectedDateStr && bookingSelectedSlot?'<div class="bg-gray-50 rounded-xl p-3 text-xs"><span class="text-gray-500">预约时间：</span><span class="font-bold text-gray-800">'+bookingSelectedDateStr+' '+bookingSelectedSlot+'</span></div>':'')+'\n        <span class="block text-center cursor-pointer w-full py-3 rounded-full bg-brand-gold text-white font-bold text-sm card-hover '+(!canConfirm?'opacity-50':'')+'" '+(!canConfirm?'':'onclick="confirmTicketBooking()"')+'>确认预约</span>';
    Common._icons(document.getElementById('booking-form'));
}
function navCal(dir) { bookingCalMonth += dir; if (bookingCalMonth < 0) { bookingCalMonth = 11; bookingCalYear--; } if (bookingCalMonth > 11) { bookingCalMonth = 0; bookingCalYear++; } renderBookingPopup(); }
function selBkDate(ds) { bookingSelectedDateStr = ds; bookingSelectedSlot = ''; renderBookingPopup(); }
function selBkSlot(s) { bookingSelectedSlot = s; renderBookingPopup(); }

function confirmTicketBooking() {
    if (!bookingSelectedDateStr || !bookingSelectedSlot) return;
    Common.hidePopup('booking-overlay');

    var card = buildCards().filter(function(c){return c.cardId===bookingCard;})[0];
    if (!card) return;
    var order = card.order, g = card.group;

    order.bookings = (order.bookings || []).filter(function(bk){return bk.group !== g;});
    order.bookings.push({group:g, dateLabel:bookingSelectedDateStr, slot:bookingSelectedSlot});

    // Post-register: save person info
    if (order.isPostRegister) {
        var labels = order.personLabels || ['购票人'];
        for (var p = 0; p < labels.length; p++) {
            var target = null;
            for (var i = 0; i < order.persons.length; i++) {
                if (order.persons[i].group === g && order.persons[i].label === labels[p]) { target = order.persons[i]; break; }
            }
            if (target) {
                target.name = document.getElementById('bk-name-'+p).value;
                target.mobile = document.getElementById('bk-mobile-'+p).value;
            }
        }
        if (!order.registered) order.registered = {};
        order.registered[g] = true;
    }

    Common.showToast('预约成功！');
    render();
}

document.addEventListener('DOMContentLoaded', render);
</script>
