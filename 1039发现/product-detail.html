<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>商品详情 - 1039发现</title>
<script src="lib/tailwind.min.js"></script>
<script src="lib/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

<div class="bg-decoration">
    <div class="bg-blob"></div><div class="bg-blob"></div>
    <div class="bg-blob"></div><div class="bg-blob"></div>
    <div class="bg-blob"></div><div class="bg-blob"></div>
</div>

<div id="app" class="relative z-[1]"></div>

<!-- 购买弹窗 -->
<div id="buy-overlay" class="fixed inset-0 bg-black/40 z-[100] hidden items-end justify-center" onclick="hideBuy(event)">
<div class="bg-white w-full rounded-t-2xl max-h-[90vh] overflow-y-auto animate-slide-up" onclick="event.stopPropagation()">
<div class="sticky top-0 bg-white z-10 flex items-center px-4 py-4 border-b border-gray-100 rounded-t-2xl">
    <span class="text-lg font-black text-gray-800 flex-1 text-center" id="buy-step-title">选择款式</span>
    <span onclick="hideBuy()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center card-hover flex-shrink-0"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></span>
</div>
<div class="p-4 space-y-4" id="buy-form"></div>
</div></div>

<!-- 优惠券弹窗 -->
<div id="coupon-overlay" class="fixed inset-0 bg-black/40 z-[110] hidden items-center justify-center" onclick="hideCoupon(event)">
<div class="bg-white rounded-2xl p-5 mx-auto w-80 max-h-[70vh] overflow-y-auto shadow-xl" onclick="event.stopPropagation()">
<div class="flex items-center justify-between mb-3">
<span class="text-base font-black text-gray-800">选择优惠券</span>
<span onclick="hideCoupon()" class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center card-hover"><i data-lucide="x" class="w-4 h-4 text-gray-500"></i></span>
</div>
<div class="mb-3 relative">
<input type="text" placeholder="输入兑换码" class="w-full text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none pr-16" style="border-color:#e5e7eb;" id="coupon-code"/>
<span class="absolute right-1.5 top-1/2 -translate-y-1/2 px-3 py-1 rounded-lg text-white text-xs font-bold cursor-pointer card-hover" style="background-color:#E880A5;" onclick="applyCouponCode()">兑换</span>
</div>
<div class="space-y-2" id="coupon-list"></div>
</div></div>

<!-- 我的地址弹窗 -->
<div id="address-overlay" class="fixed inset-0 bg-black/40 z-[110] hidden items-center justify-center" onclick="hideAddress(event)">
<div class="bg-white rounded-2xl p-5 mx-auto w-80 max-h-[70vh] overflow-y-auto shadow-xl" onclick="event.stopPropagation()">
<div class="flex items-center justify-between mb-3">
<span class="text-base font-black text-gray-800">我的地址</span>
<span onclick="hideAddress()" class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center card-hover"><i data-lucide="x" class="w-4 h-4 text-gray-500"></i></span>
</div>
<div class="space-y-2" id="address-list"></div>
</div></div>

<!-- 微信支付弹窗 -->
<div id="pay-overlay" class="fixed inset-0 bg-black/40 z-[120] hidden items-end justify-center" onclick="hidePay(event)">
<div class="bg-white w-full rounded-t-2xl animate-slide-up" onclick="event.stopPropagation()">
<div class="sticky top-0 bg-white z-10 flex items-center justify-between px-4 py-4 border-b border-gray-100 rounded-t-2xl">
<span class="text-lg font-black text-gray-800">确认支付</span>
<span onclick="hidePay()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center card-hover"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></span>
</div>
<div class="p-4 text-center space-y-4">
<div class="text-5xl">💳</div>
<div class="text-sm text-gray-500" id="pay-title"></div>
<div class="text-2xl font-black" style="color:#E880A5;" id="pay-amount"></div>
<div class="text-xs text-gray-400">请选择支付方式</div>
<div class="px-4">
<span class="block text-center cursor-pointer w-full py-4 rounded-xl bg-gradient-to-tr from-green-500 to-green-600 text-white font-bold text-base shadow-lg shadow-green-500/20 card-hover flex items-center justify-center gap-2" onclick="doPay()">
<i data-lucide="smartphone" class="w-5 h-5"></i>微信支付
</span>
</div>
<span onclick="hidePay()" class="block text-center cursor-pointer w-full py-2.5 rounded-xl bg-gray-100 text-gray-500 font-bold text-sm card-hover">取消</span>
</div></div></div>

<script src="common.js"></script>
<script>
var SPECS = [
    { id:0, name:'经典圆形款', desc:'直径4cm，1039经典LOGO设计',            price:29.9, stock:500 },
    { id:1, name:'方型复古款', desc:'4.5×3.5cm，复古收音机造型',           price:39.9, stock:300 },
    { id:2, name:'限量金色款', desc:'圆形镀金工艺，带独立编号，限量100枚',    price:69.9, stock:100 },
];

var MY_COUPONS = [
    { id:0, name:'新用户专享券', desc:'满50减5', amount:5, minPrice:50 },
    { id:1, name:'1039周年庆券', desc:'满100减10', amount:10, minPrice:100 },
];

var SAVED_ADDRESSES = JSON.parse(localStorage.getItem('my_addresses') || 'null') || [
    { id:0, name:'小明', mobile:'13812345678', address:'北京市朝阳区建国路88号SOHO现代城A座1206', isDefault:true },
    { id:1, name:'小明', mobile:'13912345678', address:'北京市海淀区中关村大街1号中关村大厦1802', isDefault:false },
];

var state = {
    specIdx: 0,
    quantity: 1,
    selectedCoupon: -1,
    couponAmount: 0,
    useAddress: -1, // -1=手填
};

var PRE_FILL = { name:'小明', mobile:'13912345678', address:'北京市朝阳区建国路88号' };

function getPrice() { return SPECS[state.specIdx].price; }

function renderHeader() {
    return '\
    <div class="fixed top-0 left-0 right-0 z-50 flex items-center px-4 py-3 text-white" style="background:linear-gradient(180deg,rgba(26,24,24,0.85) 0%,rgba(26,24,24,0) 100%);">\
        <a href="products.html" class="p-2 bg-white/10 backdrop-blur rounded-full card-hover"><i data-lucide="chevron-left" class="w-6 h-6"></i></a>\
    </div>';
}

function renderCover() {
    return '\
    <div class="relative w-full" style="aspect-ratio:16/9;">\
        <img src="images/cover3.jpg" class="w-full h-full object-cover" />\
        <div class="absolute bottom-0 left-0 right-0 h-12" style="background:linear-gradient(to top,#FFFFFF,transparent);"></div>\
    </div>';
}

function render() {
    document.getElementById('app').innerHTML = '\
        ' + renderHeader() + '\
        ' + renderCover() + '\
        <div class="relative -mt-6 bg-white rounded-t-3xl px-5 pt-6 pb-20 fade-in" style="min-height:calc(100vh - 44vw - 56px);">\
            <h1 class="text-xl font-black text-gray-900 mb-2">北京交通广播专属冰箱贴</h1>\
            <p class="text-xs text-gray-500 mb-5">FM103.9 官方文创 · 把陪伴你每一天的声音带回家</p>\
            \
            <h3 class="text-gray-800 font-bold text-base mb-3">产品特色</h3>\
            <div class="text-sm text-gray-600 space-y-2 mb-5">\
                <div class="flex items-start gap-2"><span style="color:#E880A5;" class="mt-0.5">●</span><span>锌合金材质，珐琅工艺，质感出众</span></div>\
                <div class="flex items-start gap-2"><span style="color:#E880A5;" class="mt-0.5">●</span><span>背面强力磁铁，可牢固吸附在冰箱、铁门等金属表面</span></div>\
                <div class="flex items-start gap-2"><span style="color:#E880A5;" class="mt-0.5">●</span><span>精美礼盒包装，自用送礼两相宜</span></div>\
            </div>\
            \
            <h3 class="text-gray-800 font-bold text-base mb-3">款式说明</h3>\
            <div class="text-sm text-gray-600 space-y-1 mb-5">\
                <p>· 经典圆形款：直径4cm，1039经典LOGO设计</p>\
                <p>· 方型复古款：4.5×3.5cm，复古收音机造型</p>\
                <p>· 限量金色款：圆形镀金工艺，带独立编号，限量100枚</p>\
            </div>\
            \
            <h3 class="text-gray-800 font-bold text-base mb-3">退款说明</h3>\
            <div class="text-sm text-gray-500 bg-gray-50 rounded-xl p-3 mb-5">\
                <p>本商品不支持线上退款，如有疑问请联系客服。</p>\
            </div>\
        </div>\
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 z-50 flex items-center gap-4" style="box-shadow:0 -4px 10px rgba(0,0,0,0.05);">\
            <div class="flex-1">\
                <span class="text-xl font-black" style="color:#E880A5;">¥' + Math.min.apply(null, SPECS.map(function(s){return s.price;})) + '元起</span>\
            </div>\
            <span class="px-8 py-3 rounded-full text-white font-bold text-sm card-hover shadow-lg" style="background-color:#E880A5;box-shadow:0 4px 16px rgba(232,128,165,0.25);" onclick="showBuy()">立即购买</span>\
        </div>\
    ';
    Common.initIcons();
}

// ============ 购买弹窗 Step 1 ============
function showBuy() { renderBuyStep1(); Common.showPopup('buy-overlay'); }
function hideBuy(e) { Common.closePopup(e, 'buy-overlay'); }

function renderBuyStep1() {
    document.getElementById('buy-step-title').textContent = '选择款式';
    var spec = SPECS[state.specIdx];
    var itemTotal = spec.price - state.couponAmount;
    var totalPrice = itemTotal * state.quantity;

    var specHtml = SPECS.map(function(s, i) {
        var sel = state.specIdx === i;
        return '\
        <div class="flex-1 py-3 rounded-xl text-center text-sm font-medium cursor-pointer card-hover border-2 transition-all ' + (sel ? '' : 'border-gray-100 bg-white text-gray-600') + '" style="' + (sel ? 'border-color:#E880A5;background:rgba(232,128,165,0.08);color:#E880A5;' : '') + '" onclick="selectSpec(' + i + ')">\
            ' + s.name + '\
        </div>';
    }).join('');

    var cpText = state.selectedCoupon >= 0 ? MY_COUPONS[state.selectedCoupon].name + '（省¥' + MY_COUPONS[state.selectedCoupon].amount + '）' : '选择优惠券抵扣';
    var cpCls = state.selectedCoupon >= 0 ? 'bg-green-50 border-green-200 text-green-700' : 'bg-gray-50 border-gray-200 text-gray-500';
    var cpIcon = state.selectedCoupon >= 0 ? 'check-circle' : 'ticket';

    document.getElementById('buy-form').innerHTML = '\
        <div>\
            <label class="block text-sm font-bold text-gray-700 mb-2">款式</label>\
            <div class="flex gap-2">' + specHtml + '</div>\
        </div>\
        <div>\
            <label class="block text-sm font-bold text-gray-700 mb-2">数量</label>\
            <div class="flex items-center gap-3">\
                <span class="w-10 h-10 rounded-xl border-2 border-gray-200 flex items-center justify-center text-lg font-bold cursor-pointer card-hover ' + (state.quantity <= 1 ? 'text-gray-300 border-gray-100' : 'text-gray-600') + '" onclick="changeQty(-1)">−</span>\
                <span class="text-lg font-bold text-gray-800 w-8 text-center">' + state.quantity + '</span>\
                <span class="w-10 h-10 rounded-xl border-2 border-gray-200 flex items-center justify-center text-lg font-bold cursor-pointer card-hover text-gray-600" onclick="changeQty(1)">+</span>\
            </div>\
        </div>\
        <div>\
            <label class="block text-sm font-bold text-gray-700 mb-2">优惠券</label>\
            <div class="flex items-center justify-between p-3 rounded-xl cursor-pointer card-hover border ' + cpCls + '" onclick="showCoupons()">\
                <div class="flex items-center gap-2 text-sm">\
                    <i data-lucide="' + cpIcon + '" class="w-4 h-4"></i>\
                    <span>' + cpText + '</span>\
                </div>\
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300"></i>\
            </div>\
        </div>\
        <div class="bg-gray-50 rounded-xl p-3">\
            <div class="flex justify-between text-sm mb-2">\
                <span class="text-gray-500">单价</span><span class="text-gray-800">¥' + itemTotal + '</span>\
            </div>\
            ' + '<div class="flex justify-between text-sm mb-2"><span class="text-gray-500">数量</span><span class="text-gray-800">×' + state.quantity + '</span></div>' + '\
            ' + (state.couponAmount > 0 ? '<div class="flex justify-between text-sm mb-2"><span class="text-gray-500">优惠券</span><span class="text-red-400">-¥' + (state.couponAmount * state.quantity) + '</span></div>' : '') + '\
            <div class="flex justify-between text-sm font-bold pt-2 border-t border-gray-200">\
                <span class="text-gray-800">待支付</span><span class="text-lg font-black" style="color:#E880A5;">¥' + totalPrice + '</span>\
            </div>\
        </div>\
        <span class="block text-center cursor-pointer w-full py-3 rounded-full text-white font-bold text-sm card-hover" style="background-color:#E880A5;" onclick="goBuyStep2()">下一步</span>\
    ';
    Common._icons(document.getElementById('buy-form'));
}

function selectSpec(i) { state.specIdx = i; renderBuyStep1(); }
function changeQty(d) { var n = state.quantity + d; if (n >= 1 && n <= 5) { state.quantity = n; renderBuyStep1(); } }

// ============ Step 2 ============
function goBuyStep2() { renderBuyStep2(); }
function backBuyStep1() { renderBuyStep1(); }

function renderBuyStep2() {
    document.getElementById('buy-step-title').textContent = '收货信息';
    var spec = SPECS[state.specIdx];
    var itemTotal = spec.price - state.couponAmount;
    var totalPrice = itemTotal * state.quantity;
    var qtyNote = state.quantity > 1 ? ' × ' + state.quantity : '';

    var useAddr = state.useAddress >= 0 ? SAVED_ADDRESSES[state.useAddress] : null;
    var n = useAddr ? useAddr.name : PRE_FILL.name;
    var m = useAddr ? useAddr.mobile : PRE_FILL.mobile;
    var a = useAddr ? useAddr.address : PRE_FILL.address;
    var addrLabel = useAddr ? '（已选地址）' : '';

    document.getElementById('buy-form').innerHTML = '\
        <div class="rounded-xl p-3 flex items-center justify-between" style="background:rgba(232,128,165,0.08);">\
            <div class="flex items-center gap-3">\
                <i data-lucide="shopping-bag" class="w-5 h-5 flex-shrink-0" style="color:#E880A5;"></i>\
                <div>\
                    <p class="text-sm font-bold text-gray-800">' + spec.name + qtyNote + '</p>\
                    <p class="font-bold text-base" style="color:#E880A5;">¥' + totalPrice + '</p>\
                </div>\
            </div>\
            ' + (state.couponAmount > 0 ? '<span class="text-xs text-red-400 bg-red-50 px-2 py-0.5 rounded-full">已优惠¥' + (state.couponAmount * state.quantity) + '</span>' : '') + '\
        </div>\
        <div>\
            <div class="flex items-center justify-between mb-2">\
                <h4 class="text-sm font-bold text-gray-800">收货信息' + addrLabel + '</h4>\
                <span class="text-xs cursor-pointer card-hover font-medium px-2.5 py-1 rounded-full border" style="color:#E880A5;border-color:rgba(232,128,165,0.4);" onclick="showAddress()">选择地址</span>\
            </div>\
            <div class="space-y-2">\
                <div class="flex items-center gap-2">\
                    <span class="text-xs text-gray-400 w-12 flex-shrink-0">姓名</span>\
                    <input type="text" id="prod-name" value="' + n + '" placeholder="请填写姓名" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none"/>\
                </div>\
                <div class="flex items-center gap-2">\
                    <span class="text-xs text-gray-400 w-12 flex-shrink-0">手机号</span>\
                    <input type="tel" id="prod-mobile" value="' + m + '" placeholder="请填写手机号" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none"/>\
                </div>\
                <div class="flex items-center gap-2">\
                    <span class="text-xs text-gray-400 w-12 flex-shrink-0">地址</span>\
                    <input type="text" id="prod-address" value="' + a + '" placeholder="请填写收货地址" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none"/>\
                </div>\
            </div>\
        </div>\
        <label class="flex items-start gap-2 cursor-pointer pt-2">\
            <input type="checkbox" id="buy-agreement" class="mt-0.5" style="accent-color:#E880A5;"/>\
            <span class="text-sm text-gray-600">我已阅读并同意 <span class="underline cursor-pointer" style="color:#E880A5;" onclick="Common.showToast(\'购买须知详情\')">购买须知</span></span>\
        </label>\
        <div class="flex gap-3">\
            <span class="flex-1 text-center cursor-pointer py-3 rounded-full border-2 border-gray-200 text-gray-500 font-bold text-sm card-hover" onclick="backBuyStep1()">← 上一步</span>\
            <span class="flex-[2] text-center cursor-pointer py-3 rounded-full text-white font-bold text-sm card-hover shadow-lg" style="background-color:#E880A5;box-shadow:0 4px 16px rgba(232,128,165,0.25);" onclick="confirmBuy()">确认并支付</span>\
        </div>\
    ';
    Common._icons(document.getElementById('buy-form'));
}

function confirmBuy() {
    if (!document.getElementById('buy-agreement').checked) { Common.showToast('请阅读并同意购买须知'); return; }
    var nameEl = document.getElementById('prod-name');
    if (!nameEl || !nameEl.value.trim()) { Common.showToast('请填写姓名'); return; }
    Common.hidePopup('buy-overlay');

    var spec = SPECS[state.specIdx];
    var itemTotal = spec.price - state.couponAmount;
    var totalPrice = itemTotal * state.quantity;
    document.getElementById('pay-title').textContent = spec.name + (state.quantity > 1 ? ' × ' + state.quantity : '');
    document.getElementById('pay-amount').textContent = '¥' + totalPrice;
    Common.showPopup('pay-overlay');
}

function doPay() {
    Common.hidePopup('pay-overlay');
    var spec = SPECS[state.specIdx];
    var itemTotal = spec.price - state.couponAmount;
    var totalPrice = itemTotal * state.quantity;

    var order = {
        orderNo:'OD' + Date.now(),
        orderTime: new Date().toLocaleString('zh-CN'),
        productName:'北京交通广播专属冰箱贴', productEmoji:'📻', coverImage:'images/cover3.jpg',
        specName: spec.name + (state.quantity > 1 ? ' × ' + state.quantity : ''),
        dateLabel:'', dateValue:'',
        quantity: state.quantity,
        persons:[{
            label:'', name: document.getElementById('prod-name').value,
            mobile: document.getElementById('prod-mobile').value,
            idcard:'', address: document.getElementById('prod-address').value,
        }],
        price: totalPrice, originalPrice: spec.price * state.quantity,
        couponAmount: state.couponAmount * state.quantity,
        couponName: state.selectedCoupon >= 0 ? MY_COUPONS[state.selectedCoupon].name : '',
        refundStages:[],
        status:'paid', type:'product', detailUrl:'product-detail.html',
    };
    localStorage.setItem('lastOrder', JSON.stringify(order));
    Common.showToast('支付成功！');
    setTimeout(function() { location.href = 'order-detail.html'; }, 600);
}
function hidePay(e) { Common.closePopup(e, 'pay-overlay'); }

// ============ 我的地址弹窗 ============
function showAddress() {
    var listHtml = SAVED_ADDRESSES.map(function(addr, i) {
        var active = state.useAddress === i;
        return '\
        <div class="flex items-start justify-between p-3 rounded-xl cursor-pointer card-hover border-2 transition-all ' + (active ? '' : 'border-gray-100 bg-white') + '" style="' + (active ? 'border-color:#E880A5;background:rgba(232,128,165,0.06);' : '') + '" onclick="selectAddress(' + i + ')">\
            <div class="flex-1 min-w-0">\
                <p class="text-sm font-bold text-gray-800">' + addr.name + ' <span class="text-xs text-gray-400 font-normal">' + addr.mobile + '</span>' + (addr.isDefault ? '<span class="text-[10px] text-brand-pink border border-brand-pink px-1.5 py-0.5 rounded-full ml-1">默认</span>' : '') + '</p>\
                <p class="text-xs text-gray-500 mt-1">' + addr.address + '</p>\
            </div>\
            ' + (active ? '<div class="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0 ml-2" style="background:#E880A5;"><i data-lucide="check" class="w-3.5 h-3.5 text-white"></i></div>' : '<div class="w-5 h-5 rounded-full border-2 border-gray-200 flex-shrink-0 ml-2"></div>') + '\
        </div>';
    }).join('');

    var noneActive = state.useAddress === -1;
    listHtml += '\
    <div class="flex items-center justify-between p-3 rounded-xl cursor-pointer card-hover border-2 transition-all ' + (noneActive ? '' : 'border-gray-100 bg-white') + '" style="' + (noneActive ? 'border-color:#E880A5;background:rgba(232,128,165,0.06);' : '') + '" onclick="selectAddress(-1)">\
        <span class="text-sm text-gray-500">不使用（手动填写）</span>\
        ' + (noneActive ? '<div class="w-5 h-5 rounded-full flex items-center justify-center" style="background:#E880A5;"><i data-lucide="check" class="w-3.5 h-3.5 text-white"></i></div>' : '<div class="w-5 h-5 rounded-full border-2 border-gray-200"></div>') + '\
    </div>';

    document.getElementById('address-list').innerHTML = listHtml;
    Common.showPopup('address-overlay');
    setTimeout(function() { Common._icons(document.getElementById('address-overlay')); }, 50);
}
function hideAddress(e) { Common.closePopup(e, 'address-overlay'); }
function selectAddress(i) {
    state.useAddress = i;
    Common.hidePopup('address-overlay');
    renderBuyStep2();
}

// ============ 优惠券 ============
function showCoupons() {
    var listHtml = MY_COUPONS.map(function(cp, i) {
        var active = state.selectedCoupon === i;
        var disabled = SPECS[state.specIdx].price * state.quantity < cp.minPrice;
        return '\
        <div class="flex items-center justify-between p-3 rounded-xl cursor-pointer card-hover border-2 transition-all ' + (active ? '' : (disabled ? 'border-gray-100 bg-gray-50 opacity-50' : 'border-gray-100 bg-white')) + '" style="' + (active ? 'border-color:#E880A5;background:rgba(232,128,165,0.06);' : '') + '" onclick="' + (disabled ? '' : 'selectCoupon(' + i + ')') + '">\
            <div class="flex items-center gap-2.5">\
                <div class="w-10 h-10 rounded-lg bg-red-50 flex items-center justify-center"><i data-lucide="ticket" class="w-5 h-5 text-red-400"></i></div>\
                <div><span class="text-sm font-bold text-gray-800">' + cp.name + '</span><p class="text-xs text-gray-400">' + cp.desc + (disabled ? '（未满¥' + cp.minPrice + '）' : '') + '</p></div>\
            </div>\
            ' + (active ? '<div class="w-5 h-5 rounded-full flex items-center justify-center" style="background:#E880A5;"><i data-lucide="check" class="w-3.5 h-3.5 text-white"></i></div>' : '<div class="w-5 h-5 rounded-full border-2 border-gray-200"></div>') + '\
        </div>';
    }).join('');

    var noneActive = state.selectedCoupon === -1;
    listHtml += '\
    <div class="flex items-center justify-between p-3 rounded-xl cursor-pointer card-hover border-2 transition-all ' + (noneActive ? '' : 'border-gray-100 bg-white') + '" style="' + (noneActive ? 'border-color:#E880A5;background:rgba(232,128,165,0.06);' : '') + '" onclick="selectCoupon(-1)">\
        <span class="text-sm text-gray-500">不使用优惠券</span>\
        ' + (noneActive ? '<div class="w-5 h-5 rounded-full flex items-center justify-center" style="background:#E880A5;"><i data-lucide="check" class="w-3.5 h-3.5 text-white"></i></div>' : '<div class="w-5 h-5 rounded-full border-2 border-gray-200"></div>') + '\
    </div>';

    document.getElementById('coupon-list').innerHTML = listHtml;
    Common.showPopup('coupon-overlay');
    setTimeout(function() { Common._icons(document.getElementById('coupon-overlay')); }, 50);
}
function hideCoupon(e) { Common.closePopup(e, 'coupon-overlay'); }
function selectCoupon(i) {
    state.selectedCoupon = i; state.couponAmount = i >= 0 ? MY_COUPONS[i].amount : 0;
    Common.hidePopup('coupon-overlay'); renderBuyStep1();
}
function applyCouponCode() {
    var code = document.getElementById('coupon-code').value.trim();
    if (!code) { Common.showToast('请输入兑换码'); return; }
    state.selectedCoupon = 0; state.couponAmount = MY_COUPONS[0].amount;
    Common.showToast('优惠券兑换成功！'); Common.hidePopup('coupon-overlay'); renderBuyStep1();
}

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
