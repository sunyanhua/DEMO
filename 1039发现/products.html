<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>商品 - 1039发现</title>
    <script src="lib/tailwind.min.js"></script>
    <script src="lib/lucide.min.js"></script>
    <link rel="stylesheet" href="style.css">
<style>
.bg-products .bg-blob:nth-child(1) { width:100vw; height:100vh; background:#E880A5; top:0; left:0; border-radius:0; opacity:0.9; animation:none; }
.bg-products .bg-blob:nth-child(2) { width:75vw; height:55vh; background:#f2a600; top:-10%; right:-18%; border-radius:65% 35% 45% 55% / 35% 55% 45% 65%; animation-delay:-4s; opacity:0.78; }
.bg-products .bg-blob:nth-child(3) { width:70vw; height:50vh; background:#9adff3; top:30%; left:-15%; border-radius:50% 50% 35% 65% / 40% 60% 60% 40%; animation-delay:-8s; opacity:0.72; }
.bg-products .bg-blob:nth-child(4) { width:65vw; height:48vh; background:#C76B88; top:40%; right:-10%; border-radius:70% 30% 50% 50% / 45% 55% 45% 55%; animation-delay:-12s; opacity:0.65; }
.bg-products .bg-blob:nth-child(5) { width:45vw; height:38vh; background:#f2a600; top:28%; right:10%; border-radius:70% 30% 45% 55% / 35% 65% 50% 50%; animation-delay:-6s; opacity:0.60; }
.bg-products .bg-blob:nth-child(6) { width:40vw; height:36vh; background:#9adff3; bottom:0; left:8%; border-radius:55% 45% 60% 40% / 40% 60% 40% 60%; animation-delay:-10s; opacity:0.58; }
</style>
</head>
<body class="antialiased pb-20">

    <div class="bg-decoration bg-products">
    <div class="bg-blob"></div><div class="bg-blob"></div>
    <div class="bg-blob"></div><div class="bg-blob"></div>
    <div class="bg-blob"></div><div class="bg-blob"></div>
</div>

    <div id="app" class="relative z-[1]"></div>

    <script src="common.js"></script>
    <script>
        function renderHeader() {
            return '\
            <div class="px-4 pt-3 pb-2 flex items-center justify-between">\
                <a href="index.html" class="cursor-pointer card-hover" style="color:rgba(255,255,255,0.70);">\
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>\
                </a>\
                <span class="text-white font-bold text-base">商品</span>\
                <div class="w-6"></div>\
            </div>';
        }

        function renderFilters() {
            return '\
            <div class="px-4 py-2 flex gap-2 items-center">\
                <div class="flex-1 relative">\
                    <input type="text" placeholder="搜索商品..." class="w-full bg-white/15 text-white placeholder-white/40 text-sm rounded-full px-4 py-2 pl-9 outline-none border border-white/10 focus:border-white/30" />\
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-white/40"></i>\
                </div>\
            </div>\
            <div class="px-4 pb-2 flex gap-2 overflow-x-auto no-scrollbar">\
                <span class="text-xs px-3 py-1.5 rounded-full bg-white/20 text-white font-medium cursor-pointer card-hover whitespace-nowrap">全部</span>\
                <span class="text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/60 cursor-pointer card-hover whitespace-nowrap">文创</span>\
                <span class="text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/60 cursor-pointer card-hover whitespace-nowrap">服饰</span>\
                <span class="text-xs px-3 py-1.5 rounded-full bg-white/10 text-white/60 cursor-pointer card-hover whitespace-nowrap">数码</span>\
            </div>';
        }

        function renderList() {
            var items = [
                { title:'北京交通广播专属冰箱贴', img:'images/cover3.jpg', price:'¥29.9 起', meta1:'FM103.9 官方文创', meta2:'锌合金材质 · 珐琅工艺', href:'product-detail.html' },
            ];

            return '\
            <div class="px-4 pt-3 pb-3 flex flex-col gap-3">\
                ' + items.map(function(item) {
                    return '\
                    <a href="' + item.href + '" class="flex gap-3 bg-white rounded-xl p-3 card-hover cursor-pointer no-underline shadow-sm border border-gray-100">\
                        <div class="w-28 h-28 rounded-lg flex-shrink-0 overflow-hidden">\
                            <img src="' + item.img + '" class="w-full h-full object-cover" />\
                        </div>\
                        <div class="flex-1 flex flex-col min-w-0" style="gap:4px;padding-top:5px;">\
                            <h3 class="text-sm font-bold text-gray-800 truncate">' + item.title + '</h3>\
                            <div class="text-xs text-gray-400" style="margin-top:-1px;">\
                                <p class="truncate">' + item.meta1 + '</p>\
                                <p class="truncate">' + item.meta2 + '</p>\
                            </div>\
                            <span class="font-bold text-sm" style="color:#E880A5;margin-top:5px;">' + item.price + '</span>\
                        </div>\
                    </a>';
                }).join('') + '\
            </div>';
        }

        function render() {
            document.getElementById('app').innerHTML = '\
                <div class="top-section">\
                    ' + renderHeader() + '\
                    ' + renderFilters() + '\
                </div>\
                <div class="content-card">\
                    ' + renderList() + '\
                </div>\
                <div class="pb-2"></div>\
                ' + Common.renderBottomNav('product') + '\
            ';
            Common.initIcons();
        }

        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
