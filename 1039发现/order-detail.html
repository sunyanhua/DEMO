<script src="common.js"></script>
<script>
var order = JSON.parse(localStorage.getItem('lastOrder') || 'null');
if (!order) {
    order = {
        orderNo:'OD202607180001', orderTime:'2026-07-17 14:30',
        productName:'2026冰丝带汽车生活节', productEmoji:'🏎️',
        specName:'单人票', dateLabel:'7月18日（周五）', dateValue:'2026-07-18',
        persons:[{label:'成人',name:'张三',mobile:'13812345678',idcard:'110101199001011234'}],
        price:99, originalPrice:99, couponAmount:0, couponName:'',
        refundStages:[
            {days:30, rate:100, text:'提前30天退款 → 退 100%'},
            {days:7,  rate:50,  text:'提前7天退款 → 退 50%'},
            {days:0,  rate:0,   text:'活动开始后 → 不可退'}
        ],
        status:'paid', type:'event', detailUrl:'event-detail.html',
    };
}
var refunded = order.status === 'refunded';
var verified = {};
var transferred = {};
var invoiceApplied = false;
var currentInvoiceType = '企业';
var batchMode = false;
var batchType = 'verify'; // 'verify' or 'book'
var batchSelected = {};

// ============ 预约模式数据 ============
if (order.isBooking && !order.bookings) order.bookings = [];
var TIME_SLOTS = ['09:00-10:00','10:00-11:00','11:00-12:00','14:00-15:00','15:00-16:00','16:00-17:00'];
var SLOTS_STATUS = {};
if (!order.isBooking) order.isBooking = false;

// 日历数据
var bookingCalMonth = (new Date()).getMonth();
var bookingCalYear = (new Date()).getFullYear();
function getCalendarDates(year, month) {
    var dates = [];
    var firstDay = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    for (var i = 0; i < firstDay; i++) dates.push(null);
    var today = new Date();
    for (var d = 1; d <= daysInMonth; d++) {
        var dt = new Date(year, month, d);
        var isPast = dt < new Date(today.getFullYear(), today.getMonth(), today.getDate());
        dates.push({day:d, date:dt, isPast:isPast});
    }
    return dates;
}

// 模拟计算当前可退款金额
function calcRefundAmount() {
    var stages = order.refundStages || [];
    if (!stages.length) return 0;
    // 模拟：假设今天距离活动还有15天
    var dayDiff = 15;
    // 从大到小排，取第一个 days_before <= dayDiff 的阶段（阶梯退：30→7→0）
    var sorted = stages.slice().sort(function(a,b){ return (b.days_before||b.days||0) - (a.days_before||a.days||0); });
    for (var i = 0; i < sorted.length; i++) {
        var db = sorted[i].days_before || sorted[i].days || 0;
        var rate = sorted[i].refund_value || sorted[i].rate || 0;
        if (db <= dayDiff) {
            return Math.round(order.price * rate / 100);
        }
    }
    return 0;
}

function render() {
    // 人员信息
    var infoTitle = order.type === 'product' ? '收货信息' : (order.type === 'ticket' ? '我的门票' : '我的入场券');
    var isEventOrTicket = order.type === 'event' || order.type === 'ticket';
    var personsHtml = '';
    var batchBarHtml = '';
    var isPost = order.isPostRegister;

    if (isEventOrTicket) {
        var cardLabel = order.type === 'ticket' ? '门票' : '入场券';
        var qty = order.quantity || 1;
        personsHtml = '<div class="flex overflow-x-auto gap-3 no-scrollbar -mx-4 px-4 py-1" id="cards-row">';
        for (var g = 1; g <= qty; g++) {
            var isV = verified[g];
            var isReg = !isPost || (order.registered && order.registered[g]);
            if (order.isNoRegister) isReg = true;
            var canSel = batchMode && canSelectCard(g);
            var isSel = batchMode && batchSelected[g];
            var isNoReg = order.isNoRegister;
            var cardCls = 'ticket-card flex-shrink-0 relative';
            if (batchMode && isSel) cardCls += ' outline outline-2 outline-brand-gold';
            if (batchMode && !canSel) cardCls += ' opacity-50';
            if (!batchMode && (isV || transferred[g] || refunded)) cardCls += ' opacity-50';

            personsHtml += '<div class="' + cardCls + '" style="width:80%;" ' + (canSel ? 'onclick="toggleBatchCardKeepScroll(' + g + ')"' : '') + ' id="card-' + g + '">';

            // 票券左侧色条
            personsHtml += '<div class="ticket-left-bar" style="background:#C27A00;"><div class="ticket-rotate-text">1039发现</div></div>';

            // 票券内容区
            personsHtml += '<div class="ticket-body">';

            // 批量模式：右上角勾选框
            if (batchMode) {
                if (isV) {
                    personsHtml += '<div class="absolute top-2 right-3 w-6 h-6 rounded-full bg-gray-300 flex items-center justify-center z-10"><i data-lucide="check" class="w-3.5 h-3.5 text-white"></i></div>';
                } else if (!canSel) {
                    personsHtml += '<div class="absolute top-2 right-3 w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center z-10"><i data-lucide="lock" class="w-3 h-3 text-gray-400"></i></div>';
                } else if (isSel) {
                    personsHtml += '<div class="absolute top-2 right-3 w-6 h-6 rounded-full bg-brand-gold flex items-center justify-center z-10"><i data-lucide="check" class="w-3.5 h-3.5 text-white"></i></div>';
                } else {
                    personsHtml += '<div class="absolute top-2 right-3 w-6 h-6 rounded-full border-2 border-gray-300 z-10"></div>';
                }
            }

            
            if (refunded) {
                // 已退款：保留原有内容，所有按钮隐藏，只显示"已退款"
                if (order.isNoRegister) {
                    personsHtml += '<div class="py-4 text-center"><p class="text-xs text-gray-500 mb-1">' + order.productName + '</p><p class="text-xs font-bold text-gray-700">' + order.specName.split(' × ')[0] + '</p></div>';
                } else if (order.isBooking && !isBooked) {
                    personsHtml += '<div class="py-3 text-center"><p class="text-xs text-gray-500 mb-1">请先预约使用时间后核销使用</p></div>';
                } else if (isPost && !isReg) {
                    personsHtml += '<div class="py-3 text-center"><p class="text-xs text-gray-500 mb-1">请登记报名信息后核销使用</p></div>';
                } else {
                    var existBk2 = (order.bookings || []).filter(function(bk){return bk.group === g;})[0];
                    if (existBk2) {
                        personsHtml += '<div class="py-2"><p class="text-xs text-gray-500">预约时间</p><p class="text-xs font-bold text-gray-700">' + existBk2.dateLabel + ' ' + existBk2.slot + '</p></div>';
                    }
                    (order.persons || []).filter(function(p){return p.group === g || (!p.group && g === 1);}).forEach(function(p){
                        if (p.name) {
                            personsHtml += '<div class="py-1 border-t border-gray-100 first:border-t-0"><p class="text-xs font-bold text-gray-700 mb-0.5">' + p.label + '</p><p class="text-xs text-gray-500 ml-1">姓名：' + p.name + '</p><p class="text-xs text-gray-500 ml-1">手机号：' + p.mobile + '</p>' + (p.idcard ? '<p class="text-xs text-gray-500 ml-1">身份证号：' + p.idcard + '</p>' : '') + '</div>';
                        } else {
                            personsHtml += '<div class="py-1 border-t border-gray-100 first:border-t-0"><p class="text-xs font-bold text-gray-700 mb-0.5">' + p.label + '</p></div>';
                        }
                    });
                }
                if (!batchMode) {
                    personsHtml += '<div style="text-align:center;margin-top:8px;"><span class="inline-block px-5 py-1.5 rounded-full text-xs font-bold bg-gray-200 text-gray-400 cursor-default">已退款</span></div>';
                }
            } else if (isNoReg) {
                personsHtml += '<div class="py-4 text-center"><p class="text-xs text-gray-500 mb-1">' + order.productName + '</p><p class="text-xs font-bold text-gray-700">' + order.specName.split(' × ')[0] + '</p></div>';
                if (!batchMode) {
                    var btnDisabled2 = isV;
                    var tfDisabled2 = isV || transferred[g];
                    personsHtml += '<div style="display:flex;justify-content:center;gap:8px;margin-top:8px;">\
                        <span class="inline-block px-5 py-1.5 rounded-full text-xs font-bold leading-none ' + (btnDisabled2 ? 'bg-gray-200 text-gray-400 cursor-default' : 'bg-brand-gold text-white cursor-pointer card-hover') + '" ' + (btnDisabled2 ? '' : 'onclick="showVerify(' + g + ')"') + ' style="' + (transferred[g] ? 'display:none;' : '') + '">' + (isV ? '已核销' : '核销') + '</span>\
                        <span class="inline-block px-5 py-1.5 rounded-full text-xs font-bold leading-none ' + (tfDisabled2 ? 'bg-gray-200 text-gray-400 cursor-default' : 'bg-brand-pink text-white cursor-pointer card-hover') + '" ' + (tfDisabled2 ? '' : 'onclick="showTransfer(' + g + ')"') + '>' + (transferred[g] ? '已转赠' : '转赠') + '</span>\
                    </div>';
                }
            } else if (order.isBooking) {
                var existBk = (order.bookings || []).filter(function(bk){return bk.group === g;})[0];
                if (!existBk) {
                    personsHtml += '<div class="py-3 text-center"><p class="text-xs text-gray-500 mb-1">请先预约使用时间后核销使用</p></div>';
                    if (!batchMode) {
                        var btTfDisabledBk = transferred[g];
                        personsHtml += '<div style="display:flex;justify-content:center;gap:8px;margin-top:8px;">\
                            <span class="inline-block px-5 py-1.5 rounded-full border border-brand-gold text-brand-gold text-xs font-bold cursor-pointer card-hover" style="' + (transferred[g] ? 'display:none;' : '') + '" onclick="showBooking(' + g + ')">预约</span>\
                            <span class="inline-block px-5 py-1.5 rounded-full text-xs font-bold leading-none ' + (btTfDisabledBk ? 'bg-gray-200 text-gray-400 cursor-default' : 'bg-brand-pink text-white cursor-pointer card-hover') + '" ' + (btTfDisabledBk ? '' : 'onclick="showTransfer(' + g + ')"') + '>' + (btTfDisabledBk ? '已转赠' : '转赠') + '</span>\
                        </div>';
                    }
                } else {
                    personsHtml += '<div class="py-2"><p class="text-xs text-gray-500">预约时间</p><p class="text-xs font-bold text-gray-700">' + existBk.dateLabel + ' ' + existBk.slot + '</p></div>';
                    (order.persons || []).filter(function(p){return p.group === g || (!p.group && g === 1);}).forEach(function(p){
                        personsHtml += '<div class="py-1 border-t border-gray-100 first:border-t-0"><p class="text-xs font-bold text-gray-700 mb-0.5">' + p.label + '</p><p class="text-xs text-gray-500 ml-1">姓名：' + p.name + '</p><p class="text-xs text-gray-500 ml-1">手机号：' + p.mobile + '</p></div>';
                    });
                    if (!batchMode) {
                        var btnDisabled = isV;
                        var tfDisabled = isV || transferred[g];
                        personsHtml += '<div style="display:flex;justify-content:center;gap:8px;margin-top:8px;">\
                            <span class="inline-block px-5 py-1.5 rounded-full text-xs font-bold leading-none ' + (btnDisabled ? 'bg-gray-200 text-gray-400 cursor-default' : 'bg-brand-gold text-white cursor-pointer card-hover') + '" ' + (btnDisabled ? '' : 'onclick="showVerify(' + g + ')"') + ' style="' + (transferred[g] ? 'display:none;' : '') + '">' + (isV ? '已核销' : '核销') + '</span>\
                            <span class="inline-block px-5 py-1.5 rounded-full text-xs font-bold leading-none ' + (tfDisabled ? 'bg-gray-200 text-gray-400 cursor-default' : 'bg-brand-pink text-white cursor-pointer card-hover') + '" ' + (tfDisabled ? '' : 'onclick="showTransfer(' + g + ')"') + '>' + (transferred[g] ? '已转赠' : '转赠') + '</span>\
                        </div>';
                    }

// ============ 批量操作 ============
function canSelectCard(g) {
    if (verified[g]) return false;
    if (transferred[g]) return false;
    if (batchType === 'book') {
        // 批量预约：已预约的不可选，后登记模式未登记的可选
        var isBooked = (order.bookings || []).filter(function(bk){return bk.group === g;}).length > 0;
        return !isBooked;
    } else {
        // 批量核销：后登记模式未登记不可选；预约模式未预约不可选
        if (order.isPostRegister && !(order.registered && order.registered[g])) return false;
        if (order.isBooking) {
            var isBooked2 = (order.bookings || []).filter(function(bk){return bk.group === g;}).length > 0;
            if (!isBooked2) return false;
        }
        return true;
    }
}

function enterBatch(type) {
    batchMode = true;
    batchType = type;
    batchSelected = {};
    render();
}

function cancelBatch() {
    batchMode = false;
    batchType = 'verify';
    batchSelected = {};
    render();
}

function selectAll() {
    var qty = order.quantity || 1;
    var allSel = true;
    for (var g = 1; g <= qty; g++) { if (canSelectCard(g) && !batchSelected[g]) { allSel = false; break; } }
    if (allSel) { for (var g2 = 1; g2 <= qty; g2++) { if (canSelectCard(g2)) delete batchSelected[g2]; } }
    else { for (var g3 = 1; g3 <= qty; g3++) { if (canSelectCard(g3)) batchSelected[g3] = true; } }
    render();
}

function toggleBatchCard(g) {
    if (!canSelectCard(g)) return;
    if (batchSelected[g]) { delete batchSelected[g]; } else { batchSelected[g] = true; }
    var row = document.getElementById('cards-row');
    var scrollLeft = row ? row.scrollLeft : 0;
    render();
    row = document.getElementById('cards-row');
    if (row) row.scrollLeft = scrollLeft;
}

function toggleBatchCardKeepScroll(g) { toggleBatchCard(g); }

    for (var i = 0; i < CALS.length; i++) {
        var cell = CALS[i];
        if (cell === null) {
            calHtml += '<div class="py-2 text-center text-xs text-gray-300"></div>';
        } else {
            var isPast = cell.isPast;
            var sel = bookingSelectedDateStr === cell.date.toISOString().slice(0,10);
            var cls = sel ? 'bg-brand-gold text-white rounded-full' : (isPast ? 'text-gray-300 cursor-default' : 'text-gray-700 cursor-pointer card-hover');
            calHtml += '<div class="py-2 text-center text-xs font-medium ' + cls + '" ' + (!isPast ? 'onclick="selectBookingDate(\'' + cell.date.toISOString().slice(0,10) + '\')"' : '') + '>' + cell.day + '</div>';
        }
    }

    var monthLabel = ((bookingCalMonth+1) + '月 ' + bookingCalYear + '年');
    var selDateLabel = bookingSelectedDateStr;
    var slotHtml = bookingSelectedDateStr ? TIME_SLOTS.map(function(s) {
        var avail = SLOTS_STATUS[s];
        var sel = bookingSelectedSlot === s;
        return '<div class="py-2.5 rounded-xl text-center text-xs font-medium border-2 transition-all ' + (sel ? 'border-brand-gold bg-brand-gold-light text-brand-gold cursor-pointer' : (avail ? 'border-gray-100 bg-white text-gray-600 cursor-pointer card-hover' : 'border-gray-100 bg-gray-100 text-gray-300 cursor-default')) + '" ' + (avail ? 'onclick="selectBookingSlot(\'' + s + '\')"' : '') + '>' + s + (avail ? '' : '（不可预约）') + '</div>';
    }).join('') : '<p class="text-xs text-gray-400 text-center py-4">请先选择日期</p>';

    // 后登记模式：时段后加登记表单（按要预约的卡数展开）
    var regFieldsHtml = '';
    if (order.isPostRegister && selDateLabel && bookingSelectedSlot) {
        var bkCards = bookingBatchGroups.length > 0 ? bookingBatchGroups : [bookingGroup];
        bkCards.forEach(function(cardG, gi) {
            regFieldsHtml += '<div class="border-t-2 border-dashed border-gray-200 my-3 pt-3"></div>';
            regFieldsHtml += '<h4 class="text-sm font-bold text-gray-800 mb-2">购票信息' + (bkCards.length > 1 ? (gi + 1) : '') + '</h4>';
            var labels = order.personLabels || ['购票人'];
            for (var p = 0; p < labels.length; p++) {
                regFieldsHtml += '\
                <div class="mb-3">\
                    <h5 class="text-xs font-bold text-gray-500 mb-2">' + labels[p] + '</h5>\
                    <div class="space-y-2">\
                        <div class="flex items-center gap-2">\
                            <span class="text-xs text-gray-400 w-12 flex-shrink-0">姓名</span>\
                            <input type="text" id="bk-name-' + cardG + '-' + p + '" value="小明" placeholder="请填写姓名" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none focus:border-brand-gold"/>\
                        </div>\
                        <div class="flex items-center gap-2">\
                            <span class="text-xs text-gray-400 w-12 flex-shrink-0">手机号</span>\
                            <input type="tel" id="bk-mobile-' + cardG + '-' + p + '" value="13912345678" placeholder="请填写手机号" class="flex-1 text-sm px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 outline-none focus:border-brand-gold"/>\
                        </div>\
                    </div>\
                </div>';
            }
        });
    }

    var canConfirm = selDateLabel && bookingSelectedSlot;
    if (order.isPostRegister) {
        canConfirm = canConfirm && bookingSelectedSlot; // always true if slot is set
    }

    document.getElementById('booking-form').innerHTML = '\
        <p class="text-xs text-gray-400 bg-amber-50 rounded-lg py-2 px-3 mb-3">⚠ 预约完成后不能修改，且本订单不再退款</p>\
        <div>\
            <label class="block text-sm font-bold text-gray-700 mb-2">选择日期</label>\
            <div class="flex items-center justify-between mb-2">\
                <span class="cursor-pointer card-hover px-2 py-1 rounded-lg bg-gray-100 text-sm" onclick="navCal(-1)"><i data-lucide="chevron-left" class="w-4 h-4"></i></span>\
                <span class="text-sm font-bold text-gray-800">' + monthLabel + '</span>\
                <span class="cursor-pointer card-hover px-2 py-1 rounded-lg bg-gray-100 text-sm" onclick="navCal(1)"><i data-lucide="chevron-right" class="w-4 h-4"></i></span>\
            </div>\
            <div class="grid grid-cols-7 gap-1">' + weekHeader + calHtml + '</div>\
        </div>\
        <div>\
            <label class="block text-sm font-bold text-gray-700 mb-2">选择时段</label>\
            <div class="grid grid-cols-3 gap-2">' + slotHtml + '</div>\
        </div>\
        ' + (regFieldsHtml ? '<div><label class="block text-sm font-bold text-gray-700 mb-2">购票信息</label>' + regFieldsHtml + '</div>' : '') + '\
        ' + (selDateLabel && bookingSelectedSlot ? '<div class="bg-gray-50 rounded-xl p-3 text-xs"><span class="text-gray-500">预约时间：</span><span class="font-bold text-gray-800">' + selDateLabel + ' ' + bookingSelectedSlot + '</span></div>' : '') + '\
        <span class="block text-center cursor-pointer w-full py-3 rounded-full bg-brand-gold text-white font-bold text-sm card-hover ' + (!canConfirm ? 'opacity-50' : '') + '" ' + (canConfirm ? 'onclick="confirmBooking()"' : '') + '>确认预约</span>\
    ';
    Common._icons(document.getElementById('booking-form'));
}

function navCal(dir) {
    bookingCalMonth += dir;
    if (bookingCalMonth < 0) { bookingCalMonth = 11; bookingCalYear--; }
    if (bookingCalMonth > 11) { bookingCalMonth = 0; bookingCalYear++; }
    renderBookingPopup();
}
function selectBookingDate(ds) { bookingSelectedDateStr = ds; bookingSelectedSlot = ''; renderBookingPopup(); }
function selectBookingSlot(s) { bookingSelectedSlot = s; renderBookingPopup(); }

function confirmBooking() {
    if (!bookingSelectedDateStr || !bookingSelectedSlot) return;
    Common.hidePopup('booking-overlay');

    if (bookingBatchGroups.length > 0) {
        bookingBatchGroups.forEach(function(g) {
            addBooking(g, bookingSelectedDateStr, bookingSelectedSlot);
        });
        Common.showToast('已预约' + bookingBatchGroups.length + '张门票');
        batchMode = false;
        batchType = 'verify';
        batchSelected = {};
    } else {
        addBooking(bookingGroup, bookingSelectedDateStr, bookingSelectedSlot);
        Common.showToast('预约成功！');
    }
    preserveScrollRender();
}

function addBooking(g, dateLabel, slot) {
    order.bookings = (order.bookings || []).filter(function(bk){return bk.group !== g;});
    order.bookings.push({group:g, dateLabel:dateLabel, slot:slot, count:1});

    // 后登记模式：保存购票人信息
    if (order.isPostRegister) {
        var labels = order.personLabels || ['购票人'];
        var bkPrefix = 'bk-name-' + g + '-';
        for (var p = 0; p < labels.length; p++) {
            var bkNameEl = document.getElementById(bkPrefix + p);
            if (!bkNameEl) continue;
            var target = null;
            for (var i = 0; i < order.persons.length; i++) {
                if (order.persons[i].group === g && order.persons[i].label === labels[p]) {
                    target = order.persons[i]; break;
                }
            }
            if (target) {
                target.name = bkNameEl.value;
                var mobilePrefix = bkPrefix.replace('name','mobile');
                target.mobile = document.getElementById(mobilePrefix + p).value;
            }
        }
        if (!order.registered) order.registered = {};
        order.registered[g] = true;
    }

    localStorage.setItem('lastOrder', JSON.stringify(order));
}

function batchBook() {
    var selCount = 0;
    bookingBatchGroups = [];
    for (var k in batchSelected) { if (batchSelected[k]) { bookingBatchGroups.push(parseInt(k)); selCount++; } }
    if (selCount === 0) return;
    bookingGroup = 0;
    bookingSelectedDateStr = '';
    bookingSelectedSlot = '';
    bookingCalMonth = (new Date()).getMonth();
    bookingCalYear = (new Date()).getFullYear();
    TIME_SLOTS.forEach(function(s) { SLOTS_STATUS[s] = Math.random() > 0.2; });
    renderBookingPopup();
    document.getElementById('booking-step-title').textContent = '批量预约（' + selCount + '张）';
    Common.showPopup('booking-overlay');
}

// ============ 发票功能 ============
function showInvoiceOverlay() {
    // 预填开票信息
    document.getElementById('invoice-title').value = '北京某某科技有限公司';
    document.getElementById('invoice-tax').value = '91110108XXXXXXXXXX';
    document.getElementById('invoice-email').value = 'example@qq.com';
    // 默认企业类型
    currentInvoiceType = '企业';
    var typeBtns = document.querySelectorAll('#invoice-type-group span');
    if (typeBtns.length >= 2) {
        typeBtns[0].className = 'flex-1 text-center cursor-pointer py-2.5 rounded-full text-sm font-bold transition-colors bg-brand-gold text-white';
        typeBtns[1].className = 'flex-1 text-center cursor-pointer py-2.5 rounded-full text-sm font-bold transition-colors bg-gray-100 text-gray-500';
    }
    document.getElementById('invoice-tax-group').style.display = 'block';
    Common.showPopup('invoice-overlay');
    Common._icons(document.getElementById('invoice-overlay'));
}

function hideInvoiceOverlay(e) { Common.closePopup(e, 'invoice-overlay'); }

function switchInvoiceType(type, el) {
    currentInvoiceType = type;
    var btns = document.querySelectorAll('#invoice-type-group span');
    for (var i = 0; i < btns.length; i++) {
        btns[i].className = btns[i] === el
            ? 'flex-1 text-center cursor-pointer py-2.5 rounded-full text-sm font-bold transition-colors bg-brand-gold text-white'
            : 'flex-1 text-center cursor-pointer py-2.5 rounded-full text-sm font-bold transition-colors bg-gray-100 text-gray-500';
    }
    document.getElementById('invoice-tax-group').style.display = type === '企业' ? 'block' : 'none';
    if (type === '个人') {
        document.getElementById('invoice-title').value = '张三';
        document.getElementById('invoice-tax').value = '';
    } else {
        document.getElementById('invoice-title').value = '北京某某科技有限公司';
        document.getElementById('invoice-tax').value = '91110108XXXXXXXXXX';
    }
}

function submitInvoice() {
    var title = document.getElementById('invoice-title').value.trim();
    var tax = document.getElementById('invoice-tax').value.trim();
    var email = document.getElementById('invoice-email').value.trim();

    if (!title) { Common.showToast('请填写发票抬头'); return; }
    if (currentInvoiceType === '企业' && !tax) { Common.showToast('请填写税号'); return; }
    if (!email) { Common.showToast('请填写接收邮箱'); return; }

    // 生成发票记录
    var now = new Date();
    var timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    var invoice = {
        id: 'INV' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0') + String(now.getSeconds()).padStart(2,'0'),
        orderNo: order.orderNo,
        productName: order.productName,
        specName: order.specName,
        amount: order.price,
        type: currentInvoiceType,
        title: title,
        taxNumber: tax,
        email: email,
        status: 'pending',
        applyTime: timeStr
    };

    // 存入 localStorage
    var invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
    invoices.unshift(invoice);
    localStorage.setItem('invoices', JSON.stringify(invoices));

    invoiceApplied = true;
    Common.hidePopup('invoice-overlay');
    Common.showToast('发票申请已提交！');
    render();
}

// 启动时检查是否已申请过发票
(function() {
    var invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
    for (var i = 0; i < invoices.length; i++) {
        if (invoices[i].orderNo === order.orderNo) {
            invoiceApplied = true;
            break;
        }
    }
})();

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
