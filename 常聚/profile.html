<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>常聚 · 资料完善</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="cj-theme">
<div id="app" class="cj-page"></div>
<script src="vendor/lucide.min.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
window.ProfileView = (function () {
    const HOBBIES = ['摄影', '飞盘', '探店', '麻将', '羽毛球', '游戏', '旅行', '音乐', '读书', '烘焙', '电影', '爬山'];
    const MBTI_LIST = ['ENFP', 'INFP', 'ENFJ', 'INFJ', 'ENTP', 'INTP', 'ENTJ', 'INTJ', 'ESFP', 'ISFP', 'ESTP', 'ISTP', 'ESFJ', 'ISFJ', 'ESTJ', 'ISTJ'];
    const FREE_TIME = ['随时有空', '工作日晚上', '周末', '节假日'];
    const AREAS = ['国贸', '中关村', '望京', '西单', '三里屯', '亚运村', '五道口', '簋街'];

    function chips(list, picked, onClick) {
        return '<div style="display:flex;flex-wrap:wrap;gap:8px">' + list.map(k =>
            '<span class="' + (picked.includes(k) ? 'cj-chip-warm' : 'cj-chip') + '" style="cursor:pointer" onclick="' + onClick + '(\'' + k + '\')">' + k + '</span>').join('') + '</div>';
    }

    function locCard(label, key, area, onClick) {
        return '<div class="cj-card">' +
            '<div class="cj-title" style="font-size:14px;margin-bottom:10px">' + label + ' · 定位到商圈级</div>' +
            '<div class="cj-row" style="gap:6px;margin-bottom:10px">' +
                '<span class="cj-pill cj-pill-due" style="cursor:pointer" onclick="' + onClick + '(\'' + area + '\')">📍 重新定位</span>' +
                '<span class="cj-pill cj-pill-plain">' + area + '</span>' +
            '</div>' +
            chips(AREAS, [area], onClick) +
            '<div class="cj-sub" style="margin-top:8px">只用于组局推荐，不展示具体地址</div>' +
        '</div>';
    }

    function render() {
        const s = window.ProfileView;
        return '<div class="cj-px" style="padding-top:20px">' +
            '<div class="cj-title" style="font-size:20px">' + (s._edit ? '编辑资料' : '完善资料，让组局更懂你') + '</div>' +
            '<div class="cj-sub" style="margin-top:8px;margin-bottom:20px">这些信息只用于智能组局推荐，不向圈友展示</div>' +
            '<div class="cj-card">' +
                '<div class="cj-title" style="font-size:14px;margin-bottom:10px">出生日期</div>' +
                '<input type="date" id="birthInput" value="' + s._birth + '" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;font-size:14px;background:var(--cream)">' +
            '</div>' +
            '<div class="cj-card">' +
                '<div class="cj-title" style="font-size:14px;margin-bottom:10px">个人爱好（可多选）</div>' +
                chips(HOBBIES, s._hobbies, 'window.ProfileView.toggleHobby') +
            '</div>' +
            '<div class="cj-card">' +
                '<div class="cj-title" style="font-size:14px;margin-bottom:10px">MBTI</div>' +
                chips(MBTI_LIST, [s._mbti], 'window.ProfileView.pickMbti') +
            '</div>' +
            '<div class="cj-card">' +
                '<div class="cj-title" style="font-size:14px;margin-bottom:10px">空闲时间（可多选）</div>' +
                chips(FREE_TIME, s._freeTime, 'window.ProfileView.toggleFreeTime') +
            '</div>' +
            locCard('工作地点', 'work', s._workArea, 'window.ProfileView.pickWorkArea') +
            locCard('住处', 'home', s._homeArea, 'window.ProfileView.pickHomeArea') +
            '<button class="cj-btn cj-btn-block" onclick="window.ProfileView.submit()">完成</button>' +
            '<div style="text-align:center;margin-top:14px;padding-bottom:16px">' +
                '<span class="cj-sub" style="cursor:pointer;text-decoration:underline" onclick="window.ProfileView.skip()">先跳过，以后再完善</span>' +
            '</div>' +
        '</div>';
    }

    function toggleHobby(k) {
        const i = window.ProfileView._hobbies.indexOf(k);
        if (i >= 0) window.ProfileView._hobbies.splice(i, 1);
        else window.ProfileView._hobbies.push(k);
        refresh();
    }
    function pickMbti(k) {
        window.ProfileView._mbti = k;
        refresh();
    }
    function toggleFreeTime(k) {
        const i = window.ProfileView._freeTime.indexOf(k);
        if (i >= 0) window.ProfileView._freeTime.splice(i, 1);
        else window.ProfileView._freeTime.push(k);
        refresh();
    }
    function pickWorkArea(k) { window.ProfileView._workArea = k; refresh(); }
    function pickHomeArea(k) { window.ProfileView._homeArea = k; refresh(); }

    function refresh() {
        document.getElementById('app').innerHTML = render();
        if (window.lucide) window.lucide.createIcons();
    }

    // 完成：资料并入 cj.user，跳最终目标
    function submit() {
        const s = window.ProfileView;
        const birthEl = document.getElementById('birthInput');
        s._birth = birthEl && birthEl.value ? birthEl.value : s._birth;
        try {
            const raw = window.localStorage.getItem('cj.user');
            const base = raw ? JSON.parse(raw) : {};
            window.localStorage.setItem('cj.user', JSON.stringify({
                ...base,
                birthDate: s._birth,
                hobbies: s._hobbies.slice(),
                mbti: s._mbti,
                freeTime: s._freeTime.slice(),
                workArea: s._workArea,
                homeArea: s._homeArea
            }));
        } catch (e) { /* noop */ }
        window.Common.showToast(s._edit ? '资料已更新' : '资料已完善，开始常聚');
        window.location.href = s._edit ? 'me.html' : (s._next || 'index.html');
    }

    function skip() {
        window.Common.showToast('已跳过，以后可以在个人中心完善');
        window.location.href = window.ProfileView._edit ? 'me.html' : (window.ProfileView._next || 'index.html');
    }

    return { render, toggleHobby, pickMbti, toggleFreeTime, pickWorkArea, pickHomeArea, submit, skip };
})();
(function () {
    const G = window.GlobalData.user;
    const params = new URLSearchParams(window.location.search);
    const P = window.ProfileView;
    P._edit = params.get('edit') === '1';
    P._next = params.get('next') || 'index.html';
    // 默认值：已注册资料 > 演示用户资料
    let saved = null;
    try { saved = JSON.parse(window.localStorage.getItem('cj.user') || 'null'); } catch (e) { /* noop */ }
    P._birth = (saved && saved.birthDate) || G.birthDate || '1998-06-15';
    P._hobbies = (saved && saved.hobbies) || G.tags || [];
    P._mbti = (saved && saved.mbti) || G.mbti || 'ENFP';
    P._freeTime = (saved && saved.freeTime) || G.freeTime || ['周末'];
    P._workArea = (saved && saved.workArea) || G.workArea || '国贸';
    P._homeArea = (saved && saved.homeArea) || G.homeArea || '朝阳';
    document.getElementById('app').innerHTML = window.ProfileView.render();
})();
</script>
</body>
</html>
