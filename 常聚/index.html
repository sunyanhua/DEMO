<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>常聚 · 圈子</title>
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="cj-theme">
<div id="app" class="cj-page"></div>
<script src="vendor/lucide.min.js"></script>
<script src="data.js"></script>
<script src="rotation.js"></script>
<script src="common.js"></script>
<script>
window.IndexView = (function () {
    const TYPE_LABEL = { mahjong: '麻将', dinner: '饭局', ball: '球局', outdoor: '户外', exhibit: '看展', ktv: 'K歌' };

    function statusLine(circle) {
        const G = window.GlobalData;
        if (circle.proposalId) {
            const p = (G.proposals || []).find(x => x.id === circle.proposalId);
            if (p && p.status === 'open') return '<span class="cj-pill cj-pill-due">提案进行中</span>';
        }
        const g = (G.gatherings || []).find(x => x.id === circle.lastGatheringId);
        const now = window.Common.fmtDate(window.Demo.getNow());
        const r = window.Rotation.checkRhythm({ circle, lastGatheringTime: g ? g.time : null, now });
        if (r.due) return '<span class="cj-pill cj-pill-due">已 ' + r.daysSince + ' 天没聚，该张罗啦</span>';
        if (circle.rhythm && g && r.daysSince !== null) {
            const days = circle.rhythm.unit === 'week' ? circle.rhythm.n * 7 : circle.rhythm.n * 30;
            return '<span class="cj-pill cj-pill-plain">距下次相聚还有 ' + (days - r.daysSince) + ' 天</span>';
        }
        return '<span class="cj-pill cj-pill-plain">随心而聚</span>';
    }

    function circleCard(c) {
        const members = c.members || [];
        const host = members.find(m => m.id === c.hostId);
        const lastG = window.GlobalData.gatherings.find(g => g.id === c.lastGatheringId);
        const thumb = lastG && lastG.photos && lastG.photos[0] ? lastG.photos[0]
            : (c.cover || 'images/cover-1.png');
        return '<a class="cj-card" style="display:flex;gap:14px;align-items:center;padding:14px;text-decoration:none" href="circle.html?id=' + c.id + '">' +
            '<img src="' + thumb + '" style="width:58px;height:58px;border-radius:14px;object-fit:cover" alt="上次合影">' +
            '<div style="flex:1">' +
                '<div class="cj-title" style="font-size:16px;margin-bottom:6px">' + c.name + '</div>' +
                '<span class="cj-pill cj-pill-plain">' + (TYPE_LABEL[c.type] || c.type) + ' · ' + members.length + ' 位圈友</span> ' + statusLine(c) +
            '</div>' +
            (host ? '<img src="' + host.avatarUrl + '" class="cj-avatar-ring" style="width:36px;height:36px;flex-shrink:0" alt="当值">' : '') +
        '</a>';
    }

    function render() {
        const G = window.GlobalData;
        const circles = G.circles || [];
        const list = circles.map(circleCard).join('');
        const empty = circles.length ? '' : '<div class="cj-empty">还没有圈子，建一个吧<br>常聚常伴，圈子不散</div>';
        return window.Common.renderShell('圈子') +
            '<div class="cj-cityline"><span style="cursor:pointer" onclick="window.Common.showToast(\'多城市能力预留\')">北京 · ' + circles.length + ' 个圈子</span></div>' +
            '<div class="cj-px">' + list + empty + '</div>' +
            '<div class="cj-px" style="text-align:center;padding-top:10px;padding-bottom:16px">' +
                '<a class="cj-btn-outline" style="width:100%;font-size:14px;padding:11px 0" href="create.html">＋ 建圈子</a>' +
            '</div>' + window.Common.renderTabbar('circles');
    }

    return { render };
})();
document.getElementById('app').innerHTML = window.IndexView.render();
window.Common.initIcons();
window.Demo.mountFab();
</script>
</body>
</html>
