<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>常聚 · 张罗个局</title>
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="cj-theme">
<div id="app" class="cj-page"></div>
<script src="vendor/lucide.min.js"></script>
<script src="data.js"></script>
<script src="rotation.js"></script>
<script src="recommend.js"></script>
<script src="common.js"></script>
<script src="zuju.js"></script>
<script>
window.ProposeView = (function () {
    const CATEGORY_LABELS = { mahjong: '麻将', dinner: '饭局', ball: '球局', outdoor: '户外', exhibit: '看展', ktv: 'K歌' };
    const CATEGORY_BY_TYPE = { mahjong: 'mahjong', dinner: 'dinner', ball: 'ball', outdoor: 'outdoor', exhibit: 'exhibit', ktv: 'ktv', classmate: 'dinner', colleague: 'dinner' };
    let circleId = null;

    function build(circleIdArg, opts) {
        return window.Zuju.buildProposal(circleIdArg, opts);
    }

    function previewHTML(p) {
        const G = window.GlobalData;
        const project = G.projects.find(x => x.id === p.projectId);
        const venues = p.venueIds.map(id => G.venues.find(v => v.id === id)).filter(Boolean);
        return '<div class="cj-card">' +
            '<div class="cj-title" style="font-size:15px;margin-bottom:12px">✨ 智能提案已生成</div>' +
            '<div class="cj-row" style="gap:8px;margin-bottom:10px;align-items:flex-start">' +
                '<span class="cj-sub" style="width:52px;padding-top:6px">项目</span>' +
                '<span style="flex:1">' +
                    (p.projectId === 'pending'
                        ? '<span class="cj-pill cj-pill-due">待定（圈友投票）</span>'
                        : '<span class="cj-pill cj-pill-due">' + (project ? project.name : p.projectId) + '</span>') +
                    ' <span class="cj-sub" style="cursor:pointer;text-decoration:underline" onclick="window.ProposeView.togglePending()">改为待定</span>' +
                '</span>' +
            '</div>' +
            '<div class="cj-row" style="gap:8px;margin-bottom:10px;align-items:flex-start">' +
                '<span class="cj-sub" style="width:52px;padding-top:6px">地点</span>' +
                '<span style="flex:1;display:flex;flex-wrap:wrap;gap:6px">' +
                    venues.map(v => '<span class="cj-pill cj-pill-plain">' + v.name + ' · ' + v.businessArea + '</span>').join('') +
                '</span>' +
            '</div>' +
            '<div class="cj-row" style="gap:8px;align-items:flex-start">' +
                '<span class="cj-sub" style="width:52px;padding-top:6px">时间</span>' +
                '<span style="flex:1;display:flex;flex-wrap:wrap;gap:6px">' +
                    p.timeCandidates.map((t, i) =>
                        '<span class="cj-pill cj-pill-plain">' + t +
                        '<span style="cursor:pointer;font-weight:800" onclick="window.ProposeView.removeTime(' + i + ')"> ×</span></span>').join('') +
                    '<span class="cj-pill cj-pill-due" style="cursor:pointer" onclick="window.ProposeView.addTime()">＋ 加时间</span>' +
                '</span>' +
            '</div>' +
            '<div class="cj-sub" style="margin-top:12px">截止：' + p.deadline + ' · 圈友表态后自动定案</div>' +
        '</div>';
    }

    function render(circleIdArg) {
        circleId = circleIdArg || 'c1';
        const circle = window.GlobalData.circles.find(c => c.id === circleId);
        if (!circle) return window.Common.renderShell('张罗个局') + '<div class="cj-empty">圈子不存在</div>';
        window.ProposeView._category = CATEGORY_BY_TYPE[circle.type] || null;
        return window.Common.renderShell('张罗个局') +
            '<div class="cj-px" style="padding-top:6px">' +
                '<div class="cj-sub" style="margin-bottom:12px">在「' + circle.name + '」组一局，智能提案帮你定项目、地点、时间</div>' +
                '<div class="cj-title" style="font-size:14px;margin-bottom:10px">组局方向</div>' +
                '<div id="catRow" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">' +
                    Object.keys(CATEGORY_LABELS).map(k =>
                        '<span id="cat-' + k + '" class="' + (window.ProposeView._category === k ? 'cj-chip-warm' : 'cj-chip') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickCategory(\'' + k + '\')">' + CATEGORY_LABELS[k] + '</span>').join('') +
                    '<span id="cat-auto" class="cj-chip" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickCategory(null)">让系统推荐</span>' +
                '</div>' +
                '<div id="proposeBody">' +
                    '<button class="cj-btn cj-btn-block" onclick="window.ProposeView.generate()">一键生成智能提案</button>' +
                '</div>' +
            '</div>' + window.Common.renderTabbar('circles');
    }

    function pickCategory(cat) {
        window.ProposeView._category = cat;
        const cats = document.querySelectorAll('#catRow span');
        if (cats && cats.forEach) {
            cats.forEach(el => {
                const key = el.getAttribute('id');
                const mine = cat === null ? key === 'cat-auto' : key === 'cat-' + cat;
                el.className = mine ? 'cj-chip-warm' : 'cj-chip';
            });
        }
    }

    function generate() {
        const p = window.Zuju.buildProposal(circleId, { category: window.ProposeView._category || null });
        if (!p) return;
        document.getElementById('proposeBody').innerHTML =
            previewHTML(p) +
            '<button class="cj-btn cj-btn-block" style="margin-top:4px" onclick="window.ProposeView.send()">发出提案，请圈友表态</button>';
    }

    function send() {
        window.Common.showToast('提案已发出，等圈友表态');
        window.location.href = 'vote.html?proposal=' + (window.GlobalData.circles.find(c => c.id === circleId) || {}).proposalId;
    }

    function togglePending() {
        const c = window.GlobalData.circles.find(x => x.id === circleId);
        if (!c || !c.proposalId) return;
        const p = window.GlobalData.proposals.find(x => x.id === c.proposalId);
        window.Zuju.markProjectPending(p.id);
        document.getElementById('proposeBody').innerHTML = previewHTML(p) +
            '<button class="cj-btn cj-btn-block" style="margin-top:4px" onclick="window.ProposeView.send()">发出提案，请圈友表态</button>';
    }

    function addTime() {
        const c = window.GlobalData.circles.find(x => x.id === circleId);
        if (!c || !c.proposalId) return;
        const p = window.GlobalData.proposals.find(x => x.id === c.proposalId);
        const d = window.Demo.getNow();
        const nd = new Date(d.getTime() + (p.timeCandidates.length + 3) * 24 * 3600 * 1000);
        p.timeCandidates.push(window.Common.fmtDate(nd).slice(0, 10) + ' 14:00');
        window.Common.save();
        document.getElementById('proposeBody').innerHTML = previewHTML(p) +
            '<button class="cj-btn cj-btn-block" style="margin-top:4px" onclick="window.ProposeView.send()">发出提案，请圈友表态</button>';
    }

    function removeTime(i) {
        const c = window.GlobalData.circles.find(x => x.id === circleId);
        if (!c || !c.proposalId) return;
        const p = window.GlobalData.proposals.find(x => x.id === c.proposalId);
        if (p.timeCandidates.length <= 1) { window.Common.showToast('至少保留一个时间候选'); return; }
        p.timeCandidates.splice(i, 1);
        window.Common.save();
        document.getElementById('proposeBody').innerHTML = previewHTML(p) +
            '<button class="cj-btn cj-btn-block" style="margin-top:4px" onclick="window.ProposeView.send()">发出提案，请圈友表态</button>';
    }

    return { render, build, generate, send, togglePending, addTime, removeTime, pickCategory };
})();
(function () {
    const params = new URLSearchParams(window.location.search);
    document.getElementById('app').innerHTML = window.ProposeView.render(params.get('circle'));
})();
window.Common.initIcons();
window.Demo.mountFab();
</script>
</body>
</html>
