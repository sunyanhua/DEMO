<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>常聚 · 组局</title>
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="cj-theme">
<div id="app" class="cj-page"></div>
<script src="vendor/lucide.min.js"></script>
<script src="data.js"></script>
<script src="rotation.js"></script>
<script src="recommend.js"></script>
<script src="common.js"></script>
<script src="zuju.js"></script>
<script>
window.ProposeView = (function () {
    const CATEGORY_LABELS = { dinner: '饭局', ball: '运动', mahjong: '棋牌', outdoor: '户外', exhibit: '看展', ktv: 'K歌' };
    const TIER_LABEL = { economy: '经济实惠', mid: '中等档', premium: '中高端' };
    const MAX_VENUES = 3;
    const MAX_PROJECTS = 3;

    function stepsBar(step) {
        const items = [['圈子', ''], ['活动', '项目'], ['时间', '地点'], ['邀请', '卡片']];
        return '<div class="cj-steps">' + items.map((it, i) => {
            const n = i + 1;
            const cls = n < step ? 'done' : (n === step ? 'active' : 'pending');
            const label = it[1] ? it[0] + '<br>' + it[1] : it[0];
            return '<div class="cj-step ' + cls + '"><div class="cj-step-dot">' + (n < step ? '✓' : n) + '</div><div class="cj-step-label">' + label + '</div></div>' +
                (i < 3 ? '<div class="cj-step-line' + (n < step ? ' done' : '') + '"></div>' : '');
        }).join('') + '</div>';
    }

    function projectCards(category) {
        const G = window.GlobalData;
        const pool = (G.projects || []).filter(p => p.category === category);
        if (!pool.length) return '<div class="cj-sub">该类别暂无项目</div>';
        return pool.map(p => {
            const on = window.ProposeView._projectId === p.id;
            return '<div class="cj-wiz-card" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border:1.5px solid ' + (on ? '#E08A3C' : '#E5E7EB') + '" onclick="window.ProposeView.pickProject(\'' + p.id + '\')">' +
                '<div><div style="font-weight:700;color:#111827;font-size:14px">' + p.name + (on ? ' ✓' : '') + '</div>' +
                '<div style="font-size:12px;color:#9CA3AF;margin-top:4px">' + (p.tags || []).join(' · ') + '</div></div>' +
            '</div>';
        }).join('');
    }

    function venueCards(projectId) {
        const G = window.GlobalData;
        const primary = G.projects.find(p => p.id === projectId);
        let pool = primary ? (G.venues || []).filter(v => v.category === primary.category) : (G.venues || []);
        const filtered = pool.length > 0;
        if (!pool.length) pool = G.venues || [];
        return (filtered ? '' : '<div class="cj-sub" style="margin-bottom:10px">该类别暂无专属商户，展示全部地点</div>') +
            pool.map(v => {
                const on = window.ProposeView._venueIds.includes(v.id);
                return '<div class="cj-wiz-card" style="cursor:pointer;padding:12px 16px;border:1.5px solid ' + (on ? '#E08A3C' : '#E5E7EB') + '" onclick="window.ProposeView.toggleVenue(\'' + v.id + '\')">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center">' +
                        '<div><div style="font-weight:700;color:#111827;font-size:14px">' + v.name + (on ? ' ✓' : '') + '</div>' +
                        '<div style="font-size:12px;color:#9CA3AF;margin-top:4px">' + v.district + v.businessArea + ' · ' + (TIER_LABEL[v.spendTier] || v.spendTier) + ' · ⭐' + v.rating + '</div></div>' +
                        (v.isPartner ? '<span style="font-size:11px;color:#E08A3C;font-weight:700">合作</span>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
    }

    // 第 1 步：建圈子或选择已有圈子
    function renderNew() {
        const G = window.GlobalData;
        const circles = G.circles || [];
        const newUser = window.ProposeView._newUser;
        const typeChips = (window.Zuju.CIRCLE_TYPES || []).map(t =>
            '<span id="ct-' + t.key + '" class="cj-chip' + (window.ProposeView._circleType === t.key ? ' cj-chip-warm' : '') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickCircleType(\'' + t.key + '\')">' + t.label + '</span>').join('');
        const existing = (!newUser && circles.length)
            ? '<div class="cj-section-head"><b>或选择已有圈子</b></div>' +
              circles.map(c =>
                '<a class="cj-card" style="display:flex;gap:14px;align-items:center;padding:14px;text-decoration:none" href="propose.html?circle=' + c.id + '">' +
                    '<img src="' + ((c.members || [])[0] ? c.members[0].avatarUrl : 'images/avatar-1.png') + '" class="cj-avatar-ring" style="width:44px;height:44px" alt="">' +
                    '<div style="flex:1"><div class="cj-title" style="font-size:15px">在「' + c.name + '」组一局</div>' +
                    '<div class="cj-sub" style="margin-top:4px">' + (c.members || []).length + ' 位圈友</div></div>' +
                    '<span class="cj-pill cj-pill-due">去组局 ›</span>' +
                '</a>').join('')
            : '';
        return window.Common.renderShell('') +
            '<div class="cj-px" style="padding-top:12px">' + stepsBar(1) +
                '<div class="cj-wiz-card">' +
                    '<h3 class="cj-wiz-h3">新建圈子</h3>' +
                    '<div style="margin-bottom:16px">' +
                        '<label class="cj-field-label">圈子类型</label>' +
                        '<div style="display:flex;flex-wrap:wrap;gap:8px">' + typeChips + '</div>' +
                    '</div>' +
                    '<div style="margin-bottom:8px">' +
                        '<label class="cj-field-label">圈子叫什么</label>' +
                        '<input id="circleName" class="cj-field-input" placeholder="给圈子起个名字吧">' +
                    '</div>' +
                    '<button class="cj-btn-grad" style="margin-top:12px" onclick="window.ProposeView.createAndContinue()">创建圈子，继续组局</button>' +
                '</div>' +
            '</div>' + existing +
            window.Common.renderTabbar('zuju');
    }

    function pickCircleType(key) {
        window.ProposeView._circleType = key;
        const t = (window.Zuju.CIRCLE_TYPES || []).find(x => x.key === key);
        const input = document.getElementById('circleName');
        if (input && input.value !== undefined && t) input.value = t.suggest;
        const chips = document.querySelectorAll('[id^="ct-"]');
        if (chips && chips.forEach) {
            chips.forEach(el => {
                el.className = 'cj-chip' + (el.id === 'ct-' + key ? ' cj-chip-warm' : '');
            });
        }
    }

    // 建圈成功 → 第 2 步选项目（预填默认时间候选与项目类别方向）；类型必须由用户选择
    function createAndContinue(opts) {
        const o = opts || {};
        const input = document.getElementById('circleName');
        const name = o.name || (input && input.value ? input.value.trim() : '');
        const type = o.type || window.ProposeView._circleType || null;
        if (!type) {
            window.Common.showToast('先选一个圈子类型吧');
            return null;
        }
        const circle = window.Zuju.createCircle({ name, type });
        if (!circle) return null;
        window.ProposeView._circleId = circle.id;
        window.ProposeView._projCategory = { boardgame: 'mahjong', sport: 'ball', dinner: 'dinner', ball: 'ball', mahjong: 'mahjong', outdoor: 'outdoor', exhibit: 'exhibit', ktv: 'ktv', classmate: 'dinner', colleague: 'dinner', family: 'dinner', hobby: 'exhibit' }[circle.type] || 'dinner';
        window.ProposeView._times = window.Recommend.suggestTimes({ members: circle.members, count: 3, now: window.Common.fmtDate(window.Demo.getNow()) });
        window.ProposeView.gotoStep(2);
        return circle;
    }

    function gotoStep(n) {
        window.ProposeView._step = n;
        document.getElementById('app').innerHTML = renderStep(n);
        if (window.lucide) window.lucide.createIcons();
    }

    // 第 2 步：选活动项目（单选）+ 备注说明（非必填）
    function renderStep2() {
        const G = window.GlobalData;
        const circle = G.circles.find(c => c.id === window.ProposeView._circleId);
        const cat = window.ProposeView._projCategory || 'dinner';
        const catChips = Object.keys(CATEGORY_LABELS).map(k =>
            '<span id="pc-' + k + '" class="cj-chip' + (cat === k ? ' cj-chip-warm' : '') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickProjectCategory(\'' + k + '\')">' + CATEGORY_LABELS[k] + '</span>').join('');
        return window.Common.renderShell('') +
            '<div class="cj-px" style="padding-top:12px">' + stepsBar(2) +
                '<div class="cj-sub" style="margin-bottom:10px">「' + circle.name + '」这一局，玩什么？</div>' +
                '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">' + catChips + '</div>' +
                projectCards(cat) +
                '<div class="cj-wiz-card">' +
                    '<label class="cj-field-label">备注说明（非必填）</label>' +
                    '<input id="noteInput" class="cj-field-input" value="' + window.ProposeView._note + '" placeholder="如：打完球附近一起吃个饭">' +
                '</div>' +
                '<button class="cj-btn-grad" style="margin-top:4px" onclick="window.ProposeView.gotoStep(3)">下一步：选时间地点</button>' +
            '</div>' + window.Common.renderTabbar('zuju');
    }

    function pickProjectCategory(k) {
        window.ProposeView._projCategory = k;
        gotoStep(2);
    }

    function pickProject(id) {
        window.ProposeView._projectId = id;
        gotoStep(2);
    }

    // 第 3 步：上区=时间（指定/候选投票），下区=地点（指定推荐/候选投票）
    function timeSection() {
        const P = window.ProposeView;
        const times = P._times;
        const isFixed = P._timeMode === 'fixed';
        const rows = isFixed
            ? '<div style="display:flex;gap:8px;align-items:center">' +
                '<input data-time="0" class="cj-field-input" style="flex:1" value="' + (times[0] || '') + '" placeholder="格式：2026-11-21 14:00">' +
              '</div>' +
              '<div class="cj-sub" style="margin-top:8px">时间已定，圈友确认能否出席</div>'
            : times.map((t, i) =>
                '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">' +
                    '<input data-time="' + i + '" class="cj-field-input" style="flex:1" value="' + t + '" placeholder="格式：2026-11-21 14:00">' +
                    (times.length > 1 ? '<span style="color:#9CA3AF;cursor:pointer" onclick="window.ProposeView.removeTime(' + i + ')">✕</span>' : '') +
                '</div>').join('') +
                '<span class="cj-pill cj-pill-due" style="cursor:pointer" onclick="window.ProposeView.addTime()">＋ 添加时间</span>' +
                '<div class="cj-sub" style="margin-top:8px">圈友勾选各自方便的时间，人最齐的自动胜出</div>';
        const modePills = ['fixed', 'candidates'].map(m =>
            '<span class="cj-chip' + (P._timeMode === m ? ' cj-chip-warm' : '') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickTimeMode(\'' + m + '\')">' + (m === 'fixed' ? '指定时间' : '时间候选') + '</span>').join('');
        return '<div class="cj-wiz-card">' +
            '<h3 class="cj-wiz-h3">什么时候聚？</h3>' +
            '<div class="cj-sub" style="margin-bottom:12px">直接定下时间，或者给几个候选，让圈友一起定</div>' +
            '<div style="display:flex;gap:8px;margin-bottom:12px">' + modePills + '</div>' +
            rows +
        '</div>';
    }

    function fixedVenueCards(projectId) {
        const G = window.GlobalData;
        const primary = G.projects.find(p => p.id === projectId);
        let pool = primary ? (G.venues || []).filter(v => v.category === primary.category) : (G.venues || []);
        if (!pool.length) pool = G.venues || [];
        // 合作地点优先（稳定排序）
        const sorted = pool.slice().sort((a, b) => (b.isPartner ? 1 : 0) - (a.isPartner ? 1 : 0));
        return sorted.map(v => {
            const on = window.ProposeView._venueIds[0] === v.id;
            return '<div class="cj-wiz-card" style="cursor:pointer;padding:12px 16px;border:1.5px solid ' + (on ? '#E08A3C' : '#E5E7EB') + '" onclick="window.ProposeView.pickFixedVenue(\'' + v.id + '\')">' +
                '<div style="display:flex;justify-content:space-between;align-items:center">' +
                    '<div><div style="font-weight:700;color:#111827;font-size:14px">' + v.name + (on ? ' ✓' : '') + '</div>' +
                    '<div style="font-size:12px;color:#9CA3AF;margin-top:4px">' + v.district + v.businessArea + ' · ' + (TIER_LABEL[v.spendTier] || v.spendTier) + ' · ⭐' + v.rating + '</div></div>' +
                    (v.isPartner ? '<span style="font-size:11px;color:#E08A3C;font-weight:700">合作商户</span>' : '') +
                '</div>' +
            '</div>';
        }).join('');
    }

    function venueSection() {
        const P = window.ProposeView;
        const isFixed = P._venueMode === 'fixed';
        const venueCount = P._venueIds.length;
        const modePills = ['fixed', 'candidates'].map(m =>
            '<span class="cj-chip' + (P._venueMode === m ? ' cj-chip-warm' : '') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickVenueMode(\'' + m + '\')">' + (m === 'fixed' ? '指定地点' : '地点候选') + '</span>').join('');
        const body = isFixed
            ? '<div class="cj-sub" style="margin-bottom:10px">为你推荐这些地点，也可以自己输入</div>' +
              fixedVenueCards(P._projectId) +
              '<div style="margin-top:12px">' +
                '<label class="cj-field-label">自己输入</label>' +
                '<input id="customVenueInput" class="cj-field-input" value="' + P._customVenue + '" placeholder="如：老王家常菜馆（不输入就选上面推荐的地点）">' +
              '</div>'
            : '<div class="cj-sub" style="margin-bottom:10px">选几个备选地点，圈友投票定最终地点 · 已选 ' + venueCount + '/' + MAX_VENUES + '</div>' +
              venueCards(P._projectId);
        return '<div class="cj-wiz-card">' +
                '<h3 class="cj-wiz-h3">去哪聚？</h3>' +
                '<div style="display:flex;gap:8px;margin-bottom:12px">' + modePills + '</div>' +
                body +
            '</div>';
    }

    function renderStep3() {
        return window.Common.renderShell('') +
            '<div class="cj-px" style="padding-top:12px">' + stepsBar(3) +
                timeSection() +
                venueSection() +
                '<button class="cj-btn-grad" style="margin-top:4px" onclick="window.ProposeView.gotoStep(4)">下一步：生成邀请卡片</button>' +
            '</div>' + window.Common.renderTabbar('zuju');
    }

    function pickTimeMode(m) {
        window.ProposeView._timeMode = m;
        if (m === 'fixed') {
            window.ProposeView._times = [window.ProposeView._times[0] || window.Common.fmtDate(window.Demo.getNow()).slice(0, 10) + ' 14:00'];
        } else {
            while (window.ProposeView._times.length < 3) {
                window.ProposeView._times.push(window.Common.fmtDate(window.Demo.getNow()).slice(0, 10) + ' 14:00');
            }
        }
        gotoStep(3);
    }

    function pickVenueMode(m) {
        window.ProposeView._venueMode = m;
        gotoStep(3);
    }

    function pickFixedVenue(id) {
        window.ProposeView._venueIds = [id];
        window.ProposeView._customVenue = '';
        gotoStep(3);
    }

    function setCustomVenue(text) {
        window.ProposeView._customVenue = text || '';
        if (text) window.ProposeView._venueIds = [];
        gotoStep(3);
    }

    function addTime() {
        const d = window.Demo.getNow();
        const nd = new Date(d.getTime() + (window.ProposeView._times.length + 3) * 24 * 3600 * 1000);
        window.ProposeView._times.push(window.Common.fmtDate(nd).slice(0, 10) + ' 14:00');
        gotoStep(3);
    }

    function removeTime(i) {
        if (window.ProposeView._times.length <= 1) {
            window.Common.showToast('至少保留一个时间候选');
            return;
        }
        window.ProposeView._times.splice(i, 1);
        gotoStep(3);
    }

    function toggleVenue(id) {
        const i = window.ProposeView._venueIds.indexOf(id);
        if (i >= 0) {
            window.ProposeView._venueIds.splice(i, 1);
        } else if (window.ProposeView._venueIds.length < MAX_VENUES) {
            window.ProposeView._venueIds.push(id);
        } else {
            window.Common.showToast('最多选 ' + MAX_VENUES + ' 个地点候选');
            return;
        }
        gotoStep(3);
    }

    // 第 4 步：生成邀请卡片
    function renderStep4() {
        const G = window.GlobalData;
        const circle = G.circles.find(c => c.id === window.ProposeView._circleId);
        const project = G.projects.find(p => p.id === window.ProposeView._projectId);
        const venues = window.ProposeView._venueIds.map(id => G.venues.find(v => v.id === id)).filter(Boolean);
        const venueChips = window.ProposeView._customVenue
            ? '<span style="display:inline-block;margin:3px;padding:4px 10px;border-radius:999px;background:#FFF0E3;border:1px solid #E08A3C;font-size:12px;color:#C97226">' + window.ProposeView._customVenue + '</span>'
            : venues.map(v => '<span style="display:inline-block;margin:3px;padding:4px 10px;border-radius:999px;background:#FFF0E3;border:1px solid #E08A3C;font-size:12px;color:#C97226">' + v.name + '</span>').join('');
        return window.Common.renderShell('') +
            '<div class="cj-px" style="padding-top:12px">' + stepsBar(4) +
                '<div class="cj-wiz-card" style="text-align:center;padding:24px 16px">' +
                    '<div style="font-size:11px;color:#9CA3AF;letter-spacing:2px">组局邀请卡片</div>' +
                    '<div style="font-size:20px;font-weight:800;color:#111827;margin:10px 0 6px">' + circle.name + '</div>' +
                    '<div style="font-size:13px;color:#374151;font-weight:600">' + (project ? project.name : '') + '</div>' + (window.ProposeView._note ? '<div style="font-size:12px;color:#9CA3AF;margin-top:6px">' + window.ProposeView._note + '</div>' : '') +
                    '<div style="font-size:12px;color:#9CA3AF;margin-top:10px">时间候选</div>' +
                    '<div style="margin-top:4px">' + window.ProposeView._times.map(t => '<span style="display:inline-block;margin:3px;padding:4px 10px;border-radius:999px;background:#F9FAFB;border:1px solid #E5E7EB;font-size:12px;color:#374151">' + t + '</span>').join('') + '</div>' +
                    '<div style="font-size:12px;color:#9CA3AF;margin-top:10px">地点</div>' +
                    '<div style="margin-top:4px">' + venueChips + '</div>' +
                '</div>' +
                '<button class="cj-btn-grad" onclick="window.ProposeView.send()">发出提案，请圈友表态</button>' +
                '<div id="shareArea"></div>' +
            '</div>' + window.Common.renderTabbar('zuju');
    }

    function send() {
        // 读回时间输入（可编辑）
        const inputs = document.querySelectorAll('input[data-time]');
        if (inputs && inputs.forEach) {
            inputs.forEach(inp => {
                const i = Number(inp.getAttribute('data-time'));
                if (inp.value && inp.value.trim()) window.ProposeView._times[i] = inp.value.trim();
            });
        }
        const noteInput = document.getElementById('noteInput');
        if (noteInput && noteInput.value !== undefined) window.ProposeView._note = noteInput.value.trim();
        if (!window.ProposeView._projectId) {
            window.Common.showToast('请先选择活动项目');
            return;
        }
        const p = window.Zuju.buildProposalManual({
            circleId: window.ProposeView._circleId,
            projectId: window.ProposeView._projectId,
            note: window.ProposeView._note || null,
            times: window.ProposeView._times,
            venueIds: window.ProposeView._venueIds,
            customVenue: window.ProposeView._customVenue || null
        });
        if (!p) return;
        window.Common.showToast('提案已发出，等圈友表态');
        window.ProposeView.shareInvite();
        document.getElementById('app').innerHTML = renderStep(4) +
            '<a class="cj-btn-outline" style="width:100%;margin-top:12px;justify-content:center;text-decoration:none" href="vote.html?proposal=' + p.id + '">去表态页</a>';
        if (window.lucide) window.lucide.createIcons();
    }

    function renderStep(n) {
        const P = window.ProposeView;
        if (n === 1) return renderNew();
        if (n === 2) return renderStep2();
        if (n === 3) return renderStep3();
        return renderStep4();
    }

    function render(circleIdArg) {
        window.ProposeView._circleId = circleIdArg || 'c1';
        return renderStep(2);
    }

    // 分享组局邀请到微信群（模拟浮层，逻辑在 zuju.js 共享）
    function shareInvite() {
        window.Zuju.shareInvite({
            proposalId: window.ProposeView._circleId ? (window.GlobalData.circles.find(c => c.id === window.ProposeView._circleId) || {}).proposalId : null,
            circleId: window.ProposeView._circleId,
            containerId: 'shareArea'
        });
    }

    function pickShareGroup(groupName) {
        window.Zuju.pickShareGroup(groupName, 'shareArea');
    }

    return { render, renderNew, pickCircleType, createAndContinue, gotoStep, renderStep, pickProjectCategory, pickProject, addTime, removeTime, toggleVenue, pickTimeMode, pickVenueMode, pickFixedVenue, setCustomVenue, send, shareInvite, pickShareGroup };
})();
(function () {
    const P = window.ProposeView;
    P._newUser = false;
    P._circleType = null;
    P._circleId = null;
    P._projCategory = 'dinner';
    P._projectId = null;
    P._note = '';
    P._venueIds = [];
    P._times = [];
    P._timeMode = 'candidates';
    P._venueMode = 'candidates';
    P._customVenue = '';
    P._step = 1;
    const CATEGORY_OF_TYPE = { boardgame: 'mahjong', sport: 'ball', dinner: 'dinner', ball: 'ball', mahjong: 'mahjong', outdoor: 'outdoor', exhibit: 'exhibit', ktv: 'ktv', classmate: 'dinner', colleague: 'dinner', family: 'dinner', hobby: 'exhibit' };
    const params = new URLSearchParams(window.location.search);
    if (params.get('new') === '1') {
        P._newUser = true;
        document.getElementById('app').innerHTML = window.ProposeView.renderStep(1);
    } else if (params.get('circle')) {
        const cid = params.get('circle');
        const circle = window.GlobalData.circles.find(c => c.id === cid);
        if (!circle) { document.getElementById('app').innerHTML = window.ProposeView.renderStep(1); }
        else {
            P._circleId = cid;
            P._projCategory = CATEGORY_OF_TYPE[circle.type] || 'dinner';
            P._times = window.Recommend.suggestTimes({ members: circle.members, count: 3, now: window.Common.fmtDate(window.Demo.getNow()) });
            document.getElementById('app').innerHTML = window.ProposeView.renderStep(2);
        }
    } else {
        document.getElementById('app').innerHTML = window.ProposeView.renderStep(1);
    }
})();
window.Common.initIcons();
window.Demo.mountFab();
</script>
</body>
</html>
