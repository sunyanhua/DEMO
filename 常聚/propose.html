<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>常聚 · 组局</title>
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="cj-theme">
<div id="app" class="cj-page"></div>
<script src="vendor/lucide.min.js"></script>
<script src="data.js"></script>
<script src="rotation.js"></script>
<script src="recommend.js"></script>
<script src="common.js"></script>
<script src="zuju.js"></script>
<script>
window.ProposeView = (function () {
    const CATEGORY_LABELS = { dinner: '饭局', ball: '运动', fun: '娱乐', outdoor: '户外' };
    const ANY_SHORT = { dinner: '吃饭（不限）', ball: '运动（不限）', fun: '娱乐（不限）', outdoor: '户外（不限）' };
    const TIER_LABEL = { economy: '经济实惠', mid: '中等档', premium: '中高端' };
    const MAX_VENUES = 3;
    const MAX_PROJECTS = 3;

    function stepsBar(step) {
        const items = [['圈子', ''], ['活动', '项目'], ['时间', '地点'], ['邀请', '卡片']];
        return '<div class="cj-steps">' + items.map((it, i) => {
            const n = i + 1;
            const cls = n < step ? 'done' : (n === step ? 'active' : 'pending');
            const label = it[1] ? it[0] + '<br>' + it[1] : it[0];
            return '<div class="cj-step ' + cls + '"><div class="cj-step-dot">' + (n < step ? '✓' : n) + '</div><div class="cj-step-label">' + label + '</div></div>' +
                (i < 3 ? '<div class="cj-step-line' + (n < step ? ' done' : '') + '"></div>' : '');
        }).join('') + '</div>';
    }

    function venueCards(projectId) {
        const G = window.GlobalData;
        const catOf = window.Zuju.projectCategoryOf(projectId);
        let pool = catOf ? (G.venues || []).filter(v => v.category === catOf) : (G.venues || []);
        const filtered = pool.length > 0;
        if (!pool.length) pool = G.venues || [];
        return (filtered ? '' : '<div class="cj-sub" style="margin-bottom:10px">该类别暂无专属商户，展示全部地点</div>') +
            pool.map(v => {
                const on = window.ProposeView._venueIds.includes(v.id);
                return '<div class="cj-wiz-card" style="cursor:pointer;padding:12px 16px;border:1.5px solid ' + (on ? '#E08A3C' : '#E5E7EB') + '" onclick="window.ProposeView.toggleVenue(\'' + v.id + '\')">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center">' +
                        '<div><div style="font-weight:700;color:#111827;font-size:14px">' + v.name + (on ? ' ✓' : '') + '</div>' +
                        '<div style="font-size:12px;color:#9CA3AF;margin-top:4px">' + v.district + v.businessArea + ' · ' + (TIER_LABEL[v.spendTier] || v.spendTier) + ' · ⭐' + v.rating + '</div></div>' +
                        (v.isPartner ? '<span style="font-size:11px;color:#E08A3C;font-weight:700">合作</span>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
    }

    // 第 1 步：已有圈子在上（微信群式九宫格头像+圈名+上次聚会天数），新建圈子在下
    function groupIcon(circle) {
        const avs = (circle.members || []).slice(0, 4).map(m =>
            '<img src="' + m.avatarUrl + '" alt="" style="width:100%;height:100%;object-fit:cover">').join('');
        return '<div class="cj-group-icon" style="width:48px;height:48px;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#E5E7EB;flex-shrink:0">' + avs + '</div>';
    }

    function daysSince(circle) {
        const g = window.GlobalData.gatherings.find(x => x.id === circle.lastGatheringId);
        const now = window.Common.fmtDate(window.Demo.getNow());
        const r = window.Rotation.checkRhythm({ circle, lastGatheringTime: g ? g.time : null, now });
        return (r.daysSince === null || r.daysSince === undefined) ? null : r.daysSince;
    }

    function lastGatherText(circle) {
        const d = daysSince(circle);
        if (d === null) return '还没有聚过';
        if (d === 0) return '今天刚聚过';
        return '上次聚会 ' + d + ' 天前';
    }

    function renderNew() {
        const G = window.GlobalData;
        const circles = G.circles || [];
        const newUser = window.ProposeView._newUser;
        const typeChips = (window.Zuju.CIRCLE_TYPES || []).map(t =>
            '<span id="ct-' + t.key + '" class="cj-chip' + (window.ProposeView._circleType === t.key ? ' cj-chip-warm' : '') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickCircleType(\'' + t.key + '\')">' + t.label + '</span>').join('');
        const sorted = circles.slice().sort((a, b) => {
            const da = daysSince(a), db = daysSince(b);
            const va = da === null ? Infinity : da;
            const vb = db === null ? Infinity : db;
            return vb - va; // 按上次聚会天数倒序：最久没聚的在前
        });
        const existing = (!newUser && circles.length)
            ? '<div class="cj-px">' +
                '<div class="cj-section-head"><b>已有圈子</b></div>' +
                sorted.map(c =>
                    '<a class="cj-card" style="display:flex;gap:12px;align-items:center;padding:12px 14px;text-decoration:none" href="propose.html?circle=' + c.id + '">' +
                        groupIcon(c) +
                        '<div style="flex:1">' +
                            '<div class="cj-title" style="font-size:15px">' + c.name + '</div>' +
                            '<div class="cj-sub" style="margin-top:4px">' + lastGatherText(c) + '</div>' +
                        '</div>' +
                        '<span class="cj-pill cj-pill-due">去组局 ›</span>' +
                    '</a>').join('') +
              '</div>'
            : '';
        return window.Common.renderShell('') +
            '<div class="cj-px" style="padding-top:12px">' + stepsBar(1) + '</div>' +
            existing +
            '<div class="cj-px">' +
                '<div class="cj-wiz-card">' +
                    '<h3 class="cj-wiz-h3">新建圈子</h3>' +
                    '<div style="margin-bottom:16px">' +
                        '<label class="cj-field-label">圈子类型</label>' +
                        '<div style="display:flex;flex-wrap:wrap;gap:8px">' + typeChips + '</div>' +
                    '</div>' +
                    '<div style="margin-bottom:8px">' +
                        '<label class="cj-field-label">圈子叫什么</label>' +
                        '<input id="circleName" class="cj-field-input" placeholder="给圈子起个名字吧">' +
                    '</div>' +
                    '<button class="cj-btn-grad" style="margin-top:12px" onclick="window.ProposeView.createAndContinue()">创建圈子，继续组局</button>' +
                '</div>' +
            '</div>' +
            window.Common.renderTabbar('zuju');
    }

    function pickCircleType(key) {
        window.ProposeView._circleType = key;
        const t = (window.Zuju.CIRCLE_TYPES || []).find(x => x.key === key);
        const input = document.getElementById('circleName');
        if (input && input.value !== undefined && t) input.value = t.suggest;
        const chips = document.querySelectorAll('[id^="ct-"]');
        if (chips && chips.forEach) {
            chips.forEach(el => {
                el.className = 'cj-chip' + (el.id === 'ct-' + key ? ' cj-chip-warm' : '');
            });
        }
    }

    // 建圈成功 → 第 2 步选项目（预填默认时间候选与项目类别方向）；类型必须由用户选择
    function createAndContinue(opts) {
        const o = opts || {};
        const input = document.getElementById('circleName');
        const name = o.name || (input && input.value ? input.value.trim() : '');
        const type = o.type || window.ProposeView._circleType || null;
        if (!type) {
            window.Common.showToast('先选一个圈子类型吧');
            return null;
        }
        const circle = window.Zuju.createCircle({ name, type });
        if (!circle) return null;
        window.ProposeView._circleId = circle.id;
        window.ProposeView._projCategory = { boardgame: 'fun', sport: 'ball', dinner: 'dinner', ball: 'ball', mahjong: 'fun', outdoor: 'outdoor', exhibit: 'exhibit', ktv: 'fun', classmate: 'dinner', colleague: 'dinner', family: 'dinner', hobby: 'fun' }[circle.type] || 'dinner';
        window.ProposeView._times = window.Recommend.suggestTimes({ members: circle.members, count: 1, now: window.Common.fmtDate(window.Demo.getNow()) });
        window.ProposeView.gotoStep(2);
        return circle;
    }

    function gotoStep(n) {
        window.ProposeView._step = n;
        document.getElementById('app').innerHTML = renderStep(n);
        if (window.lucide) window.lucide.createIcons();
    }

    // 第 2 步：选活动项目——一个卡片内：分类 TAB + 不限 + 项目胶囊标签单选 + 备注
    function renderStep2() {
        const G = window.GlobalData;
        const circle = G.circles.find(c => c.id === window.ProposeView._circleId);
        const cat = window.ProposeView._projCategory || 'dinner';
        const catTabs = Object.keys(CATEGORY_LABELS).map(k =>
            '<span id="pc-' + k + '" class="cj-cat-tab' + (cat === k ? ' cj-cat-tab-active' : '') + '" onclick="window.ProposeView.pickProjectCategory(\'' + k + '\')">' + CATEGORY_LABELS[k] + '</span>').join('');
        const anyId = 'any-' + cat;
        const anyChip = '<span class="cj-chip' + (window.ProposeView._projectId === anyId ? ' cj-chip-warm' : '') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickProject(\'' + anyId + '\')">' + ANY_SHORT[cat] + (window.ProposeView._projectId === anyId ? ' ✓' : '') + '</span>';
        const pool = (G.projects || []).filter(p => p.category === cat);
        const tagChips = pool.map(p => {
            const on = window.ProposeView._projectId === p.id;
            return '<span class="cj-chip' + (on ? ' cj-chip-warm' : '') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickProject(\'' + p.id + '\')">' + p.name + (on ? ' ✓' : '') + '</span>';
        }).join('');
        return window.Common.renderShell('') +
            '<div class="cj-px" style="padding-top:12px">' + stepsBar(2) +
                '<div class="cj-wiz-card">' +
                    '<h3 class="cj-wiz-h3">「' + circle.name + '」这一局，玩什么？</h3>' +
                    '<div class="cj-cat-tabs">' + catTabs + '</div>' +
                    '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">' + anyChip + tagChips + '</div>' +
                    '<div class="cj-tear" style="border-top:1.5px dashed #E5D5B8;margin-bottom:14px"></div>' +
                    '<label class="cj-field-label">备注说明（非必填）</label>' +
                    '<input id="noteInput" class="cj-field-input" value="' + window.ProposeView._note + '" placeholder="如：打完球附近一起吃个饭">' +
                '</div>' +
                '<button class="cj-btn-grad" style="margin-top:4px" onclick="window.ProposeView.gotoStep(3)">下一步：选时间地点</button>' +
            '</div>' + window.Common.renderTabbar('zuju');
    }

    function pickProjectCategory(k) {
        window.ProposeView._projCategory = k;
        gotoStep(2);
    }

    function pickProject(id) {
        window.ProposeView._projectId = id;
        gotoStep(2);
    }

    // 第 3 步：时间（1个=指定/多个=候选投票）+ 地点（1个=指定/多个=候选投票）
    const TIME_SLOTS = ['12:00', '14:00', '16:00', '18:00', '19:00', '20:00'];

    function weekdayCN(d) {
        return '周' + '日一二三四五六'[d.getDay()];
    }

    function timeDisplay(t) {
        if (!t) return '';
        const d = new Date(t.replace(' ', 'T'));
        return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + weekdayCN(d) + ' ' + t.slice(11);
    }

    function timeOptions() {
        const base = window.Demo.getNow();
        const opts = [];
        for (let i = 1; i <= 5; i++) {
            const d = new Date(base.getTime() + i * 24 * 3600 * 1000);
            const ds = window.Common.fmtDate(d).slice(0, 10);
            TIME_SLOTS.forEach(sl => opts.push(ds + ' ' + sl));
        }
        return opts;
    }

    function timeSection() {
        const P = window.ProposeView;
        const rows = P._times.map((t, i) =>
            '<div style="margin-bottom:10px;position:relative">' +
                '<div style="position:relative">' +
                    '<input data-time="' + i + '" readonly class="cj-field-input" style="cursor:pointer" value="' + timeDisplay(t) + '" placeholder="点击选择时间" onclick="window.ProposeView.openTimePicker(' + i + ')">' +
                    '<span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#9CA3AF;pointer-events:none">▾</span>' +
                '</div>' +
                (P._timePickerOpen === i
                    ? '<div class="cj-wiz-card" style="padding:10px;max-height:220px;overflow-y:auto;margin-top:6px">' +
                        timeOptions().map(opt =>
                            '<div data-topt="' + opt + '" style="padding:8px 10px;border-radius:8px;font-size:13px;color:#374151;cursor:pointer' + (P._times[i] === opt ? ';background:#FFF0E3;color:#C97226;font-weight:700' : '') + '" onclick="window.ProposeView.pickTimeOption(' + i + ', \'' + opt + '\')">' + timeDisplay(opt) + '</div>').join('') +
                      '</div>'
                    : '') +
                (P._times.length > 1
                    ? '<span class="cj-remove-btn" onclick="window.ProposeView.removeTime(' + i + ')">✕</span>'
                    : '') +
            '</div>').join('');
        return '<div class="cj-wiz-card">' +
            '<h3 class="cj-wiz-h3">什么时候聚？</h3>' +
            rows +
            '<span class="cj-pill cj-pill-due" style="cursor:pointer" onclick="window.ProposeView.addTime()">＋ 添加更多候选，由圈友投票决定</span>' +
        '</div>';
    }

    function openTimePicker(i) {
        window.ProposeView._timePickerOpen = (window.ProposeView._timePickerOpen === i ? -1 : i);
        gotoStep(3);
    }

    function pickTimeOption(i, val) {
        window.ProposeView._times[i] = val;
        window.ProposeView._timePickerOpen = -1;
        gotoStep(3);
    }

    function addTime() {
        if (window.ProposeView._times.length >= 3) {
            window.Common.showToast('最多 3 个时间候选');
            return;
        }
        window.ProposeView._times.push('');
        window.ProposeView._timePickerOpen = window.ProposeView._times.length - 1;
        gotoStep(3);
    }

    function removeTime(i) {
        if (window.ProposeView._times.length <= 1) {
            window.Common.showToast('至少保留一个时间');
            return;
        }
        window.ProposeView._times.splice(i, 1);
        window.ProposeView._timePickerOpen = -1;
        gotoStep(3);
    }

    function venueSuggestions() {
        const G = window.GlobalData;
        const catOf = window.Zuju.projectCategoryOf(window.ProposeView._projectId);
        let pool = catOf ? (G.venues || []).filter(v => v.category === catOf) : (G.venues || []);
        if (!pool.length) pool = G.venues || [];
        return pool.slice().sort((a, b) => (b.isPartner ? 1 : 0) - (a.isPartner ? 1 : 0));
    }

    function venueSection() {
        const P = window.ProposeView;
        const rows = P._venueInputs.map((v, i) =>
            '<div style="margin-bottom:10px;position:relative">' +
                '<input data-venue="' + i + '" class="cj-field-input" value="' + v + '" placeholder="点击输入地点，或从下拉推荐中选择" onclick="window.ProposeView.openVenueSuggestions(' + i + ')" oninput="window.ProposeView.setVenueInput(' + i + ', this.value)">' +
                '<div id="vdrop-' + i + '" class="cj-wiz-card" style="padding:10px;max-height:220px;overflow-y:auto;margin-top:6px;display:' + (P._venueSuggestOpen === i ? 'block' : 'none') + '">' +
                    '<div class="cj-title" style="font-size:13px;margin-bottom:6px">推荐地点</div>' +
                    venueSuggestions().map(x =>
                        '<div data-vopt="' + x.id + '" style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px;color:#374151;cursor:pointer' + (P._venueInputs[i] === x.name ? ';background:#FFF0E3;color:#C97226;font-weight:700' : '') + '" onclick="window.ProposeView.pickVenueSuggestion(' + i + ', \'' + x.id + '\')">' +
                            '<span>' + x.name + '</span><span style="font-size:11px;color:#9CA3AF">' + x.district + x.businessArea + (x.isPartner ? ' · 合作商户' : '') + '</span>' +
                        '</div>').join('') +
                '</div>' +
                (P._venueInputs.length > 1
                    ? '<span class="cj-remove-btn" onclick="window.ProposeView.removeVenueInput(' + i + ')">✕</span>'
                    : '') +
            '</div>').join('');
        return '<div class="cj-wiz-card">' +
            '<h3 class="cj-wiz-h3">去哪聚？</h3>' +
            rows +
            '<span class="cj-pill cj-pill-due" style="cursor:pointer" onclick="window.ProposeView.addVenueInput()">＋ 添加更多地点，由圈友投票决定</span>' +
        '</div>';
    }

    function openVenueSuggestions(i) {
        window.ProposeView._venueSuggestOpen = (window.ProposeView._venueSuggestOpen === i ? -1 : i);
        // 直接切换面板显隐，不整页重渲染（避免输入焦点丢失）
        [0, 1, 2].forEach(n => {
            const el = document.getElementById('vdrop-' + n);
            if (el && el.style) el.style.display = (window.ProposeView._venueSuggestOpen === n ? 'block' : 'none');
        });
    }

    function pickVenueSuggestion(i, venueId) {
        const v = window.GlobalData.venues.find(x => x.id === venueId);
        if (v) {
            window.ProposeView._venueInputs[i] = v.name;
            const inp = document.querySelector('input[data-venue="' + i + '"]');
            if (inp && inp.value !== undefined) inp.value = v.name;
        }
        window.ProposeView._venueSuggestOpen = -1;
        const el = document.getElementById('vdrop-' + i);
        if (el && el.style) el.style.display = 'none';
    }

    function setVenueInput(i, text) {
        window.ProposeView._venueInputs[i] = text || '';
    }

    function addVenueInput() {
        if (window.ProposeView._venueInputs.length >= 3) {
            window.Common.showToast('最多 3 个地点候选');
            return;
        }
        window.ProposeView._venueInputs.push('');
        gotoStep(3);
    }

    function removeVenueInput(i) {
        if (window.ProposeView._venueInputs.length <= 1) {
            window.Common.showToast('至少保留一个地点');
            return;
        }
        window.ProposeView._venueInputs.splice(i, 1);
        window.ProposeView._venueSuggestOpen = -1;
        gotoStep(3);
    }

    function renderStep3() {
        return window.Common.renderShell('') +
            '<div class="cj-px" style="padding-top:12px">' + stepsBar(3) +
                timeSection() +
                venueSection() +
                '<button class="cj-btn-grad" style="margin-top:4px" onclick="window.ProposeView.gotoStep(4)">下一步：生成邀请卡片</button>' +
            '</div>' + window.Common.renderTabbar('zuju');
    }

    function pickDeadline(h) {
        window.ProposeView._deadlineHours = h;
        gotoStep(4);
    }

    // 第 4 步：生成邀请卡片
    function renderStep4() {
        const G = window.GlobalData;
        const circle = G.circles.find(c => c.id === window.ProposeView._circleId);
        const projectLabel = window.Zuju.projectLabel(window.ProposeView._projectId);
        const venueChips = window.ProposeView._venueInputs.filter(t => t && t.trim()).map(t =>
            '<span style="display:inline-block;margin:3px;padding:4px 10px;border-radius:999px;background:#FFF0E3;border:1px solid #E08A3C;font-size:12px;color:#C97226">' + t.trim() + '</span>').join('');
        return window.Common.renderShell('') +
            '<div class="cj-px" style="padding-top:12px">' + stepsBar(4) +
                '<div class="cj-wiz-card" style="text-align:center;padding:24px 16px">' +
                    '<div style="font-size:11px;color:#9CA3AF;letter-spacing:2px">组局邀请卡片</div>' +
                    '<div style="font-size:20px;font-weight:800;color:#111827;margin:10px 0 6px">' + circle.name + '</div>' +
                    '<div style="font-size:13px;color:#374151;font-weight:600">' + projectLabel + '</div>' + (window.ProposeView._note ? '<div style="font-size:12px;color:#9CA3AF;margin-top:6px">' + window.ProposeView._note + '</div>' : '') +
                    '<div style="font-size:12px;color:#9CA3AF;margin-top:10px">时间</div>' +
                    '<div style="margin-top:4px">' + window.ProposeView._times.filter(t => t).map(t => '<span style="display:inline-block;margin:3px;padding:4px 10px;border-radius:999px;background:#F9FAFB;border:1px solid #E5E7EB;font-size:12px;color:#374151">' + window.ProposeView.timeDisplay(t) + '</span>').join('') + '</div>' +
                    '<div style="font-size:12px;color:#9CA3AF;margin-top:10px">地点</div>' +
                    '<div style="margin-top:4px">' + venueChips + '</div>' +
                '</div>' +
                '<div class="cj-wiz-card">' +
                    '<label class="cj-field-label">投票截止时间（到点自动定案）</label>' +
                    '<div style="display:flex;gap:8px;margin-top:4px">' +
                        [24, 48, 72].map(h =>
                            '<span class="cj-chip' + (window.ProposeView._deadlineHours === h ? ' cj-chip-warm' : '') + '" style="cursor:pointer;padding:8px 14px;font-size:13px" onclick="window.ProposeView.pickDeadline(' + h + ')">' + h + ' 小时</span>').join('') +
                    '</div>' +
                    '<div class="cj-sub" style="margin-top:8px">也可在局详情页手动结束投票</div>' +
                '</div>' +
                '<button class="cj-btn-grad" onclick="window.ProposeView.send()">发出提案，请圈友表态</button>' +
                '<div id="shareArea"></div>' +
            '</div>' + window.Common.renderTabbar('zuju');
    }

    function send() {
        const noteInput = document.getElementById('noteInput');
        if (noteInput && noteInput.value !== undefined) window.ProposeView._note = noteInput.value.trim();
        // 地点：读输入框，匹配商户名→venueIds，未匹配文本→customVenue
        const vInputs = document.querySelectorAll('input[data-venue]');
        if (vInputs && vInputs.forEach) {
            vInputs.forEach(inp => {
                const i = Number(inp.getAttribute('data-venue'));
                window.ProposeView._venueInputs[i] = inp.value || '';
            });
        }
        const venueIds = [];
        const customs = [];
        window.ProposeView._venueInputs.forEach(t => {
            if (!t || !t.trim()) return;
            const v = window.GlobalData.venues.find(x => x.name === t.trim());
            if (v) venueIds.push(v.id);
            else customs.push(t.trim());
        });
        const customVenue = customs.length ? customs.join('、') : null;
        const times = window.ProposeView._times.filter(t => t && t.trim());
        if (!times.length) {
            window.Common.showToast('请先选择时间');
            return;
        }
        if (!venueIds.length && !customVenue) {
            window.Common.showToast('请先输入地点');
            return;
        }
        window.ProposeView._times = times;
        if (!window.ProposeView._projectId) {
            window.Common.showToast('请先选择活动项目');
            return;
        }
        const p = window.Zuju.buildProposalManual({
            circleId: window.ProposeView._circleId,
            projectId: window.ProposeView._projectId,
            times: times,
            venueIds: venueIds,
            customVenue: customVenue,
            note: window.ProposeView._note || null,
            deadlineHours: window.ProposeView._deadlineHours || 48
        });
        if (!p) return;
        window.Common.showToast('提案已发出，等圈友表态');
        window.ProposeView.shareInvite();
        document.getElementById('app').innerHTML = renderStep(4) +
            '<a class="cj-btn-outline" style="width:100%;margin-top:12px;justify-content:center;text-decoration:none" href="vote.html?proposal=' + p.id + '">去表态页</a>';
        if (window.lucide) window.lucide.createIcons();
    }

    function renderStep(n) {
        const P = window.ProposeView;
        if (n === 1) return renderNew();
        if (n === 2) return renderStep2();
        if (n === 3) return renderStep3();
        return renderStep4();
    }

    function render(circleIdArg) {
        window.ProposeView._circleId = circleIdArg || 'c1';
        return renderStep(2);
    }

    // 分享组局邀请到微信群（模拟浮层，逻辑在 zuju.js 共享）
    function shareInvite() {
        window.Zuju.shareInvite({
            proposalId: window.ProposeView._circleId ? (window.GlobalData.circles.find(c => c.id === window.ProposeView._circleId) || {}).proposalId : null,
            circleId: window.ProposeView._circleId,
            containerId: 'shareArea'
        });
    }

    function pickShareGroup(groupName) {
        window.Zuju.pickShareGroup(groupName, 'shareArea');
    }

    return { render, renderNew, pickCircleType, createAndContinue, gotoStep, renderStep, pickProjectCategory, pickProject, timeDisplay, openTimePicker, pickTimeOption, addTime, removeTime, openVenueSuggestions, pickVenueSuggestion, setVenueInput, addVenueInput, removeVenueInput, pickDeadline, send, shareInvite, pickShareGroup };
})();
(function () {
    const P = window.ProposeView;
    P._newUser = false;
    P._circleType = null;
    P._circleId = null;
    P._projCategory = 'dinner';
    P._projectId = null;
    P._venueInputs = [''];
    P._times = [];
    P._timePickerOpen = -1;
    P._venueSuggestOpen = -1;
    P._note = '';
    P._deadlineHours = 48;
    P._step = 1;
    const CATEGORY_OF_TYPE = { boardgame: 'fun', sport: 'ball', dinner: 'dinner', ball: 'ball', mahjong: 'fun', outdoor: 'outdoor', ktv: 'fun', classmate: 'dinner', colleague: 'dinner', family: 'dinner', hobby: 'fun' };
    const params = new URLSearchParams(window.location.search);
    if (params.get('new') === '1') {
        P._newUser = true;
        document.getElementById('app').innerHTML = window.ProposeView.renderStep(1);
    } else if (params.get('circle')) {
        const cid = params.get('circle');
        const circle = window.GlobalData.circles.find(c => c.id === cid);
        if (!circle) { document.getElementById('app').innerHTML = window.ProposeView.renderStep(1); }
        else {
            P._circleId = cid;
            P._projCategory = CATEGORY_OF_TYPE[circle.type] || 'dinner';
            P._times = window.Recommend.suggestTimes({ members: circle.members, count: 1, now: window.Common.fmtDate(window.Demo.getNow()) });
            document.getElementById('app').innerHTML = window.ProposeView.renderStep(2);
        }
    } else {
        document.getElementById('app').innerHTML = window.ProposeView.renderStep(1);
    }
})();
window.Common.initIcons();
window.Demo.mountFab();
</script>
</body>
