<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信（模拟）</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        body.wx { background: #EDEDED; }
        .wx-page { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #EDEDED; display: flex; flex-direction: column; }
        .wx-header { background: #222; color: #fff; text-align: center; padding: 14px 0 10px; font-size: 16px; font-weight: 600; }
        .wx-list { background: #fff; padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
        .wx-list-avatar { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; }
        .wx-list-badge { background: #FA5151; color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 6px; }
        .wx-chat { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; }
        .wx-msg { max-width: 76%; background: #fff; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
        .wx-msg-me { align-self: flex-end; background: #95EC69; }
        .wx-msg-meta { font-size: 11px; color: #999; margin-bottom: 2px; }
        .wx-card {
            max-width: 76%; background: #FBF4E8; border: 1px solid #EFE2CD; border-radius: 12px;
            padding: 12px; display: flex; gap: 10px; align-items: center; cursor: pointer;
        }
        .wx-card-logo {
            width: 42px; height: 42px; border-radius: 10px; background: linear-gradient(135deg, #E08A3C, #C97226); color: #FFF9F0;
            display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; flex-shrink: 0;
        }
        .wx-card-name { font-size: 14px; font-weight: 800; color: #3B2E22; }
        .wx-card-desc { font-size: 11px; color: #A58C70; margin-top: 2px; }
        .wx-card-mini { font-size: 10px; color: #A58C70; border-left: 2px solid #EFE2CD; padding-left: 6px; margin-top: 6px; }
        .wx-card-title { font-size: 14px; font-weight: 800; color: #3B2E22; }
        .wx-card-cta { font-size: 11px; color: #C97226; font-weight: 700; margin-top: 6px; }
        .wx-footer { background: #EDEDED; text-align: center; font-size: 11px; color: #A58C70; padding: 10px 0 16px; }
    </style>
</head>
<body class="cj-theme wx">
<div id="app" class="wx-page"></div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
window.WechatView = (function () {
    function inviteInfo() {
        const G = window.GlobalData;
        const p = (G.proposals || []).find(x => x.id === 'p1');
        const circle = (G.circles || []).find(c => c.id === p.circleId);
        const project = (G.projects || []).find(x => x.id === p.projectId);
        return { p, circle, project };
    }

    // 路线①：全新用户点开常聚 → 手机号授权 → 注册 → 首页组局引导
    function enterNew() {
        window.location.href = 'auth.html?next=' + encodeURIComponent('index.html?tab=zuju');
    }

    // 路线②：群内组局邀请 → 手机号授权 → 注册 → 直接参与该局
    function enterInvite() {
        window.location.href = 'auth.html?next=' + encodeURIComponent('vote.html?proposal=p1');
    }

    function render() {
        const info = inviteInfo();
        return '<div class="wx-header">微信（模拟）</div>' +
            '<div class="wx-list">' +
                '<img class="wx-list-avatar" src="images/avatar-2.png" alt="群头像">' +
                '<div style="flex:1">' +
                    '<div style="font-size:15px;font-weight:600">周五麻将局</div>' +
                    '<div style="font-size:12px;color:#999">阿Sun：[小程序] 常聚</div>' +
                '</div>' +
                '<span class="wx-list-badge">2</span>' +
            '</div>' +
            '<div class="wx-chat">' +
                '<div class="wx-msg"><div class="wx-msg-meta">小李</div>我上周组了个局，用的常聚，你们也试试</div>' +
                '<div class="wx-card" onclick="window.WechatView.enterNew()">' +
                    '<div class="wx-card-logo">聚</div>' +
                    '<div>' +
                        '<div class="wx-card-name">常聚</div>' +
                        '<div class="wx-card-desc">常聚常伴，圈子不散</div>' +
                        '<div class="wx-card-mini">小程序 · 新人下载使用</div>' +
                    '</div>' +
                '</div>' +
                '<div class="wx-msg wx-msg-me"><div class="wx-msg-meta">阿Sun</div>这周的局我组好了，点下面卡片进来表态</div>' +
                '<div class="wx-card" onclick="window.WechatView.enterInvite()">' +
                    '<div class="wx-card-logo">局</div>' +
                    '<div>' +
                        '<div class="wx-card-title">' + info.circle.name + ' · 组局邀请</div>' +
                        '<div class="wx-card-desc">' + (info.project ? info.project.name : '') + ' · ' + info.p.timeCandidates[0].slice(5) + '</div>' +
                        '<div class="wx-card-mini">组局邀请 · 点击参与表态</div>' +
                        '<div class="wx-card-cta">点击授权并参与 →</div>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="wx-footer">模拟微信外壳 · 演示入口（两条路线：新用户 / 被邀请）</div>';
    }

    return { render, enterNew, enterInvite };
})();
document.getElementById('app').innerHTML = window.WechatView.render();
</script>
</body>
</html>
