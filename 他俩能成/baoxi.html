// ====== Canvas 生成海报 ======
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function coverDraw(ctx,im,x,y,w,h){
  var s=Math.max(w/im.width,h/im.height);
  var dw=im.width*s,dh=im.height*s;
  ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}
function wrapText(ctx,text,cx,y,maxW,lineH){
  var chars=text.split(''),line='',yy=y;
  chars.forEach(function(c){
    if(ctx.measureText(line+c).width>maxW&&line){ctx.fillText(line,cx,yy);yy+=lineH;line=c;}
    else{line+=c;}
  });
  if(line)ctx.fillText(line,cx,yy);
}

function loadPosterImages(cb){
  var imgs=[CURRENT.photo,selUser.photo,photoData],els=[],loaded=0,failed=false;
  imgs.forEach(function(src,i){
    var im=new Image();
    im.onload=function(){
      els[i]=im;loaded++;
      if(loaded===imgs.length&&!failed)cb(els);
    };
    im.onerror=function(){failed=true;window.Common.showToast('海报生成失败，请长按截图保存');};
    im.src=src;
  });
}

function downloadPoster(){
  loadPosterImages(function(els){saveCanvas(drawPoster(els));});
}

function saveCanvas(canvas){
  canvas.toBlob(function(blob){
    if(!blob){window.Common.showToast('海报生成失败，请长按截图保存');return;}
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='结缘海报-'+CURRENT.name+'-'+selUser.name+'.png';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
    window.Common.showToast('海报已生成，开始下载');
  },'image/png');
}

function drawPoster(im){
  var W=750,H=1400;
  var canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');
  var cn=CURRENT.name,mn=selUser.name;

  // 暖色渐变背景
  var g=ctx.createLinearGradient(0,0,0,H);
