<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>报喜 - 他俩能成</title>
<script src="lib/tailwind.min.js"></script>
<script src="lib/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  body { background: #FFF5F3; }
  @keyframes reportBounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);} }
  @keyframes loadingBarFill { from{width:0%;} to{width:100%;} }
  .loading-bar-fill { animation: loadingBarFill 1.8s ease-in-out forwards; }
  /* 缘分时间线 */
  .tl-item { position: relative; padding-left: 30px; padding-bottom: 24px; border-left: 1.5px dashed #F0D5CD; margin-left: 12px; }
  .tl-item:last-child { border-left-color: transparent; padding-bottom: 0; }
  .tl-dot { position: absolute; left: -11px; top: 3px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #FFF0EC; color: #E85D3A; }
  .tl-time { font-size: 11px; color: #B8A09A; margin-bottom: 4px; }
  .tl-text { font-size: 13px; color: #5C4640; line-height: 1.7; }
  .tl-text b { color: #E85D3A; margin: 0 2px; }
</style>
</head>
<body class="antialiased">
<div class="bg-decoration" style="z-index:0;"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div>

<div id="app" class="relative z-[1]"></div>

<!-- 生成中加载页 -->
<div id="loading-overlay" style="display:none;position:fixed;inset:0;z-index:999;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#FF6B5B 0%,#E85D3A 30%,#C44569 70%,#8B2252 100%);">
  <img src="images/cheng.png" alt="" style="width:100px;height:auto;animation:reportBounce 1.4s ease-in-out infinite;">
  <p style="color:#FFF;font-size:16px;font-weight:700;margin-top:20px;">正在生成你们的结缘海报…</p>
  <div style="width:180px;height:3px;background:rgba(255,255,255,0.25);border-radius:2px;margin-top:18px;overflow:hidden;">
    <div class="loading-bar-fill" style="height:100%;background:#FFF;border-radius:2px;width:0;"></div>
  </div>
</div>

<script src="common.js"></script>
<script src="lib/baoxi-poster.js"></script>
<script src="lib/baoxi-report.js"></script>
<script src="lib/baoxi-imgdata.js"></script>
<script>
var D=window.AppData;

// ====== Mock 数据：当前用户 & 已达1314的TA ======
var CURRENT={name:'甜心小鹿',gender:'female',photo:D.PHOTOS_F[0]};
var MATCHED=[
  {name:'阳光骑士',gender:'male',photo:D.PHOTOS_M[0]},
  {name:'清风徐来',gender:'male',photo:D.PHOTOS_M[1]},
  {name:'北辰',gender:'male',photo:D.PHOTOS_M[2]},
  {name:'奶茶妹妹',gender:'female',photo:D.PHOTOS_F[4]},
  {name:'月亮不睡',gender:'female',photo:D.PHOTOS_F[8]},
  {name:'追风少年',gender:'male',photo:D.PHOTOS_M[6]},
];

// ====== 状态 ======
var selUser=null;
var photoData=null;
var certData=null; // 结婚证照片（非必填）
var reportData=null;

var NOTICE='《他俩能成》很荣幸成为你们缘分的起点，一路见证了你和TA从相遇到相识的每一步。此刻，请把这份喜讯分享给我们——我们将为你和TA生成一份专属结缘海报，定格心动瞬间，珍藏一生。<br/><br/>注：您的报喜内容将在广播节目及平台进行展示，您的姓名等隐私信息将严格保密、不予公布。';


function gb(g){return window.Common.gb(g);}

// ====== 表单 ======
function railHtml(){
  return MATCHED.map(function(u){
    var sel=selUser&&selUser.name===u.name;
    return '<div class="flex-shrink-0 cursor-pointer card-hover" style="width:96px;" onclick="selectUser(\''+u.name+'\')">'+
      '<div class="relative bg-white rounded-2xl overflow-hidden shadow-sm border '+(sel?'border-brand-pink ring-2 ring-brand-pink/30':'border-gray-100')+'">'+
        '<div class="relative">'+
          '<img src="'+u.photo+'" class="w-full object-cover" style="aspect-ratio:3/4;"/>'+
          '<span class="absolute top-1.5 left-1.5 text-[9px] px-1.5 py-0.5 rounded-full bg-gradient-to-r from-brand-pink to-brand-orange text-white font-bold">1314</span>'+
          (sel?'<span class="absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-brand-pink text-white flex items-center justify-center"><i data-lucide="check" class="w-3 h-3"></i></span>':'')+
        '</div>'+
        '<div class="p-2 flex items-center gap-1"><span class="text-xs font-bold text-gray-800 truncate max-w-[52px]">'+u.name+'</span>'+gb(u.gender)+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function selectUser(name){
  selUser=MATCHED.filter(function(u){return u.name===name})[0]||null;
  document.getElementById('pick-rail').innerHTML=railHtml();
  window.Common.initIcons();
}

function photoBoxHtml(){
  if(photoData){
    return '<div class="relative">'+
      '<img src="'+photoData+'" class="w-full rounded-xl object-cover" style="max-height:260px;"/>'+
      '<label for="baoxi-photo" class="absolute bottom-2 right-2 cursor-pointer card-hover text-xs px-3 py-1.5 rounded-full bg-black/55 text-white font-bold">更换照片</label>'+
      '<input type="file" id="baoxi-photo" accept="image/*" class="hidden" onchange="onPhotoPick(this)"/>'+
    '</div>';
  }
  return '<label for="baoxi-photo" class="block cursor-pointer card-hover">'+
    '<input type="file" id="baoxi-photo" accept="image/*" class="hidden" onchange="onPhotoPick(this)"/>'+
    '<div class="border-2 border-dashed border-brand-pink/40 rounded-xl py-8 flex flex-col items-center justify-center gap-2" style="background:#FFF9F7;">'+
      '<div class="w-12 h-12 rounded-full bg-brand-pink/10 flex items-center justify-center"><i data-lucide="camera" class="w-6 h-6 text-brand-pink"></i></div>'+
      '<span class="text-sm font-bold text-gray-700">点击上传双人照片</span>'+
      '<span class="text-xs text-gray-400">请上传你们的双人照片，如合影、结婚照等</span>'+
    '</div>'+
  '</label>';
}

function onPhotoPick(input){
  var f=input.files&&input.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    photoData=r.result;
    document.getElementById('photo-box').innerHTML=photoBoxHtml();
    window.Common.initIcons();
  };
  r.readAsDataURL(f);
}


function certBoxHtml(){
  if(certData){
    return '<div class="relative">'+
      '<img src="'+certData+'" class="w-full rounded-xl object-cover" style="max-height:200px;"/>'+
      '<label for="baoxi-cert" class="absolute bottom-2 right-2 cursor-pointer card-hover text-xs px-3 py-1.5 rounded-full bg-black/55 text-white font-bold">更换照片</label>'+
      '<input type="file" id="baoxi-cert" accept="image/*" class="hidden" onchange="onCertPick(this)"/>'+
    '</div>';
  }
  return '<label for="baoxi-cert" class="block cursor-pointer card-hover">'+
    '<input type="file" id="baoxi-cert" accept="image/*" class="hidden" onchange="onCertPick(this)"/>'+
    '<div class="border-2 border-dashed border-gray-200 rounded-xl py-6 flex flex-col items-center justify-center gap-2" style="background:#FFF9F7;">'+
      '<div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center"><i data-lucide="file-text" class="w-6 h-6 text-gray-400"></i></div>'+
      '<span class="text-sm font-bold text-gray-600">点击上传结婚证照片</span>'+
      '<span class="text-xs text-gray-400">非必填，审核通过后将隐藏展示</span>'+
    '</div>'+
  '</label>';
}
function onCertPick(input){
  var f=input.files&&input.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    certData=r.result;
    document.getElementById('cert-box').innerHTML=certBoxHtml();
    window.Common.initIcons();
  };
  r.readAsDataURL(f);
}

function renderForm(){
  document.getElementById('app').innerHTML=
    '<div class="sticky top-0 z-40 bg-white/90 backdrop-blur-md px-4 py-3 flex items-center justify-between">'+
      '<span onclick="window.history.back()" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer"><i data-lucide="chevron-left" class="w-5 h-5 text-gray-600"></i></span>'+
      '<span class="font-black text-gray-800 text-base">报喜</span>'+
      '<span class="w-9"></span>'+
    '</div>'+
    '<div class="px-4 pt-4 pb-28">'+
      // 提示区
      '<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">'+
        '<div class="flex items-start gap-2.5">'+
          '<span class="text-xl flex-shrink-0">🎉</span>'+
          '<div class="text-xs leading-relaxed" style="color:#8C6E67;">'+NOTICE+'</div>'+
        '</div>'+
      '</div>'+
      // 1 选择TA
      '<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">'+
        '<div class="flex items-center gap-2 mb-3"><span class="w-6 h-6 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white text-xs font-bold flex items-center justify-center flex-shrink-0">1</span><span class="font-black text-gray-800 text-sm">选择与您达成1314的TA</span></div>'+
        '<div id="pick-rail" class="flex gap-3 overflow-x-auto no-scrollbar pb-1">'+railHtml()+'</div>'+
      '</div>'+
      // 2 上传照片
      '<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4">'+
        '<div class="flex items-center gap-2 mb-3"><span class="w-6 h-6 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white text-xs font-bold flex items-center justify-center flex-shrink-0">2</span><span class="font-black text-gray-800 text-sm">上传报喜照片</span></div>'+
        '<div id="photo-box">'+photoBoxHtml()+'</div>'+
        '<div class="mt-3 pt-3 border-t border-dashed border-gray-200">'+
          '<div class="flex items-center gap-2 mb-3"><span class="font-black text-gray-800 text-sm">结婚证照片 <span class="text-xs text-gray-400 font-normal">（非必填）</span></span></div>'+
          '<div id="cert-box">'+certBoxHtml()+'</div>'+
          '<p class="text-[10px] text-gray-400 mt-2 flex items-center gap-1"><i data-lucide="info" class="w-3 h-3"></i>平台审核确认后，将为您送上520元官方红包祝贺</p>'+
        '</div>'+
      '</div>'+
      // 3 喜讯留言
      '<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">'+
        '<div class="flex items-center gap-2 mb-3"><span class="w-6 h-6 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white text-xs font-bold flex items-center justify-center flex-shrink-0">3</span><span class="font-black text-gray-800 text-sm">喜讯留言</span></div>'+
        '<textarea id="baoxi-msg" rows="4" placeholder="分享你们的故事和喜悦，例如：我们结婚啦 / 我们在一起啦…" class="block w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-brand-pink resize-none"></textarea>'+
      '</div>'+
    '</div>'+
    // 提交栏
    '<div class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-gray-100 px-6 py-3">'+
      '<span class="block text-center cursor-pointer w-full py-3 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-base shadow-lg shadow-brand-pink/30 card-hover" onclick="onSubmit()">生成结缘海报</span>'+
    '</div>';
  window.Common.initIcons();
}

// ====== 提交 → 生成报告 ======
function pad(n){return n<10?'0'+n:''+n;}
function daysAgo(n){var d=new Date();d.setDate(d.getDate()-n);return d;}
function fmtDay(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}
function fmtTime(d,t){return fmtDay(d)+' '+t;}

function buildReport(){
  var waitDays=18+Math.floor(Math.random()*40);
  var heartA=3+Math.floor(Math.random()*18);
  var heartB=3+Math.floor(Math.random()*18);
  var d1=daysAgo(249),d2=daysAgo(198),d3=daysAgo(186),d4=daysAgo(167),d5=daysAgo(131),d6=daysAgo(92);
  var cn=CURRENT.name,mn=selUser.name;
  reportData={
    waitDays:waitDays,
    events:[
      {time:fmtTime(d1,'10:26'),html:'<b>'+cn+'</b>加入了他俩能成'},
      {time:'',html:'经过了<b>'+waitDays+'</b>天的等待，<b>'+mn+'</b>来了'},
      {time:fmtTime(d2,'20:15'),html:'热心用户<b>阳光骑士</b>开启了你们的缘分'},
      {time:fmtTime(d3,'09:30'),html:'<b>'+mn+'</b>关注了<b>'+cn+'</b>，并在之后心动了<b>'+heartA+'</b>次'},
      {time:fmtTime(d4,'21:07'),html:'<b>'+cn+'</b>回关了<b>'+mn+'</b>，并在之后心动了<b>'+heartB+'</b>次'},
      {time:fmtTime(d5,'12:45'),html:'好友<b>奶茶妹妹</b>送上助力'},
      {time:fmtTime(d6,'19:30'),html:'热心用户<b>清风徐来</b>送上了神助攻，你们成了！'}
    ],
    posterLines:[
      fmtDay(d1)+'，'+cn+'加入了他俩能成',
      '历经'+waitDays+'天的等待，'+mn+'来了，缘分开启',
      '热心用户与好友轮番助攻，你们成了！'
    ]
  };
}

function onSubmit(){
  if(!selUser){window.Common.showToast('请先选择与您达成1314的TA');return;}
  if(!photoData){window.Common.showToast('请上传你们的双人照片');return;}
  buildReport();
  var ov=document.getElementById('loading-overlay');
  ov.style.display='flex';
  setTimeout(function(){
    ov.style.transition='opacity 0.5s ease';ov.style.opacity='0';
    setTimeout(function(){ov.style.display='none';ov.style.opacity='1';ov.style.transition='none';},500);
    renderReport();
  },1800);
}

// ====== 结缘报告 ======
function saveMyReport(data){
  try{
    localStorage.setItem('baoxi_submitted','1');
    var stored={
      id:'mine', time:data.time || fmtDay(new Date()),
      names:[data.names[0],data.names[1]],
      avatars:[data.avatars[0],data.avatars[1]],
      genders:[data.genders[0],data.genders[1]],
      couplePhoto:(data.couplePhoto && String(data.couplePhoto).length<500000)?data.couplePhoto:'',
      story:'我们报喜啦！感谢平台见证我们的幸福！',
      events:data.events,
      posterLines:(data.events||[]).map(function(e){return String(e.html||'').replace(/<[^>]+>/g,'');})
    };
    localStorage.setItem('baoxi_my_report',JSON.stringify(stored));
  }catch(e){}
}

function renderReport(){
  saveMyReport({
    time: fmtDay(new Date()),
    names: [CURRENT.name, selUser.name],
    avatars: [CURRENT.photo, selUser.photo],
    genders: [CURRENT.gender || 'female', selUser.gender || 'male'],
    couplePhoto: photoData,
    events: reportData.events
  });
  document.getElementById('app').innerHTML=
    '<div class="px-4 pt-4">'+
      '<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4 flex items-center gap-2.5">'+
        '<span class="text-xl flex-shrink-0">📮</span>'+
        '<p class="text-xs leading-relaxed font-bold" style="color:#8C6E67;">已收到您的喜讯，我们核实后将会有大礼相赠！</p>'+
      '</div>'+
    '</div>'+
    window.BaoxiReport.posterHtml({
      cn: CURRENT.name, mn: selUser.name,
      portraits: [
        { name: CURRENT.name, gender: CURRENT.gender || 'female', photo: CURRENT.photo },
        { name: selUser.name, gender: selUser.gender || 'male', photo: selUser.photo }
      ],
      events: reportData.events,
      couplePhoto: photoData,
      blessing: window.BaoxiReport.blessing
    })+
    '<span class="block text-center cursor-pointer w-full py-3.5 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-base shadow-lg shadow-brand-pink/30 card-hover flex items-center justify-center gap-2" onclick="downloadPoster()"><i data-lucide="download" class="w-5 h-5"></i>下载结缘海报</span>'+
    '<p class="text-center text-xs mt-4"><a href="javascript:;" onclick="window.history.back()" style="color:#C8B0A8;text-decoration:underline;">返回</a></p>';
  window.Common.initIcons();
  window.scrollTo(0,0);
}

// 下载结缘海报：先 DOM 快照导出，失败回退 canvas 绘制（共享模块）
function downloadPoster(){
  window.BaoxiPoster.download({
    srcs:[CURRENT.photo, selUser.photo, photoData, 'images/cheng.png'],
    draw:{
      cn: CURRENT.name, mn: selUser.name,
      gender1: CURRENT.gender || 'female', gender2: selUser.gender || 'male',
      dateLabel: fmtDay(new Date()),
      posterLines: reportData.posterLines
    }
  });
}

// ====== Canvas 生成海报 ======
function drawPoster(im){
  // 结缘海报绘制已抽取至 lib/baoxi-poster.js（与报喜列表页共用，样式完全一致）
  return window.BaoxiPoster.draw(im,{
    cn: CURRENT.name, mn: selUser.name,
    gender1: CURRENT.gender || 'female', gender2: selUser.gender || 'male',
    dateLabel: fmtDay(new Date()),
    posterLines: reportData.posterLines
  });
}


document.addEventListener('DOMContentLoaded',function(){renderForm()});
</script>
</body>
</html>
