<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>结缘海报 - 他俩能成</title>
<script src="lib/tailwind.min.js"></script>
<script src="lib/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  body { background: #FFF5F3; }
</style>
</head>
<body class="antialiased">
<div class="bg-decoration" style="z-index:0;"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div>

<div id="app" class="relative z-[1]"></div>

<script src="common.js"></script>
<script src="lib/baoxi-data.js"></script>
<script src="lib/baoxi-gifts.js"></script>
<script src="lib/baoxi-report.js"></script>
<script src="lib/baoxi-poster.js"></script>
<script src="lib/baoxi-imgdata.js"></script>
<script>
var rawId = new URLSearchParams(window.location.search).get('id');
var pair = window.BaoxiData.getPair(rawId);
// 我的报喜：读取自己完成报喜后保存的记录
if (!pair && rawId === 'mine') {
    try { pair = JSON.parse(localStorage.getItem('baoxi_my_report') || 'null'); } catch (e) { pair = null; }
    if (pair && !pair.couplePhoto) pair.couplePhoto = 'images/logo_center.png';
}
var giftUi = window.BaoxiGifts.createUi({ render: render });

// 海报最下方区域：随礼列表 + 我要随份子（我的报喜与报喜提交后界面一致，不显示）
function giftSectionHtml() {
    if (pair.id === 'mine') return '';
    var action = window.BaoxiGifts.myGiftDone(pair.id)
        ? '<span class="block text-center w-full py-3 rounded-full bg-gray-100 text-gray-400 font-bold text-sm">已随过啦，心意已送达 💝</span>'
        : '<span onclick="giftUi.open(\'' + pair.id + '\')" class="block text-center cursor-pointer w-full py-3 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm shadow-lg shadow-brand-pink/30 card-hover">我要随份子</span>';
    return window.BaoxiGifts.giftListHtml(pair) + '<div class="mt-3">' + action + '</div>';
}

function render() {
    var header = `
    <div class="sticky top-0 z-40 bg-white/90 backdrop-blur-md px-4 py-3 flex items-center justify-between">
        <span onclick="window.history.back()" class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer"><i data-lucide="chevron-left" class="w-5 h-5 text-gray-600"></i></span>
        <span class="font-black text-gray-800 text-base">结缘海报</span>
        <span class="w-9"></span>
    </div>
    `;
    if (!pair) {
        var notFound = rawId === 'mine'
            ? '<div class="text-center py-16 px-8">' +
                '<p class="text-4xl mb-3">🎉</p>' +
                '<p class="text-sm text-gray-400 mb-5">你还未报喜，完成报喜后即可在这里查看自己的结缘海报</p>' +
                '<span class="block text-center cursor-pointer w-full py-3 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm shadow-lg shadow-brand-pink/30 card-hover" onclick="window.location.href=\'baoxi.html\'">去报喜</span>' +
              '</div>'
            : '<div class="text-center py-16 text-sm text-gray-400">未找到该报喜喜讯</div>';
        document.getElementById('app').innerHTML = header + notFound + giftUi.modalHtml();
        window.Common.initIcons();
        return;
    }
    var genders = pair.genders || ['female', 'male'];
    var isMine = pair.id === 'mine';
    // 我的报喜：与报喜提交后界面完全一致——状态提示 + 下载海报 + 返回链接（无随份子）
    var statusBanner = isMine
        ? '<div class="px-4 pt-4">' +
            '<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 mb-4 flex items-center gap-2.5">' +
              '<span class="text-xl flex-shrink-0">📮</span>' +
              '<p class="text-xs leading-relaxed font-bold" style="color:#8C6E67;">已收到您的喜讯，我们核实后将会有大礼相赠！</p>' +
            '</div>' +
          '</div>'
        : '';
    var bottom = isMine
        ? '<span class="block text-center cursor-pointer w-full py-3.5 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-base shadow-lg shadow-brand-pink/30 card-hover flex items-center justify-center gap-2" onclick="downloadMinePoster()"><i data-lucide="download" class="w-5 h-5"></i>下载结缘海报</span>' +
          '<p class="text-center text-xs mt-4"><a href="javascript:;" onclick="window.history.back()" style="color:#C8B0A8;text-decoration:underline;">返回</a></p>'
        : '<span class="block text-center cursor-pointer w-full py-3.5 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-base shadow-lg shadow-brand-pink/30 card-hover flex items-center justify-center gap-2" onclick="window.history.back()"><i data-lucide="chevron-left" class="w-5 h-5"></i>返回</span>';
    document.getElementById('app').innerHTML = header +
        statusBanner +
        window.BaoxiReport.posterHtml({
            cn: pair.names[0],
            mn: pair.names[1],
            portraits: [
                { name: pair.names[0], gender: genders[0], photo: pair.avatars[0] },
                { name: pair.names[1], gender: genders[1], photo: pair.avatars[1] }
            ],
            events: pair.events,
            couplePhoto: pair.couplePhoto,
            blessing: window.BaoxiReport.blessing,
            giftSectionHtml: giftSectionHtml()
        }) +
        bottom +
        (isMine ? '' : giftUi.modalHtml());
    window.Common.initIcons();
    window.scrollTo(0, 0);
}

// 下载我的结缘海报（DOM 快照导出，失败回退 canvas 绘制）
function downloadMinePoster() {
    var genders = pair.genders || ['female', 'male'];
    window.BaoxiPoster.download({
        srcs: [pair.avatars[0], pair.avatars[1], pair.couplePhoto || 'images/logo_center.png', 'images/cheng.png'],
        draw: {
            cn: pair.names[0], mn: pair.names[1],
            gender1: genders[0], gender2: genders[1],
            dateLabel: pair.time,
            posterLines: pair.posterLines || []
        }
    });
}

document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
