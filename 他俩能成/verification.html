<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><title>我的认证 - 他俩能成</title><script src="lib/tailwind.min.js"></script><script src="lib/lucide.min.js"></script><link rel="stylesheet" href="style.css"></head><body class="bg-white text-gray-900 antialiased pb-2">
<div class="bg-decoration"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div><div id="app" class="relative z-[1]"></div>
<script src="common.js"></script><script>
var state={realNameVerified:Math.random()>0.5,orgVerified:Math.random()>0.5,orgName:'',orgType:''};

var orgTypes=[
  {key:'gov',label:'政府机关',icon:'landmark',desc:'各级政府及事业单位'},
  {key:'soe',label:'国有企业',icon:'building',desc:'央企、地方国企等'},
  {key:'private',label:'民营企业',icon:'building-2',desc:'私企、外企、创业公司等'},
];

function submitOrgVerification(){
  var n=document.getElementById('org-name-input').value.trim();
  if(!n){window.Common.showToast('请填写单位名称');return}
  if(!state.orgType){window.Common.showToast('请选择单位类型');return}
  window.Common.showToast('单位认证申请已提交，请等待审核');
  setTimeout(function(){state.orgVerified=true;state.orgName=n;render();window.Common.showToast('单位认证成功！')},1500);
}

function render(){
  var overviewHtml='<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3">'+
    '<h3 class="font-bold text-gray-900 mb-3 flex items-center gap-2"><i data-lucide="shield" class="w-4 h-4 text-brand-pink"></i>认证状态</h3>'+
    '<div class="space-y-3">'+
      '<div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-brand-pink/10 flex items-center justify-center"><i data-lucide="user-check" class="w-5 h-5 text-brand-pink"></i></div><div><div class="font-medium text-gray-900">实名认证</div><div class="text-xs text-gray-400">上传身份证信息进行认证</div></div></div>'+
      (state.realNameVerified?'<span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">已认证</span>':'<span class="px-3 py-1 bg-gray-100 text-gray-600 text-xs font-bold rounded-full">未认证</span>')+
      '</div>'+
      '<div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center"><i data-lucide="badge-check" class="w-5 h-5 text-blue-500"></i></div><div><div class="font-medium text-gray-900">单位认证</div><div class="text-xs text-gray-400">认证您所在的工作单位</div></div></div>'+
      (state.orgVerified?'<span class="px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">已认证</span>':'<span class="px-3 py-1 bg-gray-100 text-gray-600 text-xs font-bold rounded-full">未认证</span>')+
      '</div>'+
    '</div></div>';

  var realNameHtml='<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3">'+
    '<div class="flex items-center justify-between mb-3"><h3 class="font-bold text-gray-900 flex items-center gap-2"><i data-lucide="id-card" class="w-4 h-4 text-brand-pink"></i>实名认证</h3>'+
    (state.realNameVerified?'<span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full flex items-center gap-1"><i data-lucide="check-circle" class="w-3 h-3"></i>已完成</span>':'<span class="px-2 py-1 bg-brand-pink/10 text-brand-pink text-xs font-bold rounded-full">待认证</span>')+
    '</div>';

  if(state.realNameVerified){
    realNameHtml+='<div class="p-3 bg-green-50 rounded-xl border border-green-100"><div class="flex items-center gap-2 text-green-700 mb-1"><i data-lucide="check-circle" class="w-4 h-4"></i><span class="text-sm font-bold">实名认证已完成</span></div><div class="text-xs text-green-600">认证姓名：张**<br/>认证时间：2026/6/15 14:30</div></div>';
  }else{
    realNameHtml+='<div class="space-y-3"><div class="text-sm text-gray-600">为保障平台用户安全，请完成实名认证。认证后将在个人主页显示认证标识。</div>'+
      '<div class="space-y-2 text-sm text-gray-600"><div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>需提供本人身份证正反面照片</div></div><div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>身份证信息需与注册信息一致</div></div><div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>审核通常需要1-3个工作日</div></div></div>'+
      '<div class="grid grid-cols-2 gap-3"><div class="aspect-[3/2] bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-gray-400 cursor-pointer card-hover"><i data-lucide="camera" class="w-6 h-6 mb-1"></i><span class="text-xs">身份证正面</span></div><div class="aspect-[3/2] bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-gray-400 cursor-pointer card-hover"><i data-lucide="camera" class="w-6 h-6 mb-1"></i><span class="text-xs">身份证反面</span></div></div>'+
      '<span class="block text-center w-full py-3 rounded-xl bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm shadow-lg shadow-brand-pink/20 card-hover cursor-pointer" onclick="state.realNameVerified=true;render();window.Common.showToast(\x27实名认证申请已提交，请等待审核\x27);setTimeout(function(){window.Common.showToast(\x27实名认证成功！\x27)},1500)">提交实名认证</span></div>';
  }
  realNameHtml+='</div>';

  var orgHtml='<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3">'+
    '<div class="flex items-center justify-between mb-3"><h3 class="font-bold text-gray-900 flex items-center gap-2"><i data-lucide="building-2" class="w-4 h-4 text-blue-500"></i>单位认证</h3>'+
    (state.orgVerified?'<span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full flex items-center gap-1"><i data-lucide="check-circle" class="w-3 h-3"></i>已完成</span>':'<span class="px-2 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full">待认证</span>')+
    '</div>';

  if(state.orgVerified){
    orgHtml+='<div class="p-3 bg-blue-50 rounded-xl border border-blue-100"><div class="flex items-center gap-2 text-blue-700 mb-1"><i data-lucide="check-circle" class="w-4 h-4"></i><span class="text-sm font-bold">单位认证已完成</span></div><div class="text-xs text-blue-600">认证单位：'+state.orgName+'<br/>认证时间：2026/6/20 10:15</div></div>';
  }else{
    orgHtml+='<div class="space-y-4"><div class="text-sm text-gray-600">认证您所在的工作单位，认证后将在个人主页显示单位认证标识，提升交友可信度。</div>'+
      '<div><div class="text-sm font-medium text-gray-700 mb-2">单位类型：</div><div class="grid grid-cols-3 gap-2">'+orgTypes.map(function(t){
        return'<div onclick="state.orgType=\x27'+t.key+'\x27;render()" class="p-2 border-2 '+(state.orgType===t.key?'border-blue-500 bg-blue-50':'border-gray-200 bg-white')+' rounded-xl cursor-pointer card-hover text-center"><i data-lucide="'+t.icon+'" class="w-5 h-5 '+(state.orgType===t.key?'text-blue-500':'text-gray-400')+' mx-auto mb-1"></i><div class="text-xs font-bold text-gray-700">'+t.label+'</div></div>';
      }).join('')+'</div></div>'+
      '<div><label class="block text-sm font-bold text-gray-700 mb-2">单位名称 <span class="text-brand-pink">*</span></label><input id="org-name-input" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-brand-pink" placeholder="请输入您所在的单位全称"/></div>'+
      '<div class="text-sm font-medium text-gray-700">认证材料要求：</div>'+
      '<div class="space-y-2 text-sm text-gray-600"><div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>需上传社保证明（近6个月内参保记录截图）</div></div><div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>参保单位需与填写的单位名称一致</div></div><div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>截图需清晰可辨，包含姓名和单位信息</div></div><div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>审核通常需要1-3个工作日</div></div></div>'+
      '<div class="space-y-2"><div class="text-sm font-medium text-gray-700">上传社保证明：</div><div class="bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-gray-400 cursor-pointer card-hover py-8"><i data-lucide="upload" class="w-8 h-8 mb-2"></i><span class="text-sm">点击上传社保证明截图</span><span class="text-xs mt-1">支持 JPG/PNG 格式，大小不超过 5MB</span></div></div>'+
      '<span class="block text-center w-full py-3 rounded-xl bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm shadow-lg shadow-brand-pink/20 card-hover cursor-pointer" onclick="submitOrgVerification()">提交单位认证</span></div>';
  }
  orgHtml+='</div>';

  var noteHtml='<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">'+
    '<h3 class="font-bold text-gray-900 mb-3 flex items-center gap-2"><i data-lucide="info" class="w-4 h-4 text-gray-400"></i>认证说明</h3>'+
    '<div class="space-y-2 text-sm text-gray-600">'+
      '<div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>实名认证和单位认证相互独立，可根据需求分别完成</div></div>'+
      '<div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>实名认证完成后，个人主页将显示橙色认证标识</div></div>'+
      '<div class="flex items-start gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500 mt-0.5 flex-shrink-0"></i><div>单位认证完成后，个人主页将显示蓝色认证标识，展示您的单位信息</div></div>'+
  '</div></div>';

  document.getElementById('app').innerHTML=
    '<div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-2.5 shadow-sm flex items-center"><i data-lucide="badge-check" class="w-3.5 h-3.5 text-brand-pink mr-2"></i><h1 class="text-sm font-bold text-gray-900">我的认证</h1></div>'+
    '<div class="px-4 pt-3 pb-6">'+overviewHtml+realNameHtml+orgHtml+noteHtml+'</div>';
  window.Common.initIcons();
}
document.addEventListener('DOMContentLoaded',function(){render()});
</script>
</body></html>
