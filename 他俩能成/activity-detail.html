      f.options.forEach(function(o){html+='<option value="'+o+'">'+o+'</option>'});
      html+='</select></div>';
    }else{
      html+='<textarea id="reg-'+f.id+'" required rows="3" placeholder="'+f.placeholder+'" class="block cursor-pointer w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-brand-pink resize-none"></textarea></div>';
    }
  });
  return html;
}

function showReg(){
  var isPaid=a.price>0,efHtml=getExtraFieldsHtml();
  document.getElementById('reg-form').innerHTML=
    (isPaid?'<div class="bg-amber-50 rounded-xl p-3 text-center"><span class="text-sm text-gray-700">本活动为<b class="text-brand-pink">付费活动</b>，报名需支付</span><div class="text-xl font-black text-brand-pink mt-1">¥'+a.price+'</div></div>':'<div class="bg-green-50 rounded-xl p-3 text-center"><span class="text-sm text-green-700">🎉 本活动<b>免费</b>参与</span></div>')+
    efHtml+
    '<label class="flex items-start gap-2 cursor-pointer pt-2"><input type="checkbox" id="reg-safety" class="mt-0.5 w-4 h-4 accent-brand-pink"/><span class="text-sm text-gray-600">我已阅读并同意 <span class="text-brand-pink underline cursor-pointer" onclick="showSafety()">《安全提醒》</span> <span class="text-brand-pink">*</span></span></label>'+
    '<div class="flex gap-3 pt-2"><span onclick="hideReg()" class="px-5 py-3 rounded-2xl bg-white border border-gray-200 text-gray-500 font-bold text-sm card-hover">暂不报名</span><span onclick="confirmReg()" class="flex-1 py-3 rounded-2xl bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-base shadow-lg shadow-brand-pink/20 card-hover flex items-center justify-center">确认报名</span></div>';
	  window.Common.showPopup('reg-overlay');
}

function hideReg(e){ window.Common.closePopup(e, 'reg-overlay'); }

function confirmReg(){
  if(!document.getElementById('reg-safety').checked){window.Common.showToast('请阅读并同意安全提醒');return}
  if(ef){var ok=true;ef.fields.forEach(function(f){var el=document.getElementById('reg-'+f.id);if(!el.value){window.Common.showToast('请填写'+f.label);ok=false}});if(!ok)return}
  window.Common.hidePopup('reg-overlay');
  if(a.price>0){showPay()}else{registered=true;window.Common.showToast(isReview?'提交成功，请等待审核！':'报名成功！');a.current++;render()}
}

function showPay(){
  document.getElementById('pay-title').textContent='报名费用：'+a.title;
  document.getElementById('pay-amount').textContent='¥'+a.price;
	  window.Common.showPopup('pay-overlay');
}
function hidePay(e){ window.Common.closePopup(e, 'pay-overlay'); }
function doPay(){window.Common.hidePopup('pay-overlay');registered=true;window.Common.showToast(isReview?'支付成功，请等待审核！':'支付成功，报名完成！');a.current++;render()}

function cancelReg(){
  window.Common.showPopup('cancel-reg-overlay');
}
function hideCancelReg(e){ window.Common.closePopup(e, 'cancel-reg-overlay'); }
function confirmCancel(){
  window.Common.hidePopup('cancel-reg-overlay');registered=false;a.current--;window.Common.showToast('已取消报名');render();
}

function showSafety(){ window.Common.showPopup('safety-overlay'); }
function hideSafety(e){ window.Common.closePopup(e, 'safety-overlay'); }

function render(){
  var orgHtml='';
  if(a.zone==='chaoyang'){
    orgHtml='<div class="flex items-center justify-between mb-6"><div class="flex items-center gap-3"><img src="images/icon_chaoyang.png" class="w-10 h-10 rounded-full border border-gray-100 object-contain bg-gray-50"/><div><div class="font-bold text-gray-900 text-sm">朝阳相伴</div><div class="text-xs text-gray-400">发起方</div></div></div><a href="chaoyang.html" class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full bg-brand-pink/10 text-brand-pink font-bold underline decoration-dotted cursor-pointer hover:bg-brand-pink/20 transition-colors">朝阳相伴专区 <i data-lucide="arrow-up-right" class="w-3 h-3"></i></a></div>';
  }else if(a.zone==='qingai'){
    orgHtml='<div class="flex items-center justify-between mb-6"><div class="flex items-center gap-3"><img src="images/icon_qingai.png" class="w-10 h-10 rounded-full border border-gray-100 object-contain bg-gray-50"/><div><div class="font-bold text-gray-900 text-sm">青爱团</div><div class="text-xs text-gray-400">发起方</div></div></div><a href="qingai.html" class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full bg-purple-50 text-purple-600 font-bold underline decoration-dotted cursor-pointer hover:bg-purple-100 transition-colors">青爱团专区 <i data-lucide="arrow-up-right" class="w-3 h-3"></i></a></div>';
  }

// Shuffle for random display
for(var i2=participants.length-1;i2>0;i2--){var j2=Math.floor(Math.random()*(i2+1));[participants[i2],participants[j2]]=[participants[j2],participants[i2]];}

  var pList=participants.map(function(u){
    var gb=u.gender==='male'?'<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-blue-50 text-blue-500 font-medium inline-flex items-center gap-0.5"><i data-lucide="mars" class="w-2.5 h-2.5"></i>男</span>':'<span class="text-[10px] px-1.5 py-0.5 rounded-full bg-pink-50 text-brand-pink font-medium inline-flex items-center gap-0.5"><i data-lucide="venus" class="w-2.5 h-2.5"></i>女</span>';
    return'<div class="flex items-center gap-2.5 py-2 cursor-pointer card-hover" onclick="window.location.href=\'profile.html\'"><img src="'+u.photo+'" class="w-9 h-9 rounded-full object-cover border border-gray-100 flex-shrink-0"/><div class="flex-1 min-w-0 leading-tight"><span class="text-sm font-bold text-gray-800 truncate max-w-[72px]">'+u.name+'</span><br/><span class="text-[10px] px-1.5 py-0.5 rounded-full '+(u.gender==='male'?'bg-blue-50 text-blue-500':'bg-pink-50 text-brand-pink')+' font-medium inline-flex items-center gap-0.5">'+(u.gender==='male'?'<i data-lucide="mars" class="w-2.5 h-2.5"></i>男':'<i data-lucide="venus" class="w-2.5 h-2.5"></i>女')+'</span></div></div>';
  });

  document.getElementById('app').innerHTML=
    '<div class="fixed top-0 left-0 right-0 z-50 flex items-center px-4 py-3 bg-transparent bg-gradient-to-b from-black/50 to-transparent text-white">'+
      '<span onclick="window.history.back()" class="p-2 bg-black/20 backdrop-blur rounded-full"><i data-lucide="chevron-left" class="w-6 h-6"></i></span>'+
    '</div>'+
    '<div class="relative h-72 w-full"><img src="'+a.image+'" class="w-full h-full object-cover"/><div class="absolute bottom-0 left-0 right-0 h-10 bg-gradient-to-t from-white to-transparent"></div></div>'+
    '<div class="relative -mt-6 bg-white rounded-t-3xl px-5 pt-6 fade-in">'+
      '<h1 class="text-2xl font-black text-gray-900 mb-3 leading-snug break-words">'+a.title+'</h1>'+
      '<div class="text-brand-pink font-bold text-lg mb-6">'+(a.price===0?'免费':'¥'+a.price)+'</div>'+
      '<hr class="border-gray-100 mb-6"/>'+
      orgHtml+
      // Info block with separators
      '<div class="bg-gray-50 rounded-xl p-4 mb-6">'+
        '<div class="flex items-start gap-3 py-3"><div class="p-2 bg-white rounded-lg shadow-sm text-brand-pink"><i data-lucide="calendar" class="w-5 h-5"></i></div><div><div class="font-bold text-gray-900 text-sm">活动时间</div><div class="text-sm text-gray-600">'+a.date+'</div></div></div>'+
        '<div class="border-t border-gray-200"></div>'+
        '<div class="flex items-start gap-3 py-3"><div class="p-2 bg-white rounded-lg shadow-sm text-brand-orange"><i data-lucide="map-pin" class="w-5 h-5"></i></div><div class="flex-1"><div class="font-bold text-gray-900 text-sm">活动地点</div><div class="text-sm text-gray-600 flex items-center gap-1">'+a.location+'<i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i></div></div></div>'+
        '<div class="border-t border-gray-200"></div>'+
        '<div class="flex items-start gap-3 py-3"><div class="p-2 bg-white rounded-lg shadow-sm text-purple-500"><i data-lucide="users" class="w-5 h-5"></i></div><div><div class="font-bold text-gray-900 text-sm">人员限制</div><div class="text-sm text-gray-600">已报 '+a.current+' 人 / 限 '+a.max+' 人'+a.genderLimit+'</div></div></div>'+
      '</div>'+
      // Description
      '<h3 class="font-bold text-lg mb-3">活动详情</h3>'+
      '<div class="text-gray-600 text-sm leading-relaxed mb-6">'+a.desc.replace(/\n/g,'<br/>')+'</div>'+
      // Participants
      '<h3 class="font-bold text-lg mb-3">报名名单 <span class="text-sm font-normal text-gray-400">('+participants.length+'人)</span></h3>'+
      '<div class="grid grid-cols-2 gap-x-4 gap-y-0 mb-24">'+pList.join('')+'</div>'+
    '</div>'+
    // Bottom bar
    (function(){
      var dc=!!a.deadline,cl=(a.status==='CLOSED'),canReg=!(isFull||cl||registered);
      var btnCls,btnHtml;
      if(isFull||cl){
        btnCls='bg-gray-300 text-white';btnHtml='<span class="text-base leading-tight">'+(isFull?'名额已满':'已截止')+'</span>';
      }else if(registered){
        btnCls='bg-amber-100 text-amber-700 border border-amber-200';
        btnHtml='<span class="text-base font-bold leading-tight">取消报名</span><span class="text-[10px] font-normal leading-tight mt-0.5">取消截止 '+a.cancelDeadline+'</span>';
      }else{
        btnCls='bg-gradient-to-tr from-brand-pink to-brand-orange text-white shadow-lg shadow-brand-pink/30';
        btnHtml='<span class="text-base font-bold leading-tight">立即报名</span>'+(dc?'<span class="text-[10px] font-normal leading-tight mt-0.5">报名截止 '+a.deadline+'</span>':'');
      }
      var onclick=(canReg?'showReg()':(registered?'cancelReg()':''));
      return ''+
    '<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-6 py-3 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] flex items-center gap-4 z-50">'+
      '<div class="flex flex-col items-center gap-0.5 text-gray-500 cursor-pointer" onclick="window.Common.showToast(\'转发功能开发中\')"><i data-lucide="share-2" class="w-6 h-6"></i><span class="text-[10px]">转发</span></div>'+
      '<span class="flex-1 py-2.5 rounded-full font-bold flex flex-col items-center justify-center '+btnCls+'" onclick="'+onclick+'">'+btnHtml+'</span>'+
    '</div>';
    })()+
    '</div>';
  window.Common.initIcons();
}

document.addEventListener('DOMContentLoaded',function(){render()});
</script>
</body>
</html>
