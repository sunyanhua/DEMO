<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><title>编辑资料 - 他俩能成</title><script src="lib/tailwind.min.js"></script><script src="lib/lucide.min.js"></script><link rel="stylesheet" href="style.css"></head><body class="bg-white text-gray-900 antialiased pb-2">
<div class="bg-decoration"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div><div id="app" class="relative z-[1]"></div>
<script src="common.js"></script><script>
function render(){
  document.getElementById('app').innerHTML=
    '<div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-2.5 shadow-sm flex items-center">'+
      '<i data-lucide="edit-3" class="w-3.5 h-3.5 text-brand-pink mr-2"></i>'+
      '<h1 class="text-sm font-bold text-gray-900">编辑资料</h1>'+
    '</div>'+

    '<div class="px-4 pt-3 pb-6">'+

      '<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">'+
        '<div class="flex items-center justify-between">'+
          '<div class="flex items-center gap-3">'+
            '<div class="relative">'+
              '<img id="avatar-preview" src="images/photo/female/crop.0.67.1079.1438.0.750.1000.jpg" class="w-16 h-16 rounded-full border-2 border-gray-200 object-cover bg-gray-100">'+
              '<span onclick="changeAvatar()" class="absolute bottom-0 right-0 bg-brand-pink text-white w-6 h-6 rounded-full flex items-center justify-center text-xs cursor-pointer"><i data-lucide="camera" class="w-3 h-3"></i></span>'+
            '</div>'+
            '<div><h2 class="font-bold text-gray-900">头像</h2><p class="text-xs text-gray-400">点击更换头像</p></div>'+
          '</div>'+
          '<span onclick="changeAvatar()" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-full text-sm font-medium cursor-pointer card-hover">更换</span>'+
        '</div>'+
        '<input type="file" id="avatar-input" accept="image/*" class="hidden" onchange="handleAvatar(event)">'+
      '</div>'+

      '<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-4 mb-4">'+
        '<h3 class="font-bold text-gray-800">基本资料</h3>'+
        '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">昵称</label><input type="text" value="甜心小鹿" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-400 cursor-not-allowed"></div>'+
        '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">性别</label><div class="flex gap-4"><label class="flex items-center gap-2"><input type="radio" value="female" checked disabled class="w-4 h-4"> <span class="text-gray-400">女</span></label><label class="flex items-center gap-2"><input type="radio" value="male" disabled class="w-4 h-4"> <span class="text-gray-400">男</span></label></div></div>'+
        '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">出生日期</label><input type="date" value="2000-06-15" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-400 cursor-not-allowed"></div>'+
        '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">手机号</label><input type="text" value="13651260211" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-400 cursor-not-allowed"></div>'+
      '</div>'+

      '<div class="bg-amber-50 rounded-xl p-3 mb-4 flex items-start gap-2">'+
        '<i data-lucide="alert-triangle" class="w-4 h-4 text-amber-500 flex-shrink-0 mt-0.5"></i>'+
        '<p class="text-xs text-amber-700 leading-relaxed">基本资料一经填写后，<b>不能修改</b>，若有疑问请与客服联系。仅<b>头像</b>可更换。</p>'+
      '</div>'+

      '<span onclick="window.history.back()" class="block text-center w-full py-3 rounded-xl bg-gray-100 text-gray-500 font-bold text-sm mt-6 cursor-pointer card-hover">返回</span>'+

    '</div>';
  window.Common.initIcons();
}

function changeAvatar(){document.getElementById('avatar-input').click()}
function handleAvatar(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){document.getElementById('avatar-preview').src=ev.target.result};
  reader.readAsDataURL(file);
  window.Common.showToast('头像已更新');
}
document.addEventListener('DOMContentLoaded',function(){render()});
</script>
</body></html>
