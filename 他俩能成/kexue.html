<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><title>嗑学分 - 他俩能成</title><script src="lib/tailwind.min.js"></script><script src="lib/lucide.min.js"></script><link rel="stylesheet" href="style.css"></head><body class="bg-white text-gray-900 antialiased pb-2">
<div class="bg-decoration"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div><div id="app" class="relative z-[1]"></div>

<!-- 等级说明弹窗 -->
<div id="tier-popup" class="fixed inset-0 bg-black/40 z-[200] hidden items-center justify-center" onclick="window.Common.closePopup(event,'tier-popup')">
<div class="bg-white rounded-2xl p-5 mx-auto w-80 shadow-xl max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
<h3 class="text-base font-black text-gray-800 mb-3 text-center">📋 嗑学等级说明</h3>
<div class="space-y-1.5 text-xs">
<div class="flex justify-between px-3 py-2 bg-red-50 rounded-lg"><span class="font-bold text-red-600">当代法海</span><span class="text-gray-500">低于 -10001</span></div>
<div class="flex justify-between px-3 py-2 bg-red-50/50 rounded-lg"><span class="font-bold text-red-500">高级拆家</span><span class="text-gray-500">-10000 至 -1001</span></div>
<div class="flex justify-between px-3 py-2 bg-orange-50 rounded-lg"><span class="font-bold text-orange-600">反嗑学分子</span><span class="text-gray-500">-1000 至 -101</span></div>
<div class="flex justify-between px-3 py-2 bg-orange-50/50 rounded-lg"><span class="font-bold text-orange-500">嗑学门外汉</span><span class="text-gray-500">-100 至 -1</span></div>
<div class="flex justify-between px-3 py-2 bg-gray-50 rounded-lg"><span class="font-bold text-gray-600">嗑学菜鸟</span><span class="text-gray-500">0 至 100</span></div>
<div class="flex justify-between px-3 py-2 bg-green-50/50 rounded-lg"><span class="font-bold text-green-600">嗑学门生</span><span class="text-gray-500">101 至 1000</span></div>
<div class="flex justify-between px-3 py-2 bg-green-50 rounded-lg"><span class="font-bold text-green-700">嗑学爱好者</span><span class="text-gray-500">1001 至 2000</span></div>
<div class="flex justify-between px-3 py-2 bg-teal-50 rounded-lg"><span class="font-bold text-teal-600">嗑学高手</span><span class="text-gray-500">2001 至 5000</span></div>
<div class="flex justify-between px-3 py-2 bg-blue-50 rounded-lg"><span class="font-bold text-blue-600">嗑学行家</span><span class="text-gray-500">5001 至 10000</span></div>
<div class="flex justify-between px-3 py-2 bg-purple-50 rounded-lg"><span class="font-bold text-purple-600">嗑学大神</span><span class="text-gray-500">10001 至 20000</span></div>
<div class="flex justify-between px-3 py-2 bg-pink-50 rounded-lg"><span class="font-bold text-pink-600">嗑学宗师</span><span class="text-gray-500">20001 至 50000</span></div>
<div class="flex justify-between px-3 py-2 bg-brand-pink/10 rounded-lg"><span class="font-bold text-brand-pink">嗑学传奇</span><span class="text-gray-500">高于 50001</span></div>
</div>
<div class="mt-4 w-full py-2.5 rounded-xl bg-brand-pink text-white font-bold text-sm card-hover text-center cursor-pointer" onclick="window.Common.hidePopup('tier-popup')">我知道了</div>
</div></div>

<script src="common.js"></script><script>
// Tier definitions
var TIERS=[
  {name:'当代法海',min:-Infinity,max:-10001,color:'text-red-600',bg:'bg-red-50'},
  {name:'高级拆家',min:-10000,max:-1001,color:'text-red-500',bg:'bg-red-50/50'},
  {name:'反嗑学分子',min:-1000,max:-101,color:'text-orange-600',bg:'bg-orange-50'},
  {name:'嗑学门外汉',min:-100,max:-1,color:'text-orange-500',bg:'bg-orange-50/50'},
  {name:'嗑学菜鸟',min:0,max:100,color:'text-gray-600',bg:'bg-gray-50'},
  {name:'嗑学门生',min:101,max:1000,color:'text-green-600',bg:'bg-green-50/50'},
  {name:'嗑学爱好者',min:1001,max:2000,color:'text-green-700',bg:'bg-green-50'},
  {name:'嗑学高手',min:2001,max:5000,color:'text-teal-600',bg:'bg-teal-50'},
  {name:'嗑学行家',min:5001,max:10000,color:'text-blue-600',bg:'bg-blue-50'},
  {name:'嗑学大神',min:10001,max:20000,color:'text-purple-600',bg:'bg-purple-50'},
  {name:'嗑学宗师',min:20001,max:50000,color:'text-pink-600',bg:'bg-pink-50'},
  {name:'嗑学传奇',min:50001,max:Infinity,color:'text-brand-pink',bg:'bg-brand-pink/10'},
];

function getTitle(score){
  for(var i=0;i<TIERS.length;i++){if(score>=TIERS[i].min&&score<=TIERS[i].max)return TIERS[i];}
  return TIERS[0];
}

function getProgress(score,tier){
  if(tier.max===Infinity)return 100;
  if(tier.min===-Infinity)return 0;
  var pct=((score-tier.min)/(tier.max-tier.min))*100;
  return Math.min(100,Math.max(0,pct));
}

// Mock data
var keScore=28850,keWeek=420;
var tier=getTitle(keScore);
var nextTier=TIERS[TIERS.indexOf(tier)+1]||null;
var progress=getProgress(keScore,tier);

// 成绩单 data
var stats={
  scoreRate:'90.63',total:32,success:32,fail:0,
  openFate:11,helpSuccess:0,bonusBoost:0,
  randomMatch:2,almostBreak:0,breakCouple:0,
};

function render(){
  var progressHtml='';
  if(nextTier){
    var remain=nextTier.min-keScore;
    progressHtml='<div class="mt-2"><div class="flex justify-between text-[10px] text-gray-400 mb-1"><span>距下一级 '+nextTier.name+'</span><span>还需 '+remain.toLocaleString()+' 分</span></div><div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-brand-pink to-brand-orange rounded-full transition-all" style="width:'+progress+'%"></div></div></div>';
  }else{
    progressHtml='<div class="mt-2 text-center text-[10px] text-brand-pink font-bold">🎉 已达最高等级</div>';
  }

  var scoreCard='<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-3 deco-card">'+
    '<div class="flex items-center justify-between mb-2"><span class="text-sm font-bold text-gray-700">📋 嗑学分</span><span class="px-3 py-1 rounded-full bg-brand-pink/10 text-brand-pink text-xs font-bold card-hover cursor-pointer" onclick="window.Common.showPopup(\x27tier-popup\x27)">等级说明</span></div>'+
    '<div class="text-center mb-3"><span class="text-4xl font-black text-brand-pink">'+keScore.toLocaleString()+'</span><div class="text-xs text-gray-400 mt-1">本周 +'+keWeek+'</div></div>'+
    '<div class="bg-brand-pink/5 rounded-xl p-3 text-center mb-1"><span class="text-sm font-bold text-brand-pink">当前头衔：'+tier.name+'</span></div>'+
    progressHtml+
  '</div>';

  // 成绩单 items — same as homepage with adjustments
  var items=[
    {emoji:'🔮',label:'开启缘分',value:stats.openFate,unit:'次',color:'from-purple-50 to-pink-50 text-purple-600'},
    {emoji:'🎉',label:'成功助力',value:stats.helpSuccess,unit:'次',color:'from-green-50 to-emerald-50 text-green-600'},
    {emoji:'🌸',label:'锦上添花',value:stats.bonusBoost,unit:'次',color:'from-orange-50 to-amber-50 text-orange-500'},
    {emoji:'🎲',label:'乱点鸳鸯谱',value:stats.randomMatch,unit:'次',color:'from-blue-50 to-cyan-50 text-blue-500'},
    {emoji:'💔',label:'差点儿拆散',value:stats.almostBreak,unit:'次',color:'from-gray-50 to-slate-50 text-gray-500'},
    {emoji:'⚡',label:'棒打鸳鸯',value:stats.breakCouple,unit:'次',color:'from-red-50 to-rose-50 text-red-500'},
  ];

  var summaryHtml='<div class="text-center mb-4"><div class="inline-flex items-center gap-2 bg-white rounded-full px-5 py-2 shadow-sm border border-pink-100"><span class="text-2xl">🎯</span><span class="text-xs text-gray-500">得分率</span><span class="text-2xl font-black text-brand-pink">'+stats.scoreRate+'%</span></div><p class="text-xs text-gray-400 mt-2">总计操作 <b class="text-gray-700">'+stats.total+'</b> 次 · <span class="text-brand-pink font-bold">能成 '+stats.success+'</span> 次 · <span class="text-gray-400">不成 '+stats.fail+'</span> 次</p></div>';

  var itemsHtml=items.map(function(it){
    return'<div class="bg-gradient-to-br '+it.color+' rounded-xl p-3 text-center flex flex-col items-center gap-1 shadow-sm border border-white/60"><span class="text-xl">'+it.emoji+'</span><span class="text-[11px] text-gray-500">'+it.label+'</span><span class="text-lg font-black">'+it.value+'<span class="text-[10px] text-gray-400 font-medium ml-0.5">'+it.unit+'</span></span></div>';
  }).join('');

  var reportCard='<div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 deco-card"><div class="text-center mb-3"><span class="text-sm font-black text-gray-700">📋 嗑学成绩单</span></div>'+summaryHtml+'<div class="grid grid-cols-3 gap-2">'+itemsHtml+'</div></div>';

  document.getElementById('app').innerHTML=
    '<div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-2.5 shadow-sm flex items-center"><i data-lucide="book-open" class="w-3.5 h-3.5 text-brand-pink mr-2"></i><h1 class="text-sm font-bold text-gray-900">嗑学分</h1></div>'+
    '<div class="px-4 pt-3 pb-6">'+scoreCard+reportCard+'<span class="block text-center w-full py-3 rounded-xl bg-white border border-brand-pink/30 text-brand-pink font-bold text-sm card-hover cursor-pointer mt-4" onclick="window.location.href=\x27history.html\x27">📋 查看牵线记录</span></div>';
  window.Common.initIcons();
}
document.addEventListener('DOMContentLoaded',function(){render()});
</script>
</body></html>
