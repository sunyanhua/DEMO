<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>个人中心 - 他俩能成</title>
<script src="lib/tailwind.min.js"></script>
<script src="lib/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-gray-900 antialiased pb-28">
<div class="bg-decoration"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div>
<div id="app" class="relative z-[1]"></div>

<!-- 微信手机授权弹窗 -->
<div id="phone-auth-overlay" class="fixed inset-0 bg-black/40 z-[200] hidden items-center justify-center" onclick="window.Common.closePopup(event,'phone-auth-overlay')">
<div class="bg-white rounded-2xl p-5 mx-auto w-80 shadow-xl text-center" onclick="event.stopPropagation()">
<div class="text-4xl mb-3">📱</div>
<p class="text-sm font-bold text-gray-800 mb-1">微信手机号授权</p>
<p class="text-xs text-gray-400 mb-4">授权您的微信绑定手机号<br/>用于登录「他俩能成」</p>
<div class="bg-brand-pink/5 rounded-xl p-3 mb-4 flex items-center justify-center gap-2">
  <i data-lucide="smartphone" class="w-4 h-4 text-brand-pink"></i>
  <span class="text-sm font-bold text-brand-pink">136****0211</span>
</div>
<span id="phone-auth-btn" class="block w-full py-2.5 rounded-xl bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm card-hover text-center cursor-pointer mb-2" onclick="doPhoneAuth()">确认授权</span>
<span onclick="window.Common.hidePopup('phone-auth-overlay')" class="block w-full py-2.5 rounded-xl bg-gray-100 text-gray-500 font-bold text-sm card-hover text-center cursor-pointer">暂不授权</span>
</div></div>

<div id="confirm-overlay" class="fixed inset-0 bg-black/40 z-[200] hidden items-center justify-center" onclick="window.Common.closePopup(event,'confirm-overlay')">
<div class="bg-white rounded-2xl p-5 mx-auto w-80 shadow-xl text-center" onclick="event.stopPropagation()">
<div class="text-4xl mb-3">💔</div>
<p id="confirm-msg" class="text-sm text-gray-700 mb-4"></p>
<div class="space-y-2">
<span id="confirm-btn-yes" class="block w-full py-2.5 rounded-xl bg-brand-pink text-white font-bold text-sm card-hover text-center cursor-pointer">确定</span>
<span onclick="window.Common.hidePopup('confirm-overlay')" class="block w-full py-2.5 rounded-xl bg-gray-100 text-gray-500 font-bold text-sm card-hover text-center cursor-pointer">我再想想</span>
</div>
</div></div>

<script src="common.js"></script>
<script>
var isLoggedIn=location.search.indexOf('nologin=true')===-1 && Math.random()>0.2;
var stateJoined=Math.random()>0.3;

var goldItems=[
  {icon:'coins',label:'我的金币',value:'1,280',color:'text-yellow-500 bg-yellow-50',href:'wallet.html'},
  {icon:'wallet',label:'我的钱包',value:'¥3.50',color:'text-green-600 bg-green-50',href:'wallet-cash.html'},
  {icon:'gift',label:'我的奖品',value:'',color:'text-brand-pink bg-brand-pink/10',href:'my-prizes.html'},
  {icon:'help-circle',label:'帮助与反馈',value:'',color:'text-gray-500 bg-gray-50',href:'help.html'},
];

var goldRows=goldItems.map(function(g){
  var val=g.value?'<span class="text-sm font-bold text-brand-pink">'+g.value+'</span>':'';
  return'<div class="flex items-center gap-3 py-2.5 cursor-pointer card-hover" onclick="window.location.href=\x27'+g.href+'\x27"><div class="w-8 h-8 rounded-xl '+g.color+' flex items-center justify-center"><i data-lucide="'+g.icon+'" class="w-3.5 h-3.5"></i></div><span class="flex-1 text-sm text-gray-600">'+g.label+'</span>'+val+'<i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 ml-1"></i></div>';
}).join('<div class="border-t border-gray-100"></div>');

function render(){
  if(!isLoggedIn){
    document.getElementById('app').innerHTML=
      '<div class="top-section" style="min-height:212px"><div class="px-4 pt-3 pb-2"><h1 class="text-lg font-black text-gray-800 flex items-center gap-1.5"><i data-lucide="user" class="w-5 h-5 text-brand-pink"></i>个人中心</h1></div></div>'+
      '<div class="text-center py-8 px-4" style="margin-top:-60px">'+
        '<div class="w-20 h-20 rounded-full bg-white border-2 border-white shadow-md flex items-center justify-center mx-auto mb-4"><i data-lucide="user" class="w-10 h-10 text-gray-400"></i></div>'+
        '<p class="text-sm text-gray-500 mb-4">登录后查看个人中心</p>'+
        '<span class="inline-block px-8 py-3 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-base shadow-xl shadow-brand-pink/20 card-hover cursor-pointer" onclick="showPhoneAuth()">立即登录</span>'+
      '</div>'+
      window.Common.renderBottomNav('me');
    window.Common.initIcons();
    return;
  }

  // User card
  var u='<div class="px-4 pt-4 pb-1"><div class="bg-white rounded-2xl shadow-sm border border-gray-100 pt-4 px-4 pb-2">'+
    '<div class="flex items-center gap-4 cursor-pointer card-hover" onclick="window.location.href=\x27edit-profile.html\x27"><img src="images/photo/female/crop.0.67.1079.1438.0.750.1000.jpg" class="w-16 h-16 rounded-full object-cover border-2 border-brand-pink/20"/><div class="flex-1 min-w-0"><div class="flex items-center gap-2"><span class="text-lg font-black text-gray-800">甜心小鹿</span><span class="text-[10px] px-1.5 py-0.5 rounded-full bg-pink-50 text-brand-pink font-medium inline-flex items-center gap-0.5"><i data-lucide="venus" class="w-2.5 h-2.5"></i>女</span></div><div class="text-xs text-gray-400 mt-0.5 flex items-center gap-1"><i data-lucide="edit-3" class="w-3 h-3"></i>编辑资料</div></div></div>'+
    '<div class="border-t border-gray-100 mt-3 pt-1">'+goldRows+'</div>'+
  '</div></div>';

  // Tab functional area
  var funcTab=(typeof activeTab==='undefined')?'tuodan':activeTab;
  var joined=stateJoined;

  var tabBar='<div class="px-4 pt-2"><div class="flex border-b border-gray-100">'+
    '<span onclick="activeTab=\x27tuodan\x27;render()" class="flex-1 text-center text-sm pb-2 font-bold transition-colors duration-200 '+(funcTab==='tuodan'?'text-brand-pink border-b-[3px] border-brand-pink':'text-gray-400')+' cursor-pointer">我要脱单</span>'+
    '<span onclick="activeTab=\x27qianxian\x27;render()" class="flex-1 text-center text-sm pb-2 font-bold transition-colors duration-200 '+(funcTab==='qianxian'?'text-brand-pink border-b-[3px] border-brand-pink':'text-gray-400')+' cursor-pointer">我要牵线</span>'+
  '</div></div>';

  var funcContent='';
  if(funcTab==='tuodan'){
    if(joined){
      var joinedStats=[
        {icon:'flame',label:'人气',value:507,href:'profile.html'},
        {icon:'heart',label:'心动',value:12,href:'my-lists.html?tab=heart&sub=byMe'},
        {icon:'bookmark',label:'关注',value:8,href:'my-lists.html?tab=follow&sub=byMe'},
        {icon:'heart-handshake',label:'成了',value:3,href:'my-1314.html'},
      ];
      var jStatsHtml='<div class="flex justify-around px-4 py-4 bg-brand-pink/5 rounded-xl mx-3 my-1">'+joinedStats.map(function(st){
        var h=st.href==='#'?'':' onclick="window.location.href=\x27'+st.href+'\x27"';
        return'<div class="text-center cursor-pointer card-hover"'+h+'><div class="text-2xl font-black text-brand-pink">'+st.value+'</div><div class="flex items-center justify-center gap-1 text-xs text-gray-500 mt-1.5"><i data-lucide="'+st.icon+'" class="w-3 h-3"></i>'+st.label+'</div></div>'
      }).join('')+'</div>';

      var jMenus=[
        {icon:'file-text',label:'我的脱单档案',href:'profile-edit.html'},
        {icon:'heart',label:'我的心动',href:'my-lists.html?tab=heart&sub=byMe'},
        {icon:'bookmark',label:'我的关注',href:'my-lists.html?tab=follow&sub=byMe'},
        {icon:'sparkles',label:'我的1314',href:'my-1314.html'},
        {icon:'gift',label:'我的礼物',href:'my-gifts.html'},
        {icon:'users',label:'我的亲友团',href:'my-family.html'},
        {icon:'x-circle',label:'我的无感',href:'my-lists.html?tab=dislike'},
        {icon:'badge-check',label:'我的认证',href:'verification.html'},
      ];
      var jMenuHtml=jMenus.map(function(it){return'<div class="flex items-center gap-3 p-3 border-b border-gray-50 cursor-pointer card-hover" onclick="window.location.href=\x27'+it.href+'\x27"><i data-lucide="'+it.icon+'" class="w-4 h-4 text-brand-pink"></i><span class="text-sm text-gray-700">'+it.label+'</span><i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 ml-auto"></i></div>'}).join('');

      var jBtns='<div class="px-4 pb-4 pt-2"><span class="block text-center py-2.5 rounded-xl bg-red-50 text-red-500 text-sm font-bold card-hover cursor-pointer" onclick="quitTuodan()">退出脱单</span></div>';

      funcContent='<div class="bg-white rounded-2xl shadow-sm border border-gray-100 mx-4 mt-3 deco-card">'+
        '<div class="flex items-center justify-between px-4 pt-4 pb-2"><span class="text-xs text-gray-500">能成ID：10000135 <span class="text-brand-pink cursor-pointer" onclick="window.Common.showToast(\x27已复制\x27)">[复制]</span></span><span class="inline-flex items-center gap-1 text-xs text-brand-pink font-bold bg-brand-pink/5 px-3 py-1 rounded-full cursor-pointer card-hover" onclick="window.location.href=\x27profile.html\x27"><i data-lucide="user" class="w-3 h-3"></i>个人主页</span></div>'+
        '<div class="border-t border-gray-200 mx-4"></div>'+
        jStatsHtml+
        '<div class="border-t border-gray-100 mx-4"></div>'+
        jMenuHtml+
        '<div class="border-t border-gray-100 mx-4"></div>'+
        jBtns+
      '</div>';
    }else{
      funcContent='<div class="bg-white rounded-2xl shadow-sm border border-gray-100 mx-4 mt-3 py-8 text-center deco-card">'+
        '<div class="w-16 h-16 rounded-full bg-brand-pink/10 flex items-center justify-center mx-auto mb-3"><i data-lucide="file-text" class="w-8 h-8 text-brand-pink"></i></div>'+
        '<p class="text-sm text-gray-500">请先填写你的脱单档案<br/>寻找属于你的缘分</p>'+
        '<span class="inline-block mt-4 px-8 py-2.5 rounded-full bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm shadow-lg shadow-brand-pink/20 card-hover cursor-pointer" onclick="window.location.href=\x27profile-wizard.html\x27">马上填写</span>'+
      '</div>';
    }
  }else{
    var keScore=28850,keWeek=420,keTitle='嗑学宗师';
    funcContent='<div class="bg-white rounded-2xl shadow-sm border border-gray-100 mx-4 mt-3 p-4 deco-card">'+
      '<div class="flex items-center justify-between mb-3"><span class="text-sm font-bold text-gray-700">📋 嗑学分</span><span class="text-xs text-brand-pink font-medium cursor-pointer" onclick="window.location.href=\x27kexue.html\x27">查看详情 &gt;</span></div>'+
      '<div class="text-center mb-4"><span class="text-3xl font-black text-brand-pink">'+keScore.toLocaleString()+'</span><div class="text-xs text-gray-400 mt-1">本周 +'+keWeek+'</div></div>'+
      '<div class="bg-brand-pink/5 rounded-xl p-3 text-center mb-4"><span class="text-sm font-bold text-brand-pink">当前头衔：'+keTitle+'</span></div>'+
      '<div class="border-t border-gray-100 pt-2">';
    var qMenus=[
      {icon:'users',label:'我的牵线记录',href:'history.html'},
      {icon:'zap',label:'我的神助攻',href:'my-assist.html'},
      {icon:'heart-handshake',label:'我加入的亲友团',href:'my-family-joined.html'},
    ];
    qMenus.forEach(function(it){
      funcContent+='<div class="flex items-center gap-3 p-3 border-b border-gray-50 cursor-pointer card-hover" onclick="window.location.href=\x27'+it.href+'\x27"><i data-lucide="'+it.icon+'" class="w-4 h-4 text-brand-pink"></i><span class="text-sm text-gray-700">'+it.label+'</span><i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 ml-auto"></i></div>';
    });
    funcContent+='</div></div>';
  }

  document.getElementById('app').innerHTML=
    '<div class="top-section"><div class="px-4 pt-3 pb-2"><h1 class="text-lg font-black text-gray-800 flex items-center gap-1.5"><i data-lucide="user" class="w-5 h-5 text-brand-pink"></i>个人中心</h1></div></div>'+
    '<div class="rounded-top"></div>'+
    '<div class="content-section">'+
      u+
      tabBar+funcContent+
      '<div style="height:20px"></div>'+
    '</div>'+
    window.Common.renderBottomNav('me');
  window.Common.initIcons();
}

function quitTuodan(){
  showConfirm('确定要退出脱单吗？退出后您的档案将被隐藏。',function(){
    stateJoined=false;render();window.Common.showToast('已退出脱单');
  });
}
function showConfirm(msg,cb){
  document.getElementById('confirm-msg').innerHTML=msg;
  document.getElementById('confirm-btn-yes').onclick=function(){
    window.Common.hidePopup('confirm-overlay');
    cb();
  };
  window.Common.showPopup('confirm-overlay');
}
function showPhoneAuth(){window.Common.showPopup('phone-auth-overlay')}
function doPhoneAuth(){
  window.Common.hidePopup('phone-auth-overlay');
  setTimeout(function(){window.location.href='register.html'},300);
}
document.addEventListener('DOMContentLoaded',function(){render()});
</script>
</body>
</html>
