<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>

<script src="lib/tailwind.min.js"></script>
<script src="lib/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: #FFF5F3; }

  /* ========== 加载页 ========== */
  #loading-overlay {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #FF6B5B 0%, #E85D3A 30%, #C44569 70%, #8B2252 100%);
  }
  @keyframes reportBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }
  @keyframes loadingBarFill { from { width: 0%; } to { width: 100%; } }
  @keyframes dotPulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.3); opacity: 1; }
  }
  .loading-dot { animation: dotPulse 1.5s ease-in-out infinite; }
  .loading-dot:nth-child(2) { animation-delay: 0.25s; }
  .loading-dot:nth-child(3) { animation-delay: 0.5s; }
  .loading-bar-fill { animation: loadingBarFill 3s ease-in-out forwards; }

  /* ========== 滚动容器 ========== */
  #app {
    height: 100vh; height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    position: relative; z-index: 1;
    scroll-behavior: smooth;
  }
  #app::-webkit-scrollbar { display: none; }

  /* ========== Section 容器 ========== */
  .report-section {
    min-height: 100vh; min-height: 100dvh;
    scroll-snap-align: start;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    position: relative;
    padding: 48px 20px 72px;
    box-sizing: border-box;
  }
  .report-section .sec-inner { width: 100%; max-width: 420px; }

  /* ========== 滚动提示 ========== */
  @keyframes scrollHint {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.35; }
    50% { transform: translate(-50%, 9px); opacity: 1; }
  }
  .scroll-hint {
    position: absolute; bottom: 20px; left: 50%;
    animation: scrollHint 2.4s ease-in-out infinite;
    pointer-events: none; z-index: 2; color: #C8A098;
  }
  .report-section:last-child .scroll-hint { display: none; }

  /* ========== 入场动画 ========== */
  .anim-item { opacity: 0; }

  @keyframes aFadeUp {
    from { opacity:0; transform:translateY(36px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .revealed .anim-fade-up { animation: aFadeUp 0.9s ease-out forwards; }

  @keyframes aScaleIn {
    0%   { opacity:0; transform:scale(0.65); }
    60%  { opacity:1; transform:scale(1.03); }
    100% { opacity:1; transform:scale(1); }
  }
  .revealed .anim-scale-in { animation: aScaleIn 0.75s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  @keyframes aPopNum {
    0%   { opacity:0; transform:scale(2.5); }
    50%  { opacity:1; transform:scale(0.88); }
    70%  { transform:scale(1.05); }
    100% { opacity:1; transform:scale(1); }
  }
  .revealed .anim-pop-num { animation: aPopNum 2.2s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  @keyframes aSlideLeft {
    from { opacity:0; transform:translateX(-52px); }
    to   { opacity:1; transform:translateX(0); }
  }
  .revealed .anim-slide-left { animation: aSlideLeft 0.8s ease-out forwards; }

  @keyframes aSlideRight {
    from { opacity:0; transform:translateX(52px); }
    to   { opacity:1; transform:translateX(0); }
  }
  .revealed .anim-slide-right { animation: aSlideRight 0.8s ease-out forwards; }

  @keyframes aImgPop {
    0%   { opacity:0; transform:scale(0.35); }
    55%  { opacity:1; transform:scale(1.1); }
    100% { opacity:1; transform:scale(1); }
  }
  .revealed .anim-img-pop { animation: aImgPop 0.65s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  /* ========== 飘浮心形 ========== */
  @keyframes floatHeart {
    0%   { transform: translateY(0) scale(0.4); opacity: 0; }
    15%  { opacity: 0.7; }
    75%  { opacity: 0.4; }
    100% { transform: translateY(-160px) scale(1.1); opacity: 0; }
  }
  .hearts-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
  .hearts-container .fh { position: absolute; bottom: -10px; font-size: 18px; animation: floatHeart 5s ease-in-out infinite; }

  /* ========== 组件 ========== */
  .stat-num {
    background: linear-gradient(135deg, #E85D3A, #C44569);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-num-gold {
    background: linear-gradient(135deg, #F4A460, #E8A040);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .rpt-card {
    background: #FFFFFF; border-radius: 20px;
    box-shadow: 0 4px 24px rgba(200,80,60,0.07);
    border: 1px solid rgba(200,80,60,0.05);
  }
  .gold-badge {
    background: linear-gradient(135deg, #F4A460, #E8A040);
    color: #FFF; font-size: 10px; padding: 2px 8px; border-radius: 999px;
    font-weight: 700; letter-spacing: 0.05em;
  }

  /* ========== 时间线 ========== */
  .timeline-item {
    position: relative; padding-left: 28px; padding-bottom: 40px;
    border-left: 1.5px dashed #F0D5CD; margin-left: 13px;
  }
  .timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
  .timeline-dot {
    position: absolute; left: -11px; top: 1px;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* ========== 标题 ========== */
  .sec-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 20px; font-weight: 900; color: #3D1F1A;
  }
  .sec-sub { font-size: 13px; color: #B8A09A; margin-top: 4px; margin-bottom: 24px; }
  .sec-head { margin-bottom: 6px; }

  .stat-card { padding: 18px 12px 16px !important; }
  .stat-card .stat-num,
  .stat-card .stat-num-gold { font-size: 30px !important; }
</style>
</head>

        '</div>'+
        '<p class="text-xs mb-2.5 '+ai('anim-fade-up',1.6)+'" style="color:#B8A09A;">✨ 已达1314的TA</p>'+
        '<div id="'+swiperId+'" class="overflow-x-auto no-scrollbar '+ai('anim-fade-up',1.85)+'" style="scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-right:8%;">'+
          '<div class="flex gap-3">'+pageHtml+'</div>'+

  function endingHtml() {

        '<img src="images/cheng.png" alt="" style="width:120px;display:block;margin:0 auto;">'+

        '<p class="text-xs mt-5 '+ai('anim-fade-up',1.85)+'" style="color:#C8B0A8;"><a href="index.html" style="color:#C8B0A8;text-decoration:underline;">返回首页</a></p>'+
        '<p class="text-xs mt-3 '+ai('anim-fade-up',2.0)+'" style="color:#C8B0A8;">能成报告 · 生成于 2026年7月17日</p>'+

  // ==== 渲染 ====
  function render() {
    document.getElementById('app').innerHTML =
      sec1Html()+sec2Html()+sec3Html()+sec4Html()+sec5Html()+sec6Html()+endingHtml();
    window.Common.initIcons();
    setTimeout(function(){ window.Common.initIcons(); }, 250);

    // Section 5 双向奔赴的横向 swipe 圆点更新
    var swiper = document.getElementById('swiper-sec5');
    var dots = document.getElementById('swiper-sec5-dots');
    if (swiper && dots) {
      var dotEls = dots.querySelectorAll('span');
      swiper.addEventListener('scroll', function(){
        var idx = Math.round(swiper.scrollLeft / (swiper.scrollWidth * 0.46));
        if (idx >= dotEls.length) idx = dotEls.length-1;
        dotEls.forEach(function(d,i){ d.style.background = i===idx ? '#E85D3A' : '#F0D5CD'; });
      });
    }

    var sections = document.querySelectorAll('.report-section');
    // 首屏立即显示
    if (sections[0]) { sections[0].classList.add('revealed'); }
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) {
          e.target.classList.add('revealed');
        } else if (e.boundingClientRect.bottom < window.innerHeight * 0.5) {
          e.target.classList.remove('revealed');
        }
      });
    }, { threshold: 0.10 });
    sections.forEach(function(s){ observer.observe(s); });
  }

  render();

  setTimeout(function(){
    var overlay = document.getElementById('loading-overlay');
    overlay.style.transition = 'opacity 0.6s ease';
    overlay.style.opacity = '0';
    setTimeout(function(){ overlay.remove(); }, 600);
  }, 3000);
})();
</script>
