<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>聊天 - 他俩能成</title>
<script src="lib/tailwind.min.js"></script>
<script src="lib/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 h-screen flex flex-col">

<div class="bg-decoration"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div>
<div id="app" class="flex-1 flex flex-col h-full relative z-[1]"></div>

<script src="common.js"></script>
<script>
function render(){
  var params=new URLSearchParams(window.location.search);
  var userName=params.get('name')||'对方';
  var online=(Math.random()>0.4);
  var avatar=params.get('avatar')||'images/photo/male/crop.0.0.1078.1438.0.750.1000.jpg';

  var chats=[
    {isMe:false,text:'你好呀！很高兴认识你~',time:'10:00'},
    {isMe:true,text:'你好！我也刚注册这个平台',time:'10:05'},
    {isMe:false,text:'你是朝阳的吗？我在建外这边',time:'10:06'},
    {isMe:true,text:'对的，我在望京！好近',time:'10:10'},
    {isMe:false,text:'这周末有个咖啡沙龙活动，要不要一起参加？',time:'10:15'},
    {isMe:true,text:'好啊！我看看时间~',time:'10:20'},
    {isMe:false,text:'太好了，那我们周六见！',time:'10:25'},
  ];

  var chatHtml=chats.map(function(chat){
    if(chat.isSystem){
      return'<div class="flex flex-col mb-4 items-center"><div class="text-[10px] text-gray-400 mb-1">'+chat.time+'</div><div class="px-3 py-1.5 rounded-full max-w-[90%] text-xs bg-gray-100 text-gray-500 border border-gray-200"><i data-lucide="info" class="w-3 h-3 inline-block mr-1"></i> '+chat.text+'</div></div>';
    }else{
      return'<div class="flex flex-col mb-4 '+(chat.isMe?'items-end':'items-start')+'"><div class="text-[10px] text-gray-400 mb-1 px-1">'+chat.time+'</div><div class="px-4 py-2.5 rounded-2xl max-w-[80%] text-sm '+(chat.isMe?'bg-brand-pink text-white rounded-tr-sm':'bg-white text-gray-800 rounded-tl-sm shadow-sm border border-gray-100')+'">'+chat.text+'</div></div>';
    }
  }).join('');

  document.getElementById('app').innerHTML=
    '<div class="bg-white px-4 py-3 flex items-center justify-between border-b border-gray-100 shadow-sm sticky top-0 z-10">'+
      '<span onclick="window.history.back()" class="p-1 -ml-2"><i data-lucide="chevron-left" class="w-6 h-6 text-gray-700"></i></span>'+
      '<div class="flex items-center gap-2" onclick="window.location.href=\'profile.html\'">'+
        '<img src="'+avatar+'" class="w-8 h-8 rounded-full border border-gray-100 object-cover"/>'+
        '<span class="font-bold text-gray-900 text-base">'+userName+'</span>'+
        '<i data-lucide="home" class="w-4 h-4 text-gray-400"></i>'+
      '</div>'+
      '<span class="flex items-center gap-1 '+(online?'text-green-500':'text-gray-400')+'">'+
        '<i data-lucide="circle" class="w-2.5 h-2.5 '+(online?'fill-green-500':'fill-gray-400')+'"></i>'+
        '<span class="text-xs">'+(online?'在线':'离线')+'</span>'+
      '</span>'+
    '</div>'+
    '<div class="bg-white border-b border-gray-100 py-2 px-4">'+
      '<div class="flex items-center justify-between mb-1">'+
        '<div class="flex items-center gap-2">'+
          '<i data-lucide="sparkles" class="w-4 h-4 text-brand-pink"></i>'+
          '<span class="text-xs font-medium text-brand-pink">你们的匹配度已经达到1314，可以进行畅聊了~</span>'+
        '</div>'+
        '<i data-lucide="info" class="w-4 h-4 text-gray-400"></i>'+
      '</div>'+
      '<div class="text-[10px] text-gray-400 mt-1 flex items-center gap-1">'+
        '<i data-lucide="shield" class="w-3 h-3"></i>沟通及交往过程中请注意保护您的人身财产安全'+
      '</div>'+
    '</div>'+
    '<div class="flex-1 overflow-y-auto p-4 bg-gray-50 no-scrollbar" id="chat-container">'+chatHtml+'</div>'+
    '<div class="bg-white border-t border-gray-100 p-3 flex items-center gap-2">'+
      '<span class="text-gray-400 p-1"><i data-lucide="mic" class="w-6 h-6"></i></span>'+
      '<input type="text" class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm outline-none focus:ring-1 focus:ring-brand-pink/50 transition-all" placeholder="发消息..."/>'+
      '<span class="text-gray-400 p-1"><i data-lucide="smile" class="w-6 h-6"></i></span>'+
      '<span onclick="window.Common.showToast(\'消息已发送\')" class="bg-brand-pink text-white rounded-full p-2 w-8 h-8 flex items-center justify-center card-hover"><i data-lucide="arrow-up" class="w-5 h-5"></i></span>'+
    '</div>';
  window.Common.initIcons();
}

document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
