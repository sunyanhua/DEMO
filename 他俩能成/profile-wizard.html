<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><title>完善脱单档案 - 他俩能成</title><script src="lib/tailwind.min.js"></script><script src="lib/lucide.min.js"></script><link rel="stylesheet" href="style.css"></head><body class="bg-white text-gray-900 antialiased pb-2">
<div class="bg-decoration"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div><div id="app" class="relative z-[1]"></div>

<!-- 隐私协议弹窗 -->
<div id="privacy-popup" class="fixed inset-0 bg-black/40 z-[200] hidden items-center justify-center" onclick="window.Common.closePopup(event,'privacy-popup')">
<div class="bg-white rounded-2xl p-5 mx-auto w-80 shadow-xl max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
<h3 class="text-base font-black text-gray-800 mb-3 text-center">隐私协议</h3>
<div class="text-xs text-gray-600 leading-relaxed space-y-2">
<p><b>一、信息收集</b><br/>我们仅收集为您提供交友服务所必需的基本信息，包括昵称、手机号、性别、出生日期等。</p>
<p><b>二、信息使用</b><br/>您的姓名和工作单位信息仅用于平台内部实名核验，<b>不会向其他用户展示</b>。其他脱单资料将根据您设置的可见范围对外展示。</p>
<p><b>三、信息安全</b><br/>我们采用加密存储和传输技术保护您的个人信息安全，未经您授权不会向第三方提供。</p>
<p><b>四、用户权利</b><br/>您有权随时查看、修改或删除您的脱单资料。如需注销账户，请联系客服处理。</p>
</div>
<div class="mt-4 w-full py-2.5 rounded-xl bg-brand-pink text-white font-bold text-sm card-hover text-center cursor-pointer" onclick="window.Common.hidePopup('privacy-popup')">我知道了</div>
</div></div>

<script src="common.js"></script><script>
var DISTRICTS=['东城区','西城区','朝阳区','海淀区','丰台区','石景山区','通州区','大兴区','房山区','门头沟区','昌平区','顺义区','平谷区','怀柔区','密云区','延庆区','其他'];
var NATIONS=['汉族','蒙古族','回族','藏族','维吾尔族','苗族','彝族','壮族','满族','朝鲜族','外国民族'];
var PROVS=['北京市','天津市','上海市','重庆市','河北省','山西省','辽宁省','吉林省','黑龙江省','江苏省','浙江省','安徽省','福建省','江西省','山东省','河南省','湖北省','湖南省','广东省','海南省','四川省','贵州省','云南省','陕西省','甘肃省','青海省','台湾省','内蒙古自治区','广西壮族自治区','西藏自治区','宁夏回族自治区','新疆维吾尔自治区','香港特别行政区','澳门特别行政区','外籍','其他'];
var step=1;
var wizardData={};
var photos=['images/photo/female/crop.0.67.1079.1438.0.750.1000.jpg','images/photo/female/crop.0.61.723.964.0.750.1000.jpg','images/photo/female/crop.384.0.2304.3072.0.750.1000.jpg'];
var steps=['基本资料','上传照片','脱单资料','更多信息'];

function render(){
  var stepsBar='<div class="flex items-start justify-center mb-5 px-2">'+
    steps.map(function(label,s){
      var done=step>s+1,active=step===s+1;
      var wrapped=label.replace(/(.{2})/g,'$1<br>');
      return'<div class="flex items-center gap-1.5">'+
        '<div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold flex-shrink-0 '+(done?'bg-brand-pink text-white':active?'bg-brand-pink text-white':'bg-gray-200 text-gray-400')+'">'+(done?'<i data-lucide="check" class="w-3 h-3"></i>':(s+1))+'</div>'+
        '<span class="text-[9px] leading-tight '+(active?'text-brand-pink font-bold':'text-gray-400')+'">'+wrapped+'</span>'+
      '</div>'+
      (s<3?'<div class="w-6 h-0.5 mt-3 flex-shrink-0 mx-0.5 '+(done?'bg-brand-pink':'bg-gray-200')+'"></div>':'');
    }).join('')+
  '</div>';

  var body='';
  if(step===1)body=renderStep1();
  else if(step===2)body=renderStep2();
  else if(step===3)body=renderStep3();
  else body=renderStep4();

  document.getElementById('app').innerHTML=
    '<div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-2.5 shadow-sm flex items-center"><i data-lucide="file-text" class="w-3.5 h-3.5 text-brand-pink mr-2"></i><h1 class="text-sm font-bold text-gray-900">完善脱单档案</h1></div>'+
    '<div class="px-4 pt-4 pb-6">'+stepsBar+body+'</div>';
  window.Common.initIcons();
}

function renderStep1(){
  return'<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 space-y-4">'+
    '<h3 class="font-bold text-gray-800 mb-1">基本资料</h3>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">昵称</label><input type="text" value="甜心小鹿" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-400 cursor-not-allowed"></div>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">手机号</label><input type="text" value="13651260211" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-400 cursor-not-allowed"></div>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">性别</label><div class="flex gap-4"><label class="flex items-center gap-2"><input type="radio" checked disabled class="w-4 h-4"> <span class="text-gray-400">女</span></label><label class="flex items-center gap-2"><input type="radio" disabled class="w-4 h-4"> <span class="text-gray-400">男</span></label></div></div>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">出生日期</label><input type="date" value="2000-06-15" disabled class="w-full px-4 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-400 cursor-not-allowed"></div>'+
    '<div class="bg-amber-50 rounded-xl p-3 flex items-start gap-2">'+
      '<i data-lucide="alert-triangle" class="w-4 h-4 text-amber-500 flex-shrink-0 mt-0.5"></i>'+
      '<p class="text-xs text-amber-700 leading-relaxed">以上信息不能编辑</p>'+
    '</div>'+
    '<div class="border-t border-gray-100 pt-4">'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">姓名 <span class="text-brand-pink">*</span></label><input type="text" id="realname" value="张雨婷" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink"></div>'+
      '<div class="flex items-start gap-2 mt-1"><i data-lucide="eye-off" class="w-3 h-3 text-gray-400 mt-0.5 flex-shrink-0"></i><span class="text-[11px] text-gray-400">隐私信息，不会向平台其他用户展示</span></div>'+
    '</div>'+
    '<div class="border-t border-gray-100 pt-4">'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">单位 <span class="text-brand-pink">*</span></label><input type="text" id="company" value="字节跳动科技有限公司" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink"></div>'+
      '<div class="flex items-start gap-2 mt-1"><i data-lucide="eye-off" class="w-3 h-3 text-gray-400 mt-0.5 flex-shrink-0"></i><span class="text-[11px] text-gray-400">隐私信息，不会向平台其他用户展示</span></div>'+
    '</div>'+
    '<div class="flex items-center gap-2 pt-1">'+
      '<input type="checkbox" id="privacy-agree" class="w-4 h-4 accent-brand-pink">'+
      '<span class="text-xs text-gray-600">我已阅读并同意<span class="text-brand-pink underline cursor-pointer" onclick="event.stopPropagation();window.Common.showPopup(\x27privacy-popup\x27)">《隐私协议》</span></span>'+
    '</div>'+
    '<span onclick="goStep2()" class="block text-center w-full py-3.5 bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-lg rounded-xl shadow-lg shadow-brand-pink/20 card-hover cursor-pointer">下一步</span>'+
  '</div>';
}

function goStep2(){
  var rn=document.getElementById('realname').value.trim();
  var co=document.getElementById('company').value.trim();
  if(!rn){window.Common.showToast('请填写姓名');return}
  if(!co){window.Common.showToast('请填写单位');return}
  if(!document.getElementById('privacy-agree').checked){window.Common.showToast('请先阅读并同意隐私协议');return}
  wizardData.realname=rn;wizardData.company=co;
  step=2;render();
}

function renderStep2(){
  var grid=photos.map(function(src,idx){
    return'<div class="relative aspect-[3/4] bg-gray-100 rounded-xl overflow-hidden"><img src="'+src+'" class="w-full h-full object-cover"/>'+
      (photos.length>1?'<span onclick="removePhoto('+idx+')" class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full bg-black/50 text-white flex items-center justify-center cursor-pointer text-xs">✕</span>':'')+
    '</div>';
  }).join('');

  if(photos.length<9){
    grid+='<div onclick="addPhoto()" class="aspect-[3/4] bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-gray-400 cursor-pointer card-hover"><i data-lucide="plus" class="w-8 h-8 mb-1"></i><span class="text-xs">添加照片</span></div>';
  }

  return'<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4">'+
    '<h3 class="font-bold text-gray-800 mb-3">上传个人照片 <span class="text-xs text-gray-400 font-normal">（最多9张）</span></h3>'+
    '<div class="grid grid-cols-3 gap-2">'+grid+'</div>'+
    '<div class="flex gap-3 pt-4">'+
      '<span onclick="step=1;render()" class="flex-1 text-center py-3 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm card-hover cursor-pointer">上一步</span>'+
      '<span onclick="step=3;render()" class="flex-1 text-center py-3 rounded-xl bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm shadow-lg shadow-brand-pink/20 card-hover cursor-pointer">下一步</span>'+
    '</div>'+
  '</div>';
}

function renderStep3(){
  var distOpts=DISTRICTS.map(function(d){return'<option value="'+d+'"'+(d==='海淀区'?' selected':'')+'>'+d+'</option>'}).join('');
  var natOpts=NATIONS.map(function(n){return'<option value="'+n+'"'+(n==='汉族'?' selected':'')+'>'+n+'</option>'}).join('');
  var hjOpts=PROVS.map(function(h){return'<option value="'+h+'"'+(h==='北京市'?' selected':'')+'>'+h+'</option>'}).join('');
  var hjAll=PROVS.map(function(h){return'<option value="'+h+'">'+h+'</option>'}).join('');

  return'<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 space-y-4">'+
    '<h3 class="font-bold text-gray-800 mb-1">脱单资料 <span class="text-xs text-gray-400 font-normal">（必填）</span></h3>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">婚姻状态 <span class="text-brand-pink">*</span></label><div class="flex gap-4">'+['未婚','离异','丧偶'].map(function(m){return'<label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="marital" value="'+m+'"'+(m==='未婚'?' checked':'')+' class="w-4 h-4 accent-brand-pink"> <span class="text-gray-700">'+m+'</span></label>'}).join('')+'</div></div>'+
    '<div class="grid grid-cols-2 gap-3">'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">身高 <span class="text-brand-pink">*</span></label><input type="text" id="height" value="156cm" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink"></div>'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">体重 <span class="text-brand-pink">*</span></label><input type="text" id="weight" value="46kg" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink"></div>'+
    '</div>'+
    '<div class="grid grid-cols-2 gap-3">'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">属相 <span class="text-brand-pink">*</span></label><select id="zodiac" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink">'+['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'].map(function(z){return'<option value="'+z+'"'+(z==='鸡'?' selected':'')+'>'+z+'</option>'}).join('')+'</select></div>'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">血型 <span class="text-brand-pink">*</span></label><select id="blood" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink">'+['A型','B型','AB型','O型'].map(function(z){return'<option value="'+z+'"'+(z==='AB型'?' selected':'')+'>'+z+'</option>'}).join('')+'</select></div>'+
    '</div>'+
    '<div class="grid grid-cols-2 gap-3">'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">学历 <span class="text-brand-pink">*</span></label><select id="edu" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink">'+['高中及以下','大专','大学本科','硕士','博士'].map(function(z){return'<option value="'+z+'"'+(z==='大学本科'?' selected':'')+'>'+z+'</option>'}).join('')+'</select></div>'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">职业 <span class="text-brand-pink">*</span></label><input type="text" id="job" value="销售" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink"></div>'+
    '</div>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">所在区县 <span class="text-brand-pink">*</span></label><select id="district" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink">'+distOpts+'</select></div>'+
    '<div class="grid grid-cols-2 gap-3">'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">民族 <span class="text-brand-pink">*</span></label><select id="nation" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink">'+natOpts+'</select></div>'+
      '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">户籍 <span class="text-brand-pink">*</span></label><select id="hukou" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink">'+hjOpts+'</select></div>'+
    '</div>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">家乡 <span class="text-brand-pink">*</span></label><select id="hometown" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink"><option value="">请选择</option>'+hjAll+'</select></div>'+
    '<div class="flex gap-3 pt-2">'+
      '<span onclick="step=2;render()" class="flex-1 text-center py-3 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm card-hover cursor-pointer">上一步</span>'+
      '<span onclick="if(saveStep3()){step=4;render()}" class="flex-1 text-center py-3 rounded-xl bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm shadow-lg shadow-brand-pink/20 card-hover cursor-pointer">下一步</span>'+
    '</div>'+
  '</div>';
}

function renderStep4(){
  return'<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-4 space-y-4">'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">兴趣爱好</label><input type="text" id="hobby" value="旅行、摄影、美食、瑜伽、看电影" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink"></div>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">才艺特长</label><input type="text" id="talent" value="钢琴八级、烘焙、书法" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink"></div>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">个人介绍</label><textarea id="intro" rows="3" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink resize-none">热爱生活的北京姑娘，工作在朝阳，周末喜欢探索城市里有趣的小店。</textarea></div>'+
    '<div class="space-y-2"><label class="text-sm font-medium text-gray-700">择偶标准</label><textarea id="criteria" rows="3" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-gray-900 focus:outline-none focus:border-brand-pink resize-none">希望你身高175以上，年龄25-32岁，有稳定的工作，性格阳光开朗。</textarea></div>'+
    '<div class="flex gap-3 pt-2">'+
      '<span onclick="step=3;render()" class="flex-1 text-center py-3 rounded-xl bg-gray-100 text-gray-600 font-bold text-sm card-hover cursor-pointer">上一步</span>'+
      '<span onclick="submitWizard(false)" class="flex-1 text-center py-3 rounded-xl bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-sm shadow-lg shadow-brand-pink/20 card-hover cursor-pointer">完成</span>'+
    '</div>'+
    '<span onclick="submitWizard(true)" class="block text-center w-full py-3 rounded-xl bg-gray-100 text-gray-500 font-bold text-sm card-hover cursor-pointer mt-2">跳过，以后再说</span>'+
  '</div>';
}

function addPhoto(){
  if(photos.length>=9){window.Common.showToast('最多上传9张照片');return}
  photos.push('images/photo/female/crop.0.67.1079.1438.0.750.1000.jpg');render();
}
function removePhoto(idx){photos.splice(idx,1);render()}

function saveStep3(){
  var mids=['height','weight','job'];
  var mCN={height:'身高',weight:'体重',job:'职业'};
  for(var i=0;i<mids.length;i++){
    var el=document.getElementById(mids[i]);var v=el?el.value.trim():'';
    if(!v){window.Common.showToast('请填写'+mCN[mids[i]]);return false}
    wizardData[mids[i]]=v;
  }
  var sels={district:'所在区县',zodiac:'属相',blood:'血型',edu:'学历',nation:'民族',hukou:'户籍',hometown:'家乡'};
  for(var k in sels){
    var el=document.getElementById(k);var v=el?el.value:'';
    if(!v){window.Common.showToast('请选择'+sels[k]);return false}
    wizardData[k]=v;
  }
  return true;
}

function submitWizard(skip){
  if(!skip){
    var mustFill=['height','weight','job'];
    var mCN={height:'身高',weight:'体重',job:'职业'};
    for(var i=0;i<mustFill.length;i++){
      if(!wizardData[mustFill[i]]){window.Common.showToast('请填写'+mCN[mustFill[i]]);return}
    }
    var sels={district:'所在区县',zodiac:'属相',blood:'血型',edu:'学历',nation:'民族',hukou:'户籍',hometown:'家乡'};
    for(var k in sels){if(!wizardData[k]){window.Common.showToast('请选择'+sels[k]);return}}
  }
  window.Common.showToast('脱单档案已保存');
  setTimeout(function(){window.location.href='me.html'},1000);
}

document.addEventListener('DOMContentLoaded',function(){render()});
</script>
</body></html>
