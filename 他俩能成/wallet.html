<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><title>我的金币 - 他俩能成</title><script src="lib/tailwind.min.js"></script><script src="lib/lucide.min.js"></script><link rel="stylesheet" href="style.css"></head><body class="bg-white text-gray-900 antialiased pb-2">

<script src="common.js"></script><script>
var balance=1280;
var records=[
  {title:'每日签到',amount:'+50',time:'今天 09:00'},{title:'每日签到',amount:'+50',time:'昨天 08:30'},{title:'玩法操作奖励（20次）',amount:'+10',time:'昨天 20:15'},{title:'每日签到',amount:'+50',time:'7月10日 09:00'},{title:'赠送礼物 - 菜小宝',amount:'-100',time:'7月10日 16:30'},{title:'每日签到',amount:'+50',time:'7月9日 08:00'},{title:'每日签到',amount:'+50',time:'7月8日 09:15'},{title:'赠送礼物 - 听小北-爱你',amount:'-200',time:'7月8日 14:00'},{title:'每日签到',amount:'+50',time:'7月7日 08:45'},{title:'玩法操作奖励（20次）',amount:'+10',time:'7月6日 21:00'},

    '</div>';
  window.Common.initIcons();
}
document.addEventListener('DOMContentLoaded',function(){render()});
</script></body></html>
