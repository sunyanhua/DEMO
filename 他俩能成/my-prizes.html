<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/><title>我的奖品 - 他俩能成</title><script src="lib/tailwind.min.js"></script><script src="lib/lucide.min.js"></script><link rel="stylesheet" href="style.css"></head><body class="bg-white text-gray-900 antialiased pb-2">
<div class="bg-decoration"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div><div id="app" class="relative z-[1]"></div>

<div id="coupon-popup" class="fixed inset-0 bg-black/40 z-[200] hidden items-center justify-center" onclick="window.Common.closePopup(event,'coupon-popup')">
<div class="bg-white rounded-2xl p-5 mx-auto w-80 shadow-xl text-center" onclick="event.stopPropagation()">
<div class="text-4xl mb-3">🎫</div><div class="text-sm text-gray-700 mb-2">优惠券码</div>
<div id="coupon-code" class="text-xl font-black text-brand-pink mb-1 tracking-wider">---</div><span class="text-xs text-brand-pink cursor-pointer underline" onclick="window.Common.showToast('已复制')">点击复制</span>
<div id="coupon-desc" class="text-xs text-gray-500 mt-3"></div>
<div class="mt-4 w-full py-2.5 rounded-xl bg-brand-pink text-white font-bold text-sm card-hover text-center cursor-pointer" onclick="window.Common.hidePopup('coupon-popup')">我知道了</div>
</div></div>

<div id="address-popup" class="fixed inset-0 bg-black/40 z-[200] hidden items-end justify-center" onclick="window.Common.closePopup(event,'address-popup')">
<div class="bg-white w-full rounded-t-2xl max-h-[85vh] overflow-y-auto animate-slide-up" onclick="event.stopPropagation()">
<div class="sticky top-0 bg-white z-10 flex items-center justify-between px-4 py-4 border-b border-gray-100 rounded-t-2xl"><span class="text-lg font-black text-gray-800">填写邮寄地址</span><span class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer" onclick="window.Common.hidePopup('address-popup')"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></span></div>
<div class="p-4 space-y-4"><div><label class="block text-sm font-bold text-gray-700 mb-2">收件人 <span class="text-brand-pink">*</span></label><input id="addr-name" placeholder="请输入收件人姓名" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-brand-pink"/></div><div><label class="block text-sm font-bold text-gray-700 mb-2">手机号 <span class="text-brand-pink">*</span></label><input id="addr-tel" type="tel" placeholder="请输入手机号" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-brand-pink"/></div><div><label class="block text-sm font-bold text-gray-700 mb-2">详细地址 <span class="text-brand-pink">*</span></label><textarea id="addr-detail" rows="2" placeholder="请输入详细地址" class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-brand-pink resize-none"></textarea></div><span class="block text-center w-full py-3.5 rounded-2xl bg-gradient-to-tr from-brand-pink to-brand-orange text-white font-bold text-base shadow-lg shadow-brand-pink/20 card-hover cursor-pointer" onclick="submitAddress()">提交</span></div>
</div></div>

<script src="common.js"></script><script>
var prizes=[
  {name:'红包 0.50元',source:'广播节目抽奖',icon:'💰',type:'cash',time:'7月18日',status:'已加入钱包余额'},
  {name:'红包 0.20元',source:'广播节目抽奖',icon:'💵',type:'cash',time:'7月15日',status:'已加入钱包余额'},
  {name:'搭子计划优惠券',source:'广播节目抽奖',icon:'🎫',type:'coupon',time:'7月10日',code:'DZ20260710X88',desc:'在搭子计划小程序报名时输入券码，可获<b>5元</b>金额减免'},
  {name:'精品包挂',source:'广播节目抽奖',icon:'🎀',type:'physical',time:'7月5日',status:'待发货'},
];

function showCoupon(p){
  document.getElementById('coupon-code').innerHTML=p.code;
  document.getElementById('coupon-desc').innerHTML=p.desc;
  window.Common.showPopup('coupon-popup');
}
function submitAddress(){
  var n=document.getElementById('addr-name').value.trim();
  var t=document.getElementById('addr-tel').value.trim();
  var a=document.getElementById('addr-detail').value.trim();
  if(!n||!t||!a){window.Common.showToast('请填写完整地址信息');return}
  window.Common.hidePopup('address-popup');
  window.Common.showToast('地址提交成功，等待发货');
}

function render(){
  var rows=prizes.map(function(p){
    var action;
    if(p.type==='cash')action='<span class="px-3 py-1.5 rounded-full bg-green-50 text-green-600 text-xs font-bold card-hover cursor-pointer inline-block" onclick="window.location.href=\x27wallet-cash.html\x27">✓ 已加入钱包余额</span>';
    else if(p.type==='coupon')action='<span class="px-3 py-1.5 rounded-full bg-brand-pink/10 text-brand-pink text-xs font-bold card-hover cursor-pointer inline-block" onclick="showCoupon(prizes['+prizes.indexOf(p)+'])">使用说明</span>';
    else action='<span class="px-3 py-1.5 rounded-full bg-brand-pink/10 text-brand-pink text-xs font-bold card-hover cursor-pointer inline-block" onclick="window.Common.showPopup(\x27address-popup\x27)">填写地址</span>';
    return'<div class="flex items-center gap-3 px-4 py-4 border-b border-gray-50"><div class="text-2xl">'+p.icon+'</div><div class="flex-1 min-w-0"><div class="text-sm font-bold text-gray-800">'+p.name+'</div><div class="text-xs text-gray-400 mt-0.5">'+p.source+'</div><div class="text-xs text-gray-400">'+p.time+'</div></div>'+action+'</div>';
  }).join('');

  document.getElementById('app').innerHTML=
    '<div class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-2.5 shadow-sm flex items-center"><i data-lucide="gift" class="w-3.5 h-3.5 text-brand-pink mr-2"></i><h1 class="text-sm font-bold text-gray-900">我的奖品</h1></div>'+
    '<div class="px-4 pt-3 pb-6"><div class="bg-white rounded-2xl shadow-sm border border-gray-100">'+rows+'</div></div>';
  window.Common.initIcons();
}
document.addEventListener('DOMContentLoaded',function(){render()});
</script>
</body></html>
