<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>他俩能成 - 合作专区</title>
<script src="lib/tailwind.min.js"></script>
<script src="lib/lucide.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-gray-900 antialiased">
<div class="bg-decoration"><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div><div class="bg-blob"></div></div>

<div class="relative z-[1]">
  <!-- 顶部渐变区 -->
  <div class="relative" style="background:linear-gradient(180deg,#FABFAA 0%,rgba(255,245,242,0.55) 60%,rgba(255,245,242,0) 100%);">
    <div style="position:absolute;top:-70px;left:-50px;width:280px;height:280px;background:radial-gradient(circle,rgba(240,104,64,0.30),transparent 70%);pointer-events:none;"></div>
    <div style="position:absolute;top:-50px;right:-40px;width:260px;height:260px;background:radial-gradient(circle,rgba(224,77,44,0.24),transparent 70%);pointer-events:none;"></div>
    <div class="relative flex items-center justify-between px-4 py-3">
      <span onclick="window.history.back()" class="w-9 h-9 rounded-full bg-white/80 backdrop-blur flex items-center justify-center cursor-pointer shadow-sm"><i data-lucide="chevron-left" class="w-5 h-5 text-gray-600"></i></span>
      <span class="font-black text-gray-800 text-base">合作专区</span>
      <span class="w-9"></span>
    </div>
    <div class="relative text-center pb-6 pt-1">
      <p class="text-2xl font-black" style="color:#3D1F1A;">官方合作 · 真实靠谱</p>
      <p class="text-xs mt-1.5" style="color:#8C6E67;">权威单位联合打造，让缘分有据可依</p>
    </div>
  </div>
  <div class="rounded-top"></div>
  <div class="content-section px-4 pb-10" id="zone-list"></div>
</div>

<script src="common.js"></script>
<script>
var ZONES=[
  {name:'朝阳相伴',icon:'images/icon_chaoyang.png',href:'chaoyang.html',tag:'官方专区',tagCls:'bg-brand-pink/10 text-brand-pink',desc:'由北京市朝阳区总工会与北京广播电视台"他俩能成"平台联合打造，官方护航，小型多样的精品职工联谊活动，让缘分更靠谱、相遇更安心。',tags:['官方护航','精品联谊','工会职工'],hint:'职工专场 · 官方审核把关'},
  {name:'青爱团',icon:'images/icon_qingai.png',href:'qingai.html',tag:'官方专区',tagCls:'bg-purple-50 text-purple-600',desc:'共青团北京市委员会指导、北京青少年服务中心主办的首都青年交友联谊品牌，以"交友＋志愿""交友＋公益"为主要形式，全链条、多圈层、立体化。',tags:['公益交友','青年专场','志愿同行'],hint:'青年专场 · 大型公益联谊'}
];

function render(){
  var html=ZONES.map(function(z){
    var tags=z.tags.map(function(t){return'<span class="text-[10px] px-2 py-0.5 rounded-full bg-gray-50 text-gray-500 border border-gray-100">'+t+'</span>'}).join('');
    return '<div class="bg-white rounded-2xl p-4 shadow-sm deco-card cursor-pointer card-hover mb-4" onclick="window.location.href=\''+z.href+'\'">'+
      '<div class="flex items-start gap-3.5">'+
        '<img src="'+z.icon+'" class="w-14 h-14 rounded-2xl object-contain bg-gray-50 border border-gray-100 flex-shrink-0"/>'+
        '<div class="flex-1 min-w-0">'+
          '<div class="flex items-center gap-2"><span class="text-base font-black text-gray-800">'+z.name+'</span><span class="text-[10px] px-1.5 py-0.5 rounded-full font-bold '+z.tagCls+'">'+z.tag+'</span></div>'+
          '<p class="text-xs text-gray-500 leading-relaxed mt-1.5">'+z.desc+'</p>'+
          '<div class="flex items-center gap-1.5 mt-2">'+tags+'</div>'+
        '</div>'+
        '<i data-lucide="chevron-right" class="w-5 h-5 text-gray-300 flex-shrink-0 mt-1"></i>'+
      '</div>'+
      '<div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-50">'+
        '<span class="text-xs text-gray-400">'+z.hint+'</span>'+
        '<span class="text-xs font-bold '+z.tagCls+' inline-flex items-center gap-1">进入专区 <i data-lucide="arrow-right" class="w-3 h-3"></i></span>'+
      '</div>'+
    '</div>';
  }).join('');
  document.getElementById('zone-list').innerHTML=html;
  window.Common.initIcons();
}

document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
